/* ===== 10 CONSERVATION CATEGORIES & LEGAL DIFFERENCES ===== */
SEC({id:"conservation-categories",title:"Conservation Categories & Legal Differences",group:"Protected Areas & Conservation",tier:1,
stats:["UPSC CSE: protected areas/wetlands **27 Q**; legal-category cluster **3 Q** (2010–23)","UPPCS Pre: protected areas/biosphere reserves/Ramsar **17 Q** across 7/8 papers","Core trap: Wildlife Act category ≠ tiger-reserve overlay ≠ biosphere-reserve framework ≠ ESZ regulation"],
note:"Memorise what creates each category, what land/rights structure it assumes and what legal consequence follows. Location-specific examples come in the next sheets.",
blocks:[
{h:"Wildlife Act protected-area matrix",t:1,cols:["Category / proposition","Legal rule","Recall discriminator"],rows:[
["Wildlife Sanctuary — declaration","**State Government declares a sanctuary after the statutory rights process**; the Central Government can declare one over qualifying area transferred to it under the Act","**Declaration / land basis**"],
["Wildlife Sanctuary — recognised rights","**Some pre-existing rights may continue if lawfully recognised**","**Rights consequence**"],
["Wildlife Sanctuary — use","**Entry, grazing and resource use are regulated** rather than governed by the National-Park rule set","**Activity consequence**"],
["National Park — declaration","**State Government notifies a National Park after rights over the proposed land are settled so the land is vested for the park**; transferred areas can also be declared by the Central Government","**Declaration / land basis**"],
["National Park — grazing","**No livestock grazing is permitted** except use of livestock as a vehicle by an authorised entrant","**Activity consequence**"],
["National Park — resource removal","**Wildlife/forest-produce removal is tightly limited to statutory management purposes**","**Activity consequence**"],
["Conservation Reserve","**Government-owned land**, especially landscape links or areas adjoining protected areas, may be declared after consultation with local communities","A **Conservation Reserve Management Committee advises the Chief Wild Life Warden** on conservation, management and maintenance"],
["Community Reserve","**Private or community land voluntarily offered for wildlife/habitat conservation**, outside a National Park, sanctuary or conservation reserve, may be declared","The **Community Reserve Management Committee is the management authority** [CSE 2023]; land-use change requires its resolution plus State Government approval"]]},
{h:"National Park versus Sanctuary — high-value distinctions",t:1,list:[
"Grazing :: **livestock grazing is prohibited in a National Park**, whereas sanctuary law allows grazing to be regulated, controlled or prohibited rather than imposing the same categorical NP rule",
"Boundary alteration :: **State alteration of a National Park or sanctuary boundary requires recommendation of the National Board for Wild Life**",
"Resource removal :: in both categories, **destruction/removal of wildlife or forest produce is not an ordinary right and is subject to the statutory management-permit regime**",
"Declaration trap :: !!NBWL approval is a universal prerequisite before a State can declare any National Park or sanctuary!! is **wrong**; declaration and later boundary alteration are distinct legal questions",
"==Category logic== :: a **National Park is generally the stricter Wildlife Act regime**, but the precise question should be answered from the relevant statutory provision rather than the slogan 'nothing is ever allowed'"]},
{h:"Tiger Reserve — overlay with its own statute architecture",t:1,list:[
"Tiger Reserve notification :: **State Government notifies a tiger reserve under section 38V on the advice/recommendation process of the National Tiger Conservation Authority**",
"Tiger Reserve structure :: **core or critical tiger habitat + buffer or peripheral area** form the statutory conservation design",
"Core/critical tiger habitat :: **areas of National Parks and Sanctuaries identified for a high degree of tiger-habitat protection**, subject to the statutory rights safeguards",
"Buffer/peripheral area :: **area around the core requiring a lesser degree of habitat protection**, providing habitat supplement and scope for coexistence of human activity",
"Boundary alteration :: **requires NTCA recommendation and approval of the National Board for Wild Life**",
"De-notification :: **may occur only in public interest with approval of NTCA and the National Board for Wild Life**",
"==Overlay trap== :: **Tiger Reserve ≠ National Park** — tiger-reserve notification can overlay protected-area units and surrounding buffer landscapes"]},
{h:"Biosphere Reserve — conservation with people",t:1,cols:["Zone","Recall function"],rows:[
["Core","**Long-term biodiversity conservation and ecosystem protection** receive the strongest emphasis"],
["Buffer","**Activities compatible with conservation, research, monitoring, education and sustainable use** surround or adjoin the core"],
["Transition","**Sustainable resource management and livelihoods with stakeholder participation** are promoted in the outer area"]]},

"<text x='360' y='315' font-size='19' style='font-weight:700'>Transition</text><text x='360' y='337' font-size='15'>sustainable livelihoods · stakeholder participation</text></g>"+
"</svg>"}},
{h:"Biosphere Reserve status",t:1,list:[
"Legal-category test :: **Biosphere Reserve is not a Wildlife (Protection) Act protected-area category**",
"UNESCO relationship :: the **Man and the Biosphere (MAB) Programme** internationally recognises biosphere reserves in its World Network; national biosphere-reserve planning and UNESCO recognition are not identical legal acts",
"Overlap :: a biosphere reserve **can contain National Parks, sanctuaries or other land categories within its larger zoned landscape**",
"==People-and-conservation distinction== :: the **transition zone is part of the biosphere-reserve model**, so a biosphere reserve is not simply a larger National Park"]},
{h:"Eco-Sensitive Zones",t:1,list:[
"ESZ identity :: **site-specific regulatory zone notified around a National Park or Wildlife Sanctuary under the environmental-protection framework**; it is not another Wildlife Act protected-area category",
"ESZ purpose :: **moderate transition from higher-protection areas to surrounding landscapes by regulating environmentally damaging activities**",
"ESZ width :: **site-specific and notification-dependent**; !!every protected area has exactly a `1 km` ESZ!! is wrong",
"Activity regime :: ESZ notifications typically distinguish **prohibited, regulated and permitted/promoted activities** according to the site-specific notification and zonal planning framework",
"One-kilometre trap :: rules restricting some new commercial construction in the one-kilometre context **must not be converted into a claim that the notified ESZ boundary itself is universally one kilometre**"]},
{h:"Forest-law categories — not Wildlife Act protected areas",t:1,cols:["Forest-law category","Indian Forest Act baseline","Do not confuse with"],rows:[
["Reserved Forest","**Chapter II category constituted through the statutory reservation process, including settlement of forest-right claims before final notification**","**National Park / Wildlife Sanctuary** — different parent law and declaration process"],
["Protected Forest","**Chapter IV can be applied by State notification to qualifying government forest-land or waste-land not included in a Reserved Forest; uses may then be regulated under that framework**","**Wildlife Sanctuary** — 'protected' in the name does not make it a Wildlife Act protected area"],
["Village Forest","**Chapter III allows State Government forest rights to be assigned to a village community under the applicable forest-law framework**","**Community Reserve** — similar community vocabulary, different parent law and governance architecture"]]},
{h:"Cross-law category traps",t:1,k:"trap",list:[
"!!Biosphere Reserve = National Park!! :: **wrong** — one is a zoned conservation framework; the other is a Wildlife Act protected-area category",
"!!Tiger Reserve = one more name for National Park!! :: **wrong** — a tiger reserve has its own core/buffer statutory architecture and can overlay existing protected areas",
"!!ESZ = protected area under the Wildlife Act!! :: **wrong** — ESZ is a site-specific environmental regulatory zone around a protected area",
"!!Conservation Reserve = Community Reserve!! :: **wrong** — the former is centred on **government-owned land**, while the latter is based on **private/community land volunteered for conservation**",
"!!Reserved Forest / Protected Forest / Village Forest are Wildlife Act protected-area categories!! :: **wrong** — they belong to forest-law architecture and must be kept separate from NP/WLS categories"]},
{h:"Legal-change caution",t:2,k:"support",list:[
"Boundary-rule caution :: **NBWL recommendation is not a universal prerequisite for every declaration step**; current law distinguishes declaration, management and boundary alteration",
"Community-reserve caution :: **do not equate its protection regime with a sanctuary in every respect**; its land basis, governance committee and land-use-change rule are distinct",
"ESZ court-history caution :: **avoid turning one phase of litigation into a timeless universal buffer rule**; the safe static rule is site-specific notification under the current Ministry framework"]}
]});

/* ===== 12 WETLANDS & RAMSAR SYSTEM ===== */
SEC({id:"wetlands-ramsar",title:"Wetlands & Ramsar System",group:"Protected Areas & Conservation",tier:1,
stats:["UPSC CSE: **8 wetland/Ramsar Q** (2009–22) inside the 27-Q PA/wetland topic","UPPCS Pre: protected areas/BR/Ramsar **17 Q** in the broad topic","Formats: location matching, statements, definition/implication, ecosystem-function identification"],
note:"Treat a wetland as a hydrological–ecological system first, then add Ramsar designation and domestic governance. Current Ramsar counts are a dated overlay; UP-specific sites are consolidated in Sheet 13.",
blocks:[
{h:"Wetland identity and ecological functions",t:1,list:[
"Wetland definition :: **marsh, fen, peatland or water — natural or artificial, permanent or temporary, static or flowing, fresh, brackish or salt — including marine water up to `6 m` deep at low tide**.",
"Wetland field cues :: **water-saturated/hydric soils + hydrophytic vegetation + periodic or persistent inundation** distinguish wetland conditions.",
"Flood moderation :: **temporary storage and slow release of water can reduce downstream flood peaks**.",
"Groundwater interaction :: wetlands can **recharge or receive groundwater depending on local hydrogeology**; the direction is not universally one-way.",
"Nutrient and sediment retention :: **slow water, vegetation and microbial processes trap or transform sediments and nutrients**, improving downstream water quality.",
"Wetland-as-kidney analogy :: **aquatic plants and wetland processes can remove or immobilise heavy metals and excess nutrients**. [CSE 2022]",
"Carbon function :: **peatlands, marsh soils and wetland vegetation can store substantial carbon**, although some wetlands also emit methane.",
"Habitat function :: **breeding, feeding, nursery, refuge and migration-stopover habitat** make wetlands disproportionately important for biodiversity.",
"Coastal protection :: **mangroves, salt marshes and other coastal wetlands dissipate wave energy and stabilise shorelines**; detailed mangrove ecology is in Sheet 23."]},
{h:"Wetland-function schematic",t:2,fig:{kind:"svg",alt:"Wetland cross-section showing upland runoff entering a shallow vegetated wetland, sediment and nutrient retention, hydric soil, groundwater exchange, open water habitat and downstream flow reduction.",caption:"Wetlands connect catchment, soil, vegetation, groundwater and downstream waters; their services arise from these linked processes.",src:"<svg viewBox='0 0 720 350' xmlns='http://www.w3.org/2000/svg'>"+
"<path d='M20 95L155 115L235 165L300 205L420 205L520 170L700 165L700 330L20 330Z' style='fill:var(--good-bg);stroke:var(--good);stroke-width:2'/>"+

"<g font-size='15' style='paint-order:stroke;stroke:var(--sheet);stroke-width:4;stroke-linejoin:round'><text x='42' y='70'>Catchment runoff</text><text x='264' y='148'>Vegetated shallow wetland</text><text x='305' y='270'>Hydric soil: sediment and nutrient retention</text><text x='555' y='150'>Open water / habitat</text><text x='540' y='315'>Groundwater exchange</text><text x='572' y='215'>Slower downstream flow</text></g>"+
"</svg>"}},
{h:"Wetland, estuary and lagoon distinctions",t:1,cols:["System","Recall distinction"],rows:[
["Wetland","**Broad ecological category** defined by water regime, saturated soils and/or wetland biota; it includes many inland and coastal forms."],
["Estuary","**Tidal coastal water body where river freshwater mixes with seawater**, producing strong salinity and nutrient gradients."],
["Lagoon","**Shallow coastal water body separated from the sea by a barrier** such as a sandbar or barrier island, with one or more restricted sea connections."],
["Mangrove wetland","**Intertidal woody vegetation adapted to saline, waterlogged coastal substrates**; it can occur along estuaries, deltas and sheltered coasts."],
["Artificial wetland","**Human-made water bodies can fall within the Ramsar wetland concept**, including reservoirs, fish ponds, rice paddies and salt pans under the Convention's broad definition."]]},
{h:"Ramsar architecture and wise use",t:1,list:[
"Ramsar Convention :: **intergovernmental treaty adopted at Ramsar, Iran, on `2 February 1971` and in force from 1975**; India entered into force in **1982**.",
"Three-pillar logic :: **wise use of all wetlands + designation/effective management of Ramsar Sites + international cooperation**, especially for shared wetlands and species.",
"Wise use :: **maintain ecological character through ecosystem approaches within sustainable development**, not blanket exclusion of people from every Ramsar Site. [CSE 2010]",
"Ramsar List :: a Contracting Party designates **at least one Wetland of International Importance when it accedes**, and later sites must satisfy at least one Ramsar criterion.",
"==Designation trap== :: !!Ramsar status means every human use must stop!! is **wrong**; conservation and compatible sustainable use can coexist under wise use. [CSE 2010]",
"==Territory trap== :: !!Ramsar requires strict protection of every wetland in a Contracting Party's territory!! is **wrong**; the Convention combines wise use of all wetlands with specific commitments for listed sites. [CSE 2019]"]},
{h:"Ramsar designation criteria — grouped families",t:1,cols:["Criterion family","Testable requirement"],rows:[
["Criterion 1 — wetland type","**Representative, rare or unique natural/near-natural wetland type** in the appropriate biogeographic region."],
["Criteria 2–4 — species, communities and life-cycle support","Supports **threatened species or ecological communities; regional biological diversity; or species at critical life-cycle stages/refuges during adverse conditions**."],
["Criteria 5–6 — waterbirds","**Criterion 5: regularly supports `20,000` or more waterbirds; Criterion 6: regularly supports `1%` of a population of one waterbird species or subspecies**."],
["Criteria 7–8 — fish","Supports **significant indigenous fish diversity/life-history or representative assemblages, and/or important fish food, spawning, nursery or migration functions**."],
["Criterion 9 — other wetland-dependent animals","Regularly supports **`1%` of a population of one wetland-dependent non-avian animal species or subspecies**."]]},
{h:"Montreux Record",t:1,list:[
"Montreux Record :: **register of Ramsar Sites where ecological character has changed, is changing or is likely to change because of technological development, pollution or other human interference**. [CSE 2014]",
"==Status trap== :: !!Montreux listing makes a wetland a World Heritage Site!! is **wrong**. [CSE 2014]",
"Montreux-current caution :: **no present Indian Montreux-site count is frozen into this sheet**; use the Convention’s live record for current entries."]},
{h:"Indian wetland location and river traps",t:1,k:"trap",list:[
"Largest inland saline wetland location :: **Rajasthan** was the tested State. [CSE 2009]",
"Sambhar anchor :: **Sambhar Lake is the major inland saline-lake association in Rajasthan**.",
"Harike Wetland :: **confluence of the Beas and Sutlej**. [CSE 2014]",
"!!Keoladeo Ghana National Park — Banas/Chambal confluence!! :: **wrong pairing**. [CSE 2014]",
"!!Kolleru Lake — Musi/Krishna confluence!! :: **wrong pairing**. [CSE 2014]",
"Kolleru anchor :: **freshwater lake in Andhra Pradesh between the Krishna and Godavari deltaic systems**, not a Musi–Krishna confluence.",
"!!Hokera Wetland — Punjab!! :: **wrong pairing**. [CSE 2022]",
"Hokera locator :: **Jammu and Kashmir**.",
"Renuka Wetland :: **Himachal Pradesh**. [CSE 2022]",
"Rudrasagar Lake :: **Tripura**. [CSE 2022]",
"!!Sasthamkotta Lake — Tamil Nadu!! :: **wrong pairing**. [CSE 2022]",
"Sasthamkotta locator :: **Kerala**."]},
{h:"High-yield Indian wetland anchors",t:1,cols:["Wetland","State / UT","Ecological relation"],rows:[
["Chilika Lake","**Odisha**","**Brackish coastal lagoon** connected to the Bay of Bengal; important waterbird and Irrawaddy-dolphin habitat."],
["Loktak Lake","**Manipur**","**Freshwater lake with floating phumdis**; Keibul Lamjao National Park occupies its south-western part."],
["Wular Lake","**Jammu and Kashmir**","**Large freshwater lake in the Jhelum basin**, important for flood buffering and fisheries."],
["Harike Wetland","**Punjab**","**Beas–Sutlej confluence wetland**. [CSE 2014]"],
["Kolleru Lake","**Andhra Pradesh**","**Freshwater lake between the Krishna and Godavari deltaic systems**."],
["Renuka Wetland","**Himachal Pradesh**","**Freshwater lake wetland**. [CSE 2022]"],
["Rudrasagar Lake","**Tripura**","**Freshwater lake wetland**. [CSE 2022]"],
["Sasthamkotta Lake","**Kerala**","**Freshwater lake and drinking-water source**."],
["Hokera Wetland","**Jammu and Kashmir**","**Himalayan freshwater marsh/wetland** important for waterbirds."]]},
{h:"Current India checkpoint and domestic rules",t:2,k:"support",list:[
"India Ramsar total :: **101 sites covering 1,387,741 ha**.",
"Latest designation :: **Glaw Lake became India's 101st Ramsar Site in August 2026**.",
"Current domestic framework :: **Wetlands (Conservation and Management) Rules, 2017** remain operative; the **2010 Rules are superseded**.",
"Institutional split :: **State/UT Wetland Authorities have primary implementation responsibility**, while the **National Wetlands Committee** is the central advisory body under the 2017 framework.",
"==Current-law trap== :: !!Wetlands Rules 2010 are India's present wetland-management rules!! is **wrong**; use the 2017 Rules as the current framework."]}
]});

SEC({id:"air-pollution",title:"Air Pollution, Smog, Acid Rain & Noise",group:"Pollution & Waste",tier:1,
stats:["UPSC CSE: **35 pollution Q** overall; air pollutants 5, acid rain 3, air-quality standards 2 plus industrial-source questions","UPPCS Pre: **27 pollution/waste Q**; smog/secondary pollutants 4, lichens 3, noise 3","Formats: pollutant→source→effect, primary/secondary classification, statements, direct/A–R"],
note:"Learn air pollution as source → emitted precursor → atmospheric transformation → effect. Keep current standards and programme targets separate from stable chemistry.",
blocks:[
{h:"Primary versus secondary pollutants",t:1,cols:["Type","Recall rule","Examples"],rows:[
["Primary pollutant","**Emitted directly from an identifiable source into the atmosphere**","**CO, SO₂, NO, particulate matter and many VOCs** can be emitted directly"],
["Secondary pollutant","**Formed in the atmosphere by chemical or photochemical transformation of precursors**","**Tropospheric ozone, PAN and much acid deposition/smog chemistry** are secondary"],
["Classification trap","**The same pollution episode can contain both primary precursors and secondary products**","!!Smog is not one single emitted substance!!"]]},
{h:"Major pollutant → source → effect",t:1,cols:["Pollutant","Major source relation","High-value effect"],rows:[
["Carbon monoxide (CO)","**Incomplete combustion of carbon-containing fuels**","**Binds haemoglobin strongly and reduces oxygen transport by blood** [CSE 2010]"],
["Sulphur dioxide (SO₂)","**Sulphur-containing fuel combustion, refineries and volcanic emissions**","**Respiratory irritation and acid-deposition precursor**"],
["Nitrogen oxides (NOx)","**High-temperature combustion, vehicle exhaust and other oxidation processes**","**Ozone/smog and acid-deposition precursor**"],
["Volatile organic compounds (VOCs)","**Fuel evaporation, solvents, vehicles and industrial processes**","**React with NOx in sunlight to form photochemical oxidants**"],
["Particulate matter (PM)","**Combustion, dust, construction, industry and biomass burning**","**Respiratory/cardiovascular exposure; fine particles penetrate deeper into the respiratory tract**"],
["Black carbon","**Incomplete high-temperature combustion, including diesel and biomass burning**","**Absorbs radiation and darkens snow/ice, lowering albedo**"]]},
{h:"Photochemical versus classical smog",t:1,cols:["Feature","Photochemical smog","Classical / sulphurous smog"],rows:[
["Key precursors","**NOx + VOCs/hydrocarbons + sunlight**","**SO₂ + smoke/particulate matter + moisture**"],
["Favouring weather","**Warm, dry and sunny conditions**","**Cool, humid/foggy conditions**"],
["Chemical character","**Oxidising**","**Reducing / sulphurous**"],
["Key secondary products","**Tropospheric ozone and PAN** [UPPCS 2018, 2019, 2022]","**Sulphur-containing aerosol/acid products with smoke and fog**"]]},
{h:"Smog and acid-deposition schematic",t:2,fig:{kind:"svg",alt:"Two pollution pathways: photochemical smog forms when nitrogen oxides and volatile organic compounds react in sunlight to produce ozone and PAN; acid deposition forms when sulfur dioxide and nitrogen oxides are oxidized to sulfuric and nitric acids and return by wet or dry deposition.",caption:"Two recurring chemistry chains: sunlight drives photochemical oxidants; oxidation of sulfur and nitrogen oxides drives acid deposition.",src:"<svg viewBox='0 0 720 330' xmlns='http://www.w3.org/2000/svg'>"+
"<rect x='30' y='35' width='310' height='250' rx='14' style='fill:var(--navy-bg);stroke:var(--navy);stroke-width:2'/>"+

"<text x='535' y='65' style='font-weight:700'>Acid deposition</text><text x='535' y='105'>SO₂ + NOx</text><text x='535' y='145'>oxidation + water</text><text x='535' y='190'>H₂SO₄ + HNO₃</text><text x='535' y='235'>wet + dry deposition</text></g>"+
"<line x1='185' y1='112' x2='185' y2='130' style='stroke:var(--navy);stroke-width:3'/>"+
"<line x1='185' y1='152' x2='185' y2='176' style='stroke:var(--navy);stroke-width:3'/>"+
"<line x1='535' y1='112' x2='535' y2='130' style='stroke:var(--warn);stroke-width:3'/>"+
"<line x1='535' y1='152' x2='535' y2='176' style='stroke:var(--warn);stroke-width:3'/>"+
"</svg>"}},
{h:"Acid deposition",t:1,list:[
"Acid-rain precursors :: **SO₂ and NOx are the principal exam-relevant gaseous precursors of acid deposition** [CSE 2010, 2013, 2022]",
"Wet deposition :: **acidic constituents return with rain, snow, fog or other precipitation**",
"Dry deposition :: **acidic gases and particles deposit without precipitation and can later be washed into soils and waters**",
"Soil effect :: **acidification can leach base cations and increase mobilisation of some metals**, degrading nutrient balance",
"Aquatic effect :: **falling pH can stress fish and other aquatic organisms** in acid-sensitive waters",
"Material effect :: **acid deposition accelerates weathering/corrosion of carbonate stone, metals and built heritage**",
"==Acid-rain trap== :: !!carbon oxides are the principal acid-rain precursors!! is **wrong** in the standard pollution context; focus on **sulphur and nitrogen oxides** [CSE 2010, 2013, 2022]"]},
{h:"Particulate matter and pollution trapping",t:1,list:[
"PM10 :: **particles with aerodynamic diameter up to about `10 µm`**; they can enter the respiratory system",
"PM2.5 :: **fine particles up to about `2.5 µm`**; smaller size allows deeper penetration into the lungs than coarse PM10",
"Secondary particulate matter :: **atmospheric reactions of gaseous precursors such as SO₂, NOx and ammonia can form fine particulate salts**",
"Temperature inversion :: **warmer air over cooler surface air suppresses vertical mixing and can trap pollutants near the ground**; only this pollution-dispersion consequence is retained here",
"Visibility :: **fine particles and aerosol droplets scatter/absorb light and contribute to haze**"]},
{h:"Lichens as air-pollution bioindicators",t:1,list:[
"Lichen sensitivity :: **many lichens are sensitive to air pollution because they absorb water and dissolved substances directly across much of their surface**",
"Indicator logic :: **low abundance or disappearance of pollution-sensitive lichens can signal degraded air quality** [UPPCS 2019, 2021, 2025]",
"!!Lichens grow especially well in polluted air!! :: **wrong** as a general statement; pollution-sensitive species commonly decline with worsening air quality [UPPCS 2019, 2021, 2025]",
"Bioindicator caution :: **lichen response varies by species and pollutant**, so lichen presence is not a universal numerical substitute for instrument-based monitoring"]},
{h:"Tropospheric ozone versus stratospheric ozone",t:1,k:"trap",list:[
"Tropospheric ozone :: **secondary air pollutant formed photochemically from NOx and VOC precursors**; it damages respiratory tissues and vegetation",
"Stratospheric ozone :: **protective ozone layer that absorbs biologically harmful ultraviolet radiation**; detailed depletion chemistry is in Sheet 17",
"!!All atmospheric ozone is beneficial!! :: **wrong** — ==location determines ecological role==",
"!!Ground-level ozone is emitted directly from vehicle exhaust!! :: **wrong** — vehicles emit important **precursors**, while ozone forms secondarily in sunlight"]},
{h:"Indoor air — source to pollutant/effect",t:2,cols:["Indoor source","Likely pollutant / exposure","High-value effect / trap"],rows:[
["Solid-fuel cooking or heating in poorly ventilated spaces","**Fine particulate matter, carbon monoxide and other combustion products**","High indoor exposure can cause **respiratory and cardiovascular harm; CO impairs oxygen transport**"],
["Tobacco smoke","**Fine particles, carbon monoxide and multiple volatile organic compounds**","Creates **second-hand indoor exposure**, not merely an outdoor-air problem"],
["Faulty or unvented combustion appliances and generators","**Carbon monoxide and nitrogen oxides**","Accumulation can create **CO-poisoning and respiratory-irritation risk**"],
["Paints, solvents, furnishings and some building products","**Volatile organic compounds, including formaldehyde depending on the material**","Can cause **irritation and other health effects**; the exact pollutant depends on the source"],
["Dampness and mould","**Bioaerosols, spores and allergens**","Can aggravate **respiratory and allergic symptoms**"]]},
{h:"Noise pollution",t:2,list:[
"Noise metric :: **sound-pressure level is commonly expressed in decibels (dB)**; the decibel scale is logarithmic",
"Health pathway :: **prolonged or intense noise exposure can cause hearing impairment, sleep disturbance, stress and cardiovascular effects**",
"Wildlife pathway :: **anthropogenic noise can mask communication, alter behaviour and disturb feeding, breeding or movement**"]},
{h:"Noise limits — current legal standards",t:1,cols:["Area category","Day 06:00–22:00","Night 22:00–06:00"],rows:[

["Commercial","**`65 dB(A) Leq`**","**`55 dB(A) Leq`**"],
["Residential","**`55 dB(A) Leq`**","**`45 dB(A) Leq`**"],
["Silence zone","**`50 dB(A) Leq`**","**`40 dB(A) Leq`**"]]},
{h:"AQI and current-programme caution",t:3,k:"support",list:[

/* ===== 15 WATER POLLUTION, EUTROPHICATION & TOXICANTS ===== */
SEC({id:"water-toxic-pollution",title:"Water Pollution, Eutrophication & Toxicants",group:"Pollution & Waste",tier:1,
stats:["UPSC CSE: pollution topic **35 Q** overall; water pollutants 3, heavy metals 3, emerging contaminants 9","UPPCS Pre: pollution/waste **27 Q**; eutrophication repeated in 2019–20","Formats: cause→effect chains, pollutant/source matching, statement sets, elimination"],
note:"Solve water-pollution questions by separating source, pathway, persistence and effect. Avoid treating BOD, COD, DO or one contaminant threshold as a complete measure of water quality.",
blocks:[
{h:"Water-quality core: BOD, COD and DO",t:1,cols:["Measure","Recall meaning","Exam distinction"],rows:[
["BOD","**Biochemical oxygen demand — oxygen used by microorganisms while decomposing biodegradable organic matter under specified test conditions**","Higher BOD generally signals a **higher biodegradable organic load**"],
["COD","**Chemical oxygen demand — oxygen-equivalent required to chemically oxidise oxidisable substances in water**","COD can include material that is **not readily biodegradable**, so it is not interchangeable with BOD"],
["DO","**Dissolved oxygen — oxygen available in water for aquatic organisms and aerobic processes**","Heavy organic loading can drive **DO downward** as microbial oxygen demand rises"],
["Relationship","**High biodegradable load → higher BOD → greater oxygen consumption → lower DO**, all else equal","!!DO is not determined by BOD alone!! — temperature, mixing, photosynthesis and reaeration also matter"]]},
{h:"Eutrophication sequence",t:1,list:[
"Nutrient enrichment :: **excess nitrogen and/or phosphorus enters a water body**, often from sewage, fertiliser runoff or other nutrient-rich discharges [UPPCS 2020, 2019]",
"Primary response :: **algal/phytoplankton growth can accelerate when the added nutrient is limiting**",
"Bloom aftermath :: **senescence and microbial decomposition of accumulated biomass increase oxygen demand**",
"Hypoxia pathway :: **decomposition can depress dissolved oxygen**, stressing or killing oxygen-dependent aquatic organisms [UPPCS 2020, 2019]",
"Harmful-algal-bloom caveat :: **some blooms additionally produce toxins or other harmful compounds**, so ecological damage is not only an oxygen-depletion problem",
"==Eutrophication trap== :: !!all algal growth means eutrophication!! is **wrong** — the exam-relevant process is nutrient enrichment driving excessive production and downstream ecological effects"]},
{h:"Eutrophication process",t:1,fig:{kind:"svg",alt:"Eutrophication sequence from nutrient loading to algal bloom, decomposition, oxygen depletion and fish or benthic stress",caption:"Nutrient loading can stimulate blooms; decomposition of the added biomass then consumes oxygen and can produce hypoxia.",src:"<svg viewBox='0 0 720 260' xmlns='http://www.w3.org/2000/svg'>"+
"<g text-anchor='middle' font-size='15'><rect x='24' y='82' width='122' height='70' rx='10' style='fill:var(--warn-bg);stroke:var(--warn);stroke-width:2'/><text x='85' y='108' style='font-weight:700'>Nutrient loading</text><text x='85' y='132'>N + P inputs</text>"+
"<rect x='170' y='82' width='122' height='70' rx='10' style='fill:var(--good-bg);stroke:var(--good);stroke-width:2'/><text x='231' y='108' style='font-weight:700'>Algal bloom</text><text x='231' y='132'>rapid production</text>"+
"<rect x='316' y='82' width='122' height='70' rx='10' style='fill:var(--teal-bg);stroke:var(--teal);stroke-width:2'/><text x='377' y='108' style='font-weight:700'>Decomposition</text><text x='377' y='132'>microbial demand</text>"+
"<rect x='462' y='82' width='122' height='70' rx='10' style='fill:var(--navy-bg);stroke:var(--navy);stroke-width:2'/><text x='523' y='108' style='font-weight:700'>DO falls</text><text x='523' y='132'>hypoxia risk</text>"+
"<rect x='608' y='82' width='88' height='70' rx='10' style='fill:var(--plum-bg);stroke:var(--plum);stroke-width:2'/><text x='652' y='108' style='font-weight:700'>Biotic</text><text x='652' y='132'>stress</text></g>"+
"<g style='stroke:var(--ink-2);stroke-width:2'><line x1='146' y1='117' x2='170' y2='117'/><line x1='292' y1='117' x2='316' y2='117'/><line x1='438' y1='117' x2='462' y2='117'/><line x1='584' y1='117' x2='608' y2='117'/></g>"+
"<text x='360' y='210' text-anchor='middle' font-size='15' style='fill:var(--ink-2)'>Severity depends on nutrient limitation, flushing, temperature, mixing and ecosystem context.</text>"+
"</svg>"}},
{h:"Pollution sources: point versus non-point",t:2,cols:["Source type","Recall rule","Examples"],rows:[
["Point source","**Discharge enters from a discrete, identifiable outlet**","Industrial effluent pipe, sewer outfall or treatment-plant discharge"],
["Non-point source","**Diffuse runoff or deposition enters over a broad area rather than one outlet**","Agricultural nutrient runoff, urban stormwater and diffuse sediment loading"],
["Control implication","**Point sources are usually easier to monitor at a discharge point; non-point sources require landscape-level management**","Source type changes the control strategy, not the toxicity of the pollutant itself"]]},
{h:"Heavy metals and toxic elements",t:1,cols:["Contaminant","Typical environmental pathway","High-value consequence"],rows:[
["Mercury","**Industrial releases and atmospheric deposition can enter aquatic systems; microbes can convert mercury to methylmercury**","**Methylmercury bioaccumulates and biomagnifies**, creating high exposure at upper trophic levels"],
["Lead","**Industrial emissions, batteries, paints and legacy contamination** can enter soil, dust and water","**Persistent toxic metal**; environmental exposure can affect neurological and other biological functions"],
["Arsenic","**Geogenic mobilisation in groundwater** is a major pathway in affected aquifers","Long-term contaminated-water exposure is the principal environmental-health concern"],
["Cadmium","**Mining/smelting, batteries and some fertiliser/industrial pathways** can release cadmium","Persistent metal that can accumulate in organisms and soils"],
["Chromium","**Tannery, metal-processing and other industrial effluents** can release chromium compounds","Toxicity depends strongly on chemical form; !!all chromium species are not environmentally equivalent!!"]]},
{h:"Persistent and emerging contaminants",t:1,cols:["Contaminant / group","Recall source or use","Exam discriminator"],rows:[
["PFAS","**Large family of highly persistent fluorinated chemicals used in multiple industrial and consumer applications**","Persistence and mobility make them an emerging-contaminant class; avoid one undated universal regulatory threshold"],
["Bisphenol A (BPA)","**Used in manufacture of polycarbonate plastics** [CSE 2021] and some epoxy resins","A product-associated chemical contaminant, not a microplastic particle"],
["Triclosan","**Antimicrobial compound historically used in some personal-care and consumer products**","Can enter wastewater; product regulation varies by jurisdiction and time"],
["Microbeads","**Intentionally manufactured small plastic particles formerly used in some rinse-off and consumer products**","A subset of primary microplastics"],
["Microplastics","**Plastic particles generally smaller than `5 mm`**, arising either directly as small particles or by fragmentation","Primary and secondary microplastics are origin categories; !!microbead ≠ all microplastics!!"]]},
{h:"POPs and trophic contamination",t:1,list:[
"Persistent organic pollutant (POP) :: **organic chemical that resists degradation and can persist, travel long distances and accumulate in organisms**; treaty architecture belongs in Sheet 19",
"Pollutant properties :: **persistence, bioavailability and poor metabolism/excretion favour trophic build-up**",
"Top-predator application :: **predators can receive a retained contaminant from many prey items**, producing high concentrations at upper trophic levels",
"Mechanism cross-reference :: **formal bioaccumulation/biomagnification definitions and the energy-down/pollutant-up contrast are consolidated in Sheet 02**"]},
{h:"Thermal pollution and oil spills",t:2,list:[
"Thermal pollution :: **discharge of heated water can raise receiving-water temperature**, altering metabolism and species composition",
"Temperature–oxygen relation :: **warmer water generally holds less dissolved oxygen**, increasing stress where oxygen demand is already high",
"Oil-spill surface effect :: **oil can coat organisms and interfere with insulation, feeding, respiration or reproduction**, depending on taxon and exposure",
"Oil-spill chemical effect :: **soluble and dispersed hydrocarbon fractions can be toxic**, while heavier residues can persist in sediments or shorelines",
"Remediation boundary :: **oil-spill bioremediation methods are treated in Sheet 16**"]},
{h:"Threshold and health-detail discipline",t:3,k:"support",list:[
"Current-threshold rule :: **PFAS, metal and drinking-water limits are jurisdiction- and date-specific**, so this sheet does not freeze an undated numerical catalogue",
"Toxicology scope :: **retain environmental pathway and major ecological/health consequence**, not long disease lists that do not improve Prelims discrimination",
"Water-quality trap :: !!one low BOD value proves a water body is safe from every pollutant!! is **wrong** — toxic metals, salts, pathogens and persistent chemicals require other measures"]}
]});

/* ===== 16 WASTE MANAGEMENT, EPR & REMEDIATION ===== */
SEC({id:"waste-remediation",title:"Waste Management, EPR & Remediation",group:"Pollution & Waste",tier:1,
stats:["UPSC CSE: **12 remediation/waste Q**; remediation technologies 5, construction reuse 4, waste management 3","UPSC CSE: **7 of 12 since 2018**; recurring technique→use questions","UPPCS Pre: waste embedded in the **27-Q pollution/waste core**; biodegradability recurs"],
note:"Separate the stable engineering/ecology concepts from fast-changing rule details. For each waste stream learn generation → segregation → responsible actor → recovery/treatment → final disposal.",
blocks:[
{h:"Waste hierarchy",t:1,list:[
"Highest-priority logic :: **prevent or reduce waste generation before managing waste after it is created**",
"Reuse :: **use a product or component again with minimal reprocessing**, retaining more embedded value than material recycling",
"Recycling :: **reprocess waste into secondary material or products**, reducing virgin-material demand but still requiring collection and processing",
"Recovery :: **recover material or energy from residual waste** where prevention/reuse/recycling are not feasible",
"Final disposal :: **landfilling or other final disposal is the lowest-preference endpoint for unavoidable residual waste**",
"==Hierarchy trap== :: !!waste-to-energy is equivalent to waste prevention!! is **wrong** — energy recovery sits below prevention, reuse and material recycling"]},
{h:"Current waste-rule checkpoint",t:1,cols:["Waste stream","Current framework","Recall consequence"],rows:[
["Municipal solid waste","**Solid Waste Management Rules, 2026**, effective `1 April 2026`, replaced the 2016 Rules","Current segregation architecture uses **wet, dry, sanitary and special-care** streams"],
["Construction & demolition waste","**Construction and Demolition Waste Management Rules, 2025**, effective `1 April 2026`","Current framework includes an **EPR architecture**; the 2016 C&D Rules are not the current endpoint"],
["E-waste","**E-Waste (Management) Rules, 2022**, as amended","Producer obligations are organised through **EPR and authorised recycling/recovery channels**"],
["Battery waste","**Battery Waste Management Rules, 2022**, as amended","Uses **EPR-based collection and recycling/recovery responsibilities**"],
["Plastic waste","**Plastic Waste Management Rules, 2016**, as subsequently amended","Plastic EPR and single-use-plastic controls sit under an amended rule family rather than one frozen 2016 snapshot"],
["Contaminated sites","**Environment Protection (Management of Contaminated Sites) Rules, 2025**","Creates a distinct current framework for identification and management/remediation of contaminated sites"]]},
{h:"Extended Producer Responsibility",t:1,list:[
"EPR core :: **producer responsibility extends beyond sale/use into collection, recycling, recovery or environmentally sound end-of-life management**",
"Design incentive :: **making producers responsible for downstream waste can shift incentives toward recyclability, material choice and collection systems**",
"Stream-specific rule :: **EPR obligations differ by waste stream**, so e-waste, batteries, plastics and C&D waste must not be treated as one identical compliance system",
"!!EPR means the consumer has no role!! :: **wrong** — consumer segregation/return behaviour can remain necessary even where legal producer responsibility exists",
"!!One EPR certificate is universally interchangeable across waste streams!! :: **wrong** — compliance instruments are rule- and stream-specific"]},
{h:"Solid-waste flow",t:1,fig:{kind:"svg",alt:"Waste-management flow from prevention and source segregation through reuse and recycling, biological treatment or material recovery, energy recovery for suitable residuals, and final disposal for rejects",caption:"The hierarchy is not just a list: each lower stage handles material that could not reasonably be retained at a higher-value stage.",src:"<svg viewBox='0 0 720 300' xmlns='http://www.w3.org/2000/svg'>"+

"<rect x='145' y='105' width='105' height='60' rx='9' style='fill:var(--teal-bg);stroke:var(--teal);stroke-width:2'/><text x='197' y='130' style='font-weight:700'>Reuse</text><text x='197' y='151'>repair</text>"+
"<rect x='265' y='105' width='105' height='60' rx='9' style='fill:var(--navy-bg);stroke:var(--navy);stroke-width:2'/><text x='317' y='130' style='font-weight:700'>Recycle</text><text x='317' y='151'>materials</text>"+
"<rect x='385' y='105' width='125' height='60' rx='9' style='fill:var(--warn-bg);stroke:var(--warn);stroke-width:2'/><text x='447' y='130' style='font-weight:700'>Treat / recover</text><text x='447' y='151'>bio / energy</text>"+
"<rect x='525' y='105' width='165' height='60' rx='9' style='fill:var(--plum-bg);stroke:var(--plum);stroke-width:2'/><text x='607' y='130' style='font-weight:700'>Final disposal</text><text x='607' y='151'>residual rejects</text></g>"+
"<g style='stroke:var(--ink-2);stroke-width:2'><line x1='130' y1='135' x2='145' y2='135'/><line x1='250' y1='135' x2='265' y2='135'/><line x1='370' y1='135' x2='385' y2='135'/><line x1='510' y1='135' x2='525' y2='135'/></g>"+
"<text x='360' y='235' text-anchor='middle' font-size='15' style='fill:var(--ink-2)'>Source segregation enables higher-value recovery and lowers contamination of recyclable/compostable streams.</text>"+
"</svg>"}},
{h:"Biological treatment and remediation",t:1,cols:["Technique","Core mechanism","Best discriminator"],rows:[
["Bioremediation","**Use of microorganisms or biological processes to transform, immobilise or remove contaminants** [CSE 2017]","Umbrella concept; success depends on contaminant bioavailability and environmental conditions"],
["Biostimulation","**Adjust nutrients, oxygen, electron acceptors/donors or conditions to stimulate indigenous degraders**","Stimulates microbes already present"],
["Bioaugmentation","**Add selected microorganisms with desired degradative capability**","Adds organisms rather than merely changing conditions"],
["Phytoremediation","**Use plants to extract, stabilise, transform or assist removal of contaminants**","Plant-based; mechanism varies among phytoextraction, phytostabilisation and related processes"],
["Mycoremediation","**Use fungi and fungal enzymes to transform or immobilise contaminants**","Fungal rather than bacterial/plant remediation"],
["Constructed wetland","**Engineered wetland uses plants, microbes, substrate and hydraulic retention to treat wastewater**","Combines physical settling, biological transformation and plant/substrate interactions"]]},
{h:"Legacy waste and biomining",t:2,list:[
"Legacy waste :: **old accumulated waste in dumpsites or landfills that predates or escaped systematic segregation and processing**",
"Biomining of legacy waste :: **excavates, stabilises and mechanically separates old dump material to recover usable fractions and reclaim dumpsite space or land**",
"==Biomining ≠ contaminant bioremediation== :: **biomining processes a mixed legacy-waste mass; bioremediation uses biological processes to transform, immobilise or remove specific contaminants in a medium**",
"Terminology trap :: **legacy-waste biomining is not the same as biomining or bioleaching of metals from ores**"]},
{h:"High-yield remediation technologies",t:1,list:[
"Oil-spill bioremediation :: **hydrocarbon-degrading microorganisms can accelerate breakdown of biodegradable petroleum fractions when conditions permit**",
"Oilzapper :: **microbial consortium developed for bioremediation of oil-contaminated sites**, a high-value technique→use association",
"Biofilter :: **polluted air or water passes through biologically active media where microbes degrade target contaminants**",
"Activated carbon :: **high-surface-area adsorbent removes many dissolved or gaseous contaminants by adsorption** [CSE 2025]; it is !!not a biological degradation process!!",
"Membrane bioreactor :: **combines biological wastewater treatment with membrane separation**, allowing retention of biomass and production of clarified effluent",
"==Technology trap== :: **adsorption removes contaminants onto a surface; biodegradation chemically transforms them**"]},
{h:"Industrial by-products and beneficial reuse",t:1,cols:["Material","Useful environmental relation","Caution"],rows:[
["Fly ash","**Can be used in cement, concrete, bricks and certain road/embankment applications**","Reuse must meet engineering and contaminant-control requirements; ash remains a waste/by-product until safely utilised"],
["Steel slag","**Can substitute for some natural aggregate in suitable road/construction applications after processing and quality control** [CSE 2020]","Composition and volume stability matter; !!all slag is not automatically construction-ready!!"],
["Construction & demolition material","**Concrete, masonry and other mineral fractions can be processed into recycled aggregates or products**","Source segregation improves recovery quality"],
["Organic municipal waste","**Suitable segregated biodegradable fractions can undergo composting or anaerobic digestion**","Mixed contaminated waste reduces process quality"]]},
{h:"Landfill, composting and anaerobic digestion",t:2,list:[
"Sanitary landfill :: **engineered disposal facility for residual waste using containment, leachate control and landfill-gas management**; it is not open dumping",
"Landfill leachate :: **water percolating through waste can mobilise dissolved and suspended contaminants**, requiring collection/treatment where generated",
"Landfill methane :: **anaerobic decomposition of biodegradable waste generates CH₄**, linking waste management to climate mitigation",
"Composting :: **aerobic biological decomposition of segregated organic waste produces a stabilised soil-conditioning material**",
"Anaerobic digestion :: **microbial decomposition without oxygen produces biogas plus digestate**, combining treatment with energy recovery"]},
{h:"Plastic pollution and treaty status",t:2,k:"trap",list:[
"Plastic persistence :: **poorly managed plastics can fragment into microplastics rather than rapidly mineralising**, spreading contamination across soils and waters",
"Recycling limitation :: **polymer type, additives, contamination and product design affect recyclability**, so !!all plastics are equally recyclable!! is wrong",
"Global-treaty position as of `27 September 2026` :: **no final global plastics treaty had been adopted**",
"Negotiation trap :: !!UN plastics negotiations mean the treaty is already in force!! is **wrong**; negotiation mandate, adoption, signature/ratification and entry into force are separate stages"]},
{h:"Current-law chronology traps",t:1,k:"support",list:[
"!!Solid Waste Management Rules, 2016 are the current municipal-solid-waste rules!! :: **wrong** — they were replaced by the **Solid Waste Management Rules, 2026** from `1 April 2026`",
"!!C&D Waste Management Rules, 2016 are the current endpoint!! :: **wrong** — the **2025 Rules** took effect on `1 April 2026`",
"Historical EPR milestones :: **older 2011/2016 rule references remain useful chronology**, but they must not overwrite current waste-stream-specific frameworks",
"Current-rule discipline :: **exact EPR targets, certificate mechanics and portal procedures are dynamic** and should be taken from the current rule/amendment rather than memorised from an old static table"]}
]});


/* ===== 17 CLIMATE SCIENCE, GHGS & OZONE ===== */
SEC({id:"climate-science-ozone",title:"Climate Science, GHGs & Ozone",group:"Climate Change & Carbon",tier:1,
stats:["UPSC CSE: **21 climate-change Q**; climate science 4, ODS/HFC 2, impacts 2 plus carbon-sink/GHG items","UPPCS Pre: **15 climate/ozone/GHG Q** across all 8 papers","Formats: gas→source/effect, mechanism statements, A–R, category traps"],
note:"Keep three mechanisms separate: greenhouse forcing, stratospheric ozone depletion and tropospheric ozone pollution. Exact contemporary GWP/lifetime/emission-share tables are deliberately omitted unless tied to a named assessment.",
blocks:[
{h:"Greenhouse effect — radiation logic",t:1,list:[
"Incoming solar energy :: the Earth system absorbs part of incoming **short-wave solar radiation** and reflects the rest",
"Outgoing terrestrial energy :: the warmed surface–atmosphere system emits **long-wave infrared radiation** toward space",
"Greenhouse-gas role :: **GHGs absorb and re-emit selected bands of outgoing infrared radiation** [CSE 2012], reducing the rate at which heat escapes directly to space",
"Natural greenhouse effect :: **keeps Earth's surface substantially warmer than it would be without infrared-active gases**; anthropogenic forcing strengthens this effect by changing atmospheric composition",
"Radiative forcing :: **change in Earth's energy balance caused by a driver**, with positive forcing tending to warm and negative forcing tending to cool the climate system",
"==Greenhouse trap== :: !!GHGs mainly warm Earth by blocking incoming visible sunlight!! is **wrong** — their defining mechanism concerns **outgoing infrared radiation**"]},
{h:"Major greenhouse gases — source and role",t:1,cols:["Gas","High-value source / cycle relation","Exam discriminator"],rows:[
["Carbon dioxide (CO₂)","**Fossil-fuel combustion, cement production and land-use change** add CO₂; photosynthesis and ocean uptake remove part of it","Long-lived anthropogenic forcing agent; detailed carbon cycling is in Sheet 03"],
["Methane (CH₄)","**Wetlands, ruminants, rice cultivation, landfills and fossil-fuel systems** are major source categories","Strong greenhouse gas with a **shorter atmospheric lifetime than CO₂**; exact contemporary GWP is assessment/time-horizon dependent"],
["Nitrous oxide (N₂O)","**Microbial nitrogen transformations in fertilised/agricultural soils and other nitrogen-rich systems** are major sources","Greenhouse gas and also relevant to stratospheric ozone chemistry"],
["Water vapour","**Atmospheric water responds strongly to temperature through evaporation and condensation**","Primarily a **climate feedback** on contemporary anthropogenic timescales, not the initiating long-lived forcing analogue of added CO₂"],
["Fluorinated gases","**Industrial refrigerant, foam, electrical and process applications** depending on compound","Many have high warming influence per unit mass; ==HFCs are greenhouse gases but are not classic ozone-depleting substances=="]]},
{h:"Aerosols versus greenhouse gases",t:1,cols:["Feature","Greenhouse gases","Atmospheric aerosols"],rows:[
["Primary forcing mechanism","**Absorb and re-emit outgoing long-wave infrared radiation**","**Scatter and/or absorb radiation and alter cloud properties**; composition controls the net effect"],
["Atmospheric persistence","**Varies widely by gas; many well-mixed greenhouse gases persist for years to centuries or longer**","Most tropospheric aerosols are **short-lived and spatially heterogeneous**, commonly persisting from hours to weeks or a few months"],
["Typical climate tendency","Higher concentrations of major well-mixed greenhouse gases produce **positive radiative forcing / warming**","Historical net anthropogenic aerosol forcing has been **cooling overall**, but !!aerosols are not universally cooling!!"],
["Absorbing-aerosol trap","Not the defining greenhouse-gas category","**Black carbon absorbs solar radiation and produces warming**, while many scattering aerosols such as sulphate tend to cool"]]},
{h:"Greenhouse-effect schematic",t:1,fig:{kind:"svg",alt:"Greenhouse effect diagram showing incoming short-wave solar radiation, reflected sunlight, absorbed surface energy, outgoing infrared radiation, and greenhouse gases absorbing and re-emitting part of that infrared radiation.",caption:"The greenhouse effect is an infrared-radiation mechanism: incoming solar energy warms the surface; greenhouse gases absorb and re-emit part of the outgoing long-wave radiation.",src:"<svg viewBox='0 0 720 360' xmlns='http://www.w3.org/2000/svg'>"+

"<path d='M420 142Q365 180 392 248' style='stroke:var(--navy);stroke-width:3;fill:none'/><path d='M515 165Q565 200 542 250' style='stroke:var(--navy);stroke-width:3;fill:none'/><text x='360' y='178' font-size='15'>re-emission</text>"+
"<path d='M315 162L250 120' style='stroke:var(--ink-2);stroke-width:3;fill:none'/><text x='210' y='142' font-size='15'>reflection</text>"+
"</svg>"}},
{h:"Methane and carbon sinks",t:2,list:[
"Methane oxidation :: **reaction with atmospheric hydroxyl radicals (OH)** is the dominant atmospheric sink pathway for CH₄",
"Soil methane sink :: **methanotrophic microorganisms oxidise methane** in suitable aerobic soils",
"Carbon sink :: a process or reservoir is a **net sink when it removes more carbon from the atmosphere than it releases over the stated period**",
"Reservoir versus sink :: **large carbon stock does not automatically mean a present net sink**; stock size and net flux are different quantities",
"Peatlands :: **waterlogged conditions can slow decomposition and accumulate large soil-carbon stocks**, but disturbance or drainage can reverse the balance"]},
{h:"Stratospheric ozone versus tropospheric ozone",t:1,cols:["Location","Role","Key mechanism"],rows:[
["Stratosphere","**Protective ozone layer absorbs much biologically harmful UV radiation**","Ozone is continuously formed and destroyed; catalytic halogen chemistry can accelerate destruction"],
["Troposphere","**Secondary air pollutant and greenhouse gas**","Forms photochemically from NOx and VOC precursors in sunlight; pollution chemistry is treated in Sheet 14"],
["Exam distinction","==Same molecule, different environmental role because of **altitude/location**==","!!Ozone is always beneficial!! and !!ozone is always a pollutant!! are both wrong"]]},
{h:"Ozone depletion — catalytic halogen logic",t:1,list:[
"ODS transport :: sufficiently persistent **chlorine- or bromine-containing compounds can reach the stratosphere before being broken down**",
"Photolysis :: **stratospheric ultraviolet radiation releases reactive halogen species** from many ozone-depleting substances",
"Catalytic destruction :: reactive halogens can **destroy ozone repeatedly through catalytic cycles**, so one radical can participate in many ozone-loss reactions",
"Polar amplification :: **very cold polar-stratospheric conditions and polar stratospheric clouds activate chlorine chemistry**, helping produce severe seasonal Antarctic ozone loss",
"Ozone-depletion consequence :: **less stratospheric ozone allows more UV-B to reach the surface**, increasing biological stress on organisms and materials"]},
{h:"CFC, HCFC and HFC distinction",t:1,k:"trap",list:[
"CFCs :: **chlorine-containing, long-lived ozone-depleting substances** historically used in refrigeration, foams and other applications",
"HCFCs :: **also ozone-depleting but generally lower-ODP transitional substitutes than many CFCs**; they remain controlled under Montreal architecture",
"HFCs :: **contain no chlorine or bromine and therefore are not classic ozone-depleting substances**, but many are potent greenhouse gases",
"Kigali Amendment :: **phases down HFCs within the Montreal Protocol architecture**; !!Kigali control does not make HFCs ozone-depleting substances!!",
"Current-count caution :: **Kigali ratification totals are dynamic** and are not needed to solve the stable science relationship"]},
{h:"Climate-change ecological impacts",t:2,list:[
"Species ranges :: **warming and altered moisture regimes can shift climatically suitable ranges**, especially where dispersal or habitat connectivity is limited",
"Phenology :: **timing of flowering, breeding, migration and emergence can shift with climate**, creating potential mismatches among interacting species",
"Coral bleaching :: **thermal stress can disrupt coral–algal symbiosis and cause bleaching** [UPPCS 2015, 2012]; bleaching is a stress response, not automatic immediate coral death",
"Cryosphere-linked ecology :: **loss of snow/ice and changing meltwater timing can alter freshwater, alpine and polar habitats**; detailed physical geography is outside this sheet",
"Extreme heat :: **combined heat and humidity constrain physiological cooling**, which is why wet-bulb temperature is a climate-impact metric [CSE 2025]",
"Ocean chemistry cross-link :: **ocean acidification is driven primarily by CO₂ uptake rather than warming itself** and is treated with marine ecology in Sheet 23"]},
{h:"Numerical-data discipline",t:3,k:"support",list:[
"GWP discipline :: **GWP depends on the chosen time horizon and assessment**, so undated single-number tables are not frozen here",
"Lifetime discipline :: **atmospheric lifetime differs by gas and definition**; the high-value comparison is mechanism and relative persistence, not stale decimals",
"Emission-share discipline :: **sector and country shares change with inventory year and methodology**, so learn source categories unless a dated dataset is explicitly being tested"]}
]});

/* ===== 18 CARBON REMOVAL, MARKETS & INDIA MITIGATION ===== */
SEC({id:"carbon-mitigation-markets",title:"Carbon Removal, Markets & India Mitigation",group:"Climate Change & Carbon",tier:1,
stats:["UPSC CSE: **4 geoengineering/CDR Q**, **3 carbon-market Q**, **3 India-policy Q**","UPPCS Pre: climate/ozone/GHG **15 Q**; net-zero and carbon credit are explicit revision priorities","Formats: mechanism identification, statements, policy/current-fact traps"],
note:"Separate mitigation from adaptation, CDR from solar-radiation modification, and allowances from credits. Current-policy statements are dated where necessary; uncertain implementation detail is not frozen into the static layer.",
blocks:[
{h:"Mitigation, adaptation and resilience",t:1,cols:["Concept","Recall definition","Discriminator"],rows:[
["Mitigation","**Reduce greenhouse-gas emissions or enhance removals/sinks** to limit future climate change","Acts on causes of climate change"],
["Adaptation","**Adjust human or ecological systems to actual or expected climate impacts** to reduce harm or exploit beneficial opportunities","Acts on consequences/exposure/vulnerability"],
["Climate resilience","**Capacity to anticipate, absorb, recover and adapt while maintaining essential functions**","Broader system property; can be strengthened by adaptation and development choices"],
["Climate-resilient development","**Integrates adaptation and mitigation with wider sustainable-development decisions**","Not a synonym for mitigation alone"]]},
{h:"Carbon dioxide removal versus solar-radiation modification",t:1,cols:["Approach","What it changes","High-value examples / limitation"],rows:[
["Carbon dioxide removal (CDR)","**Removes CO₂ from the atmosphere and stores it in biological, geological or durable product reservoirs**","Afforestation/reforestation, soil/blue-carbon enhancement, BECCS, direct air capture, enhanced weathering"],
["Solar-radiation modification (SRM)","**Seeks to reduce absorbed solar energy or increase outgoing reflection without removing atmospheric CO₂**","Stratospheric aerosol concepts and cloud-radiative interventions; does not directly solve elevated CO₂ or ocean acidification"],
["Category trap","==CDR changes atmospheric CO₂ stock; SRM changes radiative balance==","!!All geoengineering is carbon removal!! is **wrong**"]]},
{h:"CDR technique matrix",t:1,cols:["Technique","Core mechanism","Constraint / trap"],rows:[
["Afforestation / reforestation","**Increase carbon stored in vegetation and soils through forest establishment or restoration**","Storage can be reversed by fire, harvest, drought or land-use change; permanence matters"],
["Soil-carbon enhancement","**Increase organic carbon retained in soils through land-management changes**","Measurement, saturation and reversal can limit credited removals"],
["Blue carbon","**Increase or protect carbon stored in coastal ecosystems such as mangroves, salt marshes and seagrasses**","Habitat protection and hydrology matter; full ecology is in Sheet 23"],
["BECCS","**Biomass captures CO₂; energy conversion is paired with capture and geological storage of resulting CO₂**","Requires biomass, land/water and durable storage; lifecycle accounting is essential"],
["Direct air capture with storage","**Chemical processes remove CO₂ directly from ambient air followed by durable storage** [CSE 2025]","Energy-, material- and cost-intensive; removal is only durable if storage is durable"],
["Enhanced weathering","**Accelerates mineral reactions that consume CO₂ and convert it into dissolved or solid inorganic carbon forms**","Rate, mining/grinding energy, environmental effects and accounting determine net benefit"]]},
{h:"Removal quality and market integrity",t:1,list:[
"Additionality :: **the claimed emission reduction/removal would not have occurred without the credited intervention or incentive**",
"Permanence :: **stored carbon remains out of the atmosphere for the claimed duration**; reversal risk must be addressed",
"Leakage :: **emissions increase outside the project boundary because the activity is displaced rather than truly avoided**",
"Measurement, reporting and verification (MRV) :: **quantify and document the claimed climate outcome using an agreed method and independent or rule-based verification process**",
"Double counting :: **the same mitigation outcome must not be counted toward more than one claim where the governing system prohibits it**",
"==Credit-quality trap== :: **one tonne-labelled credit is not automatically equivalent in additionality, permanence, leakage risk or accounting treatment to every other credit**"]},
{h:"Allowance versus credit",t:1,cols:["Instrument","How it arises","Typical use"],rows:[
["Allowance / permit","**Authorisation to emit a specified quantity under a capped compliance system**","Cap-and-trade: covered entities surrender allowances against regulated emissions"],
["Carbon credit / offset unit","**Unit issued for a quantified reduction, avoidance or removal under a defined methodology**","May be used in compliance or voluntary contexts depending on the governing rules"],
["Compliance market","**Participation/use is tied to a legal or regulatory obligation**","Eligibility, surrender and accounting rules are set by the regulator/system"],
["Voluntary market","**Participation is not itself driven by a statutory emissions obligation**","Claims depend heavily on programme methodology, integrity and corporate-use rules"]]},
{h:"Carbon-market flow",t:1,fig:{kind:"svg",alt:"Carbon market flow showing a mitigation project or regulated cap generating a quantified unit, measurement reporting and verification, registry issuance or allocation, transfer between participants, and final surrender or retirement against a claim or compliance obligation.",caption:"A market unit is credible only when the underlying quantity is defined, measured, verified, uniquely recorded and then surrendered or retired without double counting.",src:"<svg viewBox='0 0 720 310' xmlns='http://www.w3.org/2000/svg'>"+
"<g text-anchor='middle' font-size='15'><rect x='24' y='100' width='118' height='70' rx='10' style='fill:var(--good-bg);stroke:var(--good);stroke-width:2'/><text x='83' y='126' style='font-weight:700'>Mitigation / cap</text><text x='83' y='149'>defined quantity</text>"+
"<rect x='166' y='100' width='118' height='70' rx='10' style='fill:var(--teal-bg);stroke:var(--teal);stroke-width:2'/><text x='225' y='126' style='font-weight:700'>MRV</text><text x='225' y='149'>measure + verify</text>"+
"<rect x='308' y='100' width='118' height='70' rx='10' style='fill:var(--navy-bg);stroke:var(--navy);stroke-width:2'/><text x='367' y='126' style='font-weight:700'>Registry</text><text x='367' y='149'>issue / allocate</text>"+
"<rect x='450' y='100' width='118' height='70' rx='10' style='fill:var(--warn-bg);stroke:var(--warn);stroke-width:2'/><text x='509' y='126' style='font-weight:700'>Transfer</text><text x='509' y='149'>trade / acquire</text>"+
"<rect x='592' y='100' width='104' height='70' rx='10' style='fill:var(--plum-bg);stroke:var(--plum);stroke-width:2'/><text x='644' y='126' style='font-weight:700'>Use</text><text x='644' y='149'>surrender / retire</text></g>"+
"<g style='stroke:var(--ink-2);stroke-width:2'><line x1='142' y1='135' x2='166' y2='135'/><line x1='284' y1='135' x2='308' y2='135'/><line x1='426' y1='135' x2='450' y2='135'/><line x1='568' y1='135' x2='592' y2='135'/></g>"+
"<text x='360' y='232' text-anchor='middle' font-size='15' style='fill:var(--ink-2)'>Integrity checks: additionality · permanence · leakage · unique accounting · no prohibited double counting</text>"+
"</svg>"}},
{h:"Paris Agreement Article 6 orientation",t:1,list:[
"Article 6 purpose :: **provides avenues for voluntary international cooperation in implementing NDCs**, including market and non-market approaches [CSE 2025]",
"Article 6.2 :: **cooperative approaches using internationally transferred mitigation outcomes (ITMOs)** with accounting requirements to avoid double counting",
"Article 6.4 :: **UN-supervised crediting mechanism** under the Paris Agreement architecture",
"Article 6.8 :: **non-market approaches** to international cooperation",
"==Article 6 trap== :: !!every domestic carbon credit is automatically an Article 6 unit!! is **wrong** — international transfer/accounting status depends on the governing mechanism and authorisation"]},
{h:"India — latest NDC and long-term direction",t:1,list:[
"Latest NDC :: **India submitted its 2031–2035 NDC on `24 April 2026`**; !!the 2022 updated NDC is no longer India's latest submission!!",
"Historical 2030 emissions-intensity commitment :: the **2022 updated NDC** framed a **45% reduction in emissions intensity of GDP from 2005 levels by 2030**; treat it as historical 2030 context, not the latest-NDC label",
"Historical 2030 power-capacity commitment :: the **2022 updated NDC** framed **about 50% cumulative installed electric-power capacity from non-fossil sources by 2030**; treat it as historical 2030 context, not the latest-NDC label",
"Net-zero direction :: **India's stated long-term net-zero objective remains 2070**",
"Power-capacity milestone :: official 2026 material states that **50% installed electric-power capacity from non-fossil sources was reached in June 2025**, ahead of the old 2030 timetable"]},
{h:"India — NAPCC and carbon-market current layer",t:1,k:"support",list:[
"NAPCC history :: **the original 2008 NAPCC architecture had eight national missions**",
"Current dashboard position :: **nine national missions** are reported in the current official NAPCC dashboard; !!'NAPCC currently has eight missions' is therefore unsafe as an undated statement!!",
"Indian Carbon Market Portal :: **launched on `21 March 2026`**, confirming that the domestic carbon-market architecture had moved beyond a purely proposed concept",
"Portal trap :: **portal launch does not prove every compliance-market segment is fully operational or every credit is interchangeable**",
"India–Japan cooperation :: **July 2026 rules relate to a Joint Crediting Mechanism under Paris Agreement Article 6.2**",
"Institutional-detail caution :: **administrator, regulator and registry roles under the CCTS must be read from the current implementing framework**, so this sheet does not hard-code a detailed role matrix"]}
]});


/* ===== 19 GLOBAL ENVIRONMENTAL CONVENTIONS ===== */
SEC({id:"global-conventions",title:"Global Environmental Conventions",group:"Environmental Governance",tier:1,
stats:["UPSC CSE: international conventions/bodies/initiatives **46 Q**; Paris, Kyoto, biodiversity and ozone treaty families recur","UPPCS Pre: international conventions/bodies/days **19 Q** (2018–25); protocols/conventions + chronology are recurring","Formats: treaty → objective/mechanism, protocol → parent convention, chronology, statement/matching traps"],
note:"Learn conventions as families: parent agreement → protocol/amendment → controlled activity → implementation mechanism. Dynamic COP outcomes and party counts stay outside this static architecture.",
blocks:[
{h:"Climate family — UNFCCC, Kyoto and Paris",t:1,cols:["Instrument","Core architecture","Exam discriminator"],rows:[
["UNFCCC","**Adopted at the 1992 Rio Earth Summit/UNCED** [CSE 2010]; entered into force on **`21 March 1994`** [UPPCS 2012]","Framework objective: stabilise greenhouse-gas concentrations so as to prevent dangerous anthropogenic interference with the climate system"],
["Kyoto Protocol","**Protocol under the UNFCCC with quantified commitment-period obligations for specified developed/Annex I Parties**","**Clean Development Mechanism belongs to the Kyoto architecture** [CSE 2016]; !!Kyoto is not a water-conservation protocol!! [UPPCS 2019]"],
["Paris Agreement","**Legally binding international agreement under the UNFCCC**; adopted at **COP21, Paris, 2015** [UPPCS 2018]","Its temperature goal is **well below `2°C` while pursuing efforts toward `1.5°C` above pre-industrial levels** [CSE 2016]"],
["NDC logic","Each Party communicates **nationally determined climate action** rather than receiving one uniform country-specific emissions quota","The earlier **INDC** formulation meant a country's planned contribution/action to combat climate change [CSE 2016]"],
["Current architecture","**Paris is the current universal climate-agreement framework**; Kyoto remains historically important for its commitment periods and mechanisms","!!Paris Agreement is not a treaty!! is **wrong**; nationally determined mitigation content does not make the agreement itself non-binding"]]},
{h:"Ozone family — Vienna, Montreal and Kigali",t:1,cols:["Instrument","Core role","High-value distinction"],rows:[
["Vienna Convention 1985","**Framework for international cooperation on protection of the ozone layer**","Framework convention; detailed phase-out controls came through Montreal"],
["Montreal Protocol 1987","**Controls and phases out ozone-depleting substances** [CSE 2015; UPPCS 2019]","Substance-control protocol under the Vienna ozone regime"],
["Kigali Amendment 2016","**Adds an HFC phase-down to the Montreal Protocol architecture**","==HFC control ≠ HFC ozone depletion==; **HFCs are greenhouse gases but are not classic ODS**"]]},
{h:"Biodiversity family — CBD, Cartagena and Nagoya",t:1,cols:["Instrument","Core objective / mechanism","Recall trap"],rows:[
["Convention on Biological Diversity (CBD)","Three objectives: **conservation of biodiversity + sustainable use + fair and equitable benefit-sharing**","Parent convention for the Cartagena and Nagoya protocols"],
["Cartagena Protocol on Biosafety","**Safe handling, transport and use of living modified organisms from modern biotechnology**","Cartagena → **biosafety** [UPPCS 2019]; !!not carbon markets or access-and-benefit sharing!!"],
["Nagoya Protocol","**Access to genetic resources + fair and equitable sharing of benefits arising from their utilisation**","Nagoya → **access and benefit-sharing (ABS)**; domestic BMC/Nagoya implementation is treated in Sheet 21"],
["Biodiversity treaty web","**International Treaty on Plant Genetic Resources for Food and Agriculture, UNCCD and World Heritage Convention can all bear on biodiversity conservation** [CSE 2014]","A treaty need not have 'biodiversity' in its title to affect biodiversity"]]},
{h:"Wildlife-trade and migratory-species regimes",t:1,cols:["System","What it regulates","Legal/status distinction"],rows:[
["CITES","**International trade in specimens of listed wild fauna and flora** through Appendix-based controls","**Legally binding on Parties but implemented through national law; it does not replace domestic legislation** [CSE 2015]"],
["CMS / Bonn Convention","**Conservation of migratory species across their ranges**","Appendix I = migratory species threatened with extinction; Appendix II = species needing or significantly benefiting from international cooperation"],
["CITES vs CMS","**CITES asks whether international trade is controlled; CMS asks whether migratory-species conservation requires range-state cooperation**","!!CITES Appendix, CMS Appendix, IUCN category and Indian Wildlife Act schedule are not interchangeable labels!!"]]},
{h:"Chemicals and hazardous-waste treaty matrix",t:1,cols:["Convention","Primary environmental problem","Mechanism cue"],rows:[
["Basel Convention 1989","**Transboundary movement and environmentally sound management of hazardous and other wastes**","Notification/consent and waste-movement control; not a POP-elimination treaty"],
["Rotterdam Convention 1998","**International trade in certain hazardous chemicals and pesticides**","Legally binding **Prior Informed Consent (PIC)** procedure"],
["Stockholm Convention 2001","**Persistent Organic Pollutants (POPs)** [UPPCS 2019]","Eliminate, restrict or reduce listed POPs; persistence and bioaccumulation/biomagnification are central hazards"],
["Minamata Convention 2013","**Anthropogenic emissions and releases of mercury and mercury compounds**","Controls mercury supply/trade, products/processes and important emission/release sources"],
["BRS relationship","**Basel, Rotterdam and Stockholm operate through a shared BRS Secretariat architecture**","Shared secretariat !!does not merge their legal mechanisms or subject matter!!"]]},
{h:"Land degradation and wetlands conventions",t:1,list:[
"UNCCD purpose :: **combat desertification and mitigate effects of drought through national action and international cooperation**",
"UNCCD implementation :: **effective national programmes and supportive international partnerships** are central to its approach [CSE 2016]",
"UNCCD participation :: **local participation and bottom-up implementation are part of the Convention's approach** [CSE 2016]",
"Land Degradation Neutrality (LDN) :: **a state in which the amount and quality of land resources needed to support ecosystem functions and services and enhance food security remain stable or increase within specified spatial and temporal scales and ecosystems**",
"LDN response hierarchy :: **avoid new degradation → reduce existing degradation → reverse past degradation**; avoidance and reduction are prioritised before restoration or rehabilitation",
"Ramsar Convention :: **international wetland framework built around wise use and Wetlands of International Importance**; detailed criteria, Montreux Record and Indian sites are in Sheet 12",
"==Land/wetland trap== :: **UNCCD addresses desertification/land degradation; Ramsar addresses wetlands** — neither is a substitute for the other"]},
{h:"Treaty-family map",t:2,fig:{kind:"svg",alt:"Family-tree diagram grouping major environmental agreements into climate, ozone, biodiversity, wildlife, chemicals and waste, land degradation, and wetlands families.",caption:"Treaty families prevent same-family distractors: first identify the environmental problem, then the parent agreement and its protocol or mechanism.",src:"<svg viewBox='0 0 720 390' xmlns='http://www.w3.org/2000/svg'>"+

"<rect x='25' y='145' width='205' height='68' rx='10' style='fill:var(--warn-bg);stroke:var(--warn);stroke-width:2'/><text x='127' y='170' style='font-weight:700'>Wildlife</text><text x='127' y='193'>CITES · CMS</text>"+
"<rect x='258' y='145' width='205' height='68' rx='10' style='fill:var(--plum-bg);stroke:var(--plum);stroke-width:2'/><text x='360' y='170' style='font-weight:700'>Chemicals / waste</text><text x='360' y='193'>Basel · Rotterdam · Stockholm · Minamata</text>"+
"<rect x='490' y='145' width='205' height='68' rx='10' style='fill:var(--warn-bg);stroke:var(--warn);stroke-width:2'/><text x='592' y='170' style='font-weight:700'>Land / wetlands</text><text x='592' y='193'>UNCCD · Ramsar</text>"+
"<rect x='180' y='275' width='360' height='72' rx='12' style='fill:var(--rule-2);stroke:var(--ink-2);stroke-width:2'/><text x='360' y='302' style='font-weight:700'>Question rule</text><text x='360' y='326'>problem → treaty family → mechanism → legal consequence</text></g>"+

"</svg>"}},
{h:"Legal-character traps",t:1,k:"trap",list:[
"Convention versus protocol :: a **protocol is a separate legal instrument linked to a parent convention**, so Cartagena/Nagoya belong to CBD and Kyoto belongs to UNFCCC",
"Amendment versus protocol :: **Kigali is an amendment to the Montreal Protocol**, not a new ozone convention",
"COP decision versus treaty :: a **COP/CMA decision can guide implementation without becoming a new treaty merely because it was adopted at a conference**",
"NDC versus treaty obligation :: an **NDC is a national submission under Paris architecture**, not a separate international treaty",
"Institution versus treaty :: **IUCN, WWF, UNEP, IPCC, GEF and GCF are not interchangeable with conventions**; their institutional roles are in Sheet 20"]}
]});

SEC({id:"forest-wildlife-rights",title:"Wildlife, Forest Rights & Current Law",group:"Environmental Governance",tier:1,

blocks:[

["Schedule III","**Protected plant species**","Plant protection/cultivation/trade questions must use the current schedule structure, not old Schedule VI numbering"],
["Schedule IV","**Specimens of species listed under CITES**","Domestic CITES implementation; !!CITES listing and Indian Schedule-I protection are not the same system!!"]]},
{h:"PYQ-era schedules → current four schedules",t:1,list:[

"Old Schedule VI implication :: under the **pre-amendment system**, cultivation of a listed protected plant required a licence [CSE 2020] — !!Schedule VI is not a current schedule!!",

"Danger exception :: **mere apprehension that a protected wild animal may become dangerous is not by itself sufficient ground for capture or killing** [CSE 2022]",

["Central Zoo Authority","**Statutory zoo-recognition and standards authority under the Wildlife Act**","Zoo recognition/regulation is distinct from in-situ protected-area declaration"],
["CITES implementation","The amended Act uses **Schedule IV and designated domestic authorities** for the CITES specimen framework","International trade controls and domestic wildlife-protection schedules can overlap but are not interchangeable"]]},
