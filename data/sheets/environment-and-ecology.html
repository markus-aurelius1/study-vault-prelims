<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Environment & Ecology Master Sheet</title>
<style>
:root{
  color-scheme:light;
  --paper:#F4F6F3; --sheet:#FFFFFF; --ink:#18212C; --ink-2:#4A5563; --rule:#D9DFDA; --rule-2:#E9EDE9;
  --omr:#B3245B; --omr-bg:#FBE9F0; --navy:#23407A; --navy-bg:#E8EEF9;
  --mark:#FFE27A; --mark-ink:#5A4300; --good:#2E6B4E; --good-bg:#E4F2EA; --warn:#8A5A00; --warn-bg:#FFF1D6;
  --plum:#6A3D9A; --plum-bg:#F1EAFA; --teal:#0F6B6B; --teal-bg:#E1F3F2;
  --shadow:0 1px 0 rgba(24,33,44,.06);
  --f-disp:"Barlow Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue Condensed",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --side:272px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#11161C; --sheet:#171E26; --ink:#E4E8EE; --ink-2:#A3AEBB; --rule:#2B3542; --rule-2:#222B36;
    --omr:#FF7FA8; --omr-bg:#3A1826; --navy:#9DB8FF; --navy-bg:#1C2A45;
    --mark:#6B5510; --mark-ink:#FFE6A0; --good:#7FD1A6; --good-bg:#16302A; --warn:#FFC766; --warn-bg:#3A2C10;
    --plum:#CDB3FF; --plum-bg:#2A2140; --teal:#7FD9D6; --teal-bg:#123332;
    --shadow:0 1px 0 rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#11161C; --sheet:#171E26; --ink:#E4E8EE; --ink-2:#A3AEBB; --rule:#2B3542; --rule-2:#222B36;
  --omr:#FF7FA8; --omr-bg:#3A1826; --navy:#9DB8FF; --navy-bg:#1C2A45;
  --mark:#6B5510; --mark-ink:#FFE6A0; --good:#7FD1A6; --good-bg:#16302A; --warn:#FFC766; --warn-bg:#3A2C10;
  --plum:#CDB3FF; --plum-bg:#2A2140; --teal:#7FD9D6; --teal-bg:#123332;
  --shadow:0 1px 0 rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--hdr,64px) + 8px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.5}
[hidden]{display:none!important}
button{font:inherit}
/* ---------- header ---------- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--paper);border-bottom:1px solid var(--rule);padding:10px 16px}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;max-width:1500px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;flex:1 1 260px;min-width:0}
.brand h1{font-family:var(--f-disp);font-weight:700;font-size:25px;letter-spacing:.01em;margin:0;line-height:1;text-transform:uppercase;white-space:nowrap}
.brand .sub{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:8px;align-items:center;flex:1 1 420px;justify-content:flex-end;flex-wrap:wrap}
.search{flex:1 1 220px;max-width:380px;position:relative}
.search input{width:100%;font:inherit;font-size:14px;padding:8px 30px 8px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink)}
.search input:focus{outline:2px solid var(--navy);outline-offset:1px}
.search .clr{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--ink-2);font-size:18px;cursor:pointer;padding:2px 6px}
.btn{font-size:13px;font-weight:600;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);padding:7px 11px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn[aria-pressed="true"]{background:var(--omr);border-color:var(--omr);color:#fff}
.btn:focus-visible,.nav-sec:focus-visible,.sn:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.sel{appearance:auto;padding:7px 8px;max-width:100%}
.sel.on{border-color:var(--navy);background:var(--navy-bg);color:var(--navy)}
.menu-btn{display:none}
/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:var(--side) minmax(0,1fr);max-width:1500px;margin:0 auto;align-items:start}
aside.side{position:sticky;top:var(--hdr,64px);height:calc(100vh - var(--hdr,64px));overflow-y:auto;border-right:1px solid var(--rule);padding:12px 10px 40px 14px;scrollbar-width:thin}
.grp{font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:14px 6px 4px}
.grp:first-child{margin-top:2px}
.nav-item{margin:1px 0}
.nav-sec{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:6px 6px;border-radius:6px;cursor:pointer;font-size:13.5px;line-height:1.25}
.nav-sec:hover{background:var(--rule-2)}
.nav-sec .no{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-2);min-width:18px}
.nav-sec .tt{flex:1;min-width:0}
.nav-sec[aria-current="true"]{background:var(--navy-bg);color:var(--navy);font-weight:600}
.tw-tog{border:0;background:none;color:var(--ink-2);cursor:pointer;padding:2px 4px;border-radius:4px;font-size:12px;line-height:1}
.tw-tog:hover{background:var(--rule-2)}
.nav-subs{list-style:none;margin:2px 0 6px 26px;padding:0 0 0 8px;border-left:1px solid var(--rule)}
.nav-subs button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink-2);font-size:12.5px;padding:3px 6px;border-radius:4px;cursor:pointer;line-height:1.3}
.nav-subs button:hover{background:var(--rule-2);color:var(--ink)}
.tier{font-family:var(--f-mono);font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:3px;letter-spacing:.02em;white-space:nowrap}
.t1{background:var(--omr-bg);color:var(--omr)} .t2{background:var(--navy-bg);color:var(--navy)} .t3{background:var(--rule-2);color:var(--ink-2)}
main{padding:16px 22px 60px;min-width:0}
.scrim{display:none}
/* ---------- section head ---------- */
.sec-head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;margin:2px 0 6px}
.sec-head h2{font-family:var(--f-disp);font-weight:700;font-size:31px;margin:0;text-transform:uppercase;letter-spacing:.01em;line-height:1.05;text-wrap:balance}
.sec-head .no{font-family:var(--f-mono);font-size:13px;color:var(--ink-2)}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.stat{font-size:12px;border:1px solid var(--rule);background:var(--sheet);border-radius:12px;padding:1px 9px;color:var(--ink-2)}
.stat b{color:var(--ink)}
.sec-note{color:var(--ink-2);max-width:82ch;margin:4px 0 12px;font-size:14px}
details.key{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;margin:0 0 14px;font-size:12.5px;color:var(--ink-2)}
details.key>summary{cursor:pointer;padding:6px 12px;font-weight:600;color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:4px 12px 10px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.subnav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px;align-items:center}
.sn{font-size:12.5px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:14px;padding:3px 10px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sn:hover{border-color:var(--navy);color:var(--navy)}
.sn.k-trap{border-color:var(--omr);color:var(--omr)}
.sn-tools{font-size:12.5px;color:var(--ink-2);margin-left:4px}
.lnk{border:0;background:none;color:var(--navy);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px;font-size:inherit}
/* ---------- blocks ---------- */
details.block{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;margin:0 0 14px;box-shadow:var(--shadow);scroll-margin-top:calc(var(--hdr,64px) + 10px)}
details.block>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:0 12px 0 0;border-bottom:1px solid var(--rule-2)}
details.block>summary::-webkit-details-marker{display:none}
details.block:not([open])>summary{border-bottom:0}
.block h3{font-family:var(--f-disp);font-weight:600;font-size:18px;letter-spacing:.03em;text-transform:uppercase;margin:0;padding:9px 14px 8px;flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.2}
.block h3 small{font-family:var(--f-body);text-transform:none;letter-spacing:0;font-weight:400;font-size:12.5px;color:var(--ink-2);margin-left:6px}
.bmeta{display:flex;align-items:center;gap:6px;flex:none}
.bc{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-2);background:var(--rule-2);border-radius:10px;padding:0 7px;line-height:18px;white-space:nowrap}
.kt{font-family:var(--f-mono);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;border-radius:3px;padding:0 5px;line-height:16px;background:var(--omr-bg);color:var(--omr)}
.chev{width:9px;height:9px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:rotate(45deg) translateY(-3px);transition:transform .15s;flex:none}
details.block:not([open]) .chev{transform:rotate(-45deg)}
details.block.k-trap{border-left:4px solid var(--omr)}
details.block.k-trap>summary{background:linear-gradient(90deg,var(--omr-bg),transparent 70%)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-family:var(--f-disp);font-weight:600;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);text-align:left;padding:7px 12px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:7px 12px;border-bottom:1px solid var(--rule-2);vertical-align:top;overflow-wrap:break-word}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:600;min-width:9ch}
ul.facts{list-style:none;margin:0;padding:4px 0}
ul.facts li{padding:6px 14px 6px 30px;border-bottom:1px solid var(--rule-2);position:relative;overflow-wrap:break-word}
ul.facts li:last-child{border-bottom:0}
ul.facts li::before{content:"";position:absolute;left:14px;top:14px;width:6px;height:6px;border-radius:1px;background:var(--navy);opacity:.55}
ul.facts li.t::before{background:var(--omr);opacity:1;transform:rotate(45deg)}
.cols2{columns:2 420px;column-gap:0}
.cols2 li{break-inside:avoid}
/* ---------- figures (block field fig) ---------- */
figure.nfig{margin:0;padding:14px 14px 10px;border-bottom:1px solid var(--rule-2);break-inside:avoid}
figure.nfig:last-child{border-bottom:0}
.nfig-m{max-width:820px;margin:0 auto;color:var(--ink)}
.nfig-m svg{display:block;width:100%;height:auto;fill:currentColor;font-family:var(--f-body);font-size:16px}
.nfig-m img{display:block;max-width:100%;height:auto;margin:0 auto;border-radius:4px}
figure.nfig figcaption{max-width:82ch;margin:8px auto 0;font-size:12.5px;color:var(--ink-2);text-align:center;text-wrap:pretty}
.nfig-bad{margin:0;padding:10px 12px;border:1px dashed var(--omr);border-radius:6px;color:var(--omr);font-size:13px}
.kt.kf{background:var(--teal-bg);color:var(--teal)}
b{font-weight:600}
.num{font-family:var(--f-mono);font-weight:600;color:var(--navy);font-size:.95em}
.trap{background:var(--omr-bg);color:var(--omr);font-weight:600;border-radius:3px;padding:0 4px}
.hl{background:var(--mark);color:var(--mark-ink);border-radius:2px;padding:0 3px}
.ar{color:var(--ink-2)}
/* ---------- exam chips ---------- */
.yrs{display:inline-flex;flex-wrap:wrap;gap:3px;margin-left:6px;vertical-align:1px}
.y{font-family:var(--f-mono);font-size:10.5px;font-weight:600;padding:0 4px;border-radius:3px;line-height:16px;white-space:nowrap}
.y.cse{background:var(--navy-bg);color:var(--navy)}
.y.up{background:var(--mark);color:var(--mark-ink)}
.y.upm{background:var(--plum-bg);color:var(--plum)}
.y.cds{background:var(--good-bg);color:var(--good)}
.y.capf{background:var(--warn-bg);color:var(--warn)}
.y.oth{background:var(--rule-2);color:var(--ink-2)}
.tnote{font-size:11.5px;color:var(--ink-2);font-style:italic;margin-left:3px}
/* ---------- recall ---------- */
.recall td:not(:first-child) .ans,.recall ul.facts li.qa .ans,.recall ul.facts li.cue .ans,.recall ul.facts li.cz b{filter:blur(5px);transition:filter .15s}
.recall td:not(:first-child),.recall ul.facts li:not(.open){cursor:pointer}
.recall td.shown .ans,.recall ul.facts li.shown .ans,.recall ul.facts li.shown b{filter:none}
/* ---------- search hits ---------- */
mark.qh{background:var(--mark);color:var(--mark-ink);border-radius:2px;padding:0 1px}
.y.hit{outline:2px solid var(--omr);outline-offset:1px}
.recall-hint{display:none;font-size:12.5px;color:var(--omr);margin:-4px 0 12px}
.recall .recall-hint{display:block}
/* ---------- radar ---------- */
.bar{display:inline-block;height:8px;border-radius:4px;background:var(--navy);vertical-align:middle;opacity:.75}
.bar.u{background:var(--mark-ink);opacity:.55}
.cell{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid var(--rule);vertical-align:middle}
.cell.on{background:var(--omr);border-color:var(--omr)}
td.c{text-align:center}
.srch-sec{display:block;border:0;background:none;padding:0;cursor:pointer;font-family:var(--f-disp);font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--omr);margin:18px 0 6px;font-weight:600}
.filt{font-size:13px;background:var(--navy-bg);color:var(--ink);border-radius:6px;padding:6px 10px;margin:0 0 14px;display:inline-block}
.empty{padding:28px;text-align:center;color:var(--ink-2)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.pager .btn{white-space:normal;max-width:100%;text-align:left;overflow-wrap:anywhere}
.totop{position:fixed;right:16px;bottom:16px;z-index:30;box-shadow:0 2px 8px rgba(0,0,0,.15)}
@media (max-width:980px){
  .layout{grid-template-columns:minmax(0,1fr)}
  aside.side{position:fixed;left:0;top:0;height:100vh;width:min(86vw,320px);z-index:60;background:var(--paper);transform:translateX(-102%);transition:transform .2s;box-shadow:2px 0 18px rgba(0,0,0,.2);padding-top:16px}
  body.nav-open aside.side{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50}
  .menu-btn{display:inline-block}
  main{padding:14px 16px 60px}
}
@media (max-width:640px){
  .brand h1{font-size:21px}.sec-head h2{font-size:25px}td,th{padding:6px 9px}
  .tools{flex-basis:100%}.search{max-width:none;flex:1 1 120px;min-width:0;order:-1}.sel{order:1;flex:1 1 100%}
  .cols2{columns:1}
  figure.nfig{padding:10px 8px 8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{header.top,aside.side,.subnav,.totop,details.key{display:none!important}.layout{display:block}details.block,figure.nfig{break-inside:avoid}}
</style>
</head>

<header class="top" id="top">
  <div class="top-row">
    <div class="brand"><button class="btn menu-btn" id="menu" aria-label="Open section list">☰</button><h1>Environment &amp; Ecology Master Sheet</h1><span class="sub">UPSC CSE Prelims · UPPCS Prelims</span></div>

        <option value="">All lines</option><option value="cse">UPSC CSE Prelims</option><option value="up">UPPSC exams (Prelims &amp; others)</option><option value="upm">UPPCS Mains</option><option value="cds">CDS / NDA</option><option value="capf">CAPF</option><option value="oth">Other State PCS</option><option value="any">Any PYQ-tagged line</option>

</div>
<button class="btn totop" id="totop" hidden aria-label="Back to top">↑ Top</button>
<script>
(function(){var t="";try{t=localStorage.getItem("pms2-theme")||""}catch(e){}if(t)document.documentElement.dataset.theme=t;})();
/* ===================== CONTENT ===================== */
/* Replace EVERYTHING between the CONTENT and RENDER banners with the subject's SEC({...}) calls.
   Keep the two lines below (const S / function SEC) exactly as they are. Spec: NOTES_FORMAT_GUIDE.md */
const S=[];
function SEC(o){o.blocks=o.blocks||[];S.push(o);return o;}
/* ===== 01 ECOSYSTEM STRUCTURE & CORE TERMS ===== */
SEC({id:"ecosystem-basics",title:"Ecosystem Structure & Core Terms",group:"Ecology Fundamentals",tier:1,
stats:["UPSC CSE: **22 ecology Q** (2009–25); ecosystem/niche cluster verified","UPPCS Pre: **33 ecology/SD Q** (2018–25); niche recurring","Formats: definition, two-statement, description → identification"],
note:"The vocabulary layer for later ecology sheets. Learn the distinctions and relationships; detailed competition and specialist/generalist niche logic comes later.",
blocks:[
{h:"Environment, ecology and ecosystem",t:1,cols:["Term","Recall definition","Exam distinction"],rows:[
["Environment","**Total biotic, abiotic and human-influenced surroundings/conditions** affecting organisms [UPPCS 2006]","Broader setting; may be described through physical, biological and cultural components"],
["Ecology","**Scientific study of interactions** among organisms and between organisms and their environment","A field of study, not a place or material system"],
["Ecosystem","**Functional system of interacting biotic and abiotic components** with transfers of energy and matter [CSE 2015]","A system with chosen boundaries; !!not every organism directly interacts with every other organism!!"],
["Biome","**Large regional ecological unit** characterised by broad climate, dominant vegetation and associated fauna","==Biome classification is strongly climate/latitude-linked; an ecosystem is defined by local interactions and can occur across climatic settings=="],
["Biosphere","**Global zone of life and its interactions** across land, water and atmosphere","Highest ecological level in the organisation ladder"]]},
{h:"Levels of ecological organisation",t:1,list:[
"Organisation ladder :: **individual → population → community → ecosystem → biome → biosphere**",
"**Individual** — one organism functioning as a biological unit",
"**Population** — individuals of the **same species** occupying a defined area at a given time",
"**Community** — populations of **different species** occurring and interacting in a defined area",
"**Population abundance** — the **number of individuals** present; density relates abundance to unit area or volume",
"**Population density** — individuals per **unit area or volume**, so equal abundance can yield different densities",
"**Carrying capacity** — the **maximum population level that an environment can sustain over time** under given resource and waste-assimilation limits",
"**Community structure** — shaped by species composition, relative abundance and interactions; it is more than a simple species count"]},
{h:"Ecosystem components and limiting factors",t:1,cols:["Component","Examples / role","Recall hook"],rows:[
["Abiotic","Light, temperature, water, wind, soil, pH, minerals, topography","**Physical and chemical environment**"],
["Producers","Plants, algae and other autotrophs convert external energy into organic matter","**Autotrophs** form the entry point of most grazing food chains"],
["Consumers","Heterotrophs obtain energy by feeding on other organisms or organic matter","**Heterotrophs** occupy consumer trophic roles"],
["Decomposers","Microorganisms chemically break down dead organic matter and wastes","**Mineralisation and nutrient return** link biotic matter back to abiotic pools"],
["Limiting factor","A resource or condition whose scarcity or excess constrains performance or distribution","**Growth/distribution is controlled by the factor closest to or beyond tolerance limits**, not by every factor equally"]]},
{h:"Habitat versus niche",t:1,cols:["Concept","Meaning","Discriminator"],rows:[
["Habitat","**Physical place or set of environmental conditions where an organism lives**","Think **address**"],
["Niche","**Functional role and resource-use position of an organism in its ecological system** [CSE 2013; UPPCS 2022]","Think **profession**; includes how it uses resources and interacts"],
["Relationship","Different species may share a habitat while using resources differently","==Same habitat does not mean same niche== — **habitat and niche are distinct concepts**"]]},
{h:"Habitat–niche schematic",t:2,fig:{kind:"svg",alt:"Habitat versus niche schematic: one landscape box labelled habitat as where an organism lives, beside a role box labelled niche as how it uses resources and interacts",caption:"Habitat asks where; niche asks how the organism functions within that setting.",src:"<svg viewBox='0 0 640 250' xmlns='http://www.w3.org/2000/svg'>"+
"<defs><marker id='ecosystem-basics_arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='4' markerHeight='4' orient='auto'><path d='M0 0L10 5L0 10z' style='fill:var(--teal)'/></marker></defs>"+
"<rect x='35' y='45' width='245' height='155' rx='14' style='fill:var(--good-bg);stroke:var(--good);stroke-width:2'/>"+
"<rect x='360' y='45' width='245' height='155' rx='14' style='fill:var(--navy-bg);stroke:var(--navy);stroke-width:2'/>"+
"<g text-anchor='middle'><text x='157' y='85' font-size='20' style='font-weight:700'>Habitat</text><text x='157' y='118' font-size='16'>Where it lives</text><text x='157' y='151' font-size='16'>place + conditions</text>"+
"<text x='482' y='85' font-size='20' style='font-weight:700'>Niche</text><text x='482' y='118' font-size='16'>How it functions</text><text x='482' y='151' font-size='16'>resources + interactions</text></g>"+
"<line x1='290' y1='122' x2='345' y2='122' style='stroke:var(--teal);stroke-width:3' marker-end='url(#ecosystem-basics_arrow)'/>"+
"<text x='318' y='105' text-anchor='middle' font-size='15' style='fill:var(--ink-2)'>same organism</text>"+
"</svg>"}},
{h:"Ecotone, ecocline and edge effect",t:1,list:[
"**Ecotone** — a transition zone between adjacent ecological communities or ecosystems [UPPCS 2012]; it may contain features of both and some distinct boundary conditions",
"**Ecocline** — a **gradual environmental or community transition** along a continuous gradient, rather than a sharply bounded transition zone",
"**Edge effect** — changes in species composition, abundance or interactions near habitat boundaries relative to adjoining interiors",
"Edge-effect diversity :: **can increase where species from adjoining communities and edge specialists overlap**, but !!an increase is not inevitable in every ecotone!!",
"Clean ecotone example :: **riparian zone** between terrestrial and aquatic systems; avoid treating every wetland as synonymous with an ecotone"]},
{h:"Tolerance, range and ecological roles",t:2,list:[
"**Tolerance range** — the span of an environmental factor within which an organism can survive and reproduce; stress rises near the limits",
"**Optimum range** — conditions within the tolerance range where **performance is highest**",
"**Indicator species** — presence, absence or condition can signal **environmental quality or ecological change**; the indicator value depends on context",
"**Keystone species** — has a **disproportionately large ecological effect relative to its abundance**; umbrella-species and wider conservation vocabulary are completed in Sheet 06",
"**Foundation species** — creates or strongly structures habitat, thereby **shaping community conditions**; it is not synonymous with keystone species",
"UPPCS-style environment classification :: **physical, biological and cultural/human components** are a useful descriptive framing of the total environment [UPPCS 2020]",
"Gaia hypothesis :: associated with **James Lovelock**; proposes strong feedbacks between life and Earth’s physico-chemical environment, but it is a support concept rather than the organising definition of ecology"]}
]});

/* ===== 02 ENERGY FLOW, FOOD WEBS & PYRAMIDS ===== */
SEC({id:"energy-flow-trophic",title:"Energy Flow, Food Webs & Pyramids",group:"Ecology Fundamentals",tier:1,
stats:["UPSC CSE: **5 food/trophic Q** (2010–21) within ecology","UPPCS Pre: **4 energy-flow/10% Q** (2019×2, 2023, 2025)","Formats: sequence, statements, code-list, trophic relation"],
note:"Track two opposite patterns: usable energy generally falls up trophic levels, while persistent pollutant concentration can rise. Pyramids encode different properties and therefore need not have the same shape.",
blocks:[
{h:"Food chains, webs and trophic levels",t:1,cols:["Concept","Meaning","Exam hook"],rows:[
["Food chain","**Linear feeding pathway** showing transfer of energy and matter through organisms [CSE 2013]","A simplified pathway; real communities usually contain multiple linked chains"],
["Grazing food chain","Begins with **living producers/autotrophs**, then herbivores and higher consumers","Producer-based pathway"],
["Detritus food chain","Begins with **dead organic matter (detritus)** and organisms using or decomposing it","Dead-matter pathway; common in soils and litter systems"],
["Food web","**Network of interconnected feeding pathways** in a community","Alternative pathways can increase resilience, but !!a food web does not guarantee stability under every disturbance!!"],
["Trophic level","An organism’s **functional feeding position** in a particular chain or web","A species can occupy different trophic positions with diet, life stage or context"],
["Typical grazing sequence","**Producers → primary consumers → secondary consumers → tertiary consumers**","The labels denote feeding position; real food webs branch and reconnect"]]},
{h:"Detritivores versus decomposers",t:1,cols:["Group","What it does","Key distinction"],rows:[
["Detritivores","**Ingest and physically fragment detritus**","Animals such as earthworms [CSE 2021] can comminute litter; fragmentation increases surface area"],
["Decomposers","**Externally digest and chemically break down organic matter**","Mainly bacteria and fungi [CSE 2013]; release inorganic nutrients through decomposition/mineralisation"],
["Relationship","Both act on dead organic matter but by different mechanisms","==Detritivore ingestion/fragmentation ≠ microbial extracellular decomposition== — **mechanisms differ**"]]},
{h:"Energy flow and ecological efficiency",t:1,list:[
"Direction of energy flow :: **unidirectional** — external energy is captured, transferred through trophic levels and ultimately dissipated as heat; nutrients, in contrast, can be recycled",
"Why food chains are short :: **usable energy is lost at each trophic transfer** [UPPCS 2019], limiting the number of levels that can be supported [CAPF 2024]",
"**Ecological efficiency** — fraction of production at one trophic level converted into production at the next; it varies among organisms and ecosystems",
"`≈10%` rule :: **exam-useful average teaching heuristic**, not a fixed universal percentage for every ecosystem or transfer [UPPCS 2025]",
"Energy losses between trophic levels :: **respiration/heat, maintenance, movement, unconsumed biomass and undigested/excreted material** reduce energy available to the next level",
"**Production efficiency** — fraction of assimilated energy converted to new biomass; **trophic-transfer efficiency** also depends on consumption and assimilation"]},
{h:"Ecological pyramids",t:1,cols:["Pyramid","What is plotted","Typical shape / reason"],rows:[
["Numbers","**Number of individuals** at successive trophic levels","May be upright or inverted; a single tree can support many herbivores/parasites"],
["Biomass","**Standing biomass per unit area or volume** at a given time","Often upright on land; can be **inverted in aquatic systems** because phytoplankton maintain low standing biomass through rapid turnover"],
["Energy","**Rate of energy flow or production** through trophic levels over time","**Always upright** because usable energy decreases at successive transfers"]]},
{h:"Trophic-pyramid schematic",t:2,fig:{kind:"svg",alt:"Conceptual trophic pyramid with producers at the broad base and primary, secondary and tertiary consumers above; an upward arrow shows available energy decreasing, while a separate upward arrow shows persistent pollutant concentration can increase",caption:"Opposite trophic trends: available energy decreases upward; persistent, poorly eliminated pollutants can biomagnify upward.",src:"<svg viewBox='0 0 640 390' xmlns='http://www.w3.org/2000/svg'>"+
"<defs><marker id='energy-flow-trophic_up' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='4' markerHeight='4' orient='auto'><path d='M0 0L10 5L0 10z' style='fill:var(--omr)'/></marker><marker id='energy-flow-trophic_down' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='4' markerHeight='4' orient='auto'><path d='M0 0L10 5L0 10z' style='fill:var(--navy)'/></marker></defs>"+
"<polygon points='135,330 505,330 455,260 185,260' style='fill:var(--good-bg);stroke:var(--good);stroke-width:2'/><polygon points='185,250 455,250 415,190 225,190' style='fill:var(--teal-bg);stroke:var(--teal);stroke-width:2'/>"+
"<polygon points='225,180 415,180 380,125 260,125' style='fill:var(--navy-bg);stroke:var(--navy);stroke-width:2'/><polygon points='260,115 380,115 350,70 290,70' style='fill:var(--plum-bg);stroke:var(--plum);stroke-width:2'/>"+
"<g text-anchor='middle' font-size='16'><text x='320' y='305' style='font-weight:700'>Producers</text><text x='320' y='225'>Primary consumers</text><text x='320' y='160'>Secondary consumers</text><text x='320' y='100'>Tertiary consumers</text></g>"+
"<line x1='80' y1='80' x2='80' y2='315' style='stroke:var(--navy);stroke-width:3' marker-end='url(#energy-flow-trophic_down)'/><text x='65' y='195' text-anchor='middle' font-size='16' transform='rotate(-90 65 195)' style='fill:var(--navy)'>available energy decreases upward</text>"+
"<line x1='560' y1='315' x2='560' y2='80' style='stroke:var(--omr);stroke-width:3' marker-end='url(#energy-flow-trophic_up)'/><text x='580' y='195' text-anchor='middle' font-size='16' transform='rotate(90 580 195)' style='fill:var(--omr)'>persistent pollutant concentration can increase</text>"+
"</svg>"}},
{h:"Standing crop, turnover and aquatic inversion",t:1,list:[
"**Standing crop** — amount of living biomass present in a trophic level or ecosystem at a specified time; it is a stock, not a production rate",
"Aquatic biomass inversion :: **phytoplankton can have lower standing biomass than zooplankton at a snapshot** because producers reproduce and are consumed rapidly",
"**Rapid producer turnover** — permits high production despite low standing biomass; therefore low biomass does not necessarily mean low productivity",
"==Biomass pyramid and energy pyramid answer different questions== — **standing-stock pyramids can invert; the energy pyramid cannot**"]},
{h:"Limits of ecological pyramids",t:2,list:[
"**Food-web complexity** — a simple pyramid compresses many feeding links into discrete trophic levels and cannot show the full web",
"**Omnivory** — one species may feed at more than one trophic level, so a single fixed position can mislead",
"**Decomposer pathway** — conventional pyramids often under-represent detrital and microbial channels despite their major role in nutrient cycling",
"**Season and turnover** — number and biomass pyramids are snapshots and can change with season, migration, recruitment or rapid producer replacement",
"**Units matter** — numbers, biomass and energy measure different properties; !!one pyramid’s shape cannot be inferred from another’s!!"]},
{h:"Biomagnification bridge",t:1,list:[
"**Bioaccumulation** — build-up of a substance within an organism when uptake exceeds elimination; concentration can rise with time or exposure [CAPF 2017]",
"**Biomagnification** — increase in concentration of a persistent, bioavailable contaminant at **successively higher trophic levels** [CSE 2010; CAPF 2017]",
"Why biomagnification occurs :: predators consume many contaminated prey and **persistent, poorly metabolised or excreted substances** are retained",
"Energy versus contaminant :: **available energy decreases upward**, whereas a biomagnifying pollutant’s concentration **can increase upward**",
"Trophic mechanism focus :: **persistent retention plus repeated consumption** is the reason concentration can rise across trophic levels"]}
]});


/* ===== 03 BIOGEOCHEMICAL CYCLES & PRODUCTIVITY ===== */
SEC({id:"cycles-productivity",title:"Biogeochemical Cycles & Productivity",group:"Ecology Fundamentals",tier:1,
stats:["UPSC CSE: **4 cycle Q + 2 productivity Q**; carbon-addition repeat in 2011/2014","UPPCS Pre: cycles/productivity sit inside the **33-Q ecology/SD core**; no separate fine-grain count","Formats: multi-statement, process direction, code-list, ecosystem comparison"],
note:"Learn cycles as reservoir → flux → sink/source relationships, not as isolated labels. Productivity is a rate concept: distinguish gross fixation, respiratory loss, net production and standing biomass.",
blocks:[
{h:"Cycle vocabulary and reservoir logic",t:1,cols:["Term","Recall meaning","Exam distinction"],rows:[
["Biogeochemical cycle","**Movement and recycling of chemical elements between biotic and abiotic compartments** [UPPCS 2021, 2020]","Matter cycles; unlike usable energy, it is not simply lost from the ecosystem after one trophic transfer"],
["Reservoir / pool","A compartment holding a **stock of an element or compound**","Reservoir size is a stock; flux is a rate of transfer"],
["Flux","**Rate of transfer** between reservoirs","A large reservoir need not have the largest flux"],
["Source","Process or reservoir that **adds a substance to the pool being considered**","Source/sink status is always relative to a specified pool and time scale"],
["Sink","Process or reservoir that **removes or stores a substance from the pool being considered**","A store can later become a source if the direction of net flux reverses"],
["Gaseous cycle","Major reservoir is in the **atmosphere or hydrosphere**; carbon and nitrogen are key examples","Often cycles relatively rapidly, but !!gaseous does not mean perfectly closed or loss-free!!"],
["Sedimentary cycle","Major reservoir is in **rocks, soils or sediments**; phosphorus is the clearest example","Material can remain locked in sediments for long periods, so cycling may be slower"]]},
{h:"Carbon cycle: directions that decide statements",t:1,list:[
"Photosynthesis and atmospheric CO₂ :: **photosynthesis removes CO₂ from the atmospheric pool and stores carbon in organic matter**",
"Respiration and atmospheric CO₂ :: **respiration returns CO₂ to the atmosphere** [CSE 2011, 2014]",
"Decomposition and atmospheric CO₂ :: **decay of organic matter can return CO₂ to the atmosphere** [CSE 2011, 2014]",
"Volcanism and atmospheric CO₂ :: **volcanic action can add CO₂ to the atmosphere** [CSE 2011, 2014]",
"Combustion and stored carbon :: **burning fossil fuels or biomass transfers stored carbon to the atmosphere, mainly as CO₂**",
"Longer-term carbon stores :: **oceans, soils, sediments/rocks and fossil carbon** can retain carbon for much longer than the short biological cycle",
"Ocean carbon exchange :: **CO₂ moves both from atmosphere to ocean and from ocean to atmosphere**; the ocean can therefore act as sink or source depending on net flux",
"==Carbon-cycle trap== :: !!photosynthesis adds CO₂ to the atmosphere!! is **wrong**; photosynthesis is a CO₂-removal process [CSE 2011, 2014]"]},
{h:"Nitrogen cycle: transformation sequence",t:1,cols:["Process","Direction","Recall point"],rows:[
["Biological nitrogen fixation","**N₂ → NH₃/NH₄⁺**","Nitrogenase-bearing prokaryotes convert atmospheric N₂ into biologically usable reduced nitrogen"],
["Lightning fixation","**Atmospheric N₂ → reactive nitrogen compounds**","Lightning supplies energy for nitrogen oxidation; products ultimately enter terrestrial/aquatic pools"],
["Nitrification","**NH₄⁺ → NO₂⁻ → NO₃⁻**","Aerobic microbial oxidation; canonical nitrifiers include Nitrosomonas for the first step and Nitrobacter for the second"],
["Assimilation","**NH₄⁺/NO₃⁻ → organic nitrogen in biomass**","Plants and microbes incorporate inorganic nitrogen into organic compounds"],
["Ammonification","**Organic nitrogen → NH₃/NH₄⁺**","Decomposition of wastes and dead biomass returns organic nitrogen to the inorganic pool"],
["Denitrification","**NO₃⁻/NO₂⁻ → gaseous N₂**","Microbial reduction under low-oxygen conditions returns nitrogen to the atmosphere"]]},
{h:"Nitrogen-cycle disruption and limiting nutrients",t:2,list:[
"Anthropogenic reactive nitrogen :: **fertiliser production/use and combustion add reactive nitrogen beyond natural biological cycling**, altering soil, water and atmospheric nitrogen pathways",
"Excess reactive nitrogen in waters :: **can accelerate eutrophication and harmful algal growth** when nitrogen is limiting",
"Phosphorus enrichment in fresh water :: **can strongly stimulate algal/phytoplankton growth and contribute to eutrophication**",
"==Limiting nutrient logic== :: ecosystem response depends on **which essential nutrient is in shortest effective supply**, so adding a non-limiting nutrient may produce little response"]},
{h:"Phosphorus and sulphur cycles",t:1,cols:["Cycle","Core pathway","High-value distinction"],rows:[
["Phosphorus","**Phosphate rock → weathering → soil/water phosphate → uptake → food web → decomposition/sedimentation → geological return**","==No major atmospheric gaseous phase==; the principal long-term reservoir is rock/sediment"],
["Phosphorus loss from rapid cycling","Phosphate can become **locked in aquatic sediments**","Geological uplift/weathering returns sedimentary phosphorus on long time scales"],
["Sulphur","**Rock/soil/organic stores ↔ biota**, with an atmospheric phase from volcanoes, decomposition, marine compounds and fuel combustion","Mostly sedimentary, but !!not atmosphere-free!!; atmospheric SO₂ can return through deposition/acid rain"]]},
{h:"Methane: source–sink architecture",t:2,list:[
"Natural methane source — wetlands :: **anaerobic decomposition by methanogenic archaea** produces CH₄ in waterlogged, oxygen-poor environments",
"Natural methane sources beyond wetlands :: **termites and methane hydrates/permafrost stores** are part of the methane-cycle source/storage picture",
"Agricultural methane :: **enteric fermentation in ruminants and flooded rice cultivation** can generate CH₄ under anaerobic microbial processes",
"Fossil-fuel methane :: **production, mining, processing, storage and transmission leakage** can release CH₄; the cycle note does not require a fixed sector percentage",
"Waste methane :: **landfills and anaerobic wastewater decomposition** can emit CH₄",
"Soil methane sink :: **methanotrophic microorganisms oxidise CH₄** in soils",
"Atmospheric methane sink :: reaction with the **hydroxyl radical (OH)** removes much atmospheric CH₄ through oxidation",
"Current-data rule :: **memorise source categories and sink mechanisms, not undated fixed percentage shares**"]},
{h:"Carbon, nitrogen and phosphorus — visual map",t:1,fig:{kind:"svg",alt:"Three-panel schematic. Carbon: atmospheric CO₂ → producers → detritus/soil → ocean/rock/fossil stores; photosynthesis, respiration and decomposition. Nitrogen: N₂ → NH₄⁺ → NO₂⁻/NO₃⁻ → organic N; fixation, nitrification, assimilation, ammonification and denitrification. Phosphorus: rock phosphate → soil/water PO₄³⁻ → biomass → sediments; weathering, uptake and decomposition; no major gaseous phase.",caption:"Read each panel as reservoir → process → reservoir. Every labelled process is stated separately in the recall lines above and below.",src:"<svg viewBox='0 0 720 430' xmlns='http://www.w3.org/2000/svg'>"+
"<rect x='15' y='15' width='220' height='400' rx='12' style='fill:var(--good-bg);stroke:var(--good);stroke-width:2'/>"+
"<rect x='250' y='15' width='220' height='400' rx='12' style='fill:var(--navy-bg);stroke:var(--navy);stroke-width:2'/>"+
"<rect x='485' y='15' width='220' height='400' rx='12' style='fill:var(--warn-bg);stroke:var(--warn);stroke-width:2'/>"+
"<g text-anchor='middle' font-size='18' font-weight='700'><text x='125' y='45'>Carbon</text><text x='360' y='45'>Nitrogen</text><text x='595' y='45'>Phosphorus</text></g>"+
"<g text-anchor='middle' font-size='15'><text x='125' y='82'>Atmospheric CO₂</text><text x='125' y='155'>Producers / biomass</text><text x='125' y='230'>Detritus / soil carbon</text><text x='125' y='330'>Ocean · rock · fossil stores</text>"+
"<text x='360' y='82'>Atmospheric N₂</text><text x='360' y='145'>NH₄⁺</text><text x='360' y='205'>NO₂⁻ → NO₃⁻</text><text x='360' y='270'>Organic N in biomass</text><text x='360' y='350'>Denitrification → N₂</text>"+
"<text x='595' y='82'>Phosphate rock</text><text x='595' y='155'>Soil / water PO₄³⁻</text><text x='595' y='230'>Biomass</text><text x='595' y='310'>Detritus / sediments</text><text x='595' y='382'>No major gaseous phase</text></g>"+
"<g style='stroke:var(--ink);stroke-width:2;fill:none'><line x1='125' y1='92' x2='125' y2='135'/><line x1='105' y1='145' x2='105' y2='100'/><line x1='145' y1='165' x2='145' y2='215'/><line x1='125' y1='245' x2='125' y2='310'/>"+
"<line x1='360' y1='92' x2='360' y2='125'/><line x1='360' y1='155' x2='360' y2='188'/><line x1='360' y1='215' x2='360' y2='252'/><line x1='335' y1='280' x2='335' y2='160'/><line x1='385' y1='215' x2='385' y2='330'/>"+
"<line x1='595' y1='92' x2='595' y2='138'/><line x1='595' y1='165' x2='595' y2='213'/><line x1='595' y1='240' x2='595' y2='293'/><line x1='570' y1='300' x2='570' y2='165'/></g>"+
"<g font-size='15' style='fill:var(--ink-2)'><text x='28' y='118'>photosynthesis ↓</text><text x='28' y='198'>respiration ↑</text><text x='28' y='275'>decomposition</text><text x='274' y='117'>fixation</text><text x='274' y='181'>nitrification</text><text x='274' y='242'>assimilation</text><text x='389' y='245'>ammonification</text><text x='509' y='123'>weathering</text><text x='509' y='197'>uptake</text><text x='509' y='272'>decomposition</text></g>"+
"</svg>"}},
{h:"Primary and secondary productivity",t:1,list:[
"**Primary productivity** — rate at which autotrophs fix energy into organic matter/biomass in an ecosystem",
"**Gross primary productivity (GPP)** — total rate of energy or carbon fixation by producers before subtracting their respiration",
"**Net primary productivity (NPP)** — producer biomass/energy remaining after autotrophic respiration; **NPP = GPP − R**",
"Consumer access to production :: **NPP, not GPP, represents the new producer biomass available for growth, herbivory and detrital pathways**",
"**Secondary production** — rate at which heterotrophs convert assimilated food into new consumer biomass; it is !!not simply the productivity of one named trophic rank!!",
"Primary-productivity controls :: **light, water and nutrient availability** are major limiting factors; which one dominates depends on ecosystem context",
"UPSC productivity order tested in 2013 :: **mangroves > grasslands > lakes > oceans** in decreasing productivity [CSE 2013]",
"Per-area versus global total :: **low mean productivity per unit area does not imply a small global contribution** when an ecosystem covers an enormous area",
"==Standing crop ≠ productivity== :: **standing crop is biomass present at a moment; productivity is a rate of biomass/energy generation**"]}
]});

/* ===== 04 SUCCESSION, NICHE & BIOTIC INTERACTIONS ===== */
SEC({id:"succession-interactions",title:"Succession, Niche & Biotic Interactions",group:"Ecology Fundamentals",tier:1,
stats:["UPSC CSE: **4 interaction Q + 2 niche Q + 1 succession Q**","UPPCS Pre: **2 succession Q + 2 niche Q** in 2020–24","Formats: sequence, assertion–reason, statements, matching"],
note:"Treat succession as a process and niche as a multidimensional role. Interaction signs describe effects on the partners; the mechanism and context decide the label.",
blocks:[
{h:"Succession vocabulary and sequence",t:1,list:[
"**Ecological succession** — directional change in community composition and structure through time after a new substrate appears or an existing community is altered",
"**Pioneer species/community** — the first colonisers able to establish under the initial site conditions",
"**Seral stage** — one transitional community stage occurring during succession",
"Entire succession series :: a **sere** is the sequence of communities that successively replace one another at a site [UPPCS 2020]",
"Biotic-succession sequence tested by UPPCS :: **migration → ecesis (establishment) → reaction → stabilization** [UPPCS 2024]",
"**Reaction** — established organisms modify conditions and interact with the environment, influencing which community can follow",
"**Stabilization / climax in the classical model** — relatively persistent late-stage community under the prevailing conditions; !!not a guarantee of one permanent, disturbance-proof endpoint!!"]},
{h:"Primary versus secondary succession",t:1,cols:["Feature","Primary succession","Secondary succession"],rows:[
["Starting condition","**Newly exposed substrate with little or no developed soil/biological legacy**","**Previously occupied site after disturbance**, usually retaining soil and biological legacies"],
["Typical triggers","Lava/new rock surfaces, newly exposed glacial material or other **new substrate**","Fire, storm, cultivation/abandonment or other disturbance of an **existing community**"],
["Early establishment","Requires **soil formation/conditioning and colonisation by hardy pioneers**","Can draw on **existing soil, seed banks, roots, microbes and nearby propagules**"],
["Relative pace","Usually **slower** because ecosystem structure must develop from a more barren starting point","Usually **faster** because soil and biological legacies remain"]]},
{h:"Succession pathways",t:2,fig:{kind:"svg",alt:"Parallel succession schematic. Primary succession begins with bare new substrate, then pioneer colonisation, seral replacement and a relatively persistent late community. Secondary succession begins after disturbance with soil and biological legacies remaining, then herbs or grasses, shrubs and later community recovery. A central sequence reads migration, ecesis, reaction and stabilization.",caption:"Primary starts with a much poorer biological legacy; secondary usually retains soil and propagules, so recovery is faster. The central sequence is the UPPCS-tested process order.",src:"<svg viewBox='0 0 720 430' xmlns='http://www.w3.org/2000/svg'>"+
"<text x='180' y='36' text-anchor='middle' font-size='18' font-weight='700'>Primary succession</text><text x='540' y='36' text-anchor='middle' font-size='18' font-weight='700'>Secondary succession</text>"+
"<g font-size='15' text-anchor='middle'><rect x='45' y='65' width='270' height='55' rx='9' style='fill:var(--rule-2);stroke:var(--ink-2);stroke-width:1.5'/><text x='180' y='98'>Bare / newly exposed substrate</text>"+
"<rect x='45' y='150' width='270' height='55' rx='9' style='fill:var(--good-bg);stroke:var(--good);stroke-width:1.5'/><text x='180' y='183'>Pioneer colonisation</text>"+
"<rect x='45' y='235' width='270' height='55' rx='9' style='fill:var(--teal-bg);stroke:var(--teal);stroke-width:1.5'/><text x='180' y='268'>Seral replacement</text>"+
"<rect x='45' y='320' width='270' height='55' rx='9' style='fill:var(--navy-bg);stroke:var(--navy);stroke-width:1.5'/><text x='180' y='353'>Relatively persistent late community</text>"+
"<rect x='405' y='65' width='270' height='55' rx='9' style='fill:var(--omr-bg);stroke:var(--omr);stroke-width:1.5'/><text x='540' y='98'>Disturbance of existing community</text>"+
"<rect x='405' y='150' width='270' height='55' rx='9' style='fill:var(--good-bg);stroke:var(--good);stroke-width:1.5'/><text x='540' y='174'>Soil + seed/root/microbial legacy</text><text x='540' y='194'>remain</text>"+
"<rect x='405' y='235' width='270' height='55' rx='9' style='fill:var(--teal-bg);stroke:var(--teal);stroke-width:1.5'/><text x='540' y='268'>Herbs / shrubs / seral recovery</text>"+
"<rect x='405' y='320' width='270' height='55' rx='9' style='fill:var(--navy-bg);stroke:var(--navy);stroke-width:1.5'/><text x='540' y='353'>Later community recovery</text></g>"+
"<g style='stroke:var(--ink-2);stroke-width:2'><line x1='180' y1='120' x2='180' y2='150'/><line x1='180' y1='205' x2='180' y2='235'/><line x1='180' y1='290' x2='180' y2='320'/><line x1='540' y1='120' x2='540' y2='150'/><line x1='540' y1='205' x2='540' y2='235'/><line x1='540' y1='290' x2='540' y2='320'/></g>"+
"<text x='360' y='405' text-anchor='middle' font-size='16' style='fill:var(--plum)'>Migration → Ecesis → Reaction → Stabilization</text>"+
"</svg>"}},
{h:"Autogenic and allogenic change",t:2,list:[
"**Autogenic succession** — community-driven modification of the local environment changes later establishment and replacement patterns",
"**Allogenic succession** — externally imposed forces such as major physical disturbance or environmental change drive community replacement",
"==Driver test== :: autogenic change originates mainly from **organism–environment feedbacks**; allogenic change originates mainly from **external forcing**",
"Classical succession model :: **use pioneer → seral replacement → relatively persistent late community as an exam model**, but avoid assuming every real ecosystem follows one linear path"]},
{h:"Niche: from role to realised occupancy",t:1,cols:["Concept","Recall definition","Discriminator"],rows:[
["Ecological niche","Range of **conditions tolerated, resources used and functional interactions/role** of a species [CSE 2013; UPPCS 2022]","Multidimensional ecological role, not merely physical location"],
["Fundamental niche","Full set of conditions/resources a species **could use in the absence of restricting biotic interactions**","Potential ecological space"],
["Realised niche","Part of the fundamental niche **actually occupied after competition, predation and other biotic constraints**","Usually equal to or narrower than the fundamental niche"],
["Specialist","Species with a **relatively narrow niche** or restricted resource/environmental requirements","Can be efficient in a narrow range but more sensitive to loss of its required conditions"],
["Generalist","Species with a **broader niche** and ability to use a wider range of resources/conditions","Broader tolerance/resource use does not mean unlimited tolerance"]]},
{h:"Competition and niche overlap",t:1,list:[
"**Competition (−/−)** — both participants incur costs when they rely on a shared limiting resource",
"Competitive-exclusion principle :: species with **sufficiently complete and persistent overlap in limiting-resource use cannot coexist indefinitely under unchanged conditions**; !!any niche overlap does not automatically cause extinction!!",
"Coexistence by niche differentiation :: **resource partitioning in space, time or resource type can reduce direct competition**",
"Resource abundance and coexistence :: **greater resource availability can reduce competition and permit more species to coexist**, all else equal [UPPCS 2024]",
"==Niche ≠ habitat== :: species may occupy the **same habitat but different realised niches** by using different resources or times"]},
{h:"Biotic interaction sign matrix",t:1,cols:["Interaction","Effect on A / B","Mechanism and canonical example"],rows:[
["Mutualism","**+/+**","Both benefit; coral–zooxanthellae is an intimate symbiotic mutualism"],
["Commensalism","**+/0**","One benefits while the other is not measurably affected; epiphyte growing on a tree is the canonical example"],
["Amensalism","**−/0**","One is inhibited while the other is effectively unaffected; antibiosis can produce this pattern"],
["Predation","**+/−**","Predator kills and consumes prey; predator–prey interaction"],
["Parasitism","**+/−**","Parasite obtains resources from a living host, usually without immediately killing it"],
["Competition","**−/−**","Both pay a cost while contesting a limiting resource"]]},
{h:"Interaction traps and extensions",t:2,k:"trap",list:[
"!!Same sign pair = same interaction!! :: **wrong** — predation and parasitism are both +/−, but differ in mechanism and typical host/prey outcome",
"!!Mutualism must be obligatory!! :: **wrong** — mutualism means both partners benefit; dependence can range from facultative to obligate",
"!!Commensalism benefits both species!! :: **wrong** — its sign convention is **+/0**, not +/+",
"!!Competition always eliminates one species!! :: **wrong** — exclusion requires sufficiently strong, persistent niche overlap under limiting conditions; partitioning can permit coexistence",
"!!Climax means permanent and disturbance-proof!! :: **wrong** — late communities can be altered by disturbance, climate and continuing ecological dynamics"]}
]});

/* ===== 05 SUSTAINABLE DEVELOPMENT & CARRYING CAPACITY ===== */
SEC({id:"sustainable-development",title:"Sustainable Development & Carrying Capacity",group:"Ecology Fundamentals",tier:1,
stats:["UPSC CSE: **2 sustainable-development Q + 1 circular-economy Q**","UPPCS Pre: **7 SD/Brundtland Q** (2018–25); repeated canonical-definition and chronology testing","Formats: direct, Assertion–Reason, two-statement, chronology"],
note:"Anchor the topic in the Brundtland definition and environmental limits. Current programmes are overlays; they do not redefine sustainable development.",
blocks:[
{h:"Brundtland core and equity",t:1,list:[
"Brundtland definition :: **development that meets present needs without compromising the ability of future generations to meet their own needs** [UPPCS 2025, 2019]",
"Brundtland report :: **Our Common Future (1987)**, produced by the World Commission on Environment and Development [UPPCS 2020]",
"Intergenerational equity :: **fairness between present and future generations** in access to resources and environmental quality",
"Intragenerational equity :: **fairness within the present generation**, including distribution of environmental benefits, burdens and opportunities",
"Three-pillar framing :: **environmental, social and economic sustainability** are complementary dimensions; !!sustainable development is not merely economic growth plus pollution control!!",
"CSE-tested sustainability link :: **sustainable development is inherently linked with carrying capacity** [CSE 2010]"]},
{h:"Carrying capacity and sustainable-use rules",t:1,list:[
"Carrying capacity :: **population or level of activity that an environment can sustain over time** under given resource, ecological and waste-assimilation conditions",
"Carrying capacity is :: **context-dependent and changeable**, because technology, consumption, resource condition and ecosystem resilience can alter the sustainable load",
"Renewable-resource rule :: **rate of extraction or use should not exceed the rate of regeneration** [UPPCS 2025]",
"Waste rule :: **waste or pollutant generation should remain within the environment's assimilative capacity** [UPPCS 2025]",
"Non-renewable-resource rule :: depletion should be accompanied by **development of renewable substitutes or alternatives** rather than treated as indefinitely renewable supply",
"Ecological footprint :: **biologically productive area needed to supply consumed resources and assimilate associated wastes under prevailing conditions** [UPPCS 2012]; it is a demand indicator, not carrying capacity itself"]},
{h:"Carrying-capacity balance",t:2,fig:{kind:"svg",alt:"Carrying-capacity balance diagram showing renewable-resource use at or below regeneration on one side and waste generation at or below environmental assimilation on the other, with sustainable activity in the centre",caption:"Sustainable use requires both sides of the balance: do not overdraw renewable stocks and do not overload waste-assimilation capacity.",src:"<svg viewBox='0 0 720 300' xmlns='http://www.w3.org/2000/svg'>"+
"<rect x='34' y='78' width='210' height='142' rx='14' style='fill:var(--good-bg);stroke:var(--good);stroke-width:2'/>"+
"<rect x='476' y='78' width='210' height='142' rx='14' style='fill:var(--warn-bg);stroke:var(--warn);stroke-width:2'/>"+
"<rect x='275' y='102' width='170' height='94' rx='14' style='fill:var(--navy-bg);stroke:var(--navy);stroke-width:2'/>"+
"<g text-anchor='middle' font-size='16'><text x='139' y='112' style='font-weight:700'>Resources</text><text x='139' y='148'>use ≤ regeneration</text><text x='139' y='181'>renewable stock maintained</text>"+
"<text x='360' y='135' style='font-weight:700'>Sustainable activity</text><text x='360' y='166'>within carrying capacity</text>"+
"<text x='581' y='112' style='font-weight:700'>Waste</text><text x='581' y='148'>generation ≤ assimilation</text><text x='581' y='181'>no chronic overload</text></g>"+
"<line x1='244' y1='149' x2='275' y2='149' style='stroke:var(--ink-2);stroke-width:3'/>"+
"<line x1='445' y1='149' x2='476' y2='149' style='stroke:var(--ink-2);stroke-width:3'/>"+
"<text x='360' y='255' text-anchor='middle' font-size='15' style='fill:var(--ink-2)'>Both constraints must hold together</text>"+
"</svg>"}},
{h:"Milestones and chronology traps",t:1,cols:["Milestone","Recall point","Exam hook"],rows:[
["Limits to Growth","**1972** — Club of Rome report placed finite-resource and growth limits at the centre of environmental debate [UPPCS 2020]","Part of the tested chronology"],
["Our Common Future","**1987** — Brundtland Commission report set out the canonical sustainable-development definition [UPPCS 2020]","Report/year repeatedly tested"],
["Montreal Protocol in force","**1989** — enters the tested chronology between Brundtland and Rio [UPPCS 2020]","Chronology relation"],
["Rio Earth Summit","**1992** — UN Conference on Environment and Development at Rio de Janeiro [UPPCS 2020]","Rio follows Brundtland in the tested sequence"],
["Agenda 21","**Adopted at the 1992 Rio Earth Summit** as a comprehensive action plan for sustainable development [UPPCS 2025]","!!Agenda 21 was not first adopted in 1995!!"]]},
{h:"Linear economy, circular economy and greenwashing",t:1,cols:["Concept","Recall proposition","Exam distinction"],rows:[
["Linear economy","**Take → make → use → dispose** dominates material flow","Value and materials are commonly lost after use"],
["Circular economy","**Design out avoidable waste, keep products and materials in use, and regenerate natural systems**","Circularity seeks to reduce virgin-resource demand and waste generation rather than merely improve disposal"],
["Life extension","**Repair, reuse, refurbishment and remanufacturing** retain product/material value before recycling","==Recycling is one circular strategy, not the whole circular economy=="],
["Greenwashing","**False or misleading environmental impression or claim** about a product, service, activity or organisation [CSE 2022]","!!Environmental branding alone does not demonstrate environmental performance!!"],
["Current-policy caution","**Programme metrics, tradability rules and regulator-specific green-finance details are time-sensitive overlays**","Do not use transient policy detail to redefine the stable concepts above"]]},
{h:"Environment-facing applications",t:2,list:[
"Sustainable agriculture :: **maintains the productive resource base while limiting long-term degradation of soil, water, biodiversity and supporting ecosystem functions**",
"Resource efficiency :: **more useful output or service per unit of material, water or energy input** can reduce pressure on extraction and waste sinks",
"Climate-resilient development :: **development choices that integrate adaptation and resilience with mitigation and wider development objectives**; the exact policy instruments can change",
"Sustainability test :: ask whether an activity **preserves ecological capacity over time**, not merely whether it produces a short-term environmental benefit"]}
]});

/* ===== 06 BIODIVERSITY PATTERNS & CONSERVATION ===== */
SEC({id:"biodiversity-conservation",title:"Biodiversity Patterns & Conservation",group:"Biodiversity & Species",tier:1,
stats:["UPSC CSE: **10 biodiversity Q** (2009–25); hotspots, patterns, loss and conservation recur despite a recent lull","UPPCS Pre: **8 biodiversity Q** across 4/8 papers","Formats: definitions, hotspot criteria, identification, statements"],
note:"Build biodiversity from level → pattern → threat → conservation response. Keep species-specific legal/IUCN status for the species sheet and protected-area geography for the conservation-map sheets.",
blocks:[
{h:"Levels and measurement of biodiversity",t:1,cols:["Concept","Recall definition","Discriminator"],rows:[
["Genetic diversity","**Variation in genes or genetic characteristics within a species or population**","Provides raw material for adaptation; loss of alleles is genetic erosion"],
["Species diversity","**Diversity of species in a community, reflecting both richness and relative abundance/evenness**","More species does not by itself describe how evenly individuals are distributed"],
["Ecosystem diversity","**Variation among ecosystems, habitats and ecological communities across a landscape or region**","Higher level than within-species genetic variation"],
["Species richness","**Number of species present** in the area being considered","Counts kinds, not relative abundance"],
["Species evenness","**How evenly individuals are distributed among the species present**","Two sites can have equal richness but different evenness"],
["Alpha diversity","**Diversity within a particular local site or ecosystem**","Local scale"],
["Beta diversity","**Change or turnover in species composition between sites or ecosystems**","Between-site contrast"],
["Gamma diversity","**Overall diversity across a larger region containing multiple communities or ecosystems**","Regional scale; !!do not reduce it to a universal alpha-plus-beta arithmetic rule!!"]]},
{h:"Spatial patterns, endemism and area",t:1,list:[
"Latitudinal diversity gradient :: **species richness generally tends to be greater at lower latitudes and decline toward the poles**, though individual taxa and habitats can depart from the pattern [CSE 2011; UPPCS 2019]",
"Species–area relationship :: **species richness generally increases as the area sampled or available increases** because larger areas can contain more habitats and populations",
"Classic species–area form :: **S = cA^z**, where S is species richness and A is area; the exponent describes how rapidly richness rises with area",
"Endemism :: **restriction of a species to a defined geographic area**; the relevant area may be an island, mountain range, region or country",
"==Native ≠ endemic== :: a **native species occurs naturally in an area**, while an endemic species is naturally restricted to that defined area",
"High endemism and small range :: **increase irreplaceability and can increase extinction vulnerability** when habitat is lost"]},
{h:"Biodiversity hotspots",t:1,list:[
"Hotspot purpose :: **prioritise exceptionally irreplaceable and highly threatened terrestrial regions** for conservation attention",
"Hotspot criterion 1 :: at least **`1,500` endemic vascular-plant species**",
"Hotspot criterion 2 :: loss of at least **`70%` of its original natural vegetation**",
"Hotspot recognition logic :: **endemism/irreplaceability plus threat** are decisive; vegetation density or ethnobotanical importance are not qualifying criteria [CSE 2011]",
"!!Biodiversity hotspots occur only in tropical regions!! :: **wrong** — hotspot status is not restricted to the tropics [CSE 2010]",
"Global hotspot framework :: **`36` recognised biodiversity hotspots**",
"India overlap :: **four hotspots are represented in India — Himalaya; Indo-Burma; Western Ghats and Sri Lanka; Sundaland (Nicobar Islands)**",
"India hotspot geography :: **political boundaries and hotspot boundaries are not identical**; the Indian territory represents only parts of transboundary hotspots"]},
{h:"Hotspot criteria funnel",t:2,fig:{kind:"svg",alt:"Biodiversity-hotspot criteria funnel showing at least 1,500 endemic vascular plant species plus at least 70 percent loss of original natural vegetation leading to hotspot qualification; a lower box lists India's four represented hotspots: Himalaya, Indo-Burma, Western Ghats and Sri Lanka, and Sundaland",caption:"A hotspot requires both irreplaceability and threat. High species richness alone is insufficient.",src:"<svg viewBox='0 0 720 350' xmlns='http://www.w3.org/2000/svg'>"+
"<rect x='45' y='35' width='275' height='82' rx='12' style='fill:var(--good-bg);stroke:var(--good);stroke-width:2'/>"+
"<rect x='400' y='35' width='275' height='82' rx='12' style='fill:var(--omr-bg);stroke:var(--omr);stroke-width:2'/>"+
"<path d='M180 130 L300 205 L420 205 L540 130' style='fill:none;stroke:var(--ink-2);stroke-width:3'/>"+
"<rect x='275' y='185' width='170' height='70' rx='12' style='fill:var(--navy-bg);stroke:var(--navy);stroke-width:2'/>"+
"<rect x='95' y='280' width='530' height='48' rx='10' style='fill:var(--rule-2);stroke:var(--ink-2);stroke-width:1.5'/>"+
"<g text-anchor='middle' font-size='15'><text x='182' y='67' style='font-weight:700'>Irreplaceability</text><text x='182' y='94'>≥ 1,500 endemic vascular plants</text>"+
"<text x='537' y='67' style='font-weight:700'>Threat</text><text x='537' y='94'>≥ 70% original vegetation lost</text>"+
"<text x='360' y='215' style='font-weight:700'>Biodiversity hotspot</text><text x='360' y='237'>both criteria required</text>"+
"<text x='360' y='310'>India: Himalaya · Indo-Burma · Western Ghats &amp; Sri Lanka · Sundaland</text></g>"+
"</svg>"}},
{h:"Drivers of biodiversity loss",t:1,cols:["Driver","Mechanism","Recall consequence"],rows:[
["Habitat loss","**Removal or conversion of habitat** reduces available living space and resources [UPPCS 2023, 2017, 2016, 2015]","Population decline and local extinction risk rise"],
["Fragmentation","**Breaks continuous habitat into smaller isolated patches** [CSE 2012]","Edge effects rise; movement and gene flow can fall"],
["Overexploitation","**Harvest exceeds sustainable replacement or recruitment**","Population size and age/size structure can collapse"],
["Invasive alien species","**Introduced organisms establish and spread, causing adverse ecological effects** [CSE 2012]","Competition, predation, disease transmission or habitat alteration can displace native biota"],
["Pollution","**Toxic substances, nutrient loading and other contaminants alter survival, reproduction or habitat quality**","Effects can occur directly or through food webs"],
["Climate change","**Shifts temperature, rainfall, disturbance regimes and suitable ranges** [CSE 2012]","Species may move, lose synchrony or face range contraction where movement/adaptation is limited"]]},
{h:"Native, alien and invasive — elimination logic",t:1,k:"trap",list:[
"!!All alien species are invasive!! :: **wrong** — an alien/exotic species is outside its natural range due to introduction; only a subset establish, spread and cause adverse impacts",
"!!All invasive species must be deliberately introduced!! :: **wrong** — introductions can be **intentional or accidental**",
"!!Native means endemic!! :: **wrong** — a native species can naturally occur across many countries; an endemic species has a **restricted natural range**",
"Invasion pathway :: **introduction → establishment → spread → adverse impact** is the useful conceptual sequence; failure at an early stage prevents later invasion",
"Genetic erosion :: **loss of genetic variants, landraces or alleles** reduces adaptive options and can increase vulnerability in small or isolated populations"]},
{h:"In situ versus ex situ conservation",t:1,cols:["Approach","Core idea","Typical examples / limitation"],rows:[
["In situ","**Conserve species within their natural habitats and ecological interactions** [UPPCS 2018]","Protected areas and sacred groves; preserves evolutionary and community processes"],
["Ex situ","**Conserve biological material outside its natural habitat under managed conditions** [UPPCS 2018]","Zoos, botanical gardens, captive breeding, seed/gene banks, tissue culture and cryopreservation"],
["Genetic representation","In situ can maintain **larger interacting gene pools and natural selection**","Ex situ programmes must manage small-population inbreeding and genetic drift"],
["Emergency role","Ex situ can provide **insurance, propagation and recovery material** for highly threatened taxa","!!Ex situ does not replace habitat conservation!!"],
["Combined strategy","**In situ and ex situ methods can complement each other**","Recovery can link captive propagation, genetic banking, habitat protection and reintroduction"]]},
{h:"Conservation frameworks and ecosystem services",t:2,k:"support",list:[
"CBD objectives :: **conservation of biological diversity; sustainable use of its components; fair and equitable sharing of benefits from genetic resources**",
"Current Indian biodiversity framework :: **Biological Diversity Act, 2002 as amended by the Biological Diversity (Amendment) Act, 2023, together with the Biological Diversity Rules, 2024**",
"CBD protocol orientation :: **Cartagena Protocol concerns biosafety; Nagoya Protocol concerns access and benefit-sharing**; detailed treaty architecture is treated later",
"IUCN threatened categories :: **Critically Endangered (CR), Endangered (EN) and Vulnerable (VU)** are the threatened-category triad; species-specific status belongs in the species sheet",
"Umbrella species :: **a species whose conservation protects a sufficiently large habitat or area that many co-occurring species also benefit**; unlike a keystone species, the concept is about conservation coverage rather than disproportionate ecological effect",
"Provisioning services :: biodiversity supports **food, fibre, fuel, genetic resources and other material outputs**",
"Regulating services :: ecosystems contribute to **pollination, climate regulation, water regulation, erosion control and disease/pest regulation**",
"Supporting services :: **nutrient cycling, soil formation and primary production** underpin other ecosystem-service categories",
"Cultural services :: ecosystems provide **recreational, aesthetic, spiritual and knowledge values**",
"==Framework trap== :: **IUCN category, Wildlife Act schedule, CITES/CMS listing, CBD target and domestic Biodiversity Act provision are different systems** and must not be treated as interchangeable status labels"]}
]});


/* ===== 07 INDIAN SPECIES: HABITAT, RANGE & STATUS ===== */
SEC({id:"species-habitat-status",title:"Indian Species: Habitat, Range & Status",group:"Biodiversity & Species",tier:1,
stats:["UPSC CSE: **47 species Q** (2009–25); habitat 9, distribution 6, threats 2, IUCN status 2","UPPCS Pre: **8 species/wildlife-conservation Q** in the broad topic","High-yield relationships: species → habitat/range → threat → current status / conservation hook"],
note:"Use habitat and range as the organising spine. Status is one profile field and must keep IUCN, Indian legal protection and treaty listings conceptually separate.",
blocks:[
{h:"Profile-reading rules",t:1,list:[
"Native-range rule :: **historical/native biogeographic range is not rewritten by a later translocation or reintroduction**",
"Current Indian-law rule :: the post-2022 Wildlife (Protection) Act uses **four schedules**, operative from `1 April 2023`; older six-schedule PYQs are historical-law questions",
"Status-systems rule :: **IUCN category, Wildlife Act schedule, CITES Appendix and CMS Appendix are independent classifications**; one cannot be inferred from another",
"Native :: **occurs naturally in the defined area without human introduction**",
"Endemic :: **is native and naturally restricted to a defined geographic area**",
"Resident :: **regularly remains in an area year-round rather than undertaking seasonal migration**",
"Migratory :: **moves seasonally or predictably between regions as part of its normal life cycle**",
"Introduced :: **occurs outside its native range because of direct or indirect human action**",
"Reintroduced :: **is restored within part of its historical native range after local extinction or disappearance**",
"Pre-2023 Wildlife Act questions :: **old six-schedule numbering may be correct for its historical legal context**, but it must not be restated as current law",
"Schedule IV meaning :: under the amended Act, **Schedule IV concerns specimens of species listed in the CITES Appendices**; it is not the old general-protection Schedule IV"]},
{h:"Priority species relational profiles",t:1,cols:["Species","Identity / habitat-range","Trait / behaviour","Threat","Current status / conservation hook"],rows:[
["Tiger","**Large felid of forest, grassland and mangrove landscapes** where prey, cover and connectivity persist","**Apex terrestrial predator**","**Habitat fragmentation, prey depletion and illegal killing/trade**","IUCN **Endangered (EN)**"],
["Snow leopard","**High-elevation Himalayan and Trans-Himalayan mountain felid** of rocky alpine terrain","**Cold-adapted mountain predator**","**Prey depletion, retaliatory killing and illegal hunting**","Conservation hook: **high-altitude habitat connectivity and conflict mitigation**"],
["Cheetah","**Large cursorial felid historically native to India and reintroduced from African populations from 2022**","**Pursuit predator adapted for high-speed running**","**Small-population and habitat-management risks require continuing conservation management**","Conservation hook: **reintroduction monitoring and habitat management**"],
["Asian elephant","**Megaherbivore of forest–grassland mosaics linked by movement corridors**","**Wide-ranging social mammal**","**Habitat fragmentation and corridor obstruction intensify conflict and isolation**","IUCN **Endangered (EN)**"],
["Greater one-horned rhinoceros","**Megaherbivore of alluvial floodplain grasslands and riverine forests**","**Large grazing/browser herbivore of floodplain mosaics**","**Poaching for horn and floodplain-habitat pressure**","IUCN **Vulnerable (VU)**"],
["Gangetic river dolphin","**Freshwater cetacean of the Ganga–Brahmaputra–Barak river systems in India**","**River-adapted toothed whale using echolocation**","**Dams/barrages, fishing-net entanglement and river degradation**","Conservation hook: **large-river connectivity, flow and bycatch reduction**"],
["Gharial","**Riverine crocodilian of large freshwater rivers with sandy banks**; the Chambal is a major Indian stronghold [CSE 2017]","**Long-snouted fish-eating crocodilian**","**River modification, extraction, fishing pressure and nesting-bank disturbance**","Conservation hook: **large-river and sandy-bank protection**"],
["Great Indian Bustard","**Large bird of open grassland, scrub and semi-arid landscapes**","**Ground-dwelling open-country bird**","**Habitat loss/fragmentation and overhead-power-line collisions**","Conservation hook: **grassland protection and power-line collision mitigation**"],
["Olive Ridley sea turtle","**Marine reptile using sandy coasts for nesting**; Odisha supports major mass-nesting beaches","**Arribada mass nesting** occurs on particular beaches","**Fishing-gear bycatch and nesting-beach disturbance**","Conservation hook: **nesting-beach and bycatch protection**"],
["Western hoolock gibbon","**Arboreal ape of north-eastern Indian forests**","**Canopy-dependent brachiating primate**","**Forest fragmentation interrupts canopy connectivity and movement**","Conservation hook: **connected forest canopy**"]]},
{h:"Other PYQ habitat anchors",t:1,cols:["Species","Tested habitat / range relationship"],rows:[
["Lion-tailed macaque","**Evergreen forests of the Western Ghats**, especially Karnataka, Kerala and Tamil Nadu [CSE 2013]"],

{h:"Reintroduction, migration and range traps",t:1,k:"trap",list:[
"Cheetah in India :: **declared extinct in India in 1952 and reintroduced from African populations beginning in 2022**; current presence does not erase its historical native range",
"!!Reintroduced means exotic by definition!! :: **wrong** — reintroduction can restore a species to part of its historical native range",

stats:["UPSC CSE: **14 feature Q + 6 classification Q + 4 behaviour Q**; strong 2022–24 concentration","Recent UPSC pattern: precise multi-statement and **how-many** discrimination","UPPCS Pre: **8 species/wildlife-conservation Q** broad topic; fine-grain trait count not separately reported"],

blocks:[

["Giant panda","**A bear in family Ursidae** [CSE 2009]; its bamboo-heavy diet does not change its carnivoran taxonomy"],
["Golden mahseer","**A freshwater fish**, not a bird [CSE 2022]"],
["Crab","**A crustacean arthropod**, not an arachnid [CSE 2014]"],
["Mite, scorpion and spider","**Arachnids** within Arthropoda; they are not insects"],
["Cicada, froghopper and pond skater","**Insects** [CSE 2024]; each has the insect body plan despite very different forms and habitats"],

{h:"Behaviour and life-history bank",t:1,list:[

{h:"Communication, tool use and coevolution",t:1,list:[

{h:"Feeding, defence and reproduction",t:1,list:[
"Hedgehog defence :: **curling into a ball protects vulnerable body parts behind spines** [CSE 2021]",
"Pangolin defence :: **rolling into a tight ball protects softer surfaces with overlapping scales** [CSE 2021]",
"Hibernation :: **occurs among some bats, bears and rodents** [CSE 2014]; !!not every species in those groups hibernates!!",
