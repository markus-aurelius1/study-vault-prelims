<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Geography Master Sheet</title>
<style>
:root{
  color-scheme:light;
  --paper:#F4F6F3; --sheet:#FFFFFF; --ink:#18212C; --ink-2:#4A5563; --rule:#D9DFDA; --rule-2:#E9EDE9;
  --omr:#B3245B; --omr-bg:#FBE9F0; --navy:#23407A; --navy-bg:#E8EEF9;
  --mark:#FFE27A; --mark-ink:#5A4300; --good:#2E6B4E; --good-bg:#E4F2EA; --warn:#8A5A00; --warn-bg:#FFF1D6;
  --plum:#6A3D9A; --plum-bg:#F1EAFA; --teal:#0F6B6B; --teal-bg:#E1F3F2;
  --shadow:0 1px 0 rgba(24,33,44,.06);
  --f-disp:"Barlow Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue Condensed",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --side:272px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#11161C; --sheet:#171E26; --ink:#E4E8EE; --ink-2:#A3AEBB; --rule:#2B3542; --rule-2:#222B36;
    --omr:#FF7FA8; --omr-bg:#3A1826; --navy:#9DB8FF; --navy-bg:#1C2A45;
    --mark:#6B5510; --mark-ink:#FFE6A0; --good:#7FD1A6; --good-bg:#16302A; --warn:#FFC766; --warn-bg:#3A2C10;
    --plum:#CDB3FF; --plum-bg:#2A2140; --teal:#7FD9D6; --teal-bg:#123332;
    --shadow:0 1px 0 rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#11161C; --sheet:#171E26; --ink:#E4E8EE; --ink-2:#A3AEBB; --rule:#2B3542; --rule-2:#222B36;
  --omr:#FF7FA8; --omr-bg:#3A1826; --navy:#9DB8FF; --navy-bg:#1C2A45;
  --mark:#6B5510; --mark-ink:#FFE6A0; --good:#7FD1A6; --good-bg:#16302A; --warn:#FFC766; --warn-bg:#3A2C10;
  --plum:#CDB3FF; --plum-bg:#2A2140; --teal:#7FD9D6; --teal-bg:#123332;
  --shadow:0 1px 0 rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--hdr,64px) + 8px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.5}
[hidden]{display:none!important}
button{font:inherit}
/* ---------- header ---------- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--paper);border-bottom:1px solid var(--rule);padding:10px 16px}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;max-width:1500px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;flex:1 1 260px;min-width:0}
.brand h1{font-family:var(--f-disp);font-weight:700;font-size:25px;letter-spacing:.01em;margin:0;line-height:1;text-transform:uppercase;white-space:nowrap}
.brand .sub{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:8px;align-items:center;flex:1 1 420px;justify-content:flex-end;flex-wrap:wrap}
.search{flex:1 1 220px;max-width:380px;position:relative}
.search input{width:100%;font:inherit;font-size:14px;padding:8px 30px 8px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink)}
.search input:focus{outline:2px solid var(--navy);outline-offset:1px}
.search .clr{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--ink-2);font-size:18px;cursor:pointer;padding:2px 6px}
.btn{font-size:13px;font-weight:600;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);padding:7px 11px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn[aria-pressed="true"]{background:var(--omr);border-color:var(--omr);color:#fff}
.btn:focus-visible,.nav-sec:focus-visible,.sn:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.sel{appearance:auto;padding:7px 8px;max-width:100%}
.sel.on{border-color:var(--navy);background:var(--navy-bg);color:var(--navy)}
.menu-btn{display:none}
/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:var(--side) minmax(0,1fr);max-width:1500px;margin:0 auto;align-items:start}
aside.side{position:sticky;top:var(--hdr,64px);height:calc(100vh - var(--hdr,64px));overflow-y:auto;border-right:1px solid var(--rule);padding:12px 10px 40px 14px;scrollbar-width:thin}
.grp{font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:14px 6px 4px}
.grp:first-child{margin-top:2px}
.nav-item{margin:1px 0}
.nav-sec{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:6px 6px;border-radius:6px;cursor:pointer;font-size:13.5px;line-height:1.25}
.nav-sec:hover{background:var(--rule-2)}
.nav-sec .no{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-2);min-width:18px}
.nav-sec .tt{flex:1;min-width:0}
.nav-sec[aria-current="true"]{background:var(--navy-bg);color:var(--navy);font-weight:600}
.tw-tog{border:0;background:none;color:var(--ink-2);cursor:pointer;padding:2px 4px;border-radius:4px;font-size:12px;line-height:1}
.tw-tog:hover{background:var(--rule-2)}
.nav-subs{list-style:none;margin:2px 0 6px 26px;padding:0 0 0 8px;border-left:1px solid var(--rule)}
.nav-subs button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink-2);font-size:12.5px;padding:3px 6px;border-radius:4px;cursor:pointer;line-height:1.3}
.nav-subs button:hover{background:var(--rule-2);color:var(--ink)}
.tier{font-family:var(--f-mono);font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:3px;letter-spacing:.02em;white-space:nowrap}
.t1{background:var(--omr-bg);color:var(--omr)} .t2{background:var(--navy-bg);color:var(--navy)} .t3{background:var(--rule-2);color:var(--ink-2)}
main{padding:16px 22px 60px;min-width:0}
.scrim{display:none}
/* ---------- section head ---------- */
.sec-head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;margin:2px 0 6px}
.sec-head h2{font-family:var(--f-disp);font-weight:700;font-size:31px;margin:0;text-transform:uppercase;letter-spacing:.01em;line-height:1.05;text-wrap:balance}
.sec-head .no{font-family:var(--f-mono);font-size:13px;color:var(--ink-2)}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.stat{font-size:12px;border:1px solid var(--rule);background:var(--sheet);border-radius:12px;padding:1px 9px;color:var(--ink-2)}
.stat b{color:var(--ink)}
.sec-note{color:var(--ink-2);max-width:82ch;margin:4px 0 12px;font-size:14px}
details.key{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;margin:0 0 14px;font-size:12.5px;color:var(--ink-2)}
details.key>summary{cursor:pointer;padding:6px 12px;font-weight:600;color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:4px 12px 10px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.subnav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px;align-items:center}
.sn{font-size:12.5px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:14px;padding:3px 10px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sn:hover{border-color:var(--navy);color:var(--navy)}
.sn.k-trap{border-color:var(--omr);color:var(--omr)}
.sn-tools{font-size:12.5px;color:var(--ink-2);margin-left:4px}
.lnk{border:0;background:none;color:var(--navy);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px;font-size:inherit}
/* ---------- blocks ---------- */
details.block{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;margin:0 0 14px;box-shadow:var(--shadow);scroll-margin-top:calc(var(--hdr,64px) + 10px)}
details.block>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:0 12px 0 0;border-bottom:1px solid var(--rule-2)}
details.block>summary::-webkit-details-marker{display:none}
details.block:not([open])>summary{border-bottom:0}
.block h3{font-family:var(--f-disp);font-weight:600;font-size:18px;letter-spacing:.03em;text-transform:uppercase;margin:0;padding:9px 14px 8px;flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.2}
.block h3 small{font-family:var(--f-body);text-transform:none;letter-spacing:0;font-weight:400;font-size:12.5px;color:var(--ink-2);margin-left:6px}
.bmeta{display:flex;align-items:center;gap:6px;flex:none}
.bc{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-2);background:var(--rule-2);border-radius:10px;padding:0 7px;line-height:18px;white-space:nowrap}
.kt{font-family:var(--f-mono);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;border-radius:3px;padding:0 5px;line-height:16px;background:var(--omr-bg);color:var(--omr)}
.chev{width:9px;height:9px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:rotate(45deg) translateY(-3px);transition:transform .15s;flex:none}
details.block:not([open]) .chev{transform:rotate(-45deg)}
details.block.k-trap{border-left:4px solid var(--omr)}
details.block.k-trap>summary{background:linear-gradient(90deg,var(--omr-bg),transparent 70%)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-family:var(--f-disp);font-weight:600;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);text-align:left;padding:7px 12px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:7px 12px;border-bottom:1px solid var(--rule-2);vertical-align:top;overflow-wrap:break-word}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:600;min-width:9ch}
ul.facts{list-style:none;margin:0;padding:4px 0}
ul.facts li{padding:6px 14px 6px 30px;border-bottom:1px solid var(--rule-2);position:relative;overflow-wrap:break-word}
ul.facts li:last-child{border-bottom:0}
ul.facts li::before{content:"";position:absolute;left:14px;top:14px;width:6px;height:6px;border-radius:1px;background:var(--navy);opacity:.55}
ul.facts li.t::before{background:var(--omr);opacity:1;transform:rotate(45deg)}
.cols2{columns:2 420px;column-gap:0}
.cols2 li{break-inside:avoid}
/* ---------- figures (block field fig) ---------- */
figure.nfig{margin:0;padding:14px 14px 10px;border-bottom:1px solid var(--rule-2);break-inside:avoid}
figure.nfig:last-child{border-bottom:0}
.nfig-m{max-width:820px;margin:0 auto;color:var(--ink)}
.nfig-m svg{display:block;width:100%;height:auto;fill:currentColor;font-family:var(--f-body);font-size:16px}
.nfig-m img{display:block;max-width:100%;height:auto;margin:0 auto;border-radius:4px}
figure.nfig figcaption{max-width:82ch;margin:8px auto 0;font-size:12.5px;color:var(--ink-2);text-align:center;text-wrap:pretty}
.nfig-bad{margin:0;padding:10px 12px;border:1px dashed var(--omr);border-radius:6px;color:var(--omr);font-size:13px}
.kt.kf{background:var(--teal-bg);color:var(--teal)}
b{font-weight:600}
.num{font-family:var(--f-mono);font-weight:600;color:var(--navy);font-size:.95em}
.trap{background:var(--omr-bg);color:var(--omr);font-weight:600;border-radius:3px;padding:0 4px}
.hl{background:var(--mark);color:var(--mark-ink);border-radius:2px;padding:0 3px}
.ar{color:var(--ink-2)}
/* ---------- exam chips ---------- */
.yrs{display:inline-flex;flex-wrap:wrap;gap:3px;margin-left:6px;vertical-align:1px}
.y{font-family:var(--f-mono);font-size:10.5px;font-weight:600;padding:0 4px;border-radius:3px;line-height:16px;white-space:nowrap}
.y.cse{background:var(--navy-bg);color:var(--navy)}
.y.up{background:var(--mark);color:var(--mark-ink)}
.y.upm{background:var(--plum-bg);color:var(--plum)}
.y.cds{background:var(--good-bg);color:var(--good)}
.y.capf{background:var(--warn-bg);color:var(--warn)}
.y.oth{background:var(--rule-2);color:var(--ink-2)}
.tnote{font-size:11.5px;color:var(--ink-2);font-style:italic;margin-left:3px}
/* ---------- recall ---------- */
.recall td:not(:first-child) .ans,.recall ul.facts li.qa .ans,.recall ul.facts li.cue .ans,.recall ul.facts li.cz b{filter:blur(5px);transition:filter .15s}
.recall td:not(:first-child),.recall ul.facts li:not(.open){cursor:pointer}
.recall td.shown .ans,.recall ul.facts li.shown .ans,.recall ul.facts li.shown b{filter:none}
/* ---------- search hits ---------- */
mark.qh{background:var(--mark);color:var(--mark-ink);border-radius:2px;padding:0 1px}
.y.hit{outline:2px solid var(--omr);outline-offset:1px}
.recall-hint{display:none;font-size:12.5px;color:var(--omr);margin:-4px 0 12px}
.recall .recall-hint{display:block}
/* ---------- radar ---------- */
.bar{display:inline-block;height:8px;border-radius:4px;background:var(--navy);vertical-align:middle;opacity:.75}
.bar.u{background:var(--mark-ink);opacity:.55}
.cell{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid var(--rule);vertical-align:middle}
.cell.on{background:var(--omr);border-color:var(--omr)}
td.c{text-align:center}
.srch-sec{display:block;border:0;background:none;padding:0;cursor:pointer;font-family:var(--f-disp);font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--omr);margin:18px 0 6px;font-weight:600}
.filt{font-size:13px;background:var(--navy-bg);color:var(--ink);border-radius:6px;padding:6px 10px;margin:0 0 14px;display:inline-block}
.empty{padding:28px;text-align:center;color:var(--ink-2)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.pager .btn{white-space:normal;max-width:100%;text-align:left;overflow-wrap:anywhere}
.totop{position:fixed;right:16px;bottom:16px;z-index:30;box-shadow:0 2px 8px rgba(0,0,0,.15)}
@media (max-width:980px){
  .layout{grid-template-columns:minmax(0,1fr)}
  aside.side{position:fixed;left:0;top:0;height:100vh;width:min(86vw,320px);z-index:60;background:var(--paper);transform:translateX(-102%);transition:transform .2s;box-shadow:2px 0 18px rgba(0,0,0,.2);padding-top:16px}
  body.nav-open aside.side{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50}
  .menu-btn{display:inline-block}
  main{padding:14px 16px 60px}
}
@media (max-width:640px){
  .brand h1{font-size:21px}.sec-head h2{font-size:25px}td,th{padding:6px 9px}
  .tools{flex-basis:100%}.search{max-width:none;flex:1 1 120px;min-width:0;order:-1}.sel{order:1;flex:1 1 100%}
  .cols2{columns:1}
  figure.nfig{padding:10px 8px 8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{header.top,aside.side,.subnav,.totop,details.key{display:none!important}.layout{display:block}details.block,figure.nfig{break-inside:avoid}}
</style>
</head>
<body>
<header class="top" id="top">
  <div class="top-row">
    <div class="brand"><button class="btn menu-btn" id="menu" aria-label="Open section list">☰</button><h1>Geography Master Sheet</h1><span class="sub">UPSC CSE Prelims · UPPCS Prelims</span></div>
    <div class="tools">
      <div class="search"><input id="q" type="search" placeholder="Search everything — a place, a term, a number or a year" aria-label="Search the sheet" autocomplete="off"><button class="clr" id="qclr" aria-label="Clear search" hidden>×</button></div>
      <select class="btn sel" id="ex" aria-label="Show only lines tested in">
        <option value="">All lines</option><option value="cse">UPSC CSE Prelims</option><option value="up">UPPSC exams (Prelims &amp; others)</option><option value="upm">UPPCS Mains</option><option value="cds">CDS / NDA</option><option value="capf">CAPF</option><option value="oth">Other State PCS</option><option value="any">Any PYQ-tagged line</option>
      </select>
      <button class="btn" id="recall" aria-pressed="false" title="Blur answers; tap to reveal">Recall</button>
      <button class="btn" id="theme" title="Switch light / dark">Dark</button>
    </div>
  </div>
</header>
<div class="layout">
  <aside class="side" id="side" aria-label="Sections"></aside>
  <div class="scrim" id="scrim"></div>
  <main id="main"></main>
</div>
<button class="btn totop" id="totop" hidden aria-label="Back to top">↑ Top</button>
<script>
(function(){var t="";try{t=localStorage.getItem("pms2-theme")||""}catch(e){}if(t)document.documentElement.dataset.theme=t;})();
/* ===================== CONTENT ===================== */
/* Geography — UPSC CSE Prelims · UPPCS Prelims. Spec: NOTES_FORMAT_GUIDE.md */
const S=[];
function SEC(o){o.blocks=o.blocks||[];S.push(o);return o;}
/* ===== 01 EARTH, SOLAR SYSTEM, SEASONS & TIME ===== */
SEC({id:"earth",title:"Earth, Solar System, Seasons & Time",group:"Earth & Landforms",tier:2,
stats:["UPSC CSE: 11 Q (2009–25) in 8 of 17 papers, 5 of 8 since 2018 — 4 in 2025 alone (time zones, date line, Earth’s spin, Equator lakes); astronomy items mostly before 2012","UPPCS Pre: 2 Q (2018–25); older UPPSC papers asked solar-system, latitude and local-time basics about 75 times (1990–2017)","Formats: how-many (time zones), Statement I–II (date line), day length on 21 June, local-time arithmetic, planet ↔ feature matching"],
note:"Everything that follows from the Earth’s shape, tilt and spin: why seasons happen, how day length changes with latitude, and how longitude becomes time. The solar-system and star blocks stay compact; deeper astrophysics belongs to Science & Tech.",
blocks:[
{h:"Shape, size and surface",t:2,list:[
"Shape :: an **oblate spheroid (geoid)** — flattened at the poles and bulging at the equator, so the **polar circumference is shorter** than the equatorial",
"Proofs of a round Earth: **circumnavigation** (Magellan’s voyage, 1519–22), a **circular horizon** that widens with height, the **Bedford Level** experiment, sunrise times that change with longitude, and the Earth’s **round shadow** on the Moon",
"Moving to a higher latitude, an object’s weight :: **increases** — the radius is smaller at the poles and the outward pull of rotation weaker, so gravity is stronger; ==the Earth is not a perfect sphere==, !!weight does not decrease poleward!! [CSE 2003]",
"Total **land area** ≈ `1,475 lakh km²` (about 148 million km², ~29% of the surface) [CSE 2005]",
"Land : water ≈ **29 : 71** (roughly 1 : 2.4) :: !!not 1 : 4!! [CSE 2005]",
"Continents by area :: **Asia > Africa > North America > South America > Antarctica > Europe > Australia** — the two smallest are Europe and Australia [CSE 2005; UPPCS M 2015, 2017; UPPCS 1992; UPPCS Spl 2008; UP RO 2014]",
"Continent with the most countries :: **Africa (54)**, then Europe and Asia [UPPCS M 2015]",
"Continent with the highest share of plains in its area :: **Europe** [UPPCS M 2013]"]},
{h:"Latitude, longitude and the Pole Star",t:2,list:[
"Latitude :: angular distance **north or south of the equator**; parallels shrink poleward; **1° of latitude ≈ 111 km** everywhere",
"Longitude :: angular distance **east or west of the Prime Meridian (Greenwich)**; meridians converge at the poles, so 1° of longitude is ~111 km at the equator and **0 km at the poles**",
"Absolute location of a place needs :: **both latitude and longitude** [CAPF 2021]",
"Great circle :: any circle that halves the globe — the **equator**, and every meridian together with its opposite (**0° with 180°**); its arc is the **shortest route** between two points [UPPCS 2000]",
"Heat zones: **torrid** (between the tropics — noon Sun overhead at least once a year) · **temperate** (23½°–66½° — never overhead) · **frigid** (beyond 66½° — midnight Sun and polar night)",
"Stars rise **perpendicular to the horizon** for an observer on the :: **Equator** [CSE 2001]",
"Pole Star (**Polaris**) sits almost over the North Pole: its height above the horizon equals the observer’s **latitude** (90° at the pole, on the horizon at the equator); the southern marker is **Sigma Octantis**",
"Facing the Pole Star you face north, so to walk **east** keep it on your :: **left** [CSE 2012]",
"Antipode of 30°N, 50°E :: **30°S, 130°W** — switch the hemisphere and move 180° of longitude [CSE 1994]"]},
{h:"Countries on the Equator, Tropics and Prime Meridian",t:1,cols:["Line","Countries (west → east)","Watch for"],rows:[
["**Equator** (0°)","South America: **Ecuador → Colombia → Brazil** · Africa: **São Tomé & Príncipe → Gabon → Rep. of Congo → DR Congo → Uganda → Kenya → Somalia** · Asia–Pacific: Maldives (sea) → **Indonesia** → **Kiribati**","!!Not Venezuela, Peru, Equatorial Guinea, Rwanda or Tanzania!!; of Colombo, Jakarta, Manila and Singapore, **Singapore** (~1½°N) is nearest the Equator [CSE 2011, 2008; UPPCS 2020, 2010, 2008; UPPCS M 2007]"],
["Lakes on the Equator","**Lake Victoria** (Uganda–Kenya)","!!Not Lake Tanganyika, Tonle Sap or Patos Lagoon!! [CSE 2025]"],
["**Tropic of Cancer** (23½°N)","**Mexico → Bahamas** · **Western Sahara → Mauritania → Mali → Algeria → Niger → Libya → Egypt** · **Saudi Arabia → UAE → Oman → India → Bangladesh → Myanmar → China → Taiwan**","!!Not Iran, not Pakistan!! [UPPCS 2005]"],
["**Tropic of Capricorn** (23½°S)","**Chile → Argentina → Paraguay → Brazil** · **Namibia → Botswana → South Africa → Mozambique → Madagascar** · **Australia**","!!Not Bolivia, not Uruguay!! [UPPCS 2003; UP Lower 1997]"],
["**Prime Meridian** (0°), north → south","**UK → France → Spain → Algeria → Mali → Burkina Faso → Togo → Ghana**; it meets the Equator in the **Gulf of Guinea** (Atlantic)","!!Not Portugal, not Nigeria!! [UPPCS Spl M 2008; UP UDA M 2010; UP Lower 2009; UKPCS 2005]"],
["All three lines (Equator + both Tropics)","**Africa** is the only continent crossed by all three","South America has the Equator and the Tropic of Capricorn only [UPPCS Spl M 2004]"]]},
{h:"Rotation and revolution",t:1,list:[
"Rotation :: **west → east** (anticlockwise seen from above the North Pole); the axis is tilted **23½°** from the perpendicular, i.e. **66½°** to the orbital plane [UPPCS 2016]",
"The axis points the same way all year — the **parallelism of the axis** [UPPCS 2000]",
"Day and night are caused by :: **rotation** on the axis; the **circle of illumination** divides them [RAS 2000; JPSC 2021]",
"Sidereal day (one 360° turn against the stars) :: **23 h 56 min**, shorter than the **24 h** solar day because the Earth also moves along its orbit [CDS 2015 I]",
"Speed of rotation :: about **1,670 km/h** at the equator, falling to **0** at the poles — so satellites are launched **eastward**, close to the equator [CSE 2002]",
"Without rotation :: **no sunrise, sunset or day–night cycle**, but **seasons would remain** (tilt and revolution cause them) [CDS 2015 I]",
"Melting polar ice shifts mass towards the equator, which **slows the spin** (conservation of angular momentum) and slightly **lengthens the day** [CSE 2025]",
"Revolution :: **365 days 6 h**, anticlockwise on an **elliptical** orbit; the spare quarter-day gives the **leap year**",
"**Perihelion ~3 January** (nearest, ~147 million km) and **aphelion ~4 July** (farthest, ~152 million km); the Earth moves **faster at perihelion** [UPPCS 2000; UP GIC 2010; UKPCS 2006; CDS 2016 I]",
"January’s **perihelion** adds a little insolation, but ==seasons come from the tilt, not from the Earth–Sun distance==",
"Mean Earth–Sun distance :: **1 astronomical unit ≈ 149.6 million km** [CSE 1998; UPPCS 2010]",
"Sunlight reaches the Earth in about :: **8 min 20 s** [UPPCS M 2005]",
"The Moon **rotates and revolves in the same direction** as the Earth revolves around the Sun [CAPF 2024]"]},

{h:"Solstices and equinoxes",t:1,cols:["Date","Noon Sun overhead at","Effect"],rows:[
["**21 June** — summer solstice (N)","**Tropic of Cancer**","Longest day and shortest night in the **N Hemisphere**; polar day north of the Arctic Circle; in the S Hemisphere it is the winter solstice [CAPF 2024; CDS 2014 II]"],
["**23 September** — autumnal equinox","**Equator**","Day = night (**12 h**) everywhere [UP Lower 2004; UPPCS 1994; UKPCS 2002; CDS 2014 II]"],
["**22 December** — winter solstice (N)","**Tropic of Capricorn**","Longest day in the **S Hemisphere**; polar night north of the Arctic Circle; high pressure builds over NW India [CGPCS 2015; CDS 2014 II]"],
["**21 March** — vernal equinox","**Equator**","Day = night everywhere; the Sun crosses into the N Hemisphere [UP Lower 2004; UPPCS 1994; CDS 2014 II]"]]},
{h:"Day length and the noon Sun",t:1,list:[
"Seasons and changing day length come from :: the Earth **revolving on a tilted axis** whose tilt stays constant [CSE 2013; CAPF 2023; RAS 1992]",
"If the equator were not inclined to the orbit :: **no seasons** [CAPF 2019]",
"On 21 June, more than 12 hours of daylight at :: the **Tropic of Cancer** and the **Arctic Circle** — !!not the Equator (always ~12 h) or the Tropic of Capricorn!! [CSE 2024]",
"On 21 June the Sun :: **does not set at the Arctic Circle** — !!it is not overhead at the Equator or the Tropic of Capricorn!! [CSE 2019]",
"Longest day of the year in the N Hemisphere :: **21 June — in the second half of June** [CSE 2022; UPPCS 2010, 1992]",
"Day and night stay **12 h all year only at the Equator**; the gap between them **grows away from the Equator** [UPPCS 1997; CDS 2014 I]",
"Shortest noon shadow in north India :: **21 June** [UPPCS 2006]",
"Noon Sun at the Tropic of Cancer on 22 December :: **43°** above the horizon (90° − 47°) [UPPCS 1997]",
"The noon Sun is overhead **twice a year** everywhere between the tropics, **once** on each tropic, and **never** outside them",
"Midnight Sun :: poleward of **66½°** in summer, with six months of day at the pole [UPPCS 1990]",
"Twilight is **shortest at the equator**, where the Sun rises and sets vertically, and longest near the poles"]},

{h:"Longitude and time",t:1,list:[
"The Earth turns **15° an hour**, so **1° = 4 minutes**; places to the east are ahead [CAPF 2024]",
"Local time 06:00 when GMT is 03:00 :: **45°E** (3 h × 15°) [UPPCS 2006]",
"Noon at Greenwich, 17:00 local :: **75°E** [UPPCS 2008]",
"Noon on 82°30′E (the IST meridian) means 06:30 on :: **0° (Greenwich)** — IST is **GMT + 5 h 30 min** [CSE 1994]",
"Standard time from most ahead to most behind GMT :: **Japan → Iraq → Greece → Cuba → Costa Rica** [CSE 1995]",
"If the Earth spun east → west, IST at noon on the date line would be :: **18:30** (it is actually 05:30) [CSE 1997]",
"There are **24** standard time zones; countries with **more than four**, counting overseas territories: **France (12)**, Russia, USA, **UK**, **Australia**, **Denmark**, **New Zealand** — !!Brazil has exactly four!! [CSE 2025]",
"Daylight saving time :: clocks put **one hour ahead** in the **spring–summer** months at mid and high latitudes [CAPF 2024]"]},
{h:"International Date Line",t:1,list:[
"IDL :: roughly the **180° meridian**, zig-zagging so island groups keep one date; agreed at the 1884 International Meridian Conference; **12 h** from Greenwich either way [UPPCS 1992]",
"Crossing the IDL **eastward** (Asia → America) sets the calendar **back one day**; crossing **westward** moves it **forward one day** — !!not the other way round!! [CAPF 2024]",
"Anadyr (Siberia) and Nome (Alaska), a few km apart across the IDL :: **different calendar days** at the same moment; Anadyr is a day ahead, so Monday in Anadyr is **Sunday** in Nome, !!not Tuesday!! [CSE 2025]",
"31 December in New Zealand is :: **30 December** in Hawaii and Alaska (east of the line) [CAPF 2024]",
"Strait nearest the IDL :: **Bering Strait** [CSE 2008]"]},
{h:"Eclipses and the Moon",t:2,list:[
"**Syzygy** — Sun, Earth and Moon in a straight line: conjunction gives a **solar** eclipse, opposition a **lunar** eclipse; !!it has nothing to do with perihelion!! [CDS 2016 II]",
"Solar eclipse :: the **Moon** comes between the Sun and the Earth — only on a **new-moon day** [UPPCS 1991, 1990]",
"Lunar eclipse :: the **Earth** comes between the Sun and the Moon — only on a **full-moon day**; a total one turns red (**blood moon**)",
"Totality in a solar eclipse is seen only along a narrow path because :: the Moon’s **shadow (umbra) is small** compared with the Earth’s cross-section [CSE 1993]",
"Annular eclipse :: the Moon near **apogee** looks too small to cover the Sun, leaving a **ring of fire**",
"We always see the same face of the Moon :: its **rotation period equals its revolution period (~27.3 days)** — tidal locking, !!not 23½ days!! [UPPCS 2006; CSE 2005]",
"Half moon :: Sun–Earth–Moon angle of **90°** (quadrature) [UPPCS 2005]",
"Blue moon :: **two full moons in one calendar month** [UPPCS M 2009, 2007]",
"Moon’s distance :: about **3.84 lakh km** on average — ~3.63 lakh km at perigee, ~4.05 lakh km at apogee [UP Lower 2008]",
"Supermoon :: a full moon at **perigee**",
"Sea of Tranquility :: a lava plain on the **Moon** — Apollo 11’s landing site (1969) [MPPCS 1995]",
"On the Moon an object’s weight becomes :: about **one-sixth** of its weight on Earth [UPPCS 2006]",
"Two people on the Moon cannot hear each other because :: there is **no atmosphere** to carry sound [UPPCS 2003]"]},
{h:"Planets at a glance",t:2,cols:["Planet","Remember"],rows:[
["**Mercury**","Nearest the Sun; **smallest**; **fastest** — orbit in **88 days**; no moons; almost no atmosphere [UPPCS 2002, 1991; UPPCS M 2004; CDS 2023 II]"],
["**Venus**","**Hottest** (thick CO₂ greenhouse) and **brightest**; the **morning and evening star**; Earth’s **twin sister**; rotates **clockwise (retrograde)**; comes **closest to Earth**; no moons [UP Lower 2015, 2008; UPPCS 2007; BPSC 2000; CAPF 2016]"],
["**Earth**","**Densest** planet; lies between Venus and Mars [CSE 2002; UPPCS M 2012]"],
["**Mars**","Red from **iron oxide**; day (~24 h 37 min) and tilt (~25°) close to Earth’s; ice caps; moons **Phobos** and **Deimos** [UPPCS 2001; CGPCS 2020]"],
["**Jupiter**","**Largest**; faint silicate-dust rings; Great Red Spot; **Ganymede** is the largest moon in the solar system [UPPCS 1990; UPPCS M 2004; CGPCS 2020]"],
["**Saturn**","Most prominent **rings of ice and dust**; **least dense** (less than water); moon **Titan** has a thick atmosphere; warmer than Neptune [UPPCS 2010, 1990; UP UDA 2006; CDS 2023 II]"],
["**Uranus**","Axis tilted **~98°** — it rolls on its side; rotates **retrograde**, like Venus [CAPF 2016]"],
["**Neptune**","Farthest; **longest orbit (~165 years)**, slowest-moving; its moon **Triton** orbits backwards; ==with Pluto demoted in 2006, the “longest orbit” answer is Neptune== [UP Lower 2004; UPPCS M 2011]"],
["**Pluto**","**Dwarf planet** since 2006 (with Ceres, Eris, Haumea, Makemake); moons **Charon** (nearly half Pluto’s size), Nix, Hydra [UP UDA M 2010]"]]},
{h:"Solar system facts",t:2,list:[
"Order from the Sun :: **Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune** — between Mars and Uranus lie **Jupiter and Saturn**; between Earth and the Sun, **Mercury and Venus** [CSE 2009; UP GIC 2010; UP Lower 2003, 2002]",
"Terrestrial (inner) planets :: **Mercury, Venus, Earth, Mars** — rocky, dense, few or no moons, no rings; they lie **between the Sun and the asteroid belt** [CDS 2020 II; CAPF 2019]",
"Jovian (gas) planets :: **Jupiter, Saturn, Uranus, Neptune** — large, low-density, many moons, rings [CDS 2023 I]",
"Planets are non-luminous: they **shine by reflected sunlight** [UPPCS 1992]",
"IAU test (2006) for a planet :: orbits the Sun, is massive enough to be **round**, and has **cleared its orbit** — a dwarf planet fails the last test",
"Asteroids :: rocky and metallic bodies orbiting **between Mars and Jupiter**; most are small, a few up to ~1,000 km (Ceres ~950 km) [CSE 2011, 1998, 1997; UPPCS 2008]",
"Comets :: frozen gases held together with rock and metal, coming from the **Kuiper belt** and Oort cloud; they show a glowing tail that points **away from the Sun**, pushed by **solar radiation pressure** and the solar wind [CSE 2011, 1997]",
"Moon’s origin :: the **giant impact** (“big splat”) — a Mars-sized body struck the early Earth and the debris gathered into the Moon",
"Meteoroid → **meteor** (burns up in the air, a “shooting star”) → **meteorite** (reaches the ground) [CSE 1995]",
"Mars takes **longer** than the Earth to orbit the Sun (~687 days) — !!a smaller diameter does not shorten the orbit!! [CSE 2006]",
"Life on Venus is improbable :: its atmosphere is ~96% **CO₂**, driving a runaway greenhouse [CSE 2005]",
"Among Earth, Jupiter, Mars and Venus, the longest year is :: **Jupiter’s (~12 years)** [CSE 2003]",
"Best sign of possible life on Mars :: its **ice caps and frozen water** [CSE 1997; UPPCS 2000]"]},
{h:"Sun, stars and galaxies",t:3,list:[
"Sun’s energy :: **nuclear fusion** of hydrogen into helium in the core (~15 million °C) [UPPCS 2006, 2001, 1996]",
"The Sun holds **99.86%** of the solar system’s mass; its diameter is ~**109×** the Earth’s",
"Layers outward :: **core → radiative zone → convective zone → photosphere** (visible surface, ~5,500 °C) **→ chromosphere → corona** (1–2 million °C, seen in a total eclipse)",
"Sunspots :: cooler, magnetically active patches on the photosphere that rise and fall in an **11-year cycle**; **solar flares** and coronal mass ejections peak with them",
"Nearest star :: the **Sun**; next, **Proxima Centauri (~4.2 light-years)** [CSE 1997; CDS 2019 I]",
"Light-year :: a unit of **distance** — how far light travels in a year [MPPCS 1994]",
"A star’s colour shows its :: **surface temperature** — blue-white hottest, red coolest [CSE 1994]",
"Chandrasekhar limit :: a dying star heavier than **1.44 solar masses** cannot end as a **white dwarf**; the limit, and early black-hole theory, are credited to **S. Chandrasekhar** [CSE 2009; UPPCS 2019, 2015, 1997, 1996; UPPCS M 2016]",
"Life cycle :: nebula → protostar → main-sequence star → **red giant** → planetary nebula → **white dwarf**; massive stars → red supergiant → **supernova** (a dying star) → **neutron star (pulsar)** or **black hole** [UP Lower M 2015]",
"Small (dwarf) stars burn slowly and **live far longer** than giants, whose fusion runs faster",
"**Sirius** :: the brightest star in the night sky — a binary with a white-dwarf companion, ~8.6 light-years away",
"Black hole :: a **collapsed star** whose gravity lets not even light escape, so it **cannot be seen directly** by a telescope [UPPCS 2019, 2003, 2001]",
"Pulsar, quasar and black hole are space objects; the **brittle star** is !!a starfish-like marine animal!! [CSE 1993; UPPCS 1996]",
"**Milky Way** :: a (barred) **spiral galaxy** with the supermassive black hole **Sagittarius A*** at its centre; the Sun sits in its **Orion arm**; the nearest large galaxy is **Andromeda** [UPPCS 2001]",
"Galaxy shapes :: **elliptical**, **spiral**, **irregular**; a **quasar** is an extremely bright galactic core powered by a supermassive black hole",
"**Cepheid** :: a pulsating variable star whose brightness changes with a steady period — used to measure cosmic distances",
"**Constellation** :: a group of stars forming a recognisable pattern [UPPCS 2013]",
"Big Bang :: origin of the **universe** (Lemaître, 1927; named by Fred Hoyle); **Edwin Hubble** showed galaxies are receding (**red shift**) — ==the expanding universe is Hubble’s, continental drift is Wegener’s== [UPPCS 2016; CSE 2008]",
"Other ideas of the universe :: **Steady State** (Fred Hoyle — no beginning, matter created continuously) · **pulsating** universe (Arthur Eddington — alternate expansion and contraction)",
"Origin of the solar system :: **nebular** (Kant, Laplace) · **planetesimal** (**Chamberlin** and Moulton) · **tidal** (Jeans and Jeffreys) · **interstellar dust** (**Otto Schmidt**) · thermal contraction of a hot Earth (**Harold Jeffreys**) [CSE 1999; CDS 2018 I]",
"Nebular hypothesis :: a slowly rotating gas cloud flattens into a **disc**; rings left behind condense into **planets** that orbit the Sun [CAPF 2024]",
"Twinkling :: turbulent air bends the light of **point-like stars**; planets (tiny discs) barely twinkle, and **nothing twinkles in space**",
"Goldilocks zone :: the belt around a star where **liquid water** can exist"]}
]});

/* ===== 02 EARTH’S INTERIOR, ROCKS & EARTH HISTORY ===== */
SEC({id:"interior",title:"Earth’s Interior, Rocks & Earth History",group:"Earth & Landforms",tier:2,
stats:["UPSC CSE: interior & seismic waves 2 Q (2009, 2023); earth history 4 Q (2012, 2013, 2014, 2018); rocks 2 Q (2001, 2025) — plus magnetism 2005","UPPCS Pre: part of 5 geomorphology Q (2018–25) — life-form sequence 2018; older UPPSC papers: crust elements, Pangaea, dating methods","Formats: Statement I–II–III (chalk vs clay 2025), sequence of life forms, rock ↔ type matching (CDS/CAPF almost every year)"],
note:"The layered Earth as seismic waves reveal it, the three rock families and how each turns into the others, and the long clock of Earth history. Plate movement, volcanoes and earthquakes follow on the next sheet.",
blocks:[
{h:"How we know the interior",t:2,list:[
"Direct sources :: **mines and deep drilling** — the deepest hole, the **Kola Superdeep Borehole (~12 km)**, is on land in north-west Russia — and **volcanic material**",
"Indirect sources :: **seismic waves**, gravity and magnetic surveys, **meteorites**, and the Earth’s mean density (**~5.5 g/cm³**, far above crustal rock at 2.7–3)",
"Temperature rises about **1 °C every 32 m** near the surface, but rising pressure keeps deep rock from melting"]},
{h:"Layers of the Earth",t:1,cols:["Layer","Depth and state","Key facts"],rows:[
["**Crust**","~35 km under continents (up to **70 km** beneath the Himalaya); **5–10 km** under oceans","**Continental — sial**: granitic, ~2.7 g/cm³, older · **Oceanic — sima**: basaltic, ~3.0 g/cm³, younger · under 1% of the Earth’s volume"],
["**Lithosphere**","Crust + uppermost mantle, to ~100 km; rigid","Broken into the **plates**"],
["**Asthenosphere**","~100–350 km; **plastic**","Upper-mantle zone where seismic waves slow (**low-velocity zone**); source of magma; the plates glide over it"],
["**Mantle**","To **2,900 km**","Largest layer — **~84% of the volume, ~67% of the mass**; rich in magnesium and iron; its **convection currents** move the plates [CAPF 2021]"],
["**Outer core**","2,900–5,150 km; **liquid**","**Iron–nickel (nife)**; its flow generates the magnetic field; **S-waves cannot cross it** [CSE 2009]"],
["**Mesosphere · barysphere**","Mantle below the asthenosphere · the whole core","Older names for the physical divisions, still used in some questions"],
["**Inner core**","5,150–6,371 km; **solid**","Solid despite ~5,000 °C and more, because of **enormous pressure**"]]},
{h:"Discontinuities",t:2,cols:["Discontinuity","Separates"],rows:[
["**Conrad**","Upper (sial) and lower (sima) continental crust"],
["**Mohorovičić (Moho)**","**Crust and mantle**"],
["**Repetti**","Upper and lower mantle (~700 km)"],
["**Gutenberg**","**Mantle and outer core** (~2,900 km)"],
["**Lehmann**","Outer and inner core (~5,150 km)"]]},
{h:"Elements in the Earth",t:2,list:[
"Crust :: **oxygen (~46.6%) > silicon (~27.7%) > aluminium > iron > calcium > sodium > potassium > magnesium** — most abundant **oxygen**, least of these eight **magnesium** [UP UDA 2013; CDS 2015 II]",
"Whole Earth by mass :: **iron (~32%)** narrowly ahead of oxygen (~30%), because of the core — a question worded “on Earth” was keyed **oxygen**, i.e. read as the crust [CAPF 2023]"]},
{h:"Seismic waves and shadow zones",t:1,list:[
"**P-waves** (primary, longitudinal, compressional) :: the **fastest, first to arrive** at a seismograph; particles vibrate **to and fro along** the direction of travel, like sound; they pass through **solids, liquids and gases** [CSE 2023; CDS 2021 I]",
"**S-waves** (secondary, transverse) :: slower; particles vibrate **at right angles** to the direction of travel; they travel **only through solids** [CSE 2023]",
"**Surface (L) waves** :: formed when body waves reach the surface; the **slowest but most destructive**",
"P-wave shadow zone :: **105°–145°** from the epicentre — P-waves bend as they enter the liquid outer core",
"S-wave shadow zone :: everything **beyond 105°** — S-waves cannot cross the liquid outer core, so seismographs there record **no S-waves**, !!not both P and S!! [CGPCS 2020]",
"Each earthquake has **its own shadow zone**, which moves with the epicentre [CGPCS 2020]"]},
{h:"Interior and the seismic shadow zones",t:2,fig:{kind:"svg",
alt:"Cross-section of the Earth showing the crust, mantle, liquid outer core and solid inner core; from an epicentre at the top, direct waves reach the surface up to 105 degrees; a P-wave shadow zone lies between 105 and 145 degrees on both sides, and S-waves are absent everywhere beyond 105 degrees",
caption:"The liquid outer core stops S-waves and bends P-waves, which is how the core was discovered.",

{h:"Geomagnetism",t:2,list:[
"The magnetic field is generated by **convection of liquid iron in the outer core** (the geodynamo)",
"Magnetic axis is tilted about **11°** to the geographic axis :: !!not 23½°!! [CSE 2005]",
"North magnetic pole :: long in **Arctic Canada** (first located on the Boothia Peninsula, 1831) — keyed correct in 2005 — and since drifting across the Arctic Ocean towards **Siberia** [CSE 2005]",
"Magnetic equator passes through :: **Thumba**, near Thiruvananthapuram — India’s first rocket-launch site [CSE 2005]",
"The field has **reversed every few hundred thousand years**; rocks record it as **palaeomagnetism**, and the slow drift of the poles as **polar wandering** [CSE 2018]",
"Auroras :: solar-wind particles channelled by the field into the **polar** upper air — **aurora borealis** (N), **aurora australis** (S); one was seen in 2024 even from **Hanle, Ladakh**, India’s dark-sky reserve"]},
{h:"The three rock families",t:1,cols:["Family","Formed by","Examples","Exam hook"],rows:[
["**Igneous** (primary)","Cooling of **magma or lava**; no layers, no fossils","Intrusive (plutonic): **granite**, gabbro · Extrusive (volcanic): **basalt** (Deccan Traps), andesite, **pumice**, obsidian","Can be **crystalline or glassy** (non-crystalline); lava cooling gives igneous rock [BPSC 2024, 1995; CDS 2021 I; CAPF 2023]"],
["**Sedimentary**","**Weathering → transport → deposition → lithification** (compaction + cementation) by the **hydrological system**","Mechanical: **sandstone**, **conglomerate**, shale, **loess** · Organic (NCERT grouping): **geyserite**, chalk, coal · Chemical: chert, **halite** (rock salt), potash","**Layered**, with **fossils**; geyserite is !!not mechanically formed!! [CSE 2001; CDS 2022 II; CAPF 2023]"],
["**Metamorphic**","Recrystallisation of existing rock by **heat and/or pressure** — contact (thermal) or regional (dynamic); minerals align in bands (**foliation**)","granite → **gneiss** · sandstone → **quartzite** · limestone → **marble** · shale → **slate** → schist · coal → graphite","Formed from **both igneous and sedimentary** rock; !!gneiss is not igneous, granite is not metamorphic!! [JPSC 2011; CAPF 2018]"]]},
{h:"Rock facts and the rock cycle",t:2,list:[
"Rock vs mineral :: a **mineral** has a definite chemical composition; a **rock** is an aggregate of minerals with none",
"Silica content :: **acid** rocks over 66% (granite — light, less dense) · **intermediate** 52–66% (andesite) · **basic** under 52% (basalt, gabbro — dark, dense)",
"Chalk vs clay :: chalk is **porous and permeable**; clay is porous too, but its tiny pores make it **nearly impermeable** — so ==“clay is not at all porous” is false== [CSE 2025]",
"Permeable rock, of granite, limestone, quartzite and a sill :: **limestone** — water passes through its joints and solution channels [CAPF 2023]",
"Slate is **metamorphic** (from shale), !!not sedimentary!!; conglomerate is a **clastic** sedimentary rock; granite plutonic, basalt extrusive [CAPF 2023]",
"Rock cycle :: **solidification** (magma → igneous), **lithification** (sediment → sedimentary) and **metamorphism** are all part of it; any family can become any other [CAPF 2024]"]},
{h:"The rock cycle",t:2,fig:{kind:"svg",
alt:"Rock cycle diagram: magma cools and solidifies into igneous rock; weathering, erosion, deposition and lithification turn rock into sedimentary rock; heat and pressure turn sedimentary and igneous rock into metamorphic rock; melting turns metamorphic rock back into magma",

{h:"Earth history and the origin of life",t:1,list:[
"Age of the Earth ≈ **4.54 billion years**, found by **uranium (radiometric) dating** :: !!not carbon dating, which reaches back only ~50,000 years!! [UP UDA 2006]",
"Early atmosphere :: hydrogen and helium stripped away by the solar wind, then **degassing** from the interior (water vapour, nitrogen, CO₂, methane, ammonia) — **almost no free oxygen**, !!not 54%!! [CSE 2018]",
"Free oxygen came from **photosynthesis** by cyanobacteria (blue-green algae), from ~2.5–3 billion years ago — living organisms **modified the atmosphere** [CSE 2018]",
"Elements primarily responsible for the origin of life :: **carbon, hydrogen and nitrogen** (with oxygen) [CSE 2012]",
"**Continental drift** and **glacial cycles** both influenced the evolution of organisms [CSE 2014]",
"Forces that reshape the surface :: **electromagnetic (solar) radiation, geothermal energy, gravity, plate movements, rotation and revolution** — all six [CSE 2013]",
"Order of first appearance :: **shelled animals (Cambrian) → insects → reptiles (Carboniferous) → mammals (Triassic)** [UPPCS 2018]",
"First marsupials :: the **Cretaceous** — keyed **Lower Cretaceous** in 2022 [CAPF 2022]",
"Single original landmass :: **Pangaea**, in one ocean, **Panthalassa** (assembled ~335–300 million years ago) [UPPCS M 2016]",
"Mass extinctions to know :: **end-Permian (~252 million years ago)**, the “Great Dying”, the largest; **end-Cretaceous (66 million years ago)** — Chicxulub impact (Yucatán) plus Deccan volcanism — ended the dinosaurs",
"Little Ice Age :: roughly **AD 1300–1870** — keyed **1650–1870** among the options [UPPCS 2015]",
"Holocene (from **11,700 years ago**) is split into :: **Greenlandian → Northgrippian (from 8,200) → Meghalayan (from 4,200 years ago)**, the last named from **Mawmluh Cave**, Meghalaya"]},
{h:"Geological time scale",t:2,cols:["Era · period","Began (million years ago)","Life and events"],rows:[
["**Precambrian** (Hadean, Archaean, Proterozoic)","4,600","Crust, oceans and atmosphere form; bacteria by ~3.5 billion years ago; blue-green algae release oxygen"],
["Palaeozoic · **Cambrian**","539","Burst of **shelled marine invertebrates**"],
["Palaeozoic · Ordovician","485","First **vertebrates** (jawless fish)"],
["Palaeozoic · Silurian","444","First **land plants**"],
["Palaeozoic · Devonian","419","Age of fishes; first **amphibians** and insects"],
["Palaeozoic · **Carboniferous**","359","First **reptiles**; vast swamp forests → coal"],
["Palaeozoic · Permian","299","Reptiles spread; **Pangaea** complete; ends in the Great Dying"],
["Mesozoic · Triassic","252","First **dinosaurs** and **mammals**"],
["Mesozoic · **Jurassic**","201","Age of dinosaurs; first birds; Pangaea begins to split"],
["Mesozoic · **Cretaceous**","145","**Flowering plants**, **marsupials**; ends with the dinosaurs’ extinction (66)"],
["Cenozoic · Palaeogene","66","Mammals diversify; India meets Asia and the **Himalaya** begins to rise"],
["Cenozoic · Neogene","23","**Apes**; the Tethys closes; grasslands spread; early hominins"],
["Cenozoic · **Quaternary**","2.58","Ice ages (**Pleistocene**); **Homo sapiens**; the Holocene; the **Ganga plains** built up"]]}
]});

/* ===== 03 PLATE TECTONICS, VOLCANOES & EARTHQUAKES ===== */

stats:["UPSC CSE: drift evidence 2025; volcanic products and fold/block-mountain rows 2024; older items — volcano ↔ country (2001, 2005), Baltic Sea (2001), Richter vs Mercalli (2001)","UPPCS Pre: volcano ↔ country matches (2010, 2015, 2021), active volcanoes, Ring of Fire; about 65 UPPSC questions since 1990 on volcanoes, earthquakes and mountain types","Formats: match the list, how-many rows, three-statement evidence items; CDS/CAPF: volcano types, plate names, seismic gaps"],
note:"From drift to plates, then what each plate boundary builds — mountains, volcanoes and earthquakes. Every volcano and mountain type is tied to the boundary that makes it.",
blocks:[
{h:"Continental drift",t:1,list:[
"Continental drift :: **Alfred Wegener (1912)** — one supercontinent, **Pangaea**, in one ocean, **Panthalassa**, split into **Laurasia** (north) and **Gondwanaland** (south) across the **Tethys** [CSE 2008]",
"Evidence :: the **jig-saw fit** of the Atlantic coasts (Bullard’s 1964 fit) · matching **ancient rock belts** of the Brazil coast and West Africa · **placer gold of Ghana** with no local source, derived from the Brazil plateau · **Gondwana sediments** of India matched in six southern landmasses · **tillite** (old glacial deposits) · **Mesosaurus** and **Glossopteris** fossils on continents now apart [CSE 2025]",
"Gondwanaland included :: **South America, Africa, Madagascar, Arabia, Peninsular India, Australia and Antarctica** — !!not North America!! [UPPCS M 2016; MPPCS 2008]",
"Wegener’s driving forces :: **pole-fleeing** force (from rotation) and **tidal** force — judged far too weak, the main reason the theory was rejected",
"Continents drifted apart because of :: **tectonic activity** [BPSC 2011]",
"Related theories :: **sliding continents** (Reginald **Daly**) · **geosynclinal** theory of mountain building (Antoni **Kober**) [CDS 2018 I]"]},
{h:"Sea-floor spreading and plate tectonics",t:1,list:[
"Sea-floor spreading :: **Harry Hess (1960–62)** — new crust forms at **mid-ocean ridges** and is consumed at **trenches**",
"Evidence :: rocks grow **older away from the ridge** in mirror-image bands of **reversed magnetism**; ocean crust is **young (under 200 million years)** and thin; **shallow** earthquakes at ridges, **deep** ones at trenches",
"Plate tectonics (1967–68) :: **McKenzie, Parker and Morgan** — rigid **lithospheric plates** move over the plastic **asthenosphere**; built on sea-floor spreading, !!not propounded by Hess!! [CGPCS 2021]",
"Drivers :: **mantle convection** (Arthur Holmes, 1930s), plus **ridge push**, **slab pull** at subduction zones (the strongest), and **mantle plumes** under hotspots",
"Plates are of **oceanic or thicker continental** lithosphere; they move because the rigid lithosphere rides on a **weaker** asthenosphere; !!subduction happens at convergent, not divergent, boundaries!! [CDS 2014 II]",
"Seven major plates :: **Pacific, North American, South American, Eurasian, African, Indo-Australian, Antarctic** — !!the Arabian plate is minor, Antarctica is major!! [CDS 2020 II; CAPF 2015]",
"Minor plates :: **Cocos, Nazca, Caribbean, Arabian, Philippine, Juan de Fuca, Scotia**, Caroline, Fiji"]},
{h:"Plate boundaries",t:1,cols:["Boundary","What happens","Landforms and examples"],rows:[
["**Divergent** (constructive)","Plates pull apart; magma rises and makes new crust","**Mid-ocean ridges** — Mid-Atlantic Ridge, Carlsberg Ridge, East Pacific Rise; on land, **rift valleys** — East African Rift → Red Sea (a young ocean); shallow earthquakes, fissure eruptions"],
["**Ocean–ocean convergent**","The older, denser plate subducts; melting feeds volcanoes","**Deep trenches** (Mariana, Japan) and **island arcs** (Japan, Aleutians, Philippines, Indonesia); earthquakes deepen along the slab (**Benioff zone**)"],
["**Ocean–continent convergent**","Oceanic plate subducts beneath the continent","**Fold ranges with volcanoes** — Andes (Nazca under South America), Cascades; Peru–Chile trench; all three depths of earthquake"],
["**Continent–continent convergent**","Neither sinks easily; crust thickens, folds and thrusts along a **suture**","**Himalaya** and Alps; **nappes**; shallow and intermediate earthquakes, **few or no volcanoes**"],
["**Transform** (conservative)","Plates slide past; crust neither made nor destroyed","**San Andreas Fault** (California); fracture zones offsetting ridges; the North Anatolian Fault (Türkiye)"]]},

{h:"The Indian plate",t:2,list:[
"Indian plate :: Peninsular India and the Indian Ocean floor (with Australia, the Indo-Australian plate); its east edge runs along the **Arakan Yoma–Java trench**, its west edge along the **Kirthar** ranges of Pakistan",
"After Gondwana broke up, India drifted **north** — as its palaeomagnetic record shows — and crossed the **Réunion hotspot** ~66 million years ago → **Deccan Traps** [UPPCS 1998]",
"Collision with Eurasia from ~50 million years ago raised the **Himalaya**, still rising; north-west India is earthquake-prone because of this **plate convergence** [UPPCS 2024; UPPCS M 2005]"]},
{h:"Volcano types",t:1,cols:["Type","Magma and behaviour","Examples"],rows:[
["**Shield**","Very fluid **basaltic** lava; flows only a few feet thick pile up into huge, gently sloping cones; mildly explosive","**Mauna Loa**, Mauna Kea, Kilauea — Hawaii [CDS 2022 I; CAPF 2015]"],
["**Composite (strato)**","Viscous **andesitic** magma; alternate lava and ash layers; steep cones; **violent** eruptions","Fuji, Vesuvius, **Mayon**, St Helens, Pinatubo — the Philippines [CAPF 2015]"],
["**Cinder cone**","Loose ash and cinders piled round a vent; small","**Parícutin** (Mexico)"],
["**Caldera**","A huge magma chamber empties and the summit collapses; the **most explosive** type","**Toba** (Sumatra), Krakatoa, Taal lake — Indonesia [CAPF 2015]"],
["**Flood basalt province**","Very fluid lava pours from fissures and spreads in sheets over wide areas","**Deccan Traps** (India), Columbia Plateau [CAPF 2015]"],
["**Mid-ocean ridge**","Fissure eruptions along spreading ridges","**Iceland**, on the Mid-Atlantic Ridge"]]},
{h:"Volcanic products and features",t:2,list:[
"Products of an eruption :: **pyroclastic debris, ash and dust, nitrogen compounds and sulphur compounds** — all four [CSE 2024]",
"Most abundant volcanic gas :: **water vapour**, then CO₂ and SO₂ [JPSC 2013]",
"Magma types :: **granitic** (acidic, over 66% silica) — viscous, cooler, from melted continental crust · **basaltic** (basic, under 52% silica) — fluid, hotter, from the mantle and far more common · **andesitic** — in between, typical of subduction zones",
"Molten rock **inside** the Earth is **magma**; once erupted it is **lava** [UKPCS 2006]",
"**Crater** :: the depression at the top of a vent after an eruption, sometimes holding a lake; a **caldera** is a far larger collapse basin [CAPF 2021]",
"Hot spring · **geyser** (intermittent jets — Old Faithful, Yellowstone) · **fumarole** (steam and gas only) · **mud volcano** (Baratang, Andaman)",
"Eruption strength is measured by the **Volcanic Explosivity Index**; **Iceland** and the **Philippines** were built by volcanoes; volcanic soils are **deep and fertile** [CDS 2023 I]",
"Streams on a dissected volcanic cone form a **radial** pattern — !!the claim that they are not radial is the false one!! [CDS 2017 I]"]},
{h:"Intrusive igneous bodies",t:2,cols:["Form","Shape"],rows:[
["**Batholith**","Huge dome-shaped mass cooled deep down; granite cores of mountain ranges"],
["**Laccolith**","Mushroom-like dome intruded along bedding planes and fed from below; the granite domes of the Karnataka plateau"],
["**Lopolith**","Saucer-shaped mass sagging into a basin"],
["**Phacolith**","Wavy mass at the crest of an anticline or the trough of a syncline"],
["**Sill / sheet**","Horizontal sheet **parallel** to the bedding (thick = sill, thin = sheet)"],
["**Dyke**","Vertical wall **cutting across** the beds — common in western Maharashtra, as feeders of the Deccan lavas"]]},

{h:"Volcanic belts and the Ring of Fire",t:1,list:[
"**Circum-Pacific belt (Ring of Fire)** :: the most active volcanic **and** seismic belt, round the Pacific; **convergent** margins, prone to **tsunamis** — !!not a divergent margin, not linked to forest fires!! [UPPCS 2008; MPPCS 2021; CAPF 2017, 2016]",
"Mid-continental (Alpine–Himalayan) belt :: Mediterranean volcanoes (Etna, Vesuvius, Stromboli) east to Indonesia, with **volcano-free gaps in the Alps and Himalaya** [CDS 2018 I]",
"Mid-Atlantic belt :: fissure eruptions along the ridge; **Iceland** is the most active part",
"Volcanic eruptions do not occur in the :: **Baltic Sea** — it lies inside a stable plate; the Caribbean (Mt Pelée, Soufrière Hills) and the Caspian–Black Sea region (Damavand in the Alborz, mud volcanoes) do have them [CSE 2001]",
"Hotspot volcanoes (inside plates, over **mantle plumes**) :: **Hawaii**, Réunion, Yellowstone; Iceland sits on a plume under a ridge"]},
{h:"Volcanoes to know",t:1,cols:["Volcano","Where","Note"],rows:[
["**Mauna Loa**","Hawaii (USA)","Largest active volcano by volume; shield [UPPCS 2005; UPPCS M 2014; CDS 2020 II]"],
["**Kilauea**","Hawaii","The most continuously active [UPPCS 2009; UPPCS M 2006]"],
["**Mauna Kea**","Hawaii","Tallest mountain from its sea-floor base (~10,200 m); dormant"],
["**Etna**","Sicily, Italy","Europe’s most active; stratovolcano [CSE 2001; UPPCS 2021, 2015, 2010; UPPCS M 2011, 2007]"],
["**Vesuvius**","Near Naples, Italy","Buried Pompeii (AD 79); active [UPPCS 2010; UPPCS M 2011; CDS 2020 II]"],
["**Stromboli**","Aeolian Islands, Italy","**Lighthouse of the Mediterranean** — near-constant glowing eruptions [UPPCS M 2004]"],
["**Fuji(yama)**","Honshu, Japan","Stratovolcano; classed active (last erupted 1707) [UPPCS M 2007]"],
["**Sakurajima · Aso**","Kyushu, Japan","Sakurajima — among Japan’s most active; Aso erupted in 2021 [CDS 2020 II]"],
["**Merapi**","Java, Indonesia","[UPPCS 2015; CDS 2020 II]"],
["**Semeru · Sinabung**","Java · Sumatra, Indonesia","Semeru is the highest volcano on Java (erupted 2021); Sinabung among Indonesia’s most active"],
["**Krakatoa (Krakatau)**","Sunda Strait, Indonesia","The **1883** eruption was among the most violent recorded — !!Tambora (1815) was larger!! [UP RO 2016]"],
["**Toba**","Sumatra, Indonesia","Supervolcano with a caldera lake"],
["**Mayon · Pinatubo · Taal · Apo**","Philippines","Mayon — near-perfect cone; Pinatubo — 1991 eruption; Taal — volcano in a lake; Apo — the highest peak [CSE 2001; UPPCS 2021]"],
["**St Helens · Rainier**","Washington, USA (Cascades)","St Helens erupted in 1980 [CSE 2005, 2001; UPPCS 2021]"],
["**Parícutin · Colima · Popocatépetl**","Mexico","Parícutin rose out of a cornfield in 1943 [CSE 2001; UPPCS 2021, 2015]"],
["**Cotopaxi · Chimborazo · Sangay**","Ecuador","Cotopaxi is one of the highest active volcanoes, keyed the highest volcanic mountain against Pinatubo, Kilimanjaro and Taal [UPPCS 2020, 2015, 2010; UPPCS M 2007]"],
["**Tungurahua**","Ecuador","Active stratovolcano; declared a UNESCO Global Geopark in 2025 [CSE 2026]"],
["**Ojos del Salado**","Chile–Argentina border","**Highest active volcano** (~6,890 m)"],
["**Sabancaya**","Peru","[UPPCS 2015]"],
["**Kilimanjaro**","Tanzania","Africa’s highest (5,895 m); **dormant**, !!not active!! [UPPCS M 2015, 2011, 2009]"],
["**Aconcagua**","Argentina","Highest peak of the Americas; volcanic rocks but !!not an active volcano!! [UPPCS M 2015, 2011, 2007]"],
["**Cumbre Vieja**","La Palma, Canary Islands (Spain)","2021 eruption"],
["**Bezymianny**","Kamchatka, Russia","Erupted 2022"],
["**Whakaari (White Island)**","New Zealand","Deadly 2019 eruption"],
["**Erebus**","Ross Island, Antarctica","Southernmost active volcano [UPPCS 2010]"],
["**Nyiragongo**","DR Congo","Very fluid lava lake"],
["**Hunga Tonga–Hunga Ha’apai**","Tonga","2022 submarine explosion, the largest this century"]]},
{h:"Earthquakes",t:1,list:[
"**Focus (hypocentre)** :: the point of rupture below the surface; the **epicentre**, directly above it on the surface, **feels the waves first** — !!the point of origin is the focus, not the epicentre!! [UP RO 2017; CDS 2016 II; CDS 2014 I]",
"Most earthquakes occur along **convergent plate boundaries**; intensity **falls with distance** from the epicentre; epicentres also lie under the sea, !!not over continents only!! [CDS 2016 II]",
"By depth :: **shallow 0–70 km** (most damaging) · intermediate 70–300 km · deep 300–700 km",
"Causes :: tectonic (commonest), volcanic, collapse (mines), explosions, and **reservoir-induced** — **Koyna**, Maharashtra (1967)",
"**Magnitude** — Richter scale :: the energy released; one value per quake; logarithmic — each whole number = **10× the wave amplitude and ~32× the energy**, !!not 100×!! [CSE 2001]",
"**Intensity** — Modified Mercalli scale (I–XII) :: the observed **damage**, which varies from place to place; papers often say “intensity” for magnitude — the Richter scale was keyed for it in 2015 [CSE 2001; UP Lower 2015]",
"Instrument :: the **seismograph**; its record is a **seismogram** [UPPCS M 2017]",
"**Seismic gap** :: a stretch of an active plate boundary that **has not ruptured recently** — stress is building there [CDS 2015 I]",
"**Homoseismal (coseismal) lines** join places shaken **at the same time**; **isoseismal lines** join places of **equal intensity** [CDS 2014 I]",
"Damage depends on the quake’s **strength**, **population density** and **building type** — !!not on the climate!! [CDS 2021 II]",
"Effects :: shaking, **soil liquefaction**, landslides, **tsunamis** (from sudden vertical movement of the sea floor), fires and dam bursts"]},
{h:"Folds, faults and diastrophism",t:2,list:[
"Endogenic forces :: driven by heat inside the Earth — slow **diastrophism** and sudden events (earthquakes, volcanism)",
"**Epeirogeny** :: broad, slow **vertical** uplift or subsidence of continents",
"**Orogeny** :: **mountain building** by horizontal compression",
"**Eustatic** change :: a worldwide rise or fall of **sea level**, from a change in the volume of ocean water (ice ages) or in basin capacity",
"Folds :: **anticline** (upfold) and **syncline** (downfold); rising pressure → symmetrical → asymmetrical → overturned → **recumbent** → **nappe** (sheared off and thrust far forward — well developed in the Himalaya and Alps)",
"Faults :: **normal** (tension — one block drops) · **reverse or thrust** (compression — one block rides up) · **strike-slip or transform** (horizontal, e.g. San Andreas)",
"**Horst** :: an **uplifted** block between faults — a block mountain",
"**Graben** :: a **dropped** block between faults — a rift valley",
"Rift valleys (graben) :: **East African Rift**, the **Rhine valley** between the **Vosges** and the **Black Forest**, the **Narmada and Tapi** valleys, the **Dead Sea**; ==Death Valley (California) was keyed a rift valley== [UPPCS 2012; UP RI 2014; UP Lower 2004]"]},
{h:"Mountains by origin and age",t:1,cols:["Type","How formed","Examples"],rows:[
["**Fold**","Compression of sedimentary layers at convergent margins","**Young (Alpine, Tertiary)**: Himalaya, **Alps**, **Andes**, Rockies, Atlas, Kunlun · **Old**: **Appalachians**, Urals, Great Dividing Range, **Aravalli** (India’s oldest) [CSE 2024; UPPCS M 2014; UP UDA 2013]"],
["**Block**","Faulting — horsts uplifted beside rift valleys","**Vosges** and **Black Forest** (Europe), Sierra Nevada (USA), **Satpura** [CSE 2024; UP UDA 2013]"],
["**Volcanic**","Built up by erupted material","**Fuji**, Kilimanjaro, Cotopaxi, Mauna Loa [UP UDA 2013]"],
["**Residual (relict)**","Worn-down remnants of old ranges","**Vindhya**, **Aravalli**, Eastern Ghats, Nilgiri [UP UDA 2013; UPPCS M 2005]"]]},
{h:"Mountain-building facts",t:2,list:[
"The world’s **highest peaks** stand in **young fold mountains** [BPSC 2001]",
"Appalachians are **old fold mountains**, !!not a product of the Tertiary (Alpine) orogeny!! [UPPCS M 2014; CSE 2024]",
"Alps are **fold** mountains, !!not block!!; the Vosges are block mountains in **Europe**, !!not Central Asia!! [CSE 2024]",
"Orogenies by age :: **Precambrian** (Aravalli, Laurentian shield) → **Caledonian** (~400 million years ago; Scottish and Scandinavian highlands, early Appalachians) → **Hercynian** (~300; Urals, Black Forest, Vosges, Tien Shan, Altai) → **Alpine** (last ~65; Himalaya, Alps, Andes, Rockies, Atlas)"]}
]});

/* ===== 04 WEATHERING, MASS MOVEMENT & LANDFORMS ===== */
SEC({id:"landforms",title:"Weathering, Mass Movement & Landforms",group:"Earth & Landforms",tier:2,
stats:["UPSC CSE: weathering by rain (2024) and chalk vs clay (2025) as Statement I–II–III; rocky-coast features (2008); drainage and landform ideas also sit inside river questions","UPPCS Pre: few direct Q since 2018; older UPPSC papers — blind valley, peneplain, Death Valley; CDS/CAPF ask a landform ↔ agent item in almost every paper","Formats: landform ↔ agent matching, upstream-to-downstream order, three-statement explanations"],
note:"Exogenic processes wear the land down and build it back up: weathering first, then mass movement, then each agent — rivers, underground water, waves, wind and ice — with its own erosional and depositional landforms.",
blocks:[
{h:"Weathering",t:1,cols:["Type","Process","Where it dominates"],rows:[
["**Physical (mechanical)**","Rock breaks **without chemical change**: frost wedging (freeze–thaw), salt-crystal growth, **exfoliation** (onion-skin peeling from daily heating and cooling), pressure release on unloading, block and granular disintegration; plant-root wedging is counted here [CDS 2015 II]","**Hot deserts** (large daily range) and cold high mountains"],
["**Chemical**","Rock decomposes **with chemical change**: solution; **carbonation** (CO₂ in rain → carbonic acid dissolves limestone); **oxidation** (iron rusts red); **hydration** (minerals take up water and **swell**, adding stress); hydrolysis [CDS 2022 II; CDS 2015 II]","**Hot, humid** climates"],
["**Biological**","Roots and burrowing animals open cracks; decaying matter releases acids","Wherever life is abundant"]]},
{h:"Weathering facts",t:1,list:[
"Rain weathers rock because rainwater carries **dissolved CO₂** (carbonation) **and dissolved oxygen** (oxidation) — ==both are true and both explain it== [CSE 2024]",
"Weathering is **in situ** — no transport; it is the **first step in soil formation**",
"Controls on weathering :: **rock type and joints**, **climate** (temperature range and water), **slope and aspect**, **vegetation**"]},
{h:"Erosion and river loads",t:2,list:[
"Erosion processes :: **abrasion (corrasion)** — grinding by the load · **attrition** — the load grinds itself smaller · **corrosion (solution)** · **hydraulic action** · **cavitation** · **deflation** — wind lifts dust · **plucking** — ice tears out blocks",
"River loads, heaviest first :: **traction** (boulders rolled along the bed) → **saltation** (sand and pebbles bouncing) → **suspension** (silt and clay) → **solution** (dissolved) [CAPF 2021]",
"**Aggradation** = building up by deposition · **degradation (denudation)** = weathering + mass movement + erosion lowering the land",
"Landforms differ because of the **rock material and structure**, the **process** at work, and the **rate** of that process from place to place [CAPF 2015]",
"Geomorphic factors that shape plant and animal distribution :: **slope angle, slope aspect and relative relief** [CDS 2020 I]"]},
{h:"Mass movement",t:2,list:[
"Mass movement :: downslope movement under **gravity alone**, with no agent carrying the material",
"Slow :: **soil creep**; **solifluction** — waterlogged soil flowing over frozen ground, typical of **permafrost** regions [CAPF 2022]",
"Rapid :: earth flow, **mudflow**, debris avalanche; **slump** (slides with a **backward rotation**), debris slide, **rock slide**, **rock fall** (free fall from a steep face)",
"Why the Himalaya slides :: steep slopes, active tectonics, weak sedimentary and loose rock; the **Western Ghats and Nilgiris** slide too — steep scarps and heavy rain in short spells"]},
{h:"Rivers: stages and landforms",t:1,cols:["Stage","Channel","Landforms"],rows:[
["**Youth**","Steep gradient; **vertical** erosion; V-shaped valleys","**Gorges, canyons**, rapids, **waterfalls**, plunge pools, **potholes**"],
["**Maturity**","Lateral erosion widens the valley; waterfalls disappear","**Meanders** with river cliffs and **point bars** (slip-off slopes), flood plains; **incised meanders** where uplift makes the river cut down again (rejuvenation) [CDS 2018 I]"],
["**Old age**","Very gentle gradient; heavy deposition","**Ox-bow lakes**, **natural levees**, **braided channels**, **deltas** and estuaries; the land ends as a **peneplain** with residual **monadnocks** [MPPCS 2017]"]]},

{h:"More fluvial facts",t:2,list:[
"Upstream → downstream :: **falls → meanders → ox-bow lake → delta** [CDS 2014 II]",
"**Alluvial fan** :: a gently sloping cone of **coarse alluvium** laid by a braided stream where it leaves the hills [CAPF 2019]",
"Gorge, canyon and braids are river-made; a **cirque is glacial**, !!not fluvial!! [CDS 2020 II]",
"**Point bars** are laid down by rivers on the inside of meanders [CAPF 2019]",
"Strong **tides (ebb and flow)** hinder delta building by sweeping sediment away [MPPCS 1993]",
"River capture (piracy) leaves a dry notch, the **wind gap** — ==a wind gap is made by rivers, not by wind== [CDS 2016 II]",
"Stream types :: **consequent** — follows the original slope · **subsequent** — follows weak rock structure · **resequent** — same direction as the consequent, at a lower level · **insequent** — no evident control · **obsequent** — flows against the original slope [CDS 2022 II]"]},
{h:"Drainage patterns",t:1,cols:["Pattern","Shape","Where / example"],rows:[
["**Dendritic**","Tree-like branching","Uniform rock with no structural control — rivers of the northern plains"],
["**Trellis**","Main stream in a valley; tributaries meet it at **right angles** and run parallel to one another","Folded ridge-and-valley country — the old folds of **Singhbhum** (Chota Nagpur), the Appalachians"],
["**Rectangular**","Right-angled bends that follow **joints and faults**","Jointed hard rock of the plateau"],
["**Radial**","Streams flow **outward** from a central high point","Volcanic cones; **Amarkantak** (Narmada, Son, Johila); Girnar"],
["**Centripetal**","Streams flow **inward** into a lake or basin","**Loktak** lake (Manipur); the **Sambhar** basin (Rajasthan) [CDS 2021 I]"],
["**Parallel**","Streams run side by side down a uniform slope","West-flowing rivers of the Western Ghats"]]},

{h:"Karst (limestone) landforms",t:1,list:[
"Karst needs :: thick, **jointed limestone or dolomite** near the surface, moderate-to-heavy rain, and good underground drainage",
"Sinkholes (dolines) :: the **commonest karst form**, from under a metre to a few hundred metres deep; water enters through **swallow holes** [CDS 2018 I; JPSC 2016]",
"Karst landforms by size :: sinkholes merge into an **uvala**; the largest is the flat-floored **polje** [CAPF 2020]",
"**Blind valleys** end where a stream vanishes underground; **lapies** are grooved, fluted limestone surfaces [UP UDA 2013]",
"Cave deposits :: **stalactites** hang from the roof, **stalagmites** rise from the floor, and join as **pillars** — features of **karst** (underground-water) topography [CDS 2016 I; CDS 2015 II]",
"Karst regions :: the **Karst** plateau (Slovenia, former Yugoslavia), Yucatán (Mexico), Guilin (China), Kentucky; in India — **Meghalaya** caves, Kutumsar (Chhattisgarh), Borra and Belum (Andhra Pradesh); a “karst plain” means limestone country [CAPF 2015]",
"Springs are common with **well-jointed rocks, karst and tilted strata** — !!not in arid areas!! [CAPF 2018]"]},
{h:"Coastal landforms",t:1,list:[
"High rocky coasts (erosional) :: **cliffs**, **wave-cut platforms (terraces)**, sea caves, **arches**, **stacks** and stumps, blowholes — and, from the eroded material, **barrier bars and lagoons** can form off them too [CSE 2008]",
"Caves, arches, stacks and stumps are carved by :: **waves** [CAPF 2021]",
"Low sedimentary coasts (depositional) :: **beaches**, **bars** (submerged ridges parallel to the shore) → **barrier bars**, **spits**, **lagoons**, **tombolos**",
"**Spit** :: a narrow ridge of sand or shingle **attached to the mainland at one end** [CAPF 2020]",
"**Tombolo** :: a bar that **joins an island to the mainland** — a sea-deposited form [CAPF 2019]"]},
{h:"Wind (aeolian) landforms",t:1,list:[
"Wind erodes by **deflation**, **abrasion** and **attrition**",
"Erosional :: **deflation hollows**, **mushroom (pedestal) rocks**, **zeugen**, **yardangs**, **ventifacts / dreikanter** (wind-faceted pebbles), **demoiselles**, **inselbergs** (isolated residual hills) [CDS 2023 II; CDS 2016 II; MPPCS 2017]",
"**Zeugen** :: tabular ridges where **hard rock caps soft rock in horizontal layers**",
"**Yardangs** :: ridges carved along the wind where hard and soft bands stand **vertical**",
"**Barchan** :: a crescent dune whose **horns point downwind**; the windward side is **gentle and convex**, the leeward slip face steep — common in the **Thar** [CAPF 2023]",
"Other dunes :: **seif** (longitudinal, along the wind) · **transverse** (across it) · **parabolic** (horns pointing upwind)",
"**Loess** :: fine wind-blown silt laid far from its source — China’s Loess Plateau [CAPF 2019]",
"**Bajada** (also called a peripediment) :: merged **alluvial fans** at the foot of desert mountains, below the rock **pediment** [CDS 2022 I]",
"**Playa** :: a flat **salt-lake bed** in a desert basin (**bolson**)"]},
{h:"Glacial landforms",t:1,list:[
"Ice erodes by **plucking** and **abrasion**",
"Erosional :: **cirque** (armchair hollow at the glacier head, often holding a tarn) → two back-to-back cirques leave an **arête**, several a pyramidal **horn**, and a saddle between cirques a **col**; **nivation hollows** start the process; **U-shaped valleys**, **hanging valleys**, **fjords** (drowned glacial valleys)",
"Glacial troughs may show remarkably **flat floor sections** — but those flat floors come mainly from **deposits** laid as the ice retreats, !!not from uniform erosion!! [CDS 2018 I]",
"**Moraines** :: unsorted glacial debris — lateral, medial, terminal and ground; a glacier-deposited form [CAPF 2019]",
"**Till** is the unsorted glacial deposit; **tillite** is ancient till turned to rock [CDS 2015 II]",
"**Drumlin** :: a streamlined hill of till moulded under moving ice, shaped like an inverted spoon [CAPF 2023]",
"**Esker** :: a winding ridge of gravel laid by meltwater under the ice; **outwash plains** spread in front of it"]}
]});

/* ===== 05 ATMOSPHERE, HEAT BUDGET & TEMPERATURE ===== */
SEC({id:"atmosphere",title:"Atmosphere, Heat Budget & Temperature",group:"Climate & Oceans",tier:1,
stats:["UPSC CSE: 15 Q (2010–25) in 8 of 17 papers — 10 of them in 2022–25 (troposphere thickness, heating by terrestrial radiation, water vapour and infrared, high vs low clouds, January isotherms, dust, the greenhouse set of 2025)","UPPCS Pre: 1 Q since 2018 (albedo, 2019); older UPPSC papers asked gases, layers, ozone, the ionosphere and how the air is heated about 15 times (1991–2017)","Formats: Statement I–II with an explanation link (2023–25), three-statement causal sets, layer ↔ feature matching, highest-albedo picks (CDS/CAPF)"],
note:"How the air is built and how it is heated: gases and layers, why the atmosphere is warmed from below, the heat budget and albedo, and how temperature spreads across latitude, land and sea, and height. Pressure and winds follow in the next sheet; greenhouse policy and the ozone treaties belong to Environment.",
blocks:[
{h:"Composition",t:1,list:[
"Atmosphere :: the envelope of gases held to the Earth by **gravity**; it is densest at sea level and **thins rapidly with height**",
"Dry air by volume :: **nitrogen 78%** > **oxygen 21%** > **argon 0.93%** > **carbon dioxide ~0.04%** (about 420 ppm and rising), then neon, helium, methane, krypton, xenon and hydrogen [UPPCS 1993]",
"Permanent gases (a steady share) :: **nitrogen, oxygen and argon**; water vapour, CO₂ and ozone vary [UPPCS M 2017]",
"Water vapour :: up to **4%** of the air in the wet tropics, under 1% over deserts and polar regions; it **falls with height** and **from the equator to the poles**, and almost all of it lies in the **troposphere**",
"Water vapour absorbs little insolation but much of the **outgoing infrared (terrestrial) radiation** — the lower air’s blanket and the largest natural greenhouse gas [CSE 2023]",
"Water vapour also drives all weather: it condenses into cloud and rain and releases **latent heat** that powers storms",
"Dust sources :: sea salt, fine soil, smoke and soot, volcanic ash, pollen and meteor dust; it stays mostly in the **lower layers**, lifted by convection",
"More dust over the **subtropical and temperate** belts than over the equatorial and polar ones, because their winds are **drier** — !!not “less dry”!! [CSE 2025]",
"Dust and salt particles act as **hygroscopic nuclei**: water vapour condenses on them to form cloud droplets",
"Homosphere (to ~80 km) :: gases **evenly mixed**, in molecular form (O₂, N₂), with most of the water vapour and dust",
"Heterosphere (above ~80 km) :: gases sorted into **layers by weight** — molecular nitrogen lowest, then atomic oxygen, helium and hydrogen"]},
