{h:"Iron ore",t:1,list:[
"Ores by iron content :: **magnetite** (up to ~72%, the richest) > **haematite** (60–70%) > **limonite** (35–50%) > **siderite** (low grade, self-fluxing)",
"**Haematite** is the largest resource and nearly all the output — mostly in Odisha, Jharkhand and Chhattisgarh; **magnetite** lies mostly in **Karnataka** and is little mined [CGPCS 2017]",
"Leading producers :: **Odisha** (over half) > **Karnataka** > **Chhattisgarh** > Jharkhand (2024–25); in 2019–20 the top two were **Odisha and Chhattisgarh** [UPPCS 2022]",
"Richest resources (haematite + magnetite) were keyed in **Karnataka** and the largest producer is **Odisha** — but India is the **third or fourth** producer, !!not second!! [UP UDA 2010]",
"**Rajasthan** has iron-ore mines too — both haematite and magnetite occur there [CSE 2018]",
"India is fully **self-sufficient** in iron ore and exports low-grade fines"]},
{h:"Iron-ore belts",t:1,cols:["Belt","Mines","Feeds and exam hooks"],rows:[
["**Odisha–Jharkhand**","**Gorumahisani**, **Badampahar**, Sulaipat (Mayurbhanj); Joda–Barbil (**Keonjhar**); Bonai (Sundargarh); **Noamundi**, Gua, Kiriburu–Meghahatuburu (West Singhbhum)","Jamshedpur, Rourkela, Bokaro, Durgapur; exports via Paradip and Haldia"],
["**Durg–Bastar–Chandrapur**","**Dalli–Rajhara** (Balod), **Bailadila** (Dantewada), Rowghat","Dalli–Rajhara feeds **Bhilai**; Bailadila is India’s largest **mechanised** mine, sending ore to Japan through **Visakhapatnam** [UPPCS 2015]"],
["**Ballari–Chitradurga–Chikkamagaluru**","**Ballari–Hospet** (Sandur), Chitradurga, **Kudremukh**, **Kemmangundi** and the Baba Budan hills","Kudremukh (magnetite) closed in 2005 for its national park — its ore went as slurry to Mangaluru; Kemmangundi fed **Bhadravati**"],
["**Goa–Maharashtra**","North Goa, Redi (Sindhudurg), Ratnagiri","Low-grade ore shipped from **Mormugao**"]]},
{h:"Manganese and alloy metals",t:1,list:[
"Manganese :: essential for **steel** — about 6–10 kg per tonne of steel",
"Manganese producers :: **Maharashtra** (Nagpur–Bhandara) > **MP** (Balaghat–Chhindwara) > Odisha (2023–24) [UPPCS 2012; UPPCS M 2008]",
"Largest manganese **reserves** :: **Odisha**, then Karnataka — and Odisha mines almost all the **chromite** [UP BEO 2019]",
"**Balaghat** (MP) has Asia’s deepest underground **manganese** mine — !!not diamonds!!; **Majhgawan** (Panna) is India’s only mechanised **diamond** mine — !!not manganese!! [CSE 2007]",
"Manganese areas :: Nagpur–Bhandara · Balaghat · Keonjhar–Sundargarh · Sandur–Ballari, **Shivamogga, Chitradurga** (Karnataka) — **Srikakulam** is in Andhra, !!not Karnataka!! [UP RO 2023]",
"**Chromite** :: Odisha’s **Sukinda** valley (Jajpur) gives almost all of it [UPPCS Spl M 2008]",
"**Nickel** :: Sukinda, Odisha, holds about three-quarters of the resources",
"Ore ↔ State :: manganese — **MP** · nickel — **Odisha** · lead–zinc — **Rajasthan** · asbestos — **Andhra** [CSE 1996; UPPCS 1998]",
"**Tin** (cassiterite) :: **Chhattisgarh** (Dantewada) is the only producer; Haryana (Tosham) also has reserves [UPPCS 2015; UPPCS M 2009]",
"Tin is found mostly in :: **placer** deposits [BPSC 1994]",
"**Tungsten** :: Degana (Nagaur), Rajasthan"]},
{h:"Bauxite, copper, lead–zinc and gold",t:1,cols:["Metal","Leading States","Mines and exam hooks"],rows:[
["**Bauxite** — the ore of **aluminium** [UPPCS 1997]","**Odisha** (about three-quarters of output and the largest reserves) > **Gujarat** > Jharkhand (2024–25) [UP RO M 2021]","Laterite caps on plateaus — **Panchpatmali** (Koraput), **Kalahandi**, **Lanjigarh** (Odisha) · Lohardaga (Jharkhand) · **Amarkantak**–Maikal and **Katni** (MP) · Kutch–Jamnagar (Gujarat)"],
["**Copper**","Largest reserves — **Rajasthan**; most ore — **MP** (Malanjkhand) [UPPCS M 2011; BPSC 2020]","**Malanjkhand** (Balaghat) — the largest single deposit · **Khetri–Singhana** (Jhunjhunu) · Singhbhum belt — **Mosabani**, **Rakha**, Ghatsila"],
["**Lead–zinc**","**Rajasthan** — near-monopoly [UPPCS M 2013]","**Rampura Agucha** (Bhilwara) — among the world’s largest zinc mines · **Zawar** (Udaipur) — worked for over 2,000 years · Rajpura–Dariba · Sindesar Khurd"],
["**Silver**","**Rajasthan** — almost all, as a by-product of zinc–lead, !!not Karnataka!! [UP BEO 2019]","Zawar and Sindesar Khurd"],
["**Gold**","**Karnataka** — almost all primary gold; **Bihar** has the largest ore resources (Jamui) [BPSC 2024]","**Hutti** (Raichur) · **Kolar** Gold Fields (closed 2001) · Kundarkocha (Jharkhand) · placers of the **Subarnarekha**"],
["**Diamond**","**Madhya Pradesh**","**Majhgawan**, Panna — NMDC’s mine; the old Golconda stones came from the Krishna valley [UPPCS M 2014]"]]},
{h:"Mica",t:1,list:[
"Mica :: a flaky insulator for electrical and electronic goods; India long led the world in **sheet mica** [UP UDA 2001]",
"Largest mica belt :: **Koderma–Hazaribagh–Gaya–Munger** (Jharkhand–Bihar) — high-grade **ruby mica**; Koderma is the ‘mica capital’ [UP Lower 2009; UKPCS 2021; UPPCS 2008, 2001; UPPCS M 2005]",
"Other belts :: **Nellore** (Andhra) and **Bhilwara–Ajmer–Udaipur** (Rajasthan)",
"A map with dots over Jharkhand–Bihar, Nellore and the Aravalli shows :: **mica** [CSE 2001]",
"Leading producer keyed as **Rajasthan** — the only producer in 2021–22 [UPPCS Spl M 2004; UPPCS 2001]",
"Other keys named **Andhra Pradesh**, the leader of earlier years [UPPCS Spl M 2008; MPPCS 1990]",
"Of Jharkhand, Rajasthan, Andhra and MP, **Madhya Pradesh** produced no mica [UP GIC 2010; UPPCS M 2003]",
"Mica ↔ **India**, silver ↔ Mexico, iron ore ↔ Russia, copper ↔ Chile [UPPCS M 2017]"]},
{h:"Atomic and beach-sand minerals",t:1,list:[
"**Monazite** :: a beach-sand mineral that is a source of **rare earths** and contains **thorium** — true; it is !!not found along the entire coast!!, and only government bodies (IREL) may produce, process or export it [CSE 2022]",
"India has one of the world’s largest **thorium** resources, so ‘India has no thorium’ is !!false!!; Kerala’s monazite does contain a little **uranium** [CSE 2009]",
"India is self-sufficient in :: **thorium** — !!not uranium!! [UPPCS M 2005; UPPCS 2003; UP Lower 2002]",
"Monazite coasts :: **Kerala** (Chavara), Manavalakurichi (TN), Chhatrapur (Odisha), and the Andhra and Bengal coasts [UP UDA 2013; UPPCS M 2002]",
"**Ilmenite** and **rutile** :: ores of **titanium**, rich in the beach sands of Kerala, Tamil Nadu and Odisha [CSE 2023]",
"Kerala’s beach sands hold **ilmenite, zircon, sillimanite**, rutile and monazite — !!not tungsten!! [CSE 2006]",
"Uranium mines :: **Jaduguda** (the first, 1967), Narwapahar, Turamdih, Bagjata (East Singhbhum, Jharkhand) and **Tummalapalle** (Kadapa, Andhra) [UPPCS 2012, 2007; UP RO 2016]",
"Uranium sites :: **Domiasiat** — Meghalaya · **Lambapur** — Telangana (then Andhra) · **Rohil** — Rajasthan · **Gogi** — Karnataka [UPPCS Spl M 2008]",
"Radium is extracted from :: **pitchblende** (uraninite) [BPSC 1994]"]},
{h:"Critical minerals and rare earths",t:1,list:[
"Critical minerals :: minerals vital to the economy and defence whose supply is at risk — India listed **30** in June 2023, from lithium, cobalt and nickel to graphite and the rare earths",
"India joined the US-led **Minerals Security Partnership** (June 2023) — true; it is !!not resource-rich in all 30!! critical minerals [CSE 2025]",
"The **MMDR Amendment Act, 2023** lets only the **Centre** auction leases and composite licences for **24** critical minerals (Part D of the First Schedule) — true [CSE 2025]",
"The same 2023 amendment removed six minerals, **lithium** among them, from the atomic-minerals list so that private firms can mine them",
"Lithium was found at **Salal–Haimana, Reasi** (J&K) — 5.9 million t inferred (2023) — and India imports its **lithium, nickel and cobalt**; both true [UPPCS 2023]",
"**National Critical Mineral Mission** (2025) :: self-reliance from exploration to recycling, with 1,200 exploration projects by 2030–31 — true [CSE 2026]",
"**KABIL** (Khanij Bidesh India Ltd) :: a NALCO–HCL–MECL venture that buys critical-mineral assets abroad — lithium blocks in **Argentina** (2024)",
"**Rare earth elements** :: **17** — the 15 lanthanides plus **scandium** and **yttrium** — !!not 13!!; used in AI hardware, robotics, space and EV magnets [CSE 2026]",
"**China** leads rare-earth mining by far; India holds sizeable reserves in monazite but mines little, so it is !!not second!! [CSE 2026]",
"Some rare earths (europium, terbium) are **phosphorescent**, which is why they coat flat TV screens and monitors — the reason explains the use [CSE 2025]"]},
{h:"Non-metallic minerals",t:2,list:[
"**Limestone** :: the raw material of **cement** and a flux in steel; largest resources in **Karnataka**, then Andhra and Rajasthan",
"**Rajasthan** is famed for :: **limestone, gypsum, salt and zinc** [UP RO 2023]",
"**Gypsum** :: Rajasthan (Bikaner, Nagaur, Barmer) mines nearly all of it",
"**Marble** :: metamorphosed limestone; the finest is from **Makrana** (Rajasthan) — the Taj Mahal and the Victoria Memorial [UPPCS 1992, 1991]",
"**Salt** :: **Gujarat** makes over three-quarters of India’s salt — its long hot, dry season speeds evaporation; Tamil Nadu and Rajasthan follow [CAPF 2015; CDS 2015 I]",
"A State famed for its rocks and minerals, with the largest **chrysotile asbestos** deposits and the **Neelam Sanjiva Reddy Sagar** hydel project :: **Andhra Pradesh** [CDS 2022 II]",
"**Asbestos** mining has nearly stopped — the fibre causes cancer",
"**Pyrite** :: Amjhore (Rohtas, Bihar)",
"**Garnet** :: a mineral of metamorphic rocks [UP Lower 2010]",
"Refractory minerals :: **kyanite** (Jharkhand, Maharashtra) and **sillimanite** (Meghalaya’s Sonapahar, Odisha, Kerala sands)",
"**Graphite** :: Odisha, Jharkhand (Palamu) and Tamil Nadu"]},
{h:"Mines in questions",t:1,list:[
"Iron mine ↔ State :: Gorumahisani — **Odisha** · Bailadila — **Chhattisgarh** · Noamundi — **Jharkhand** · Kudremukh — **Karnataka** [UPPCS 2025]",
"Iron zone ↔ State :: Badampahar — **Odisha** · Dalli–Rajhara — **Chhattisgarh** · Kudremukh — **Karnataka** · Noamundi — **Jharkhand** [UP UDA M 2010]",
"Copper field ↔ State :: Chandrapur — **Maharashtra** · Hassan — **Karnataka** · Khammam — **Telangana** (then Andhra) · Khetri — **Rajasthan** [UPPCS M 2011]",
"Mine ↔ mineral :: Gorumahisani — **iron** · Talcher — **coal** · Jaduguda — **uranium** · Zawar — **lead–zinc** [UPPCS 2012; UP RO 2016]",
"Mine ↔ mineral :: Makum — **coal** · Dalli–Rajhara — **iron** · Koraput — **bauxite** · Chitradurga — **manganese** [UPPCS 2016]",
"Mine ↔ mineral :: Badampahar — **iron** · Koderma — **mica** · Mosabani — **copper** · Rava — **petroleum** (Krishna–Godavari offshore) [UPPCS 2008]",
"Mine ↔ mineral :: Ankleshwar — **petroleum** · Dalli–Rajhara — **iron** · Koderma — **mica** · Khetri — **copper** [UPPCS 2001]",
"Mineral ↔ area :: iron — **Keonjhar** · copper — **Khetri** · coal — **Korba** · mica — **Koderma** [UPPCS M 2005]",
"Mineral ↔ mine :: gold — **Kolar** · coal — **Jharia** · copper — **Khetri** · iron — **Kudremukh** [UPPCS 2008]",
"Mineral ↔ mine :: coal — **Talcher** · copper — **Khetri** · iron — **Kudremukh** · silver — **Zawar** [UPPCS 1998]",
"Mine ↔ mineral :: Kalahandi — **bauxite** · Zawar — **zinc–lead** · Kolar — **gold** · Mosabani — **copper** [MPPCS 2019]",
"Mine ↔ mineral :: Amjhore — **pyrite** · Sukinda — **chromite** · Zawar — **zinc** · Hutti — **gold** [CAPF 2017]",
"Wrongly paired :: **copper — Chitradurga** and **manganese — Bhilwara**; Ballari (iron) and Katni (bauxite) were right [UPPCS 2020]",
"Wrongly paired :: **Kamptee** is coal (Nagpur), !!not copper!!; Amguri — petroleum, Lanjigarh — bauxite, Ballari — iron [UPPCS M 2009]",
"Wrongly paired :: **Nellore** is mica and copper, !!not manganese!!; Rakha — copper, Amarkantak — bauxite [UPPCS M 2002]",
"Wrongly paired :: **Koraput** is bauxite, !!not manganese!! [UP RO M 2013]",
"Wrongly paired :: **Guntur** has no iron ore; Kolar — gold, Jharia — coal, Panna — diamonds [UP RO M 2017]",
"Wrongly paired :: **Bailadila** is in **Chhattisgarh**, !!not MP!!; Kemmangundi — Karnataka, Singhbhum — Jharkhand, Mayurbhanj — Odisha [UPPCS M 2004]",
"Top State, as keyed then :: iron ore — **Odisha** · copper — **Rajasthan** · gold — **Karnataka** · mica — **Andhra** [UPPCS Spl M 2008]",
"Mineral ↔ State :: mineral oil — **Gujarat** · gypsum — **Rajasthan** · gold — **Karnataka** · bauxite — **Odisha** [UP Lower 2010; UP UDA 2006]",
"**Chhattisgarh** has **bauxite, dolomite, iron ore and tin** — all four [CSE 2008]",
"Mineral ↔ main use :: limestone — **cement** · copper — **electrical goods** · bauxite — **aircraft** · manganese — **steel** [UP RO 2021]",
"Non-ferrous metals :: **nickel, zinc, copper, aluminium** — iron and steel are ferrous [RAS 2013]"]},
{h:"Mining law",t:1,list:[
"**MMDR Act, 1957** :: the Centre’s law for mines and minerals; **major** minerals are those not notified as **minor** (sand, gravel, marble, granite, slate, bentonite, clays)",
"Major minerals :: **chromite, kyanite and sillimanite** — !!bentonite is minor!! [CSE 2020]",
"**Sand** is a minor mineral, and **States** make the rules for minor minerals, !!not the Centre!!; States also frame rules against illegal mining [CSE 2019]",
"Since the 2015 amendment, **States auction** non-coal mines — so ‘States cannot auction non-coal mines’ is !!false!!; Andhra and Jharkhand !!do have!! gold mines [CSE 2018]",
"**District Mineral Foundations** (2015) :: funds from miners in each mining district, spent on the **people and areas hurt by mining** — !!not!! exploration or licensing [CSE 2016]",
"In **July 2024** the Supreme Court held that **royalty is not a tax** and that States may tax mineral rights and mineral-bearing land",
"Coal blocks are auctioned by the **Centre**; the 2023 amendment added Centre-run auctions for critical minerals and exploration licences for deep-seated minerals"]},
{h:"Resources of the sea",t:2,list:[
"Dissolved in sea water :: common salt, **bromine**, **magnesium** and calcium — continually replenished",
"On the continental shelf :: **placer gold** (Subarnarekha delta, Gulf of Mexico, Yukon), shells for cement, sand and gravel, **magnetite** and **phosphorite**",
"**Polymetallic nodules** :: potato-sized lumps of manganese, nickel, cobalt and copper on the deep ocean floor — the **Clarion–Clipperton** zone of the Pacific, off Peru, and the **Central Indian Ocean Basin**, where India holds an exploration area",
"**Polymetallic sulphides** :: copper, zinc and lead deposits around **hydrothermal vents** on mid-ocean ridges",
"**Deep Ocean Mission** (2021) :: India’s programme to explore and mine the deep sea bed, with the crewed submersible **Matsya 6000** (Samudrayaan)",
"The **Offshore Areas Mineral Act** (amended 2023) opened sea-bed blocks — construction sand, lime mud, nodules — to Centre-run auctions (first round 2024)",
"Energy from the sea :: offshore **oil and gas** (Mumbai High, the Gulf of Mexico, the North Sea), offshore wind, tidal, wave and ocean-thermal power, and **deuterium** for future fusion",
"Food from the sea :: fish, crabs, prawns and **seaweed**; fresh water can be won from sea water by **reverse osmosis** or electrodialysis"]}

stats:["UPSC CSE: 11 Q (2010–23) in 8 of 17 papers — Gondwana coal and coalfields (2010 ×2), coal imports (2012), Indian coal’s quality (2013), coalbed methane (2014), shale-gas basins (2016), coal policy and gas hydrates (2019 ×2), solar firsts (2022), uranium enrichment and thermal plants (2023 ×2)","UPPCS Pre: 8 Q since 2018 — coalfields (2019, 2024, 2025), the solar alliance’s seat (2019), NTPC Singrauli (2021), tidal power (2022), Shivanasamudra and Kalpakkam (2023), refineries (2025); UP RO and BEO papers since 2016 added coal history, plant ↔ State, lignite and hot springs; older UPPSC papers asked coalfields, refineries and nuclear plants about 80 times","Formats: coalfield ↔ valley or State, refinery ↔ State, power station ↔ type or State, Assertion–Reason on coal and nuclear fuel, statement sets on renewables and unconventional gas"],
note:"Fuels and power: kinds of coal and where the coalfields lie, oil and gas fields, refineries and pipelines, then the power mix — thermal, hydro, nuclear, solar, wind, geothermal and tidal. Dams and their rivers are in the water-projects sheet; climate policy is in Environment.",
blocks:[
{h:"Kinds of coal",t:1,list:[
"Coal ranks by carbon :: **anthracite** (the best, a little in J&K) > **bituminous** (most Indian coal; **coking** coal for steel) > **lignite** (brown coal) > **peat**",
"**Lignite** is an inferior, moist coal — the key accepted ‘35–40% carbon’ — and Jharkhand is !!not!! its largest producer; it has no lignite at all [UP UDA 2002]",
"Largest lignite field :: **Neyveli**, Tamil Nadu — which holds about four-fifths of India’s lignite [UP BEO 2019; UP UDA 2013]",
"Lignite States :: Tamil Nadu, **Gujarat** (Panandhro, Kutch), **Rajasthan** (Palana, Barsingsar near Bikaner), Kerala and J&K — !!not Jharkhand!! [UP RO M 2017]",
"**Gondwana** coal (about 250 million years old) :: about **99%** of reserves, in the Damodar, Son, Mahanadi and Godavari–Wardha troughs — why Gondwana rocks matter most [CSE 2010; UPPCS 2017, 2008; UP RO 2016; UP UDA 2006]",
"**Tertiary** coal (about 55 million years old) :: Assam, Arunachal, Meghalaya and J&K — low in ash but **high in sulphur**",
"Indian (Gondwana) coal :: **high ash** (30–45%) and **low sulphur**, with a **high** ash-fusion temperature — so ‘low ash-fusion temperature’ is !!false!! [CSE 2013]",
"India imports coal because power plants cannot get enough at home and steel needs **coking coal** — !!not!! to save its own reserves [CSE 2012]",
"Most coal is burnt for :: **power** — then steel and cement [UPPCS M 2008]"]},

{h:"Coalfields in questions",t:1,list:[
"Valley ↔ coalfield :: Damodar — **Barakar** · Son — **Umaria** · Godavari — **Singareni** · Mahanadi — **Talcher** [CSE 2010; UP UDA 2010]",
"Coalfield ↔ valley :: Talcher — **Mahanadi** · Karanpura — **Damodar** · Singrauli — **Son** · Singareni — **Godavari** [UPPCS 2019]",
"Coal resource ↔ State :: Hutar — **Jharkhand** · Ib river — **Odisha** · Tatapani–Ramkola — **Chhattisgarh** · Umaria — **MP** [UPPCS 2024]",
"**Maolong** is in **Meghalaya**, !!not Arunachal!!; Raniganj — West Bengal, Ramgarh — Jharkhand, Talcher — Odisha [UPPCS 2025]",
"**Singareni** is in **Telangana**, !!not MP!!; Talcher — Odisha, Korba — Chhattisgarh, Wardha valley — Maharashtra [UP RO 2023]",
"Coalfield ↔ State :: Rajmahal — **Jharkhand** · Sohagpur — **MP** · Bisrampur — **Chhattisgarh** · Raniganj — **West Bengal** [UPPCS M 2017]",
"Coalfield ↔ State :: Makum — **Assam** · Namchik — **Arunachal** · Giridih — **Jharkhand** · Sohagpur — **MP** [UP BEO 2019]",
"**Namchik–Namphuk** coalfields :: Changlang, **Arunachal Pradesh** [UPPCS Spl 2008]",
"Coalfield ↔ State :: Jhilmili — **Chhattisgarh** · Karanpura — **Jharkhand** · Rampur–Himgir — **Odisha** · Sohagpur — **MP** [UP RO M 2016]",
"Coalfield ↔ State :: Rangit valley — **Sikkim** · Tandur — **Telangana** · Warora — **Maharashtra** · Lalmatia — **Jharkhand** [UP RO M 2016]",
"Coalfield ↔ State :: Karanpura — **Jharkhand** · Singareni — **Telangana** (then Andhra) · Neyveli — **Tamil Nadu** · Korba — **Chhattisgarh** [UP UDA M 2010]",
"**Talcher** coalfield :: Angul, **Odisha** [UP GIC 2010]",
"**Bisrampur** :: a coal area of Surajpur, Chhattisgarh [UPPCS 2008; UP Lower 2004]",
"**Jharia** :: Jharkhand’s coking-coal field, where seams have burnt underground since 1916 [UP RO M 2014; BPSC 2022]",
"Largest reserves in one coalfield :: **Raniganj**, ahead of Jharia, Singrauli and Korba [UPPCS 1999]",
"The most important Gondwana valley for coal :: **Damodar** [CGPCS 2017]",
"The Chota Nagpur industrial region grew from **coal** found in the Damodar valley, and the plateau yields about **three-fifths** of India’s coal [UPPCS Spl M 2004; UPPCS 1998]"]},
{h:"Coal: States, output and policy",t:1,list:[
"Coal resources (2022) :: **Odisha > Jharkhand > Chhattisgarh** > West Bengal > MP — older keys put **Jharkhand** first [UPPCS M 2014]",
"Over half the **proved** reserves lie in **Jharkhand and Odisha** — true; a total of ‘293.5 billion t’ is !!out of date!! (about 361 billion t of coal in 2022) [UP BEO 2019]",
"Coal output :: **Odisha** leads, then **Chhattisgarh**, with Jharkhand and MP next — older keys put Chhattisgarh and Odisha, or Jharkhand, on top [UP RO 2014; UP UDA 2010; UPPCS M 2009; UPPCS 2008]",
"India is the world’s **second** coal producer and consumer, after China, and has vast reserves in Jharkhand and Chhattisgarh — both true; output passed **1 billion t** in 2024–25 [UP RO 2023]",
"Coal history, in order :: **Raniganj** mining (1774) → **NCDC** (1956) → **nationalisation** (1971–73) → **Coal India** (1975) [UP RO 2023]",
"Coal was nationalised under **Indira Gandhi** — true; blocks are now **auctioned**, !!not allotted by lottery!!, and India still imports coal [CSE 2019]",
"In 2014 the Supreme Court cancelled 214 allotted coal blocks; the Coal Mines (Special Provisions) Act, 2015 brought **auctions**, and commercial mining opened to private firms in 2020",
"Railways carry **Bengal–Jharkhand** coal to the north-west — coal is the biggest item of inter-State rail freight; the reason explains it [UP UDA 2010]",
"**Singrauli** (MP–UP) :: the ‘energy capital of India’ — coal mines and super thermal stations side by side"]},
{h:"Petroleum",t:1,list:[
"Oil and gas collect in **Tertiary** sedimentary rocks — anticlines and fault traps in Assam, Gujarat, Rajasthan, the Mumbai offshore and the Krishna–Godavari and Cauvery basins",
"First oil well :: **Makum**, Upper Assam (1867); oil flowed at **Digboi** in 1889, and its refinery (1901) is the oldest still working [UP UDA 2013]",
"The oldest oil field :: **Digboi** (Assam) [BPSC 2015]",
"Crude today :: the **Mumbai offshore** gives the most, then **Rajasthan** (Barmer — Mangala, Bhagyam, Aishwariya), Gujarat and Assam; among the options, **Gujarat** was keyed [UP GIC 2010; UPPCS M 2004, 2003]",
"**Mumbai High** lies about **160 km** off Mumbai — !!not 60 km!!; Soviet–Indian surveys found it, oil was struck in 1974 and flowed from 1976 [UPPCS M 2014]",
"Gujarat fields :: **Ankleshwar**, Kalol, **Navagam**, Mehsana, Lunej, Kosamba — around the Gulf of Khambhat [UP Lower 2004; UP RO M 2013]",
"Assam fields :: Digboi, **Naharkatiya**, Moran, Lakwa, Rudrasagar and Amguri",
"Explorers :: **ONGC** and **Oil India** — IOC and HPCL refine and sell, !!not explore!! [UPPCS Spl M 2004]",
"India imports about **85–88%** of the crude oil it uses"]},
{h:"Natural gas and new hydrocarbons",t:1,list:[
"Most natural gas comes from :: the **Mumbai offshore** — Mumbai High and Bassein [UP UDA 2013; UPPCS 2012]",
"**KG-D6** (Krishna–Godavari basin, off Andhra) :: Reliance’s big **gas** find of 2002, producing since 2009 [UPPCS M 2011; UP Lower 2002]",
"**Shale gas** basins :: **Cambay, Krishna–Godavari and Cauvery** — all three — besides Assam–Arakan, the Damodar and the Gangetic plain [CSE 2016]",
"**Coalbed methane** is almost pure methane drawn from coal seams (Raniganj, Jharia, Bokaro, Sohagpur); shale gas is also mostly methane, !!not just propane and butane!!, and India does have shale basins — so neither statement held [CSE 2014]",
"**Gas hydrates** :: methane locked in ice under the sea floor (Krishna–Godavari, Mahanadi, Andaman) and in Arctic permafrost; warming could release it, and methane oxidises to CO₂ within a decade or two — all three true [CSE 2019]",
"**LNG terminals** :: Dahej (the first, 2004), Hazira, Mundra and Chhara (Gujarat), Dabhol, Kochi, Ennore and Dhamra — !!Kandla has none!! [UPPCS 2005]"]},
{h:"Refineries",t:1,cols:["Refinery","State","Note"],rows:[
["**Digboi**","Assam","The oldest working refinery (1901)"],
["**Guwahati** (Noonmati)","Assam","The first public-sector refinery (1962) [UPPCS M 2008]"],
["**Bongaigaon** · **Numaligarh**","Assam","Bongaigaon has a petrochemical unit; Numaligarh came from the Assam Accord (1985)"],
["**Barauni**","Bihar","Built with Soviet help (1964)"],
["**Haldia** · **Paradip**","West Bengal · Odisha","Paradip (2016) is IOC’s newest"],
["**Visakhapatnam** · **Tatipaka**","Andhra Pradesh","Tatipaka is ONGC’s mini-refinery in the Godavari delta [UPPCS 2016]"],
["**Chennai** (Manali) · **Nagapattinam**","Tamil Nadu","Nagapattinam is the Cauvery Basin refinery"],
["**Kochi** · **Mangaluru**","Kerala · Karnataka","Mangaluru is MRPL"],
["**Mumbai** (two) · **Koyali**","Maharashtra · Gujarat","Koyali is the Gujarat refinery near Vadodara [UP RO M 2016]"],
["**Jamnagar** · **Vadinar**","Gujarat","Jamnagar (Reliance) is the world’s largest refining complex; Vadinar is Nayara’s [UP RO 2016]"],
["**Mathura** · **Panipat** · **Bathinda** · **Bina**","UP · Haryana · Punjab · MP","Inland refineries fed by crude pipelines from the Gujarat coast"],
["**Barmer** (Pachpadra)","Rajasthan","HPCL’s refinery near the Barmer oil fields, being completed"]]},
{h:"Refineries in questions",t:1,list:[
"Refinery ↔ State :: Nayara — **Gujarat** · Manali — **Tamil Nadu** · Numaligarh — **Assam** · Tatipaka — **Andhra** [UPPCS 2025]",
"Refinery ↔ State :: Haldia — **West Bengal** · Jamnagar — **Gujarat** · Kochi — **Kerala** · Numaligarh — **Assam** [UPPCS 2005]",
"**Panagudi** — Tamil Nadu is the only right pair; Haldia is !!not!! Odisha, Jamnagar !!not!! Maharashtra, Numaligarh !!not!! Gujarat [UPPCS 2006]",
"Refinery ↔ State :: Numaligarh — **Assam** · Tatipaka — **Andhra** · Koyali — **Gujarat** · Barauni — **Bihar** [UP UDA M 2010]",
"Refinery ↔ State :: Noonmati — **Assam** · Koyali — **Gujarat** · Mangalore — **Karnataka** · Panipat — **Haryana** [UP RI 2014]",
"Refinery ↔ State :: Tatipaka — **Andhra** · Koyali — **Gujarat** · Nagapattinam — **Tamil Nadu** · Numaligarh — **Assam** [UPPCS M 2013]",
"**Nagapattinam** is in **Tamil Nadu**, !!not Andhra!!; Koyali — Gujarat, Numaligarh — Assam, Manali — Tamil Nadu [UPPCS 2011]",
"Visakhapatnam refinery — **Andhra** is the right pair; Barauni is in Bihar, Koyna is a dam and Mathura is in UP [RAS 1992]",
"No refinery at :: **Hatia** (Ranchi) — Koyali, Noonmati and Barauni have one [UP UDA 2010]",
"Refineries west → east :: **Koyali, Kochi, Panipat, Mathura** [CDS 2014 I]",
"Strategic petroleum reserves :: rock caverns at **Visakhapatnam, Mangaluru and Padur** — !!not Ankleshwar!!; Chandikhol (Odisha) is next [UP Lower 2008]"]},
{h:"Pipelines",t:2,list:[
"**Hazira–Vijaipur–Jagdishpur (HVJ/HBJ)** :: GAIL’s gas trunk line (1987) carrying gas from Mumbai High’s **South Basin** to fertiliser and power plants in Gujarat, MP, Rajasthan and UP [UP RO 2014; UPPCS M 2006]",
"Pipelines, longest first :: **HVJ > Mundra–Bathinda > Jamnagar–Loni (LPG) > Salaya–Koyali–Mathura** [CGPCS 2020]",
"First crude pipeline :: **Naharkatiya–Guwahati–Barauni** (1960s), for Assam’s oil",
"**Pradhan Mantri Urja Ganga** :: the Jagdishpur–Haldia–Bokaro–Dhamra gas line for eastern India",
"Cross-border lines :: **Motihari–Amlekhganj** (to Nepal, 2019 — South Asia’s first cross-border oil pipeline) and the **India–Bangladesh Friendship** pipeline (Siliguri–Parbatipur, 2023)"]},
{h:"India’s power mix",t:1,list:[
"Commercial energy :: coal, oil, gas and electricity — **biogas**, firewood and dung are non-commercial [UP RO M 2013]",
"Coal is India’s largest energy source — about half of primary energy and about **three-quarters** of the electricity generated [UPPCS Spl 2008; UP Lower 2002]",
"**Thermal** power has the highest share of generation — !!not!! hydro or nuclear [UPPCS M 2011, 2006]",
"Installed capacity :: about **514 GW** (December 2025) — coal and lignite about 44%, then **solar** (~136 GW), wind (~55 GW), large hydro (~51 GW), gas, bio-power and nuclear (~8.8 GW)",
"**Non-fossil** sources passed **half** of installed capacity in June 2025, five years ahead of the 2030 pledge; the goal is **500 GW** of non-fossil capacity by 2030",
"By installed capacity :: **thermal > wind > hydro > nuclear** today; older keys put hydro and nuclear ahead of wind [UP UDA 2010; UP RO M 2014]",
"Shares in 2019, descending :: **hydro > natural gas > nuclear > diesel** [UP RO 2016]",
"Largest installed capacity, renewables included :: **Gujarat** — while **Uttar Pradesh**, then Chhattisgarh, generated the most from conventional plants in 2024–25 [UPPCS M 2006]",
"Thermal plant load factor :: about **69%** (2024–25) [UPPCS Spl M 2004]"]},
{h:"Thermal power stations",t:1,list:[
"How it works :: burning coal, oil or gas boils water into steam that spins a **turbine** — the second statement explains the first [CDS 2023 I]",
"NTPC’s oldest unit :: **Singrauli** (Shaktinagar, Sonbhadra, UP; 1982) — !!not in Chhattisgarh!!; Rihand is also in Sonbhadra, and **Vindhyachal** (MP) is India’s largest thermal station [UPPCS 2021]",
"Plant ↔ State :: Kahalgaon — **Bihar** · Khargone — **MP** · Korba — **Chhattisgarh** · Kudgi — **Karnataka** [UP RO 2023]",
"Plant ↔ State :: Ukai — **Gujarat** · Patratu — **Jharkhand** · Pench — **MP** · Dabhol — **Maharashtra** [UPPCS 2013; UP UDA 2010]",
"**Paras** is in **Maharashtra**, !!not Andhra!!; Badarpur — Delhi, Harduaganj — UP, Utran — Gujarat [UPPCS M 2006]",
"**Obra** (Sonbhadra) :: built with **Soviet** help, working from 1967 [UPPCS Spl M 2008]",
"**Ramagundam** super thermal station :: Telangana (then Andhra) [UP Lower 2004]",
"Gas-based stations :: **Uran** and Dabhol (Maharashtra), Kawas and Gandhar (Gujarat), **Auraiya** and Dadri (UP), Anta (Rajasthan) [UPPCS M 2010]",
"Coastal plants such as **Mundra** cool with **sea water**, many plants stand in **water-stressed** districts and many are **private** — so all three ‘none of them’ statements are !!false!! [CSE 2023]"]},
{h:"Power stations by type",t:1,list:[
"**Shivanasamudra** — hydel (on the Kaveri, 1902) · **Kalpakkam** — nuclear [UPPCS 2023]",
"Station ↔ type :: Chamera — **hydro** · Gwal Pahari — **solar** · Kudankulam — **atomic** · Patratu — **thermal** [UP BEO 2019]",
"**Korba** is thermal, !!not wind!!; Patratu — thermal, Jhakri — hydro, Kalpakkam — nuclear [UP RO M 2016]",
"**Idukki** is hydro, !!not thermal!!; Sabarigiri — hydro, Ghataprabha — irrigation, Ramganga — multipurpose [UPPCS 2017]",
"Hydroelectric station :: **Koyna** (Maharashtra) — Neyveli is lignite, Trombay atomic research [UPPCS 1992]",
"Large hydro :: about **51 GW** installed of a potential near 145 GW, most of it in the Himalaya; dams and their rivers are in the water-projects sheet",
"**Pumped storage** plants such as **Tehri** store spare daytime solar power by pumping water uphill"]},
{h:"Nuclear power",t:1,cols:["Station","State","Note"],rows:[
["**Tarapur**","Maharashtra","India’s first (1969), with US boiling-water reactors"],
["**Rawatbhata**","Rajasthan — near **Kota**, on the Chambal","1973, with Canada; a new 700 MW unit in 2025"],
["**Kalpakkam**","Tamil Nadu — Palar coast","1984; the **Prototype Fast Breeder Reactor** is being commissioned here"],
["**Narora**","Uttar Pradesh — on the Ganga (Bulandshahr)","1991"],
["**Kakrapar**","Gujarat — near the Tapi","1993; its unit 3 (2023) is the first Indian-designed **700 MW** reactor"],
["**Kaiga**","Karnataka — on the Kali","2000"],
["**Kudankulam**","Tamil Nadu — Tirunelveli coast","2013; Russian 1,000 MW reactors — the largest station"]]},

{h:"Nuclear power in questions",t:1,list:[
"Station ↔ State :: Kota (Rawatbhata) — **Rajasthan** · Tarapur — **Maharashtra** · Kakrapar — **Gujarat** · Narora — **UP** [UPPCS 1999]",
"State ↔ station :: Gujarat — **Kakrapar** · Karnataka — **Kaiga** · Rajasthan — **Rawatbhata** · UP — **Narora** [UP UDA 2002]",
"Commissioned :: Rawatbhata **1973** · Kalpakkam **1984** · Kakrapar **1993** · Kaiga **2000** — none of the listed years matched [UPPCS M 2007]",
"**Ennore** is in Tamil Nadu, !!not Meghalaya!!; Kaiga — Karnataka, Rawatbhata — Rajasthan, Muppandal (wind) — Tamil Nadu [UPPCS M 2015]",
"Planned plants :: **Jaitapur** — Maharashtra · **Mithi Virdi** — Gujarat, moved to **Kovvada** (Andhra) in 2017 · **Haripur** — West Bengal, !!not Haryana!! [UP GIC 2017]",
"**Mithi Virdi** was to be built with the :: **USA**, after the 2008 civil nuclear deal [UP RO 2014]",
"Other new sites :: **Gorakhpur** (Haryana), **Mahi Banswara** (Rajasthan) and Chutka (MP)",
"**Apsara** (Trombay, 1956) :: India’s first research reactor",
"**Three-stage programme** :: heavy-water reactors on natural uranium → **fast breeders** on plutonium → **thorium** reactors — India has little uranium but a great deal of thorium",
"**Nuclear energy** is promising for India’s future — true; nuclear minerals are !!not ubiquitous!! — uranium is scarce and partly imported [UP UDA 2006]",
"India makes most of its electricity from **coal** despite its uranium — true; power reactors need uranium enriched to only **3–5%**, !!not 60%!! [CSE 2023]",
"**Anushakti Vidyut Nigam** :: a venture of NPCIL (51%) and **NTPC** (49%) [UPPCS 2015]",
"Nuclear capacity :: about **8.8 GW** (December 2025), roughly 3% of electricity"]},
{h:"Solar and wind",t:1,list:[
"Solar leaders :: **Rajasthan**, then Gujarat — solar is now India’s largest renewable source",
"Largest solar park :: **Bhadla** (Jodhpur, Rajasthan; about 2.2 GW) — so ‘Gujarat has the largest solar park’ is !!false!!; Pavagada (Karnataka), Kurnool (Andhra) and Rewa (MP) follow [CSE 2022]",
"**Cochin** airport (Kerala) :: the world’s first fully **solar-powered** airport (2015) — true [CSE 2022]",
"Floating solar :: the largest projects are on the **Omkareshwar** reservoir (MP) and at NTPC’s Ramagundam (Telangana) — !!not Goa!! [CSE 2022]",
"**Khavda** (Kutch) :: a 30 GW solar–wind park on the Rann, set to be the world’s largest renewable-energy park",
"First UT on 100% solar power by day :: **Diu** (2018) [UP RO 2017]",
"First village with its own solar plant :: **Rampura** (UP); **Modhera** (Gujarat) became the first round-the-clock solar village in 2022 [UP UDA 2010]",
"**International Solar Alliance** :: secretariat at **Gurugram** (Gwal Pahari) [UPPCS 2019]",
"Wind leaders :: **Gujarat** > Tamil Nadu > Karnataka (December 2025) [UP UDA 2013]",
"**Muppandal** (Kanyakumari) :: once Asia’s biggest wind farm (150 MW) [UPPCS 1999]",
"Offshore wind :: sites off **Gujarat** and in the **Gulf of Mannar** (Tamil Nadu)"]},
{h:"Geothermal, tidal and other sources",t:2,list:[
"**Manikaran** (Parbati valley, Himachal) :: hot springs — **geothermal** energy [CDS 2022 I]",
"**Puga** valley (Ladakh) :: India’s first geothermal power project, being built by ONGC",
"Hot spring ↔ State :: Manikaran — **Himachal** · Avaloli — **Maharashtra** · Sohna — **Haryana** · Lasundra — **Gujarat**, !!not Rajasthan!! [UP RO M 2014]",

{h:"Roads",t:1,list:[
"India has the world’s **second-largest** road network (about 63 lakh km); roads carry about **85%** of passengers and **60–65%** of freight [UPPCS M 2014]",
"National highways :: about 1.46 lakh km; the longest in a State is **Maharashtra**, then UP and Rajasthan (2024) — **UP** was keyed among older options [UPPCS 2000]",

"The two corridors cross at :: **Jhansi** [UPPCS 1999; UP UDA 2001]",
"The East–West corridor is !!not Dibrugarh–Surat!!; the **Trilateral Highway** runs from Moreh (Manipur) through Myanmar to **Mae Sot**, !!not Chiang Mai!!; **BCIM** would join Kolkata, !!not Varanasi!!, with Kunming [CSE 2023]",
"Old NH pairs :: NH 4 ran **Mumbai–Chennai**, NH 6 **Surat–Kolkata** and NH 15 **Samakhiali–Pathankot** — so Chennai–Hyderabad, Mumbai–Kolkata and Ahmedabad–Jodhpur were all !!wrong!! [CSE 2014]",

"Old pairs :: Nashik–Pune was NH 50, Durgapur–Kolkata an expressway and Haldia–Prayagraj a national waterway — but South Central Railway’s head office is **Secunderabad**, !!not Hyderabad!! [UPPCS M 2002]",
"**Mumbai–Pune** Expressway (2002) :: India’s first six-lane access-controlled expressway [UPPCS 2003, 2001]",
"Newer expressways :: **Delhi–Mumbai** (~1,386 km, largely open) and the **Samruddhi Mahamarg** (Mumbai–Nagpur, 701 km)",

"**PMGSY** (2000) :: all-weather roads to villages of **500+** people (**250+** in hills, deserts and tribal areas) [UPPCS 2001]",

"Zone ↔ head office :: Northern — **New Delhi** · North Eastern — **Gorakhpur** · South Eastern — **Kolkata**, !!not Cuttack!! [UPPCS 2025]",
"Other zone offices :: North Central — Prayagraj · East Coast — Bhubaneswar · South Central — **Secunderabad** · East Central — Hajipur · Northeast Frontier — Maligaon (Guwahati)",
"Rail factories :: Rail Coach Factory — **Kapurthala** · Integral Coach Factory — **Perambur** · Rail Wheel Factory — **Bengaluru** · Diesel (now Banaras) Locomotive Works — **Varanasi** [UPPCS M 2008]",
"Passenger coaches are made mainly in :: **Punjab and Tamil Nadu** [UPPCS Spl 2008]",
"The third coach factory :: **Raebareli** (Modern Coach Factory, Lalganj) [UPPCS Spl 1995]",
"Locomotives :: **Chittaranjan** (West Bengal) for electric engines; **Madhepura** (Bihar) builds high-power electric locos with Alstom [BPSC 2024]",
"Firsts :: CNG train — **Rewari–Rohtak** (2015) · first PPP line — **Gujarat** (Gandhidham–Tuna Tekra, 2015) [UPPCS M 2016]",
"Shortest Gorakhpur–Mumbai route :: via **Prayagraj** [UPPCS 1993]",
"Railway Staff College (National Academy of Indian Railways) :: **Vadodara** [UPPCS 1991]",
"**Dedicated freight corridors** :: Eastern — Ludhiana to Sonnagar (Bihar) · Western — Dadri to JNPA; the **bullet train** is **Mumbai–Ahmedabad** (508 km, with Japan) [UP UDA 2001]",
"Rail tunnels, longest first :: **Pir Panjal** (11.2 km) > Karbude > Nathuwadi > Berdewadi — the **T-50** on the Udhampur–Baramulla line (12.8 km, 2024) is now longer [UPPCS M 2015]",
"**Chenab** bridge (Reasi) :: the world’s highest railway arch bridge, on the line that brought trains to Srinagar in 2025",
"**New Pamban** bridge (2025) :: India’s first **vertical-lift** railway sea bridge, to Rameswaram, built by the Navratna RVNL — both true [UPPCS 2025]",
"Every State now has a railway line except **Sikkim** (its line is being built); Meghalaya was keyed as rail-less in 2013 and got its first station in 2014 [UP UDA 2013]",
"Mountain railways (World Heritage) :: **Darjeeling Himalayan** (1999), **Nilgiri** (2005), **Kalka–Shimla** (2008)",
"First metro :: **Kolkata** (1984); its underwater section runs beneath the **Hooghly** (2024) [CDS 2023 II]"]},
{h:"Waterways",t:2,list:[
"**111** national waterways (2016 Act); **IWAI** (1986) — **Noida**; National Inland Navigation Institute — **Patna**; Central Inland Water Transport Corporation — **Kolkata**, !!not Delhi!! [CDS 2016 II; UPPCS M 2009]",
"**NW 1** :: Ganga–Bhagirathi–Hooghly, **Haldia–Prayagraj**, 1,620 km (1986) — the longest [UPPCS 2014; UPPCS M 2010, 2009; UP RO M 2016]",
"Other waterways :: NW 2 — Brahmaputra, **Dhubri–Sadiya** · NW 3 — West Coast Canal, **Kottapuram–Kollam** (Kerala) · NW 4 — Krishna, Godavari and canals to Puducherry · NW 5 — Brahmani–Mahanadi delta with the East Coast Canal",
"**Jal Marg Vikas** :: multimodal terminals on NW 1 at Varanasi, Sahibganj and Haldia; the **Ganga Vilas** cruise (2023) sailed Varanasi to Dibrugarh",
"**Sethusamudram** project :: a ship canal through the Palk Strait–Adam’s Bridge shallows to join the **Gulf of Mannar** with **Palk Bay** [UPPCS 2008; UP Lower 2004]"]},
{h:"Major ports",t:1,cols:["Port","State","Known for"],rows:[
["**Deendayal** (Kandla)","Gujarat — Gulf of Kachchh","A **tidal** port built after Karachi went to Pakistan; a free-trade zone since 1965"],
["**Mumbai** · **JNPA** (Nhava Sheva)","Maharashtra","Mumbai — the largest natural harbour; JNPA (1989) — the largest **container** port, built to relieve Mumbai [UPPCS M 2007; UP UDA 2013]"],
["**Mormugao**","Goa","Iron-ore exports, at the Zuari mouth"],
["**New Mangalore**","Karnataka","Kudremukh ore and coffee"],
["**Kochi**","Kerala — Malabar coast","A natural harbour on **Willingdon Island**"],
["**V. O. Chidambaranar** (Tuticorin)","Tamil Nadu","An artificial harbour with a large fishing harbour"],
["**Chennai** · **Kamarajar** (Ennore)","Tamil Nadu","Chennai — the oldest artificial harbour on the east coast (1881); Kamarajar — the 12th major port, the first **corporatised** one, built for coal"],
["**Visakhapatnam**","Andhra Pradesh","The deepest, **land-locked** natural harbour behind Dolphin’s Nose"],
["**Paradip**","Odisha","Iron-ore exports; the busiest major port by cargo in 2023–24"],
["**Syama Prasad Mookerjee** (Kolkata–Haldia)","West Bengal","The only **riverine** major port; Haldia is its deep-water out-port"]]},

{h:"Ports in questions",t:1,list:[
"**12** major ports are under the Centre (Ministry of Ports, Shipping and Waterways) and about 200 non-major ports under **State maritime boards** — so ‘4 major and 25 minor’ is !!false!! [CAPF 2022]",
"**Vadhavan** (Palghar, Maharashtra) :: a deep-water port approved in 2024 to be the 13th major port",
"Kamarajar is the first major port **registered as a company** and Mundra the largest **private** port — but the largest container port is **JNPA**, !!not Visakhapatnam!! [CSE 2023]",
"Kolkata is the only riverine major port, Kochi stands on Willingdon Island and Mundra is private — but Maharashtra has **two** major ports, !!not three!! [CAPF 2016]",
"The only riverine major port :: **Kolkata** [CAPF 2021]",
"Visakhapatnam is a **land-locked** harbour and Deendayal a **tidal** port — both true [CDS 2023 I]",
"Deepest inland, protected port on the east coast :: **Visakhapatnam** [CAPF 2023]",
"Land-locked harbour :: **Visakhapatnam** — built 1927–33 to ship manganese ore [UP RO 2023; CDS 2014 I]",
"**Chennai** is !!not!! the deepest port (Visakhapatnam is); Kochi natural, JNPA mechanised, Kandla tidal [UPPCS 1997]",
"Deepest among Kandla, Kochi, Paradip and Mormugao was keyed :: **Paradip** [UPPCS 2017]",
"Natural ports :: **Kochi and Visakhapatnam** — Chennai and Tuticorin are artificial [UPPCS 2013]",
"Not a natural harbour :: **Chennai** — India’s largest artificial port [UPPCS 2007]",
"**Kolkata** is !!not!! the deepest harbour; Tuticorin — fishing harbour, Chennai — artificial, Visakhapatnam — natural [UP RO 2023]",
"Artificial port :: **Chennai** [BPSC 2024]",
"Open-sea port :: **Chennai** — and **Haldia** is an outer port [UPPCS 2012; UPPCS M 2012]",
"Not on the east coast :: **Kandla** — Chennai, Paradip and Tuticorin are [UPPCS 2008]",
"On the Gulf of Kachchh :: **Kandla** [UPPCS Spl M 2004]",
"Port on the Odisha coast :: **Paradip** [UP UDA 2013]",
"Kandla is in **Gujarat** — Haldia is in West Bengal, Paradip in Odisha, Mormugao in Goa [UPPCS 1993]",
"Port ↔ State :: Paradip — **Odisha** · Tuticorin — **Tamil Nadu** · Kakinada — **Andhra** · Alappuzha — **Kerala** [UPPCS 2025]",
"Port ↔ State :: Kandla — **Gujarat** · Nhava Sheva — **Maharashtra** · Paradip — **Odisha** · Tuticorin — **Tamil Nadu** [UP GIC 2010]",
"**Mundra** is in **Gujarat**, !!not Andhra!!; Mormugao — Goa, Paradip — Odisha, Mangalore — Karnataka [UPPCS M 2015]",
"**Jamnagar** is !!not!! a port town — Okha, Porbandar and Veraval are [UPPCS 2011]",
"**Karaikal** (Puducherry) is on the east coast — Daman, Janjira and Ratnagiri are western [UPPCS M 2008]",
"Kochi port lies on the :: **Malabar** coast [UP UDA 2013]",
"Port city of Andhra :: **Kakinada**; **Krishnapatnam** (Nellore) also serves **Andhra Pradesh** [UP UDA M 2010; UP Lower 2008]",
"Coal port near Chennai :: **Ennore** (Kamarajar), the 12th major port [UP GIC 2010; UPPCS M 2004]",
"Shipyard ↔ State :: Garden Reach — **West Bengal** · Hindustan Shipyard — **Andhra** · Mazagon Dock — **Maharashtra** · Cochin Shipyard — **Kerala** [UPPCS M 2011]",
"Rajasthan planned an **inland port** at **Jalore**, joined to the sea by a channel through the Rann and the Gulf of Kachchh [CSE 2016]",
"**Vizhinjam** (Thiruvananthapuram, 2025) :: a natural **deep draft** beside the east–west shipping lane lets it take the largest container ships and cuts reliance on **foreign transshipment** hubs — it is !!not domestic-only!! or a cruise port [CSE 2026]"]},
{h:"Airports",t:2,list:[
"About **160** airports operate; the **UDAN** scheme (2016) links small towns by air",
"**Kushinagar** airport (UP) :: given **international** status in June 2020, for the Buddhist circuit [UPPCS 2020]",
"**Cochin** :: India’s first airport built as a public–private partnership",
"New greenfield airports :: **Donyi Polo** (Itanagar), **Mopa** (Goa), Shivamogga and **Navi Mumbai** (2025)"]}
]});

/* ===== 23 POPULATION, SETTLEMENTS & TRIBES ===== */
SEC({id:"population",title:"Population, Settlements & Tribes",group:"India — Resources & People",tier:1,
stats:["UPSC CSE: 9 Q on population (2009–24) in 6 of 17 papers — census trends, fertility, urbanisation, the demographic dividend (2011, 2013), demographic transition (2012) and ageing (2024) — and 7 on tribes (2009–21); tagged here are Limboo, Karbi, Dongria and Bonda (2013) and the Changpa (2014)","UPPCS Pre: 24 Q on population, census and settlement since 2018 — Census 2011 rank lists (2018 ×2, 2021 ×2, 2024), Malthus (2022, 2023, 2024), TFR (2018, 2020), dependency ratio and demographic dividend (2019, 2022), urbanisation (2018, 2021, 2022) — and 11 on tribes and thinkers; older UPPSC papers matched tribes with their homes about 55 times","Formats: Census rank orders (top and bottom States), definitions (literate, worker, census town, TFR, dependency ratio), theory ↔ thinker, tribe ↔ State or region, statement sets on ageing and the demographic dividend"],
note:"People: the Census and its definitions, India’s population in numbers and rank lists, religion and language, population theories, fertility, ageing and the demographic dividend, urbanisation and settlements, human-geography ideas, and the tribes of India and the world. Uttar Pradesh’s own figures are in the UP sheet; reservation and welfare schemes belong to Polity and Economy.",
blocks:[
{h:"The Census",t:1,list:[
"First census :: **1872** (Lord Mayo), not simultaneous; the first **synchronous** census was **1881** (Lord Ripon), and it has been held every ten years since",
"**Census 2011** :: the 15th census and the 7th since Independence, with **1 March 2011** as its reference date",
"The next census :: reference date **1 March 2027** (1 October 2026 for snow-bound Ladakh, J&K, Himachal and Uttarakhand) — India’s first **digital** census, and the first since 1931 to record **caste**",
"The census is held under the **Census Act, 1948** by the **Registrar General and Census Commissioner** (Ministry of Home Affairs)",
"Literate, in the Census :: a person aged **7 or more** who can both **read and write** with understanding in any language — one who can only read is !!not literate!! [CDS 2023 I]",
"Workers :: **main** (worked six months or more of the year) and **marginal**; four classes — **cultivators, agricultural labourers, household-industry workers and other workers** — !!domestic workers are not a class!! [CAPF 2020]",
"Work participation rate (2011) :: about **39.8%** of the population"]},
{h:"India’s population in numbers (2011)",t:1,cols:["Indicator","India","Highest","Lowest"],rows:[
["**Population**","**121.09 crore** — 17.5% of the world on 2.4% of its land","**Uttar Pradesh** (19.98 crore)","**Sikkim** (6.1 lakh); among UTs **Lakshadweep** (64,473)"],
["**Growth, 2001–11**","**17.7%** — the lowest decade since Independence","**Meghalaya** (27.9%)","**Nagaland** (−0.6%, the only fall)"],
["**Density**","**382** per km²","**Bihar** (1,106); UT **Delhi** (11,320)","**Arunachal** (17); UT **Andaman and Nicobar** (46)"],
["**Sex ratio** (women per 1,000 men)","**943**","**Kerala** (1,084); UT **Puducherry** (1,037)","**Haryana** (879); UT **Daman and Diu** (618)"],
["**Child sex ratio** (0–6)","**918**","**Mizoram** and **Meghalaya** (970)","**Haryana** (834)"],
["**Literacy**","**74.0%** (provisional; 73.0% final)","**Kerala** (94%)","**Bihar** (61.8%)"],
["**Urban share**","**31.2%**","**Goa** (62.2%); UT **Delhi** (97.5%)","**Himachal Pradesh** (10%)"],
["**Scheduled Tribes**","**8.6%**","**Mizoram** (94.4%); UT **Lakshadweep** (94.8%)","none in **Punjab, Haryana, Delhi, Chandigarh, Puducherry**"],
["**Scheduled Castes**","**16.6%**","**Punjab** (31.9%); largest number in **UP**","—"]]},
{h:"Census rank lists",t:1,list:[
"Most populous States :: **Uttar Pradesh > Maharashtra > Bihar > West Bengal > Madhya Pradesh**",
"Densest States :: **Bihar > West Bengal > Kerala > Uttar Pradesh** [CAPF 2018]",
"Largest **rural** population :: **Uttar Pradesh**",
"Largest **urban** population :: **Maharashtra** — though **Goa** is the most urbanised",
"Highest share of Scheduled Tribes among the States :: **Mizoram** — ahead of Nagaland, Meghalaya and Arunachal [CDS 2018 I]",
"Largest Scheduled Tribe population :: **Madhya Pradesh**, then Maharashtra and Odisha"]},
{h:"Religion and language",t:2,list:[
"Religions (2011) :: Hindu **79.8%** · Muslim **14.2%** · Christian 2.3% · Sikh 1.7% · Buddhist 0.7% · Jain 0.4%",
"Language families :: **Indo-Aryan** (about 78% — the largest) · **Dravidian** (about 20%) · **Austro-Asiatic** (Santali, Mundari, Ho, Khasi) · **Tibeto-Burman** (Bodo, Manipuri) [CDS 2021 I]",
"**22** languages are in the Eighth Schedule; **Hindi** is the mother tongue of about **44%** (2011)",
"**Khasi** and **Garo** are spoken in :: **Meghalaya** [UPPCS M 2002]",
"State ↔ main language :: Goa — Konkani · Meghalaya — Khasi · Nagaland — Angami among others · **Sikkim** — Nepali, Bhutia and Lepcha, !!not Tibetan!! [UPPCS M 2006]"]},
{h:"Population theories",t:1,list:[
"**Malthus** (*An Essay on the Principle of Population*, 1798) :: population grows **geometrically** (1, 2, 4, 8…) but food only **arithmetically** (1, 2, 3, 4…), so **positive checks** (famine, disease, war) and **preventive checks** (late marriage, restraint) must restore the balance",
"**Demographic transition** :: societies move from **high birth and death rates** to **low** ones, and grow fastest in between — Warren **Thompson** (1929) and Frank **Notestein** (1945)",
"Stages :: 1 **high stationary** — both rates high, growth slow · 2 **early expanding** — deaths fall fast · 3 **late expanding** — births fall too · 4 **low stationary** — both low, growth slow · 5 **declining** — births below deaths [CDS 2014 I]",
"**Optimum population** :: the size at which income per head is highest — Edwin **Cannan**",
"Migration theory :: E. S. **Lee’s** push–pull model (1966) [UPPCS M 2017]",
"**Ravenstein’s** laws of migration (1885) :: most migrants go short distances, move in steps towards towns, and each stream raises a counter-stream",
"**Natural increase** :: birth rate − death rate; actual growth also adds net migration [CAPF 2020]"]},
{h:"The demographic transition",t:1,fig:{kind:"svg",
alt:"Demographic transition in five stages: 1 high stationary, with high birth and death rates and slow growth; 2 early expanding, as the death rate falls fast; 3 late expanding, as the birth rate falls too; 4 low stationary, with both rates low; 5 declining, with births below deaths. The gap between the curves is natural increase, and total population rises most in stages 2 and 3",
caption:"Schematic. Deaths fall before births do, so population grows fastest in stages 2 and 3; India, with fertility near replacement, is moving from stage 3 to stage 4.",

{h:"Fertility, ageing and the dividend",t:1,list:[
"**Total fertility rate** :: the children a woman would bear in her lifetime at current rates; **2.1** is the **replacement level**",
"India’s TFR :: **2.0** (NFHS-5, 2019–21) — below replacement; highest in **Bihar** (3.0), lowest in **Sikkim** (1.1)",
"**Dependency ratio** :: (children 0–14 + elderly 65+) ÷ people 15–64 × 100",
"**Demographic dividend** :: the growth boost when the working-age share is large — India’s window runs to about **2055**, and it pays only with jobs, skills and health",
"**Population ageing** :: the share of the old **rises**, from falling fertility and longer lives — so ‘it falls’ is !!false!!; developed countries are the oldest [CAPF 2023]",
"India’s 60+ share :: about **10%** (2021), heading for about **20%** by 2050",
"A **population pyramid** shows **age groups** and **sex** — males left, females right; a broad base means growth, a narrow base decline [CDS 2022 I]"]},
{h:"Population pyramids",t:2,fig:{kind:"svg",

caption:"A broad base means many births and a growing population; a narrowing base means falling births and, in time, an older and smaller population.",

{h:"Urbanisation and settlements",t:1,list:[
"Urban, in the Census :: **statutory towns** (with a municipality, corporation, cantonment or notified area) and **census towns** — **5,000+** people, **75%+** of male main workers outside farming and **400+** people per km²",
"India :: **31.2%** urban in 2011 (27.8% in 2001); **53** cities of a million or more; **Greater Mumbai**, **Delhi** and **Kolkata** are megacities (10 million+)",
"World :: about **55%** urban (2018), heading for **68%** by 2050 (UN DESA) — with Asia and Africa adding the most",
"**Urbanisation curve** :: an S-shaped path — a slow **initial** stage, a fast **acceleration** stage, then a **terminal** stage when most people are urban",
"Most urban of India’s religious groups (2011) :: **Jains** — about four-fifths live in towns",
"**Umland** :: the area around a town that it serves — its hinterland [UPPCS M 2017]",
"Rural settlements :: **clustered**, **semi-clustered**, **hamleted** and **dispersed**",
"Urban ideas :: **central place theory** — Walter **Christaller** (1933) · **primate city** — Mark **Jefferson** · **rank–size rule** — **Zipf** · **conurbation** — Patrick **Geddes**"]},
{h:"Human geography ideas",t:2,list:[
"**Environmental determinism** :: nature shapes human life — Friedrich **Ratzel**, Ellen **Semple**, Ellsworth **Huntington**",
"**Possibilism** :: people choose among the options nature offers — Paul **Vidal de la Blache** (and Lucien Febvre)",
"**Neo-determinism** (‘stop-and-go’ determinism) :: Griffith **Taylor** [UPPCS 1994]",
"Thinker ↔ idea :: planting hearth — **C. O. Sauer** · world floral regions — **Adolf Engler** · cryophyte steppe — **Arctic tundra** · puszta grassland — **Hungary** [UPPCS 2024]",
"The world divided into **11** cultural worlds :: J. E. **Spencer** and W. L. **Thomas** [UP RO 2016]",
"The hill peoples of north-east India are :: **Mongoloid** [UPPCS M 2003]",
"The **Santhal** are :: **Proto-Australoid** [UPPCS 2002]",
"The native peoples of North America are :: **Mongoloid** [UPPCS 2015]",
"**Transhumance** :: herders moving with their animals between valley winter grounds and mountain summer pastures — the **Gaddi**, **Bakarwal**, Gujjar and **Bhotia** [JPSC 2013]",
"Transhumance is practised by the :: **Bhotia** [UPPCS 1997]"]},

{h:"Tribes in questions",t:1,list:[
"Tribe ↔ home :: Jarawa — **Andaman** · Kuki — **Manipur** · Tharu — **Uttar Pradesh** · Gond — **Madhya Pradesh** [UP BEO 2019]",
"Of Keria (Kharia) — Odisha, Kuki — UP, Yanadi — Rajasthan and Paliyan — Tamil Nadu, the intended pairs were **Kharia — Odisha** and **Paliyan — Tamil Nadu**; the Kuki are **north-eastern** and the Yanadi **Andhran** [UPPCS 2022]",
"Tribe ↔ home :: Bhil — **Rajasthan** · Santhal — **Jharkhand** · Raji — **Uttarakhand** · Lepcha — **Sikkim** [UP Lower 2002]",
"Tribe ↔ home :: Jaunsari — **Uttarakhand** · Santhal — **Jharkhand** · Bhil — **Madhya Pradesh** · Lepcha — **Sikkim** [UP Lower 2002]",
"Tribe ↔ region :: Birhor — **Jharkhand** · Bhutia — **Sikkim** · Toda — **Tamil Nadu** · Sentinelese — **Andaman** [UPPCS 2014; UP Lower 2013]",

"Tribe ↔ State :: Gaddi — **Himachal** · Toda — **Tamil Nadu** · Khasi — **Meghalaya** · Naga — **Manipur** [UPPCS M 2017]",
"Tribe ↔ State :: Bhil — **Rajasthan** · Gond — **Chhattisgarh** · Limboo — **Sikkim** · Konyak — **Nagaland** [UP RO M 2016]",
"**Limboo — Sikkim** and **Dongria — Odisha** are right; the Karbi live in **Assam**, !!not Himachal!!, and the Bonda in **Odisha**, !!not Tamil Nadu!! [CSE 2013]",
"**Changpa** :: semi-nomadic herders of **Ladakh’s** Changthang — !!not Uttarakhand!! — who rear **pashmina** goats and are a Scheduled Tribe [CSE 2014]",
"The **Khas** live in Uttarakhand, Himachal and J&K, !!not Arunachal!!; Angami — Nagaland, Birhor — Jharkhand, Toda — Tamil Nadu [UPPCS 2020]",
"The **Rengma** are a Naga tribe, !!not Andamanese!!; the Nicobarese (Halchu), Onge and Shompen are islanders [UPPCS 2020]",
"**Jarawa** :: the tribe of South and Middle Andaman, protected in the Jarawa reserve [UP RO 2016; UPPCS M 2013]",
"**Toda** :: the tribe of the **Nilgiri** hills [UPPCS 1993; UP Lower 2013]",
"The tribe of the ‘blue mountains’ :: **Toda** [CDS 2017 II]",
"Polyandry :: the **Toda** and the **Jaunsari** — !!not the Gond or Naga!! [UPPCS 2009; UPPCS M 2006, 2005]",
"**Gaddi** :: the shepherd tribe of the **Dhauladhar** [UP Lower 2003; UPPCS 2001; UP UDA 2002]",
"Jhum (shifting cultivation) is practised by the :: **Khasi** [UPPCS 2010]",
"**Sarhul** :: the spring festival of the **Munda** — and of the Oraon, Ho and Santhal [UPPCS 2005]",
"The tribe that worships **Lohasur**, the iron god :: **Agaria** [UPPCS 2016]",
"**Tamaria** :: a Bhumij sub-group of **Jharkhand** [UP RO 2021]",
"Tharu (UP, Uttarakhand), Gaddi (Himachal, J&K) and — as keyed — Irula, Chenchu and Sumali for Kerala are right; the **Garasia** live in **Rajasthan–Gujarat**, !!not Goa!! [CAPF 2017]",
"Scheduled Tribes are identified by a **distinct culture and separate habitat** — primitive traits, shyness of contact, isolation and backwardness [UPPCS 1992]"]},

stats:["UPSC CSE: 24 Q on world locational geography in 2009–25 (14 of 17 papers) and 2 more in 2026; the physical ones are the Andes countries (2025), Lake Turkana (2026), a desert–canyon–lake–range match (2009), rivers and their seas (2020), and shrinking lakes such as the Aral Sea and Lake Faguibine (2018, 2022)","UPPCS Pre: 39 Q on world regional geography since 2018 (3–7 a paper) — deserts (2018, 2022, 2023, 2025), mountains ↔ countries (2020, 2023, 2024 ×2) and rivers (2021, 2023, 2024, 2025) lead; older UPPSC papers asked lakes, waterfalls, city ↔ river pairs and continent orders about 100 times","Formats: feature ↔ country or continent, city ↔ river, orders by size or from west to east, statement sets on one lake or river, and ‘which one does not…’ odd-one-outs"],

"City ↔ river :: Paris — **Seine** · Kinshasa — **Congo** · Bangkok — **Chao Phraya** · Asunción — **Paraguay** [UP BEO 2019]",
"River ↔ city :: Shatt al-Arab — **Basra** · Paraguay — **Asunción** · Niger — **Niamey** · Danube — **Vienna** [UP RO 2016]",
"City ↔ river :: London — **Thames** · Antwerp — **Scheldt** · Rotterdam — **Rhine** · Hamburg — **Elbe** [UP Lower 2015]",
"City ↔ river :: Berlin — **Spree** · Lahore — **Ravi** · New York — **Hudson** · Rome — **Tiber** [UPPCS Spl 2002; UPPCS 1999]",
"**Sydney — Seine** is the wrong pair; Khartoum — Nile, New York — Hudson and Berlin — Spree are right [UPPCS M 2015]",
"**Vienna — Volga** is wrong — Vienna is on the **Danube**; Bonn — Rhine, Cairo — Nile, New York — Hudson [UP RO M 2016; UP Lower 2004; UPPCS 1998]",
"**Hamburg — Elbe** is the right pair; Belgrade is on the Danube, Kyiv on the Dnieper and Lahore on the Ravi [UPPCS M 2004]",
"**Lisbon — Tiber** is wrong — Lisbon is on the **Tagus**; Belgrade — Danube, Warsaw — Vistula, Washington — Potomac [UP Lower 2009]",
"River ↔ country :: Potomac — **USA** · Nile — **Sudan** · Tigris — **Iraq** · Thames — **England** [UPPCS M 2003]",
"**Rhône — Spain** is wrong — the Rhône flows through Switzerland and France; Dnieper — Ukraine, Po — Italy, Rhine — Germany [UPPCS Spl M 2008]",
"Budapest — **Danube** and Cologne — **Rhine** are right; New Orleans stands on the **Mississippi** and Hyderabad on the **Musi**, !!not the Paleru!! [UPPCS 2025]",
"The **Huangpu** flows through :: **Shanghai** [CSE 2006]"]},
{h:"Great dams",t:2,list:[
"River ↔ dam :: Colorado — **Hoover** · Damodar — **Panchet Hill** · Nile — **Aswan** · Zambezi — **Kariba** [UPPCS 2013; UP UDA 2013]",
"**Kariba** dam is on the :: **Zambezi**, on the Zambia–Zimbabwe border [UP RO 2016]",
"**Hoover — Tennessee** is the wrong pair (Hoover is on the Colorado); Grand Coulee — Columbia, **Nurek — Vakhsh** (Tajikistan), Cahora Bassa — Zambezi [UPPCS 2015]",
"**Zangmu** :: China’s dam on the Yarlung Tsangpo (Brahmaputra) in Tibet, begun in 2010 [UPPCS 2013]",
"More giants :: **Rogun** and **Nurek** (Vakhsh, Tajikistan) · **Three Gorges** (Yangtze) — the largest hydropower plant · **Itaipu** (Paraná) · **GERD** (Blue Nile) — Africa’s largest · **Akosombo** (Volta) and **Kariba** hold the largest reservoirs"]},
{h:"Lakes of Asia and Africa",t:1,cols:["Lake","Where","Remember"],rows:[
["**Caspian Sea**","Russia, Kazakhstan, Turkmenistan, Iran, Azerbaijan","The **largest lake** by area and volume; brackish [UPPCS Spl 2008]"],
["**Baikal**","Siberia, Russia","The **deepest** (1,642 m) and **oldest** (over 25 million years), and among the clearest; more fresh water than all the Great Lakes; the **Angara** drains it"],
["**Aral Sea**","**Kazakhstan–Uzbekistan**","Fed by the Amu and Syr Darya; it shrank to fragments after they were drawn off for cotton [UPPCS 2012]"],
["**Balkhash**","Kazakhstan","Fresh in the west, salty in the east [UP RO M 2021]"],
["**Dead Sea**","Israel, the West Bank, Jordan","The lowest land on Earth and one of the saltiest lakes, in a rift"],
["**Van · Urmia**","Turkey · Iran","Soda and salt lakes"],
["**Galilee**","Israel","The lowest freshwater lake (about −210 m)"],
["**Kajin Sara · Tilicho**","Nepal","Kajin Sara was claimed in 2020 as the world’s highest lake, above Tilicho — the claim is unconfirmed"],
["**Tonle Sap · Toba · Lop Nur**","Cambodia · Sumatra · Xinjiang","Swells when the Mekong floods back into it · a supervolcano caldera · a dry salt lake where China tested its bombs"],
["**Victoria**","**Uganda, Kenya, Tanzania**","Africa’s largest and the world’s third after the Caspian and Superior; on the **Equator**; the **White Nile** leaves it; a shallow basin, !!not a rift lake!!"],
["**Tanganyika**","Tanzania, DR Congo, Burundi, Zambia","The **longest** freshwater lake, the **second deepest** and second by volume; a rift lake south of the Equator"],
["**Malawi (Nyasa)**","Malawi, Mozambique, Tanzania","Africa’s third largest; the southernmost rift lake"],
["**Turkana**","Kenya, its northern tip in Ethiopia","The largest permanent **desert lake**, fed by the Omo; a rift lake"],
["**Albert · Edward · Kivu**","Uganda–DR Congo · DR Congo–Rwanda","Lakes of the western rift; Kivu holds dissolved methane"],
["**Tana**","Ethiopia","Source of the **Blue Nile**; dammed by lava, not a rift lake"],
["**Chad**","Chad, Cameroon, Niger, Nigeria","A shallow inland-drainage lake fed by the Chari; it has shrunk by about nine-tenths since the 1960s"],
["**Nasser · Volta · Kariba**","Egypt–Sudan · Ghana · Zambia–Zimbabwe","Reservoirs behind the **Aswan**, **Akosombo** and **Kariba** dams"],
["**Assal**","Djibouti","Africa’s lowest point; saltier than the Dead Sea"]]},
{h:"Lakes of Africa’s rift",t:1,fig:{kind:"svg",
alt:"Map of East Africa from Ethiopia to Malawi. The Western Rift holds Lakes Albert, Edward, Kivu, Tanganyika and Malawi; the Eastern Rift runs from the Afar through Lake Turkana into Tanzania. Lake Victoria lies between the rifts on the Equator and feeds the White Nile; the Blue Nile leaves Lake Tana. Kilimanjaro, Mount Kenya and the Ruwenzori are marked",
caption:"Victoria fills a shallow basin between the two rifts and is the only one of these lakes on the Equator; Tanganyika and Malawi lie in the Western Rift, Turkana in the Eastern.",

{h:"Lakes of the Americas, Europe and Oceania",t:2,cols:["Lake","Where","Remember"],rows:[
["**Titicaca**","Peru–Bolivia","The highest navigable lake (3,812 m); South America’s largest freshwater lake"],
["**Maracaibo**","Venezuela","A brackish lagoon open to the sea; South America’s largest lake; oil"],
["**Poopó · Patos**","Bolivian Altiplano · southern Brazil","Poopó dried up in 2015 · Patos is Brazil’s largest coastal lagoon"],
["**Great Bear · Great Slave · Winnipeg · Athabasca · Reindeer**","Canada","The Arctic Circle crosses Great Bear; the **Mackenzie** leaves Great Slave, the **Nelson** Lake Winnipeg"],
["**Great Salt Lake**","Utah, USA","North America’s saltiest, left by the ice-age Lake Bonneville"],
["**Tahoe**","California–Nevada","A deep, clear lake in the **Sierra Nevada**, falling in droughts"],
["**Ladoga · Onega**","Russia","Europe’s largest lakes"],
["**Geneva**","Switzerland–France","The Rhône passes through it"],
["**Plitvice**","Croatia","Terraced lakes, a World Heritage site"],
["**Eyre**","South Australia","Australia’s lowest point; usually a dry salt pan"]]},
{h:"Lakes in questions",t:1,list:[
"By area :: **Superior > Victoria > Baikal > Great Bear** [UPPCS 2016]",
"The oldest and deepest lake :: **Baikal** [UPPCS 2015]",
"The second deepest and the longest lake :: **Tanganyika** [UP RO M 2014]",
"**Victoria** is shared by **three** countries and is **not** in the rift, so both statements were wrong [UP RO M 2021]",
"Lake **Turkana** is the largest **desert lake** and a World Heritage site, the ‘**Jade Sea**’; it lies in Kenya, !!not South Sudan!! [CSE 2026]",
"**Onega — Canada** is wrong — Onega is Russian; Maracaibo — Venezuela, Michigan — USA, Baikal — Russia [UPPCS 2023]",
"**Five Flower Lake — Mongolia** is wrong — it is in China (Jiuzhaigou); Boiling Lake — Dominica, Red Lagoon — Bolivia, Great Slave — Canada [UPPCS 2015]",
"**Reindeer Lake — Russia** is wrong — it is Canadian; Titicaca — Bolivia–Peru, Urmia — Iran, Athabasca — Canada [UP RO M 2014]",
"A World Heritage lake :: **Plitvice**, Croatia [UP RO 2014]",
"**Malawi — Asia** is wrong — Lake Malawi is African; Baikal — Russia, Caspian — Asia–Europe, Tanganyika — Africa [UP RO M 2017]",
"Lakes shrunk by human use :: the **Aral Sea** (irrigation), **Lake Chad** and Mali’s **Lake Faguibine**, now largely dry — !!not Baikal or the Black Sea!!"]},

{h:"The Great Lakes",t:1,list:[
"By area :: **Superior > Huron > Michigan > Erie > Ontario**; west → east they run **Superior, Michigan, Huron, Erie, Ontario**",
"**Superior** :: the largest freshwater lake by area; **Ontario** the smallest, about a quarter of its size",
"Lying wholly in the USA :: **Lake Michigan**, the largest lake inside a single country — the other four are shared with Canada [UPPCS M 2017, 2015]",
"City on Lake Superior :: **Duluth** — !!not Chicago, Buffalo or Detroit!! [UP RO M 2014]",
"Lake ↔ city :: Erie — **Detroit** (on the river into it) · Michigan — **Gary** · Ontario — **Hamilton** · Superior — **Duluth** [UPPCS 2011]",
"The **Soo (Sault Ste Marie) canal** joins :: **Superior and Huron** [UPPCS 1991]",
"Niagara and its bypass :: **Niagara Falls** drop from **Erie** to **Ontario** on the US–Canada border; the **Welland Canal** lets ships round them",
"To the sea :: the **St Lawrence Seaway** (1959) takes ocean ships up to Lake Superior; the **Erie Canal** (1825) links Buffalo on Lake Erie to the **Hudson** and New York"]},
{h:"Waterfalls",t:2,cols:["Fall","River · where","Remember"],rows:[
["**Angel** (Kerepakupai Merú)","A Guiana Highlands stream · **Venezuela**","The highest, 979 m [UP RI 2014]"],
["**Tugela**","Drakensberg · South Africa","Second — one database ranks it first"],
["**Victoria** (Mosi-oa-Tunya)","**Zambezi** · Zambia–**Zimbabwe**","‘The smoke that thunders’; a World Heritage site"],
["**Iguazú**","Iguazu · Argentina–Brazil","About 275 falls in a wide arc"],
["**Niagara**","Niagara · USA–Canada","The Horseshoe Falls are on the Canadian side"],
["**Boyoma (Stanley)**","Congo · DR Congo","Cataracts with an enormous flow, near Kisangani"],
["**Khone Phapheng**","Mekong · Laos","The widest"],
["**Kaieteur**","Potaro · Guyana","A great single drop"]]},
{h:"Waterfalls in questions",t:2,list:[
"**Victoria Falls** is on the **Zambezi** — true; it lies on the Zambia–**Zimbabwe** border, !!not Zambia–Mozambique!! [UP RO 2023]",
"The tallest fall was keyed as **Angel Falls**, so ‘Tugela’ was the mismatch; Superior — the largest freshwater lake, Titicaca — the highest navigable lake, Tanganyika — the second deepest [UPPCS 2015]"]}
]});

SEC({id:"world-seas",title:"World: Oceans, Seas, Straits & Islands",group:"World",tier:1,
stats:["UPSC CSE: seas and borders are UPSC’s most repeated world cluster — 8 Q (2014, 2015, 2017, 2019, 2022, 2023, 2024 ×2): Turkey’s seas, the Mediterranean coast, sea ↔ country pairs, the North Sea, the Red Sea (the neighbours of Afghanistan and Ukraine are in the next sheet); with straits (Bering 2008, Dover 2007), the Kra canal (2011), the island nearest Great Nicobar (2017) and Hormuz (2026)","UPPCS Pre: islands (2021 ×3, 2022) and the Suez Canal (2018, 2019, 2025) lead since 2018, with seas (2021, 2025); older UPPSC papers asked seas, straits, canals and islands about 45 times","Formats: sea ↔ bordering country (‘which does not border…’), strait ↔ the waters or lands it joins, island ↔ owner country, orders from west to east or north to south, statement sets on one sea or canal"],
note:"The five oceans, then the seas and gulfs with the countries round them, straits, canals, isthmuses, peninsulas and capes, and islands ocean by ocean. Ocean-floor relief, currents, salinity, tides and coral reefs are in the Oceans sheet; ports and sea routes are in World Resources.",
blocks:[
{h:"The five oceans",t:1,list:[
"By size :: **Pacific > Atlantic > Indian > Southern > Arctic**",
"**Pacific** :: the largest and deepest — bigger than all the land put together, with over twice the Atlantic’s water; joined to the Arctic by the **Bering Strait** and to the Atlantic by the **Drake Passage** (and the Panama Canal)",
"The Pacific’s island realms :: **Polynesia** — Hawaii, New Zealand, Samoa, Tonga, Tahiti, Easter Island · **Melanesia** — New Guinea, Solomons, Vanuatu, Fiji, New Caledonia · **Micronesia** — Marshall, Mariana (Guam, Tinian), Caroline islands, the Gilberts (Kiribati), Nauru",
"**Atlantic** :: the second largest, **S-shaped**, and the youngest of the three great oceans — it opened as Pangaea split; the **Mid-Atlantic Ridge**, part of the longest mountain chain on Earth (the mid-ocean ridge), runs down its middle",
"**Indian Ocean** :: the only ocean named after a country; it spans **both sides of the Equator**, and the ancient Greeks called its north-western waters the **Erythraean Sea** — both true [UPPCS 2025]",
"Boundary of the Indian and Pacific oceans :: the meridian of **South East Cape, Tasmania** (about 147°E) [CAPF 2014]",
"**Southern Ocean** :: the waters round Antarctica south of **60°S**, set apart by the **Antarctic Circumpolar Current** — the International Hydrographic Organization proposed it in **2000**, but its members never ratified the limits; National Geographic recognised it in **2021**",
"**Arctic Ocean** :: the smallest and shallowest; its sea ice is shrinking as the Arctic warms about **four times** faster than the globe — **Arctic amplification**, as open dark water absorbs more sunlight than ice",
"**Arctic Council** (1996) :: **8** members — USA (Alaska), Canada, **Denmark** (Greenland), Iceland, Norway, Sweden, **Finland**, Russia; India has been an **observer** since **2013**, as has China",
"India in the Arctic :: the **Himadri** station at Ny-Ålesund on **Svalbard**, Norway (2008), and **IndARC**, a moored underwater observatory in Kongsfjorden (2014)"]},
{h:"Seas and gulfs",t:1,cols:["Sea","Shores","Remember"],rows:[
["**Mediterranean**","21 countries of Europe, Africa and Asia","Entered by **Gibraltar**, **Suez** and the **Dardanelles**; its arms include the Ligurian, **Tyrrhenian**, **Adriatic**, **Ionian**, **Aegean** and Levantine seas"],
["**Tyrrhenian**","Italy, Sicily, Sardinia, Corsica","The sea those four enclose [UP UDA M 2010]"],
["**Adriatic**","Italy · Slovenia, Croatia, Bosnia and Herzegovina, Montenegro, Albania","Karst coasts; !!North Macedonia is landlocked!!"],
["**Black Sea**","Bulgaria, Romania, Ukraine, Russia, Georgia, Turkey","Joined to the Mediterranean through the **Bosphorus**, Sea of Marmara and **Dardanelles**; the **Sea of Azov** (Russia–Ukraine) lies behind the Kerch Strait; its depths are oxygen-poor"],
["**Caspian Sea**","**Russia, Kazakhstan, Turkmenistan, Iran, Azerbaijan** (‘TARIK’)","In truth a **lake** — so Kazakhstan and Turkmenistan count as landlocked; **Baku**’s oil"],
["**Baltic**","Denmark, Germany, Poland, Russia, Lithuania, Latvia, Estonia, Finland, Sweden","Brackish; the Gulfs of **Bothnia** (Sweden–Finland), Finland and Riga; the **Kiel Canal** links it to the North Sea"],
["**North Sea**","UK, Norway, Denmark, Germany, Netherlands, Belgium, France","**Brent** crude; the **Dogger Bank**; Rotterdam"],
["**Atlantic coast of Europe**","Portugal, Spain, France, UK, Ireland, Norway, Iceland","The **Bay of Biscay** lies between France and Spain"],
["**Red Sea**","Egypt, Sudan, Eritrea, Djibouti · Saudi Arabia, Yemen — with Israel and Jordan on the Gulf of **Aqaba**","A young rift between Africa and Arabia; very hot and salty; ends at **Suez** and **Bab-el-Mandeb**"],
["**Persian (Arabian) Gulf**","**Iran, Iraq, Kuwait, Saudi Arabia, Bahrain, Qatar, UAE** — and Oman’s Musandam tip","Inside the Strait of **Hormuz**; the richest oil waters"],
["**Gulf of Oman · Gulf of Aden**","Iran, Oman, UAE · Yemen, Djibouti, Somalia","Hormuz → Arabian Sea · Bab-el-Mandeb → Arabian Sea; piracy off Somalia led to the **Djibouti Code of Conduct** (2009), where India is an observer"],
["**South China Sea**","China, Taiwan, Philippines, Malaysia, Brunei, Indonesia, Vietnam","The **Paracel** and **Spratly** disputes; China’s ‘nine-dash line’, rejected by a 2016 arbitral award"],
["**East China · Yellow · Japan (East Sea) · Okhotsk · Bering**","China, the Koreas, Japan, Russia, Alaska","The **Senkaku (Diaoyu)** islands lie in the East China Sea"],
["**Java · Banda · Arafura · Coral · Tasman**","Indonesia to Australia and New Zealand","The **Coral Sea** holds the Great Barrier Reef; the **Tasman** separates Australia and New Zealand"],
["**Caribbean · Gulf of Mexico**","Central America, the Antilles, northern South America · USA, Mexico, Cuba","Hurricane waters; the Mississippi’s delta; the Panama Canal’s Atlantic end"],
["**Hudson Bay · Baffin Bay · Gulf of St Lawrence**","Canada · Canada–Greenland · eastern Canada","Hudson Bay is an inland sea of the Canadian Shield"]]},
{h:"Seas in questions",t:1,list:[
"**Turkey** lies between the :: **Black Sea and the Mediterranean** [CSE 2014]",
"South-west Asian country with no Mediterranean coast :: **Jordan** — Syria, Lebanon and Israel have one [CSE 2015]",
"Mediterranean shores among Jordan, Iraq, Lebanon and Syria :: **Lebanon and Syria** [CSE 2017]",
"Sea ↔ country :: Adriatic — **Albania** · Caspian — **Kazakhstan** · Mediterranean — **Morocco** are right; **Croatia** is Adriatic, !!not Black Sea!!, and **Syria** is Mediterranean, !!not Red Sea!! [CSE 2019]",
"North Sea shores among Finland, Germany, Norway and Russia :: **Germany and Norway** — only two [CSE 2024]",
"**Red Sea** :: very little rain in any form, and **no river** flows into it for good — both true [CSE 2024]",
"The Red Sea is an :: **axial trough** — a young rift between Africa and Arabia [UPPCS 2017]",
"West → east :: **Mediterranean → Black → Caspian → Aral** [UP RO 2016]",
"**Baku** stands on the :: **Caspian Sea** [UP BEO 2019]",
"Not on the Black Sea :: **Syria** — Turkey, Georgia and Bulgaria are [UPPCS 2021]",
"Not on the Mediterranean :: **Chad** or **Sudan** — Algeria, Morocco, Tunisia, Libya and Egypt are [UPPCS M 2010; CAPF 2020]",
"Not on the Baltic :: **Norway** — Sweden, Russia, Latvia and Poland are [UP RO M 2021]",
"The Persian Gulf does not touch :: **Oman**, as keyed — Oman fronts the Gulf of Oman and the Arabian Sea, with only its Musandam tip on Hormuz; Bahrain, Iraq and Kuwait do [UPPCS M 2008, 2007]",
"Deepest of the South China, Bering, Mediterranean and Japan seas :: **South China Sea** (about 5,400 m) [UPPCS M 2015]",
"Gulf ↔ country :: **Gulf of Tonkin — Vietnam** is right; Bothnia lies between Sweden and Finland, Baffin Bay by Canada and Greenland, Carpentaria in Australia [UPPCS M 2003]",
"The Gulf Cooperation Council :: **Saudi Arabia, Kuwait, Bahrain, Qatar, UAE and Oman** — Iran and Iraq are Gulf shores but not members"]},
