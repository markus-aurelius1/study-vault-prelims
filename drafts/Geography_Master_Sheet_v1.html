{h:"Layers of the atmosphere",t:1,cols:["Layer","Height","Temperature with height","Key facts"],rows:[
["**Troposphere**","Surface to **~18 km at the equator** and **~8 km at the poles** (average ~13 km)","**Falls** ~6.5°C per km (1°C per 165 m) — the **normal lapse rate**","All **weather**; ~75% of the air’s mass and nearly all the water vapour and dust; zone of convection and turbulence; ends at the near-isothermal **tropopause** — the lowest layer [UP RO 2016; RAS 1999]"],
["**Stratosphere**","Tropopause to **~50 km**","**Rises**, as ozone absorbs ultraviolet","Holds the **ozone layer** (15–35 km); very dry and nearly cloudless except rare **nacreous (mother-of-pearl)** clouds; ends at the stratopause [UPPCS 1997; UPPCS M 2005, 2003; CGPCS 2011]"],
["**Mesosphere**","50–**80 km**","**Falls** to about **−90°C** at the mesopause — the coldest level of the atmosphere","**Meteors burn up** here"],
["**Thermosphere**","80 km to ~640 km","**Rises** steeply — beyond 1,000°C — as the thin gas absorbs high-energy radiation","Contains the **ionosphere** (~80–400 km, in layers D, E and F), whose ions **reflect radio waves** back to Earth; **aurorae** glow here [UPPCS M 2005; UPPCS 2013, 2010]"],
["**Exosphere**","Above ~640 km","Very thin","Atomic oxygen, hydrogen and helium fade into space; low satellites orbit here [UKPCS 2005; RAS 1997]"]]},
{h:"Layer facts in questions",t:1,list:[
"The troposphere is **thickest at the equator** because strong **convection** carries heat to great heights [CSE 2024]",
"Order upward :: **troposphere → stratosphere → mesosphere → ionosphere (thermosphere)** [CSE 1998; UPPCS M 2005]",
"Jet aircraft fly smoothly in the lower stratosphere :: **no clouds or water vapour** and **no vertical winds** there [CSE 2011; JPSC 2010]",
"Troposphere — **weather**, stratosphere — **ozone layer**, ionosphere — **radio waves**; aurorae belong to the ionosphere, !!not the mesosphere!! [UPPCS M 2002]",
"Ozone absorbs all **UV-C** and most **UV-B**, so it keeps harmful ultraviolet off the ground; most **UV-A** passes [UKPCS 2002]",
"Beyond the air, the **magnetosphere** traps solar-wind particles in the two **Van Allen radiation belts** (inner centred ~3,000 km, outer ~16,000 km up)",
"**Kármán line** :: **100 km** — the conventional edge of space, above which the air is too thin for aircraft; no treaty fixes where space begins",
"The atmosphere has **no sharp top**: it thins with height and merges into space"]},
{h:"Insolation and heating",t:1,list:[
"Insolation :: incoming **short-wave** solar radiation; the Earth intercepts only about **one two-billionth** of the Sun’s output",
"Solar constant :: about **1.94 calories per cm² per minute** (~1,361 W/m²) at the top of the atmosphere, on a surface facing the Sun at mean distance",
"At **perihelion (3 January)** the Earth gets slightly more insolation than at aphelion (4 July), but land–sea layout and circulation mask the difference",
"The air is nearly **transparent to short-wave** insolation, which heats the **ground**; the ground re-emits **long-wave terrestrial radiation**, which the air absorbs — so the air is **heated from below**",
"The atmosphere is heated more by **terrestrial radiation** than by incoming sunlight — !!not the other way round!!; CO₂ and other greenhouse gases are good absorbers of long waves [CSE 2024]",
"The short-wave → long-wave conversion takes place at the **Earth’s surface**, so the air gets its heat **indirectly** from the Sun and **directly** from the ground [UPPCS 1997]",
"**Greenhouse effect** :: warming of the surface and lower air by gases that absorb terrestrial radiation — CO₂, CH₄, N₂O, HFCs, PFCs, SF₆ and water vapour",
"Heat absorbed by the atmosphere keeps the mean surface near **15°C**, and gases like CO₂ absorb and trap radiation — but without an atmosphere the sunlit side would be scorching, so !!“below freezing everywhere” is false!! [CSE 2025]",
"Most insolation reaches the **subtropical deserts** (least cloud); the **equator gets less than the tropics**; at one latitude, **continents get more than oceans**",
"Insolation depends on the **angle of the rays** (latitude), **day length**, the air’s **transparency** (cloud, dust, vapour), the tilt of the axis, and the slope and aspect of the land",
"The **blue sky** and **red sunrise and sunset** come from **scattering** of sunlight by air molecules and particles",
"Scattering acts on **short-wave** light; outgoing **long-wave** radiation is absorbed and re-emitted, not scattered",
"Hotter bodies radiate **more energy at shorter wavelengths** (Planck’s and Wien’s laws): the Sun sends short waves and the Earth returns long ones"]},
{h:"Heat budget in 100 units",t:1,fig:{kind:"svg",
alt:"Heat budget diagram with three bands: space, the atmosphere with clouds, and the Earth’s surface. 100 units of insolation arrive; 35 are reflected to space, 6 by the air, 27 by clouds and 2 by the surface; 14 are absorbed by the air and 51 by the ground. The ground sends 17 units straight to space and 34 to the air as radiation 6, convection 9 and latent heat 19; the air radiates 48 units to space",
caption:"What comes in goes out: 35 reflected + 17 + 48 radiated = 100. The 35 reflected units are the Earth’s albedo.",

"</svg>"}},
{h:"Albedo and clouds",t:1,list:[
"Albedo :: the share of incoming radiation a surface **reflects** — its reflecting power, which also sets how bright it looks; reflected energy does not heat the Earth [UPPCS 2019]",
"Earth’s albedo :: about **35 units of 100** in the heat-budget model (satellite estimates ~30%); the Earth reflects more than Mercury because of its clouds, ice and oceans",
"Highest albedo :: **fresh snow** (up to ~90%) — above desert sand, a paddy field, prairie, a rocky piedmont or a mangrove forest [CSE 2010; CDS 2022 I]",
"Albedo, lowest to highest :: fresh asphalt < open ocean < worn asphalt < conifer forest < deciduous trees < bare soil < green grass < desert sand < new concrete < sea ice < **fresh snow**",
"High, thin clouds (**cirrus**) :: let most sunlight through but trap outgoing infrared — net **warming** [CSE 2022]",
"Low, thick clouds (**stratocumulus**) :: reflect much sunlight back to space — net **cooling**; !!the exam swaps high and low clouds!! [CSE 2022]",
"Clear nights are colder than cloudy ones: with no cloud, the ground loses heat freely by **radiation**"]},
{h:"How heat moves",t:2,list:[
"**Radiation** :: transfer as radiant energy, needing no medium — insolation in, terrestrial radiation out",
"**Conduction** :: transfer by molecular contact — ground to the air layer touching it",
"**Convection** :: vertical transfer by rising and sinking air — equatorial convection currents",
"**Advection** :: horizontal transfer by winds and currents — at **mid-latitudes most day-to-day weather change** comes from advection, and India’s **loo** is advected heat [CAPF 2018]",
"A surface’s temperature follows its **net radiation**, which is **positive by day** and **negative by night**; a sunlit soil **gains** energy as it warms, !!it does not lose it!! [CAPF 2024]"]},
{h:"What controls temperature",t:1,list:[
"Controls :: **latitude** (insolation), **altitude**, **distance from the sea**, ocean currents and air masses, and local albedo, slope and aspect",
"Land heats and cools **faster** than water — lower specific heat, opaque to sunlight, and no mixing",
"Temperature falls with height because the air is heated **from the ground** and the thin upper air absorbs less — !!not because upper air holds more moisture!! [CSE 2012]",
"Rising air also **expands and cools** (adiabatic cooling), so it can hold less vapour",
"Interiors have a higher annual range than coasts because of the **land–water thermal difference** — !!not altitude, strong winds or heavier inland rain!! [CSE 2013]",
"The land–sea temperature contrast is greater in **winter** than in summer [CSE 2023]",
"The annual range is greater in the **N Hemisphere** (more land) than in the S Hemisphere [CSE 2007]",
"The belt of maximum temperature lies near **20°N**, !!not along the equator!! — the thermal equator follows the Sun and the larger northern landmasses [UPPCS 2002]",
"The annual range **grows from the equator towards the poles** — largest, over **60°C**, in **north-east Siberia** (continentality); smallest, about **3°C**, between 20°S and 15°N",
"Diurnal range :: highest minus lowest of a day — the **low comes just before sunrise**, the **high just after noon**",
"Annual range :: warmest minus coldest **mean monthly temperature**; mean daily temperature is the average of the 24 hourly readings"]},
{h:"Isotherms",t:1,fig:{kind:"svg",
alt:"Schematic January map of the northern mid-latitudes with North America and Eurasia separated by the Atlantic. The 0 degree and minus 20 degree isotherms dip south over both continents and bulge north over the ocean, most strongly in the North Atlantic where the warm Gulf Stream and North Atlantic Drift flow north-east",
caption:"January in the N Hemisphere: isotherms sag equatorward over the cold land and bulge poleward over the warmer sea, most of all over the North Atlantic.",

"<text x='70' y='52' style='font-weight:700'>North America</text><text x='470' y='52' style='font-weight:700'>Eurasia</text><text x='255' y='270' style='fill:var(--ink-2)'>Atlantic</text>"+
"<text x='150' y='210' text-anchor='middle' style='fill:var(--navy);font-weight:700'>0°C</text><text x='150' y='120' text-anchor='middle' style='fill:var(--navy);font-weight:700'>−20°C</text>"+
"<text x='318' y='140' font-size='15' style='fill:var(--omr)'>Warm drift</text></g>"+

{h:"Isotherm patterns",t:1,list:[
"Isotherm :: a line joining places of **equal temperature**; broadly parallel to the latitudes",
"January, N Hemisphere :: isotherms bend **equatorward over the landmasses** and **poleward over the oceans**, because the air over the oceans is **warmer** than over land in winter [CSE 2025, 2024]",
"The poleward bend is sharpest in the North Atlantic, where the **Gulf Stream and North Atlantic Drift** push it north — they are **warm** currents, !!not cold ones!! [CSE 2024]",
"Siberia in January :: mean temperature along **60°E** is about **−20°C at both 80°N and 50°N** — the isotherm runs north–south",
"In January the hotter isotherms lie in the **S Hemisphere**, where summer has begun",
"S Hemisphere :: mostly ocean, so isotherms stay **nearly parallel** to the latitudes and seasons are milder",
"July reverses the pattern — isotherms bend **poleward over land**, equatorward over the oceans — and the whole set **shifts north** from January to July"]},
{h:"Temperature inversion",t:1,list:[
"Normal lapse rate :: temperature **falls ~6.5°C per km** of height",
"Temperature inversion :: the reverse — temperature **rises with height** through a layer [CDS 2022 II]",
"Ideal conditions :: **long winter nights**, **clear skies**, **calm, dry air** — the ground radiates heat away and chills the air above it [CDS 2022 II]",
"Inversions form everywhere and are **near-permanent over the poles** — !!not “common except at the poles”!! [CDS 2022 II]",
"**Radiation (surface) inversion** :: calm, clear winter nights; the ground and the air touching it cool fastest",
"**Air drainage (valley) inversion** :: cold, dense air slides down the slopes at night and pools on the valley floor under warmer air",
"**Advection inversion** :: warm air flows over a cold sea or snow surface",
"**Frontal inversion** :: cold air undercuts warm air along a front; **subsidence inversion** forms under sinking air in anticyclones",
"Effects :: a **stable** atmosphere with no convection or rain, **fog**, and trapped pollutants — the **inversion lid** behind winter **smog** (Delhi) [CDS 2022 I]",
"Valley floors get the frost, so settlements and orchards climb the **upper slopes** — Himachal apple orchards, Brazil’s coffee on hillsides"]}
]});

/* ===== 06 PRESSURE BELTS, WINDS & JET STREAMS ===== */
SEC({id:"winds",title:"Pressure Belts, Winds & Jet Streams",group:"Climate & Oceans",tier:1,
stats:["UPSC CSE: 5 Q (2010–24) in 5 of 17 papers — Coriolis strength (2024), stronger southern westerlies (2011), western disturbances as westerlies (2015); older papers asked Roaring Forties (2000), local winds (2001), 60°–65° lows (2002), Coriolis (2005) and horse latitudes (2007)","UPPCS Pre: 4 Q (2019–24) — local wind ↔ place (2019, 2021), Coriolis (2023), jet streams (2024); older UPPSC papers matched local winds about 8 times","Formats: Statement I–II on causes, local wind ↔ region matching, not-correctly-matched pairs, jet-stream and Coriolis statement sets (CDS/CAPF yearly)"],
note:"Pressure drives the wind and the Earth’s spin bends it. The sheet runs from pressure belts and the three-cell circulation to planetary, seasonal and local winds, then jet streams and the polar vortex. The monsoon mechanism is in the India climate sheet.",
blocks:[
{h:"Pressure",t:2,list:[
"Atmospheric pressure :: the **weight of the air column** over a unit area, read with a **barometer** (mercury or aneroid)",
"Mean sea-level pressure :: **1013.25 mb** (hPa); it falls with height, about 1 mb per 10 m near the ground",
"**Isobar** :: a line joining places of equal pressure; tightly packed isobars mean a steep gradient and strong wind",
"Low pressure :: **rising air**, cloud and wet weather",
"High pressure :: **sinking air** and clear skies",
"**Trough** :: an elongated **low** (isobars dip) with rising air and cloud",
"**Ridge** :: an elongated **high** (isobars bulge) with sinking air and clear skies",
"A sudden fall of the barometer warns of :: **stormy weather** [UKPCS M 2002]",
"Warm air expands and pressure falls, so pressure is **lowest in summer** [UPPCS 2014]",
"The vertical pressure gradient is far larger than the horizontal one but is **balanced by gravity**, so there are no strong upward winds"]},
{h:"Pressure belts",t:1,cols:["Belt","Latitude","Origin","Weather"],rows:[
["**Equatorial low** (ITCZ, **doldrums**)","0°–5° N and S, migrating with the Sun","**Thermal** — heating makes air rise","Calm, light variable winds and daily convectional rain; equatorial calms that shift in position and extent [CAPF 2019, 2014]"],
["**Subtropical high** (**horse latitudes**)","**30°–35°** N and S, over the oceans","**Dynamic** — air from the Hadley cell **sinks** here","Calm, dry and clear; the source of both trades and westerlies; hot deserts on the western sides of continents"],
["**Subpolar low**","**60°–65°** N and S","**Dynamic** — rotation spreads air out and westerlies meet polar easterlies at the **polar front**","Stormy, with frontal cyclones; strongest over the oceans (Aleutian and Icelandic lows)"],
["**Polar high**","Around the poles","**Thermal** — intense cold makes the air dense and sink","Source of the polar easterlies"]]},
{h:"Pressure-belt facts in questions",t:1,list:[
"Horse latitudes are the **subtropical highs** at about 30°–35°, !!not low-pressure belts!! — becalmed ships threw horses overboard [CSE 2007; UP Lower 2008]",
"60°–65° holds a **low**, not a high — true; lows are also **steadier over oceans** than over land — true, !!but that does not explain the belt!! [CSE 2002]",
"All belts shift about **5°–10° north in July** and **south in January**, following the overhead Sun",
"January :: the equatorial low reaches well into the **S Hemisphere**; the southern subtropical high survives only over the oceans; a continuous northern high links to the **Siberian High**",
"July :: the equatorial low pushes deep into the **N Hemisphere** over India and Tibet; the northern subtropical high breaks into cells over the Atlantic and Pacific; the southern one forms a **continuous belt**"]},
{h:"Three-cell circulation",t:1,fig:{kind:"svg",
alt:"Northern Hemisphere cross-section from the equator to the pole: the Hadley cell with the NE trades at the surface, the Ferrel cell with the westerlies and the polar cell with the polar easterlies. Air rises at the equatorial low and the subpolar low at 60°N and sinks at the subtropical high at 30°N and the polar high. The tropopause slopes down towards the pole",
caption:"Rising air makes the lows at 0° and 60°; sinking air makes the highs at 30° and the pole. Surface winds blow from the highs to the lows.",
src:"<svg viewBox='0 0 640 300' xmlns='http://www.w3.org/2000/svg'>"+

{h:"Cells of the general circulation",t:1,list:[
"**Hadley cell** (0°–30°) :: air rises at the ITCZ, flows poleward aloft and **descends at the subtropical high-pressure cells**; the trades return it at the surface [CDS 2020 I]",
"**Ferrel cell** (30°–60°) :: driven by the two cells beside it; **westerlies** at the surface",
"**Polar cell** (60°–90°) :: cold air sinks at the pole; **polar easterlies** at the surface",
"Winds aloft blow opposite to the surface winds, so each meridian carries **three cells** — the tricellular circulation",
"**Walker circulation** :: an east–west cell over the equatorial Pacific; its ENSO swings are in the India climate sheet"]},
{h:"Forces that move and steer the wind",t:1,list:[
"Winds are **named after the direction they blow from** — a westerly comes from the west",
"**Pressure gradient force** :: pushes air from **high to low** pressure, at right angles to the isobars; strong where isobars crowd",
"**Friction** :: greatest at the surface and over land; it slows the wind and makes it cross isobars towards the low",
"**Coriolis force** :: the apparent deflection caused by the Earth’s rotation — to the **right in the N Hemisphere** and the **left in the S Hemisphere** (Ferrel’s law), !!never right in the south!! [UPPCS 2023; CDS 2021 I; CDS 2016 I]",
"Coriolis force **grows with wind speed** and is **maximum at the poles and absent at the equator** [CSE 2024; CDS 2021 I]",
"At the equator there is no Coriolis force, so winds blow straight across the isobars, lows **fill up** instead of deepening, and **no tropical cyclone** forms within about 5°",
"**Geostrophic wind** :: upper-air wind, free of friction, where the pressure-gradient and Coriolis forces balance, so it blows **parallel to the isobars** [CAPF 2024]",
"Both the **trades** and the **westerlies** blow out of the **subtropical highs** [CAPF 2015]"]},
{h:"Circulation round lows and highs",t:1,cols:["System","Centre","N Hemisphere","S Hemisphere"],rows:[
["**Cyclone**","**Low** pressure — air converges and rises","**Anticlockwise**, spiralling inward [CDS 2015 II]","**Clockwise**"],
["**Anticyclone**","**High** pressure — air sinks and diverges","**Clockwise**, spiralling outward","**Anticlockwise** [CAPF 2015]"]]},
{h:"Planetary winds",t:1,cols:["Wind","Blows","Character"],rows:[
["**Trade winds** (easterlies)","Subtropical high → equatorial low; **NE trades** in the N Hemisphere, **SE trades** in the S","Steady; dry where they start, moist after crossing the sea — rain on **eastern margins**, offshore and dry on **western margins**, where the hot deserts lie"],
["**Westerlies**","Subtropical high → subpolar low, about **35°–60°**; **SW** in the N Hemisphere, **NW** in the S","Carry temperate cyclones; stronger and steadier in the S Hemisphere — **Roaring Forties**, **Furious Fifties**, **Shrieking Sixties** [MPPCS 2015]"],
["**Polar easterlies**","Polar high → subpolar low","Very cold and dry"]]},
{h:"Planetary winds in questions",t:1,list:[
"Planetary winds depend on **latitudinal heating**, the **pressure belts** and their **seasonal migration**, **land–sea layout** and **rotation** — !!not on the Earth’s revolution!! [CAPF 2015]",
"The trades meet at the **ITCZ**; the converging air rises, flows poleward aloft and sinks at about 30° to rebuild the subtropical highs",
"Southern westerlies are stronger because the S Hemisphere has **less land** to slow them — !!not because Coriolis is stronger there!! [CSE 2011]",
"Roaring Forties :: strong westerlies between **40° and 50°S**; they blow from the west, !!not east to west!! [CAPF 2014]",
"Roaring Forties blow with **great strength and constancy**, broadly west to east, under **overcast skies, rain and raw weather** — !!they are not uninterrupted in the N Hemisphere!! [CSE 2000]",
"Rain that **western disturbances** bring to north-western India is part of the westerlies — true; !!“winds between 30°N and 60°S all year are westerlies” is false!! [CSE 2015]",
"Seasonal winds :: a seasonal reversal of pressure and wind — the **monsoons** (SW in summer, NE in winter)"]},
{h:"Land, sea, valley and mountain breezes",t:2,list:[
"**Sea breeze** :: by day the land heats faster and a low forms over it, so cooler sea air blows inland — relief on coasts by late afternoon",
"**Land breeze** :: by night the land cools faster and air flows from the land to the sea",
"**Valley breeze** (anabatic) :: by day the slopes heat and air climbs up the valley",
"**Mountain breeze** (katabatic) :: by night cold dense air drains down into the valley — the source of valley frost and inversions",
"Foehn-type wind :: moist air rises over a range, cools and **rains on the windward side**, then sinks on the **leeward side**, warming as it is compressed — a warm, dry wind that **melts snow**"]},
{h:"Foehn and chinook",t:2,fig:{kind:"svg",
alt:"Cross-section of a mountain range. On the windward side air at 20 degrees rises, cools to 10 degrees at the cloud base at 1 km and forms cloud and rain up to the summit at 3 km, where it is minus 2 degrees. On the leeward side the dry air sinks and warms by compression, reaching 28 degrees at the foot as a warm, dry foehn wind",
caption:"Air cools slowly in cloud (latent heat is released) but warms fast when it sinks dry, so it reaches the leeward foot warmer than it started.",
src:"<svg viewBox='0 0 640 300' xmlns='http://www.w3.org/2000/svg'>"+

"</svg>"}},
{h:"Local winds",t:1,cols:["Wind","Where","Nature"],rows:[
["**Chinook**","Eastern slopes of the **Rockies** into the prairies (USA, Canada)","Warm, dry, descending — the **snow eater**; raises winter temperatures on the plains and keeps pastures clear [UPPCS 2005; JPSC 2013]"],
["**Foehn**","Northern slopes of the **Alps** — Switzerland, Austria","Warm, dry, descending; melts snow, helps grazing and ripens grapes [CSE 2001; UPPCS 2016; UP UDA 2010]"],
["**Zonda**","Eastern slopes of the Andes, **Argentina**","Foehn-type [CSE 2001]"],
["**Santa Ana**","Southern **California**","Hot, dry, dusty; fans wildfires [CSE 2001; UPPCS 2019]"],
["**Simoom** (samoon)","Arabia, Iran and **Kurdistan**","Hot, dry, dust-laden — the **poison wind** of heatstroke [CSE 2001]"],
["**Sirocco**","From the **Sahara** north across the Mediterranean to **Sicily**, southern Italy and Malta","Hot and dusty; after picking up moisture it brings **blood rain** (red Saharan dust) to **Italy** — called **Khamsin** in Egypt, **Ghibli** in Libya, **Chili** in Tunisia and **Leveche** in Spain [UPPCS 2021, 2005; UP Lower 1998]"],
["**Harmattan**","From the Sahara over **West Africa** — Nigeria, the Guinea coast","Dry, dusty north-easterly (Nov–Mar); it lowers the humidity on the coast, so it is called **the Doctor**"],
["**Haboob**","**Sudan**","Violent dust storm [UPPCS 2019]"],
["**Levanter**","Strait of **Gibraltar**, southern Spain","Easterly, often foggy"],
["**Loo**","North Indian plains","Hot, dry westerly of May–June afternoons"],
["**Karaburan**","**Tarim basin**, Central Asia","Black, dust-laden spring and summer storm"],
["**Shamal**","**Iraq**, Iran and the Arabian Peninsula","Hot, dry, dusty north-westerly of June–July — !!not Austria!! [UPPCS 2021]"],
["**Berg**","South Africa","Hot, dry wind from the interior plateau down to the coast"],
["**Brickfielder**","Southern **Australia** (Victoria)","Hot, dry wind from the desert interior [UPPCS 2021]"],
["**Yamo**","**Japan**","Hot, dry local wind [UPPCS 2019]"],
["**Black roller**","Great Plains, **North America**","Dust storm [UPPCS 2021]"],
["**Mistral**","**Rhône valley**, France","Very cold, dry northerly funnelled between the Alps and the Massif Central — !!not Australia!! [UPPCS 2019]"],
["**Bora**","Eastern shore of the **Adriatic**","Cold, dry north-easterly down the mountains — !!not Poland!! [CDS 2020 I; UPPCS 2016]"],
["**Bise · Tramontane · Gregale**","Switzerland · the Alps into Italy · Malta","Cold northerly and north-easterly winds of the Alpine and Mediterranean lands"],
["**Blizzard**","Canada, the USA, Siberia, Antarctica","Violent snow-laden polar wind — !!not Chile!! [UPPCS 2005]"],
["**Buran · Purga**","Siberia · Russian tundra","Blizzards of Russia"],
["**Norther · Norte**","Texas and the Gulf of Mexico · Mexico","Cold northerly outbursts of polar air"],
["**Pampero**","Argentine pampas","Cold south-westerly burst of polar air"],
["**Southerly buster**","New South Wales and Victoria, Australia","Sudden cold southerly"]]},
{h:"Local winds in questions",t:1,list:[
"**Sirocco** is !!not a wind of France!!; Bora — **Italy’s Adriatic** and Blizzard — **Canada** are right [UPPCS M 2013]",
"**Mistral — Rhine valley** passed as a correct pair in one key, but the Mistral blows down the **Rhône**, !!not the Rhine!! [UPPCS 2016]",
"Snow on the **Atlas** comes when moist Atlantic air rises over the range — a rare event, !!not a local wind!!"]},
{h:"Jet streams",t:1,list:[
"Jet stream :: a narrow band of **very fast wind** near the tropopause (about **8–15 km**), with strong vertical and sideways shear, following a wavy path of **Rossby waves**",
"Speed :: usually **130–225 km/h**, at times above 400 km/h [UPPCS 2024]",
"Jet streams are **westerly** (west → east) and occur in **both hemispheres** — !!not “northern hemisphere only”, not easterly!! [CSE 2020; CAPF 2022; UPPCS 2024]",
"Pilots met them in **World War II**; the assertion that they are high-altitude easterlies is false [UPPCS 2024]",
"Cause :: the **temperature contrast** between air masses — the greater the contrast, the stronger the jet — so they are **strongest in winter**",
"**Polar front jet** :: over the polar front (~40°–60°), meandering and irregular; strongest in **winter** — !!not summer!! [CDS 2017 I]",
"**Subtropical westerly jet** :: at the poleward edge of the Hadley cell (~30°); steadier; in winter it flows **south of the Himalaya** over north India",
"**Tropical easterly jet** :: blows **east → west** over peninsular India and Africa in **summer**, from the heating of the Tibetan plateau",
"**Local jets** such as the low-level **Somali jet** off East Africa; the **polar night jet** circles the winter pole in the stratosphere",
"Divergence under the jet aloft draws air up from the surface, so jets **spawn and steer temperate cyclones**; they also affect the monsoon, carry pollutants aloft, feed **polar ozone loss** and help eastbound flights",
"Jet streams are high-altitude winds that **affect surface weather** [UPPCS 2002]"]},
{h:"Polar vortex",t:2,list:[
"Polar vortex :: a large, cold **low-pressure** area round each pole, where strong westerlies (the polar night jet) circle anticlockwise round the North Pole and keep the cold air penned in",
"When the vortex **weakens or splits**, lobes of Arctic air spill south, bringing severe cold spells to mid-latitudes"]}
]});

/* ===== 07 HUMIDITY, RAINFALL & CYCLONES ===== */
SEC({id:"weather",title:"Humidity, Rainfall & Cyclones",group:"Climate & Oceans",tier:1,
stats:["UPSC CSE: 5 Q (2009–20) in 5 of 17 papers — hurricane names (2009), thunder (2013), no cyclones in the South Atlantic (2015), dew on cloudy nights (2019), the cyclone’s eye (2020); older papers asked moisture and latitude (2006), rain all year near the equator (2003) and inward-spiralling winds (2002); wet-bulb heat (2025)","UPPCS Pre: 4 Q (2018–24) — cyclone names by region (2019, 2020), global warming and storms (2018), relative humidity (2024); older UPPSC papers asked tornado belts and scales, the highest clouds and Willy-willy","Formats: why-questions (dew, no cyclones, thunder), cyclone-anatomy statement sets, name ↔ region and scale ↔ hazard matching, cloud and fog statements (CDS/CAPF)"],
note:"Moisture from vapour to rain: humidity, condensation, clouds, precipitation and rainfall belts, then storms — air masses and fronts, temperate and tropical cyclones, thunderstorms and tornadoes. India’s own cyclones, their naming and the IMD colour warnings are in the India climate sheet.",
blocks:[
{h:"Humidity",t:1,list:[
"Humidity :: the **water vapour** in the air — the raw material of all precipitation",
"**Absolute humidity** :: grams of vapour per **cubic metre** of air; it changes as air expands or contracts",
"**Specific humidity** :: grams of vapour per **kilogram** of air; unaffected by changes of volume",
"**Relative humidity** :: vapour present as a **percentage of what the air could hold** at that temperature; at 100% the air is **saturated**",
"Relative humidity **falls as air warms** — true; absolute humidity rises with evaporation — also true, !!but it does not explain the fall!! [UPPCS 2024]",
"**Dew point** :: the temperature at which air becomes saturated; if saturation comes below 0°C it is the **frost point**",
"The air’s moisture varies with **latitude** because warmer air can hold more vapour — the reason explains the assertion [CSE 2006]",
"**Muggy** weather :: humid heat in summer, when abundant vapour traps heat [UP UDA 2002]",
"**Wet-bulb temperature** :: the lowest temperature evaporation can cool the air to; it joins heat and humidity, and near **35°C** the body can no longer cool by sweating — a gauge of **human survivability**, !!not of floods or cyclones!! [CSE 2025]"]},
{h:"Evaporation and condensation",t:2,list:[
"Evaporation rises with **temperature** and **wind speed**, and falls as the air grows more **humid**",
"Evaporation is greatest in the **subtropics** (dry, clear air), less at the humid equator and least at the poles; over oceans it peaks where warm and cold currents meet",
"Condensation needs :: air **cooled to its dew point** at constant volume, **cooled as its volume shrinks**, or **more vapour added** by evaporation",
"It depends on the amount of **cooling** and the **relative humidity**; clouds are the result of **condensation** [UKPCS 2016]"]},
{h:"Forms of condensation",t:1,cols:["Form","What it is","Conditions"],rows:[
["**Dew**","Water drops on cool surfaces","Clear sky, calm air, high humidity, long nights, dew point above 0°C. No dew on cloudy nights because clouds **reflect the Earth’s radiation back** and keep the ground warm [CSE 2019]"],
["**Frost**","Ice deposited on cold surfaces","As for dew, but the dew point is at or below freezing"],
["**Rime**","Needle-like white ice","Supercooled droplets freeze on contact with a very cold surface"],
["**Fog**","A cloud at or near the ground; visibility under 1 km","**Radiation fog** from night cooling of the land; **advection fog** when moist air crosses a cold surface; valley and frontal fog; smoke nuclei make **smog** [CDS 2023 II]"],
["**Mist**","Suspended droplets with more moisture per nucleus than fog; visibility 1–2 km","Frequent on mountains, where rising warm air meets cold slopes"],
["**Haze**","Dry dust and smoke particles","Humidity below ~75%; visibility up to about 2 km"]]},
{h:"Clouds",t:1,cols:["Family","Clouds","Look and weather"],rows:[
["**High** (above ~6 km; ice crystals)","**Cirrus** (8–12 km) · **cirrocumulus** · **cirrostratus**","Cirrus: thin, feathery, fair weather, with **halos** from light refracted in ice crystals · cirrocumulus: rippled **mackerel sky** · cirrostratus: milky sheet [UP Lower 2009]"],
["**Middle** (2–6 km)","**Altocumulus** · **altostratus**","Globular masses · grey sheets"],
["**Low** (below 2 km)","**Stratus** · **stratocumulus** · **nimbostratus**","Uniform grey layer with drizzle · layered rolls · thick dark rain cloud of steady rain"],
["**Vertical growth**","**Cumulus** · **cumulonimbus**","Cauliflower heaps of fair weather · towering anvil-topped storm clouds born of **convection** — the only cloud of **hail, thunder and lightning** [CDS 2022 I; JPSC 2003]"]]},
{h:"Clouds in questions",t:2,list:[
"Two basic forms :: **stratiform** (layers) and **cumuliform** (heaps); by height they are high, middle and low; **nimbus** in a name means precipitation [CDS 2023 II]",
"Stratus, nimbostratus and stratocumulus are **low** clouds, !!not high ones!! [CDS 2023 II]"]},
{h:"Precipitation",t:1,list:[
"**Instability** :: air that does not resist rising — it convects, builds cloud and rains; it comes with strong heating, low pressure and converging winds",
"Precipitation needs :: **lifting** of moist air, **cooling below the dew point**, and **hygroscopic nuclei** to condense on",
"**Snow** :: below 0°C vapour turns straight into hexagonal ice crystals, which clump into flakes",
"**Sleet** :: frozen raindrops or refrozen melt — a layer **above freezing** lies over a **sub-freezing** layer near the ground",
"**Hail** :: rounded lumps of ice with **concentric layers**, grown in **cumulonimbus** clouds as drops are lifted again and again through freezing layers",
"Hail in India comes mostly in the **pre-monsoon** months (March–May) — !!not usually in the monsoon season!! [CAPF 2024]",
"**Collision–coalescence** :: droplets collide and merge into raindrops — the process in **warm clouds that stay below the freezing level** [CDS 2014 II]",
"The amount of rain depends chiefly on the air’s **humidity** [UPPCS 2017]"]},
{h:"Three kinds of rainfall",t:1,fig:{kind:"svg",
alt:"Three panels. Convectional: the Sun heats the ground, air rises into a towering cloud and rain falls. Orographic: moist wind rises up the windward slope of a mountain and rains, leaving a dry rain shadow on the leeward side. Frontal: warm air rises over a wedge of cold air along a front, forming cloud and rain",
caption:"Every rain needs rising air. Heating lifts it in convectional rain, a mountain in orographic rain, and a wedge of cold air in frontal rain.",

{h:"Rainfall types",t:1,list:[
"**Convectional** :: strong heating makes moist air rise into **cumulonimbus**, giving short afternoon downpours with thunder — daily in the equatorial belt, in summer in the tropics and continental interiors",
"A day of clear morning, sea breeze, mounting heat, thunder-cloud and a short heavy afternoon shower describes the **equatorial** region [CSE 2015; BPSC 1994]",
"Places within **5°–8°** of the equator get rain all year, because high heat and humidity give convectional showers, mostly in the afternoon — the reason explains the assertion [CSE 2003]",
"**Orographic (relief)** :: moist air forced up a range rains on the **windward** side and descends dry on the **leeward** side — the **rain shadow** (Ladakh, the Deccan east of the Western Ghats)",
"**Frontal (cyclonic)** :: warm air lifted over cold air along a front — the rain of temperate cyclones between **40° and 60°**"]},
{h:"World pattern of rainfall",t:2,list:[
"Rainfall **decreases from the equator towards the poles** and is heavier over oceans than over land",
"Between **35° and 40°** N and S, the **east coasts** are wetter (trades) and rain decreases westward",
"Between **45° and 65°** N and S, the **west coasts** are wetter (westerlies) and rain decreases eastward",
"Where mountains run parallel to the coast, the **windward side is wet** and the lee dry — the Western Ghats",
"**Over 200 cm** :: the equatorial belt, windward west coasts of the cool temperate zone, and monsoon coasts",
"**100–200 cm** :: much of the interior and coasts in the tropics, and temperate lands at 40°–60° with frontal rain",
"**50–100 cm** :: central tropical lands and the eastern and interior parts of temperate lands",
"**Under 50 cm** :: rain-shadow interiors, high latitudes and the subtropical deserts (about **25 cm**, under sinking air)"]},
{h:"Air masses and fronts",t:1,list:[
"Air mass :: a vast body of air, hundreds to thousands of km across, with **uniform temperature and humidity** taken from its **source region** — a uniform surface under light, diverging winds (anticyclones)",
"Types :: **mT** maritime tropical · **cT** continental tropical · **mP** maritime polar · **cP** continental polar · **cA** continental arctic",
"**Front** :: the boundary between unlike air masses; its birth is **frontogenesis**, its decay **frontolysis**",
"**Cold front** :: cold air **undercuts** warm air on a steep slope — **cumulonimbus**, short heavy rain and thunderstorms",
"**Warm front** :: warm air **climbs gently** over cold air — cirrus giving way to **nimbostratus** and long, steady rain over a wide area",
"Cold fronts usually move **faster** than warm fronts and **overtake** them [CDS 2015 II]",
"**Occluded front** :: the warm air has been **lifted clear of the ground** when the cold front catches the warm front [CAPF 2015]",
"**Stationary front** :: neither air mass advances; disturbed, it becomes a warm or cold front",
"Air-mass effects :: **maritime** air carries moisture and rain inland, **dry continental tropical** air keeps the subtropics arid, **Siberian polar** air chills its neighbours in winter, and warm, moist **maritime tropical** air feeds tropical cyclones and the Indian monsoon",
"Where air masses meet they build **fronts, frontal fog, frontal inversions and temperate cyclones**"]},
{h:"Temperate cyclones",t:1,list:[
"Temperate (extra-tropical, wave) cyclone :: a frontal low of **35°–65°** N and S, over land and sea",
"Life cycle :: stationary front → a wave forms → a **warm sector** between the warm and cold fronts → the cold front gains and the sector narrows → **occlusion** → the low fills and dies",
"**Divergence under the jet stream** aloft lets surface air converge, bringing the air masses together",
"Temperate cyclones travel **west → east** with the westerlies; tropical ones follow the **trades** westward [CDS 2019 I]",
"Signs of approach :: falling pressure and temperature, a wind shift, and a **halo** round the Sun or Moon"]},
{h:"Tropical and temperate cyclones",t:1,cols:["Feature","Tropical","Temperate"],rows:[
["Where","Over warm seas, about **5°–25°**","Land and sea, **35°–65°**"],
["Size","Smaller — hundreds of km","Larger — up to a few thousand km"],
["Moves","**East → west**, often recurving poleward","**West → east**"],
["Energy","**Latent heat** of condensation","Contrast between **air masses** along fronts"],
["Fronts and eye","No fronts; a calm **eye**","Warm, cold and occluded fronts; no eye"],
["Winds and rain","Violent winds, torrential rain for a few days","Moderate winds, light rain lasting days"],
["Season","Late summer and autumn","Strongest in winter"]]},
{h:"How tropical cyclones form",t:1,list:[
"Conditions :: sea surface **above ~27°C** over a warm layer about **50–60 m deep**, enough **Coriolis force**, **low vertical wind shear**, a pre-existing low, upper-level divergence and humid mid-levels",
"Deep convection builds cumulonimbus, and the **latent heat** released in them warms the core and powers the storm",
"None form within about **5°** of the equator (too little Coriolis force) or poleward of about 25°–30° (seas too cool)",
"None form in the **South Atlantic and south-east Pacific** because the **ITCZ seldom occurs** there [CSE 2015]",
"**Cold currents and dry air** off the western coasts of continents also suppress them",
"Tropical cyclones form over **warm seas**, need the **Coriolis force** and develop a calm **eye** of sinking air — they are !!not mid-latitude storms!! [CAPF 2018]",
"Hurricanes are tropical cyclones that develop in **low latitudes**, !!not mid-latitudes!! [CDS 2019 I]",
"Recurvature :: a cyclone drifting poleward is swung **north-eastward** by the westerlies; such paths are hard to forecast — **Ockhi** (2017) curved towards Gujarat",
"Global warming is raising the frequency and severity of **cyclones, storms and hurricanes** alike [UPPCS 2018]"]},
{h:"Names of tropical cyclones",t:1,cols:["Name","Where"],rows:[
["**Cyclone**","Indian Ocean — India [UPPCS M 2005; CDS 2021 I]"],
["**Hurricane**","Atlantic and north-east Pacific — **USA** and the Caribbean [UPPCS 2020, 2019, 2014; UPPCS M 2005; CDS 2021 I]"],
["**Typhoon**","North-west Pacific — **China**, the South China Sea [UPPCS 2020, 2019, 2014; UPPCS M 2005; CDS 2021 I]"],
["**Taifu**","**Japan** [UPPCS 2019]"],
["**Baguio** (bagyo)","**Philippines** [UPPCS 2020, 2019, 2014]"],
["**Willy-willy**","North-west **Australia** [UPPCS 2020, 2019, 2014; UPPCS M 2005; CDS 2021 I; UP UDA 2001]"]]},

{h:"Anatomy of a tropical cyclone",t:1,list:[
"**Eye** :: the centre, roughly 10–50 km across — calm and clear, with the **lowest pressure** and the **highest temperature**, since sinking air warms [CDS 2016 I; CAPF 2014]",
"The eye is **warmer** than its surroundings, by as much as 10°C — !!not 10°C cooler!! [CSE 2020]",
"Only **tropical** cyclones develop an eye, so “only some cyclones develop an eye” is true [CSE 2020]",
"**Eye wall** :: a ring of towering cumulonimbus round the eye, with the **strongest winds** and heaviest rain",
"**Spiral rain bands** :: feeder bands of cloud hundreds of km long that give the storm its galaxy-like look; between them lie zones of suppressed cloud",
"Surface winds **spiral inward** to the centre and **rise in the eye wall**; air sinks only in the narrow eye [CSE 2002]",
"**Storm surge** :: onshore winds and low pressure pile sea water onto the coast — the storm’s deadliest effect",
"Hurricane damage scale :: **Saffir–Simpson** (categories 1–5) [UPPCS M 2016]",
"Tornado intensity scale :: **Fujita** (Enhanced Fujita) [UP Lower 2009]"]},
{h:"Thunderstorms, cloudbursts and tornadoes",t:1,list:[
"Thunderstorm :: intense heating and convection build cumulonimbus; up- and down-draughts **separate electric charges**, and lightning flashes between them",
"Thunder is produced by the **sudden expansion of air heated by lightning** — !!not by clouds colliding, lightning separating clouds or rising air!! [CSE 2013]",
"With too little moisture, a thunderstorm raises a **dust storm** instead",
"Thunderstorms need instability, low-level moisture, and **low-level convergence with upper-level divergence**; cold, dry air below warm, moist air is stable and !!does not favour them!! [CAPF 2017]",
"**Cloudburst** :: a sudden, very heavy, localised downpour with thunder and lightning, mostly in **hilly areas** — IMD’s threshold is **10 cm (100 mm) in an hour** over a small area; it can strike **by night** too [CDS 2017 I]",
"Cloudburst events :: **Leh (2010)**, **Kedarnath (2013)**, **Dharamshala (2021)**; Mumbai’s deluge of July 2005 is often counted with them",
"Cloudburst trigger :: warm, very humid air rising fast over **steep slopes**, where clouds build up without releasing rain until they dump it at once",
"**Tornado** :: a violently rotating funnel from a thunderstorm to the ground, with the **lowest pressure** at its core and winds up to about 450 km/h; a **waterspout** is one over water",
"A tornado forms when wind changing in speed and direction with height sets the air **spinning horizontally** and a thunderstorm’s updraft **tips the spin upright**",
"Tornadoes are mid-latitude storms — the **Great Plains (Mississippi plains) of the USA** are **Tornado Alley** (Texas, Oklahoma, Kansas, Nebraska) [UPPCS 2005; UP Lower 2009]",
"An old key named the **Caribbean** as the home of tornadoes, but tornadoes are !!not tropical cyclones!! [UPPCS 1996]"]}
]});

{h:"Climate types from the equator to the poles",t:1,cols:["Type","Where","Climate","Vegetation"],rows:[
["**Equatorial** (Af)","Within ~5°–10° of the equator — Amazon, Congo, Indonesia, Malaysia, Singapore, Papua New Guinea, Ecuador, Colombia","Hot all year (~27°C), tiny annual range, over 200 cm of rain from daily convection; no seasons, shortest twilight","**Tropical rainforest** — evergreen, broadleaf, layered, with epiphytes and climbers"],
["**Tropical monsoon** (Am)","South Asia, Myanmar, Thailand, Indo-China, northern Australia","Wet summer and dry winter from seasonally reversing winds","Deciduous — trees shed leaves in the dry season"],
["**Tropical marine**","Central America, north-east Australia, eastern Brazil","Onshore trades bring rain in both seasons","Evergreen and semi-evergreen"],
["**Savanna (Sudan type)** (Aw)","Between the rainforest and the deserts — Sudan and East Africa, the llanos and campos, northern Australia","Wet summer, longer dry winter; ~70–150 cm","Tall grass with scattered drought-resistant trees"],
["**Hot desert** (BWh)","Western sides of continents at **15°–30°** — Sahara, Arabia, Thar, Kalahari, Namib, Atacama, Great Australian, Mojave–Sonoran","Under 25 cm of rain; **diurnal range greater than annual range**","Xerophytes — cacti, thorny scrub"],
["**Mediterranean** (Cs)","Western sides at **30°–45°** — Mediterranean lands, California, central Chile, the Cape, south and south-west Australia","**Warm dry summer, mild wet winter**","Evergreen, drought-resistant, deep-rooted shrubs and trees"],
["**China type** (Cfa)","Eastern sides at 25°–45° — eastern China, south-east USA, south-east Brazil, Natal, south-east Australia","Hot humid summer, cool winter, **rain all year** (summer maximum)","Mixed broadleaf evergreen and deciduous"],
["**Temperate grassland** (BSk)","Continental interiors — steppes, prairies, pampas, veld, downs","Extreme temperatures, 25–75 cm of rain","Short, nutritious grass; wheat and ranching"],
["**British (marine west coast)** (Cfb)","Western sides at 40°–65° — north-west Europe, British Columbia, southern Chile, Tasmania, New Zealand","Mild; rain all year from onshore westerlies; low annual and daily range","Deciduous and mixed forest"],
["**Laurentian** (cool temperate east margin)","North-east USA, eastern Canada, northern China, Korea, northern Japan","Warm summers, cold winters below 0°C; rain all year","Mixed deciduous and coniferous"],
["**Siberian (taiga)** (Dfc)","About 50°–70°N only — Siberia, Scandinavia, Canada, Alaska","Long, severe winters; short summers; the largest annual range","**Boreal coniferous forest**"],
["**Tundra** (ET)","Beyond the Arctic Circle — northern Canada, Alaska, northern Russia, Greenland’s coasts","Long frozen winter, brief cool summer, permafrost","Mosses, lichens and sedges; no trees; animals and birds mostly migrate"],
["**Ice cap** (EF) · **highland** (H)","Antarctica, interior Greenland · high mountains","Permanently frozen · climate changes with height","None · belts of vegetation stacked by altitude"]]},
{h:"Equatorial climate and the rainforest",t:1,list:[
"The equator has no season but summer, because day and night stay **nearly equal all year** [CDS 2014 II]",
"The equatorial climate suits **plants but not people**, and its annual range is **very small** — both true, but the small range does not explain it [UP UDA M 2010]",
"Not equatorial :: **Ethiopia** (a highland) — Congo, Gabon and the DR Congo (Zaire) are [UP UDA 2013]",
"Unique to equatorial forest :: **tall, closely set trees** with a continuous canopy, **very many species**, and **numerous epiphytes** [CSE 2013]",
"Leaf litter decomposes faster than in any other biome, the forest floor is often bare, and climbers and epiphytes reach the canopy — a **tropical rainforest** [CSE 2021]",
"Rainforest soil is **poor in nutrients**: rapid decomposition returns them straight to the plants and heavy rain leaches the rest — !!“the soil is rich in nutrients” is false!! [CSE 2023]",
"Cleared rainforest does !!not!! give lasting **productive farmland** without fertiliser, though its **primary productivity** is very high [CSE 2003]",
"Rainforests :: soils quite infertile, evergreen growth year-round, **“deserts covered by trees”**, and the most productive land ecosystem [CAPF 2021]",
"**Leaching** (soil erosion) is a major problem of tropical rainforests [UPPCS 1998]",
"Buttress roots bear the **mechanical load** of tall, heavy hardwoods [CAPF 2015]",
"The rainforest biome lies about **10°N–10°S** and is megathermal — !!it is not in California or north-west Africa!! [CDS 2017 I]",
"Forests near the equator are **tropical** forests, and the world’s dense forests lie mostly near the equator [CSE 2007; BPSC 1996]",
"Extensive tropical rainforest :: the **Congo basin** — not the Ganga, Hwang Ho or Murray–Darling [UPPCS 1996]",
"Largest and densest rainforests :: **Brazil** (Amazon) [UP Lower 2004; UKPCS 2002]",
"Dense, hot, humid forest in Africa :: **Ivory Coast**, on the Gulf of Guinea — not Kenya, Zimbabwe or South Africa [UPPCS 1998]",
"The **Congo basin** holds the world’s largest tropical peatland (the Cuvette Centrale)",
"Brazil’s equatorial rainforests are the **selvas** — broadleaf evergreen; its dark, fertile coffee soil is **terra roxa** [UPPCS 2025; UP BEO 2019]",
"Equatorial trees :: **mahogany, rosewood and ebony** [UP RO M 2013]"]},
{h:"Monsoon and savanna lands",t:1,list:[
"The seasonal reversal of winds is the hallmark of the **monsoon** climate [CSE 2014]",
"Monsoon forests are **deciduous** — **teak and sal** [UP RO M 2013]",
"Savanna climate :: a **definite dry and a definite wet season** [CSE 2012]",
"Equatorial — **Congo** · Mediterranean — **California** · monsoon — **Bangladesh** · savanna — **Sudan** [UPPCS 2003; UP UDA 2002]",
"Savannas stay grassland because of **fire**, **grazing herbivores** and **seasonal rainfall** — !!not burrowing animals, termites or soil!! [CSE 2021]",
"Savanna vegetation :: grassland with scattered **flat-topped trees** and shrubs, between the rainforest and the steppes and deserts [CDS 2014 I]",
"Match :: epiphytes — **equatorial** · acacia — **Sahara** · baobab — **savanna** · cedars — **Mediterranean** [UPPCS 2019]",
"The tropical savanna is the **land of big game** [UPPCS 2019]",
"Savannas are most widespread in :: **Africa** [UPPCS M 2011; UPPCS 1993]",
"Tropical deciduous forests grow in the **West Indies**, **South and South-East Asia**, **eastern Africa** and **northern Australia** — !!not south-west North America!! [CAPF 2019]"]},
{h:"Hot deserts",t:1,list:[
"Most hot deserts lie on the **western margins** of continents at **15°–30°**, where the trades have lost their moisture — the reason explains the assertion [UP BEO 2019]",
"The **subtropical high**, **offshore trades** and **cold currents** together make the hot deserts",
"The African–Eurasian desert belt comes from the **subtropical high-pressure cells** — !!not warm ocean currents!! [CSE 2011]",
"Desert :: annual rain **under 25 cm** [UP Lower 2009]",
"Desert leaves cut water loss by being **hard and waxy**, **tiny or absent**, or turned into **thorns** [CSE 2013]",
"Atacama is the driest desert; a key accepted as the reason that it lies between the Coastal Range and the Andes, which block moisture — the cold **Humboldt** current and the subtropical high matter too [CDS 2014 II]",
"California — **Mediterranean** · Western Australia — **hot desert** · Bangladesh — **tropical monsoon** · Siberia — **cold temperate** [UPPCS 1999]",
"Australia’s interior is desert and semi-desert — true; northern Australia is **tropical**, !!not temperate!! [UPPCS 2025]"]},
{h:"Mediterranean climate",t:1,list:[
"Summer :: the belts shift poleward, so the **subtropical high** and dry offshore trades bring **warm, dry weather**",
"Winter :: the belts shift equatorward and onshore **westerlies** with temperate cyclones bring **rain** — both true, the reason explains it [UPPCS M 2004]",
"Rain comes in winter — true; in summer the region lies under **dry continental trades** — true, !!but that is not why winter is wet!! [UPPCS 2022]",
"It rains in **winter**, and at the northern winter solstice the pressure belts shift **south** — both correct [UPPCS 2024]",
"Its most noticeable trait :: a **dry summer** [CDS 2019 II]",
"Warm, dry climate, mild wet winter and **evergreen oak** point to the :: **Mediterranean** [CSE 2010]",
"Wet winter, dry summer :: **Italy** [UPPCS M 2004]",
"Mediterranean rain falls in **winter** and monsoon rain mostly in **summer**; both have **wet and dry seasons** [CDS 2016 I]",
"Mediterranean temperatures :: a **moderate range**, warm-to-hot summers and **mild winters** [CDS 2015 II]",
"The south coast of Australia faces the southern Indian Ocean and gets winter rain in **June–August** — !!not December–January, its summer!! [CAPF 2024]",
"Trees and crops :: **holm and cork oak**, olive, fig, chestnut, **cedar**, grapes and **citrus** — the world’s orchard lands and a leading citrus supplier [CDS 2019 II]",
"**Teak** is !!not!! a Mediterranean tree — **oak, chestnut and olive** are [UP RO M 2021]",
"Mediterranean forests :: **olive and plum** [UP RO M 2013]",
"Scrub names :: **maquis** — Mediterranean coasts · **chaparral** — California · **matorral** — Chile · **fynbos** — South Africa · **mallee** — Australia [UPPCS 2019; CAPF 2017]",
"Chaparral grows in the **Mediterranean** climate, !!not the taiga!! [CAPF 2020]"]},
{h:"Temperate and cold climates",t:1,list:[
"British type :: rain in **all months** from onshore westerlies, with low annual and daily range — the description with 50–250 cm of rain is the **marine west coast** climate [CSE 2024]",
"Western Europe gets rain in every month and lies in the **westerlies** — both true [UPPCS 2024]",
"North-west European ports stay open all year and south-westerlies blow there all year — both true, but the ports stay ice-free because of the warm **North Atlantic Drift** [UPPCS M 2002]",
"Marine west coast — a temperature cycle **moderated by the sea** · dry mid-latitude — a **strong cycle with a large range** · moist continental — warm summers and cold winters with about **three months below freezing** [CDS 2015 II]",
"China-type climate has rain throughout the year and tropical highlands show **vertical zones** of climate — true; equatorial lands have no four seasons and Mediterranean summers are dry [CSE 2002]",
"Extreme climate, scanty rain and nomadic herders describe the :: **Central Asian steppe** [CSE 2013]",
"Siberian (taiga) climate exists only in the **N Hemisphere**; its boreal forest is the largest continuous stretch of vegetation on Earth",
"Temperate coniferous (taiga) forests cover the **largest share** of the world’s forest area [CSE 2003]",
"Taiga forests belong to the :: **temperate** region [UPPCS M 2016]",
"Temperate coniferous forest :: little **undergrowth**, a growing season of only **50–100 days** and a **very large annual temperature range** — !!not a low one!! [CDS 2019 II]",
"**Amazonia** has no coniferous forest — they grow in Scandinavia, Canada and Finland [UPPCS 2001]",
"Coniferous forests :: **pine and spruce** [UP RO M 2013]",
"Tundra biodiversity is low because the **warm growing season is short** — the reason explains it [CDS 2018 I]",
"No timber grows in the **tundra** [CDS 2020 II]",
"Lichens dominate the **tundra** [CAPF 2020]",
"Belarus has **no tundra**; Russia, Canada and the USA (Alaska) do [CDS 2020 II]",
"From Zaire to the Netherlands :: **equatorial → hot desert → Mediterranean → West European** [UPPCS 2002]"]},
{h:"Temperate grasslands",t:1,cols:["Grassland","Where"],rows:[
["**Steppes**","**Eurasia** — Ukraine to Mongolia [UPPCS 2014; UPPCS M 2016, 2015; CAPF 2023]"],
["**Prairies**","**North America** — USA and Canada [UPPCS M 2016, 2015; CDS 2015 I; CAPF 2023]"],
["**Pampas**","**Argentina**, with Uruguay and southern Brazil [UPPCS 2018, 2005; UPPCS M 2015, 2012; UP RO 2017; CDS 2015 I; CAPF 2023]"],
["**Veld**","**South Africa** — !!not Australia!! [UPPCS M 2016, 2015; UP RO 2017; CAPF 2023]"],
["**Downs**","**Australia** (Murray–Darling basin) — temperate, !!not tropical!! [UPPCS M 2002; UP RO 2017; CDS 2015 I]"],
["**Puszta**","**Hungary** [UP RO 2017]"],
["**Canterbury**","New Zealand"]]},
{h:"Grassland facts",t:1,list:[
"Tropical grasslands :: the **savanna** (Africa), **llanos** (Venezuela and Colombia, Orinoco basin) and **campos** (Brazil)",
"**Llanos — Venezuela** is correct; campos are in Brazil’s south-east, the pampas in Argentina, and selvas are rainforest [UP GIC 2010; UPPCS M 2016; CDS 2015 I]",
"**Savanna** is !!not a temperate grassland!! [UP Lower 2013; UPPCS 2012]",
"The Pampas are Argentina’s main farming region because of **fertile soil and a temperate climate** — the reason explains it (wheat and cattle) [UP RO M 2016]",
"Temperate grasslands get **less rain than savannas** (about 25–75 cm), spread through the year with a late-spring maximum; their short, nutritious grass suits grazing and wheat"]},
{h:"Forest belts and timber",t:2,list:[
"Tropical rainforest :: **evergreen, many-layered**, with little undergrowth under the canopy and the highest biodiversity",
"Monsoon forest :: **deciduous**, a little less dense than rainforest — South Asia, Indo-China, eastern Africa, northern Australia",
"Mediterranean :: **evergreen short bushes** and **deep-rooted** plants that survive the dry summer — chaparral, citrus, grapes",
"Mixed forest :: **broadleaf deciduous with conifers**, where it is neither very hot nor very cold — the China and British type regions",
"Coniferous (boreal) :: conical, evergreen and **needle-leaved** — needles cut water loss when the ground is frozen and cones shed snow; few species, the largest continuous forest",
"Timber by country :: **Douglas fir — Canada**, **mahogany — Honduras**, **teak — Myanmar** [CSE 1999]",
"Highest forest share among China, India, Indonesia and Japan :: **Japan** (~68%) [UP UDA 2010]",
"**Bhutan**’s constitution requires at least **60%** of its land to stay under forest [UPPCS M 2016]"]},
{h:"Weather records",t:2,list:[
"Wettest place (highest average annual rain) :: **Mawsynram**, Meghalaya — ahead of Cherrapunji [UP UDA 2001; UPPCS 1997]",
"Coldest recorded temperature :: **−89.2°C at Vostok**, Antarctica (1983); among inhabited places, **Verkhoyansk** and Oymyakon in Siberia (about −68°C) — keyed against Halifax, Chicago and Siachen [UPPCS 1999; UP Lower 2004]",
"Hottest, coldest, wettest, driest :: **Sahara**, **Antarctica**, **Cherrapunji** (an older key), **Chile’s Atacama** [BPSC 2008]",
"Highest air temperature recognised by WMO :: **56.7°C** at Furnace Creek, **Death Valley** (1913)"]}
]});

/* ===== 09 OCEANS: RELIEF, SALINITY, CURRENTS & TIDES ===== */
SEC({id:"oceans",title:"Oceans: Relief, Salinity, Currents & Tides",group:"Climate & Oceans",tier:2,
stats:["UPSC CSE: 9 Q (2010–24) in 6 of 17 papers — currents 4 (2012, 2013, 2015, 2021), where fresh water is stored 3 (2010, 2013, 2021), tides (2015); coral reefs came twice more (2014, 2018); older papers asked currents (1997, 1999, 2002) and ocean temperature ranges (2007)","UPPCS Pre: 9 Q (2019–25) in 6 of 8 papers — current ↔ ocean (2020, 2025), trenches (2022), salinity and tides (2023), density layers (2024), water supply and the Indian Ocean (2025); older UPPSC papers asked currents, salinity, tides and trenches about 20 times","Formats: current ↔ ocean or warm/cold, trench ↔ ocean matching, causes of tides, salinity and currents, Statement I–II on ocean temperature (CDS/CAPF: a current item almost every year)"],
note:"The ocean floor from shelf to trench, how temperature and salinity vary, the great current circuits and what they do, then tides, waves and tsunamis, coral reefs and maritime zones. El Niño, the IOD and ocean heat in monsoon forecasts are in the India climate sheet; named seas, straits and islands are in the World sheets.",
blocks:[
{h:"Water on the Earth",t:1,list:[
"About **71%** of the surface is water; about **97%** of all water is salt water in the oceans",
"Fresh water :: **glaciers and ice caps ~69%** > **groundwater ~30%** > lakes, rivers, swamps, soil moisture and the air **under 1%**",
"Usable fresh water is **less than 1%** of all water — true; but about 69%, !!not 95%!!, of fresh water is locked in ice [CSE 2010]",
"After ice caps and glaciers, most fresh water exists as :: **groundwater** [CSE 2013]",
"There is **more water in ice caps and glaciers than underground**, and more underground than in rivers and lakes [CSE 2021]",
"The largest store of fresh water :: **glaciers and ice caps** [UPPCS 2015]",
"World water supply in descending order :: **oceans > polar ice and glaciers > groundwater > rivers** [UPPCS 2025]",
"**Datum line** :: the horizontal reference level (mean sea level) from which heights and depths are measured [UPPCS 1994, 1991]"]},
{h:"The ocean floor",t:1,fig:{kind:"svg",

{h:"Relief of the ocean floor",t:1,cols:["Feature","What it is","Facts"],rows:[
["**Continental shelf**","Gently sloping, drowned edge of the continent, to about **150–200 m** deep; average width ~80 km","Sunlit and rich in plankton — the great **fishing grounds**; thick sediments that become **fossil fuels**; narrow or absent along active plate margins such as Chile and west Sumatra"],
["**Continental slope**","Steep drop from the **shelf break** to about 3,000 m","Cut by **submarine canyons** carved by turbidity currents — the Hudson Canyon"],
["**Continental rise**","Gentle apron of sediment at the foot of the slope","Merges into the abyssal plain"],
["**Abyssal (deep-sea) plains**","Flat floor at **3,000–6,000 m**, blanketed by fine sediment","The **flattest, smoothest** surfaces on Earth and the **most extensive** part of the ocean floor [UKPCS 2012]"],
["**Mid-ocean ridge**","Twin volcanic ranges with a **rift valley** along the crest","The **longest mountain chain** on Earth; some peaks rise as islands (Iceland, the Azores)"],
["**Seamount · guyot**","Submerged volcanic peak with a pointed top, 3,000–4,500 m tall · a **flat-topped** one","The **Emperor seamounts** continue the Hawaiian chain"],
["**Trench (deep)**","Narrow, steep-sided trough 3–5 km deeper than the floor around it","At subduction zones beside **island arcs** and young fold ranges, with strong earthquakes and volcanoes"]]},
{h:"Ocean-floor facts in questions",t:2,list:[
"Many of the world’s biggest mountain chains lie **under the sea**, some show above it as **island arcs**, and the mid-ocean ridges are the **longest** — but the Mid-Atlantic Ridge rises some **2–3 km**, !!not 33 m!!, above the floor [CAPF 2023]",
"A shelf is **heavily sedimented**, a rich **fishing area**, and absent near some plate boundaries; the key picked “abrupt falls towards the continental slope” as the wrong statement, though a shelf does end at a steep **shelf break** [CAPF 2015]"]},
{h:"Oceans and their deepest points",t:1,cols:["Ocean","Deepest point","Depth"],rows:[
["**Pacific**","**Mariana Trench** — **Challenger Deep**","~10,900 m, the deepest point on Earth [UPPCS 2022, 1991; UPPCS M 2017; CDS 2020 II]"],
["**Atlantic**","**Puerto Rico Trench**","~8,400 m [UPPCS 2022; UPPCS M 2017]"],
["**Indian**","**Java (Sunda) Trench**","~7,200 m [UPPCS 2022; UPPCS M 2017]"],
["**Southern**","South Sandwich Trench","~7,400 m"],
["**Arctic**","**Molloy Deep** (Fram Strait); an older key gave the **Eurasian Basin**","~5,550 m [UPPCS 2022; UPPCS M 2017]"]]},
{h:"Temperature of ocean water",t:1,list:[
"Controls :: **latitude**, **prevailing winds** (offshore winds drag warm water away and cold water **upwells**), **currents**, and enclosure by land",
"Surface temperature averages about **27°C** near the equator and falls about **0.5°C per degree of latitude** — ~22°C at 20°, ~14°C at 40°, near 0°C at the poles",
"The warmest water lies **a little north of the equator**, and N Hemisphere oceans (~19°C) are warmer than southern ones (~16°C) because of more land",
"Enclosed seas in low latitudes are **warmer** than the open ocean",
"Three layers in low latitudes :: a **warm, wind-mixed surface layer** (20–25°C, a few hundred metres) → the **thermocline**, where temperature drops fast → a **deep cold layer** near 0–4°C",
"Deep water is cold because it **sinks from the polar seas** — !!sea water has no density maximum at 4°C; that belongs to fresh water!!",
"Polar seas have a **single cold layer**, near 0°C from top to bottom",
"The lake names **epilimnion, metalimnion (thermocline) and hypolimnion** are sometimes borrowed for these layers",
"Layers of sharp change :: **thermocline** — temperature · **halocline** — salinity · **pycnocline** — **density** [UPPCS 2024, 2015]",
"The Atlantic has a **greater annual range** than the Pacific — it is narrower and more hemmed in by land — !!not the Pacific!! [CSE 2007]",
"In the **tropics** the trades pile warm water in the **western** parts of oceans; in the **temperate zone** the westerlies make the **eastern** parts warmer [CSE 2021]"]},
{h:"Salinity",t:1,list:[
"Salinity :: grams of dissolved salt in **1,000 g of sea water** (‰); the average is about **35‰**",
"Salt that contributes most :: **sodium chloride** (~78%), then magnesium chloride, magnesium sulphate, calcium sulphate and potassium sulphate [UPPCS 2000]",
"By ions per kg :: **chloride (~19 g) > sodium (~11 g)** > sulphate > magnesium > calcium",
"Salinity rises with **evaporation** (heat, wind, dry air) and **freezing**; it falls with **rain**, **river water** and **melting ice**; currents mix it — it depends on evaporation and precipitation, and changes of temperature or density affect it [CAPF 2016]",
"Salts come from **rock weathering carried by rivers**, submarine volcanoes and vents; losses to sediments and gains balance, so the ocean’s salinity stays roughly constant",
"Highest surface salinity :: near the **Tropics of Cancer and Capricorn** (hot, dry, high evaporation), !!not the rainy equator!! [UPPCS 2023]",
"By zone :: **subtropical > equatorial > temperate > polar**",
"Vertical profile :: polar surface water is **freshened by melting ice**; subtropical water is **salty at the top** and freshens to a uniform level below; equatorial surface water is **freshened by rain**",
"**Isohalines** :: lines joining places of equal **salinity** [CDS 2022 I]",
"Above normal :: the **Red Sea** (up to ~41‰, the saltiest open sea), the **Persian Gulf** and the **Mediterranean** — hot, dry and nearly enclosed",
"Below normal :: the **Baltic** (~7‰), Black Sea, Arctic Ocean, North Sea, Bering Sea and Gulf of St Lawrence — cold, or fed by many rivers",
"The **Bay of Bengal** is less salty than the **Arabian Sea**: the Ganga and Brahmaputra pour in fresh water, while the Arabian Sea has **high evaporation and little river inflow** [CAPF 2018]",
"Older figures used in keys :: **Lake Van (330‰) > Dead Sea (238‰) > Great Salt Lake (220‰)** [UPPCS 1995]",
"Modern measurements put the **Dead Sea near 340‰** and Lake Van, a soda lake, near 22‰; Antarctica’s Don Juan Pond is saltier still",
"Saltiest sea among the Caspian, Mediterranean, Red and Dead :: the **Red Sea** as a true sea, the **Dead Sea** if lakes count — no single key [UPPCS 2012, 1998]",
"**Atlantification** :: warmer, saltier Atlantic water pushing into the Arctic as sea ice shrinks; the **Arctic Dipole** wind pattern, flipping every ~15 years, has slowed it in its positive phase"]},
{h:"What drives currents",t:1,list:[
"Ocean current :: a steady flow of surface water in a set direction over long distances; **warm** currents run from low to high latitudes, **cold** ones the other way",
"Primary forces :: **solar heating** (water expands, standing a few cm higher near the equator), **winds** (the main driver of surface currents), **gravity** and the **Coriolis force**",
"Secondary forces :: differences in **temperature, salinity and density**, and the shape of coasts and sea floor",
"**Rotation**, **air pressure and wind**, and **water density** influence currents — !!the Earth’s revolution does not!! [CSE 2012]",
"Currents are slow surface movements, help keep the Earth’s **heat balance**, are set moving mainly by **prevailing winds** and are shaped by the ocean’s outline [CSE 2002]",
"The **Sun’s and Moon’s pull** drives **tides**, !!not currents!! [CDS 2022 II]",
"Coriolis turns the big current loops (**gyres**) **clockwise in the N Hemisphere** and **anticlockwise in the S Hemisphere**",
"The **equatorial counter-current** flows east because the two equatorial currents **pile water up in the west** — !!not rotation or the calm belt!! [CSE 2015]",
"In the Indian Ocean north of the equator, currents reverse with the monsoon — the **monsoon drift** [CSE 1997]"]},
{h:"The pattern of currents",t:1,fig:{kind:"svg",

caption:"Every ocean repeats this plan: warm currents on the western side of a basin (east coasts of continents), cold ones on the eastern side (west coasts), and the West Wind Drift circling Antarctica.",

{h:"Major ocean currents",t:1,cols:["Ocean","Warm currents","Cold currents"],rows:[
["**North Atlantic**","North Equatorial, Antilles, **Florida**, **Gulf Stream**, **North Atlantic Drift**, Norwegian","**Canary**, **Labrador**, East Greenland"],
["**South Atlantic**","South Equatorial, **Brazil**","**Benguela**, **Falkland**, West Wind Drift"],
["**North Pacific**","North Equatorial, **Kuroshio** (Japan), North Pacific, **Alaska**","**California**, **Oyashio** (Kurile), Okhotsk"],
["**South Pacific**","South Equatorial, **East Australian**","**Humboldt (Peru)**, West Wind Drift"],
["**Indian Ocean**","**Agulhas**, **Mozambique**, South Equatorial, the monsoon drifts","**West Australian**, West Wind Drift"]]},
{h:"How the circuits run",t:2,list:[
"North Atlantic :: the **South Equatorial Current** splits at **Cape São Roque** (Brazil); one branch joins the North Equatorial into the Caribbean, the other runs outside the West Indies as the **Antilles** Current",
"The water leaves the Gulf of Mexico as the **Florida Current**, becomes the **Gulf Stream** beyond **Cape Hatteras**, meets the cold **Labrador** and East Greenland currents near the **Grand Banks**, and crosses the ocean under the westerlies as the **North Atlantic Drift**",
"The drift splits: the **Norwegian Current** runs past Britain and Norway into the Arctic, and the **Canary Current** turns south between Spain and the Azores to rejoin the North Equatorial Current",
"South Atlantic :: the warm **Brazil Current** swings east near 35°S as the South Atlantic Drift into the **West Wind Drift**; the cold **Falkland** runs between Argentina and the Falklands; the cold **Benguela** returns north along south-west Africa",
"North Pacific :: the North Equatorial Current turns north off the Philippines as the warm **Kuroshio**; the cold **Oyashio** comes down past Kamchatka and the **Okhotsk** past Sakhalin to meet it off Hokkaido",
"The Kuroshio becomes the **North Pacific Current** under the westerlies and splits off North America into the warm **Alaska** Current (north) and the cold **California** Current (south)",
"South Pacific :: the South Equatorial Current turns south as the warm **East Australian** Current; the eastward South Pacific Current turns north off Chile as the cold **Peru (Humboldt)** Current",
"Indian Ocean :: in winter the NE monsoon sets an **anticlockwise** circulation north of the equator with a counter-current; in summer the SW monsoon wipes out the North Equatorial Current and the water turns **clockwise** — the **SW Monsoon Drift**",
"South Indian Ocean :: the South Equatorial Current splits at Madagascar into the **Mozambique** Current (in the channel) and the East Madagascar Current, which join off South Africa as the warm **Agulhas**; the **West Wind Drift** turns north off Western Australia as the cold **West Australian** Current"]},
{h:"Currents in questions",t:1,list:[
"Cold :: **Peru (Humboldt)**, **California**, Canary, Benguela, Labrador, Falkland, Oyashio [UPPCS 1995; CDS 2021 I]",
"Warm :: **Agulhas** and **Brazil** — !!not cold!! [UPPCS 2025, 2017; UP RO M 2017]",
"Warm pairs :: **North Atlantic Drift and Brazil** — not Kuroshio with California, Canary with Benguela, or West Wind Drift with Falkland [CDS 2020 I]",
"Indian Ocean current :: **Agulhas** (with the Mozambique and South Indian Ocean currents) — !!Benguela is Atlantic!! [UPPCS 2020; UPPCS M 2014]",
"The only Atlantic current among the Humboldt, California, Alaska and Benguela :: **Benguela** [UP RO 2023]",
"The cold current of the **South Atlantic** :: **Benguela** [UPPCS 2005]",
"Not part of the South Atlantic loop (Brazil, Benguela, West Wind Drift) :: the **Canary**, which is North Atlantic [UPPCS 2000]",
"Not in the North Atlantic :: **Benguela** [UKPCS 2021]",
"Not in the Pacific :: **Canary** [UKPCS 2016]",
"The Humboldt is a **South** Pacific current, !!not North Pacific!! [UPPCS 1998]",
"The odd one out among Benguela, Brazil, South Equatorial and Peru :: **Peru**, the only Pacific one [RAS 1999]",
"Match :: Gulf Stream — **warm current** · West Wind Drift — **slow eastward drift under the westerlies** · Peru — **Pacific** · West Australian — **Indian Ocean** [JPSC 2013]",
"Match :: Kuroshio — **Pacific** · Agulhas — **Indian** · East Wind Drift — **Antarctic** · Antilles — **Atlantic** [CAPF 2024]",
"Map item :: the **Benguela** and **Guinea** currents off south-west and west Africa [CSE 1999]",
"Kuroshio :: a warm, north-flowing current on the **west side of the North Pacific**, like the Gulf Stream; it starts off the **Philippines and Taiwan**, !!not off Japan!!, and warms southern Japan’s coral reefs [CAPF 2014]",
"The Kuroshio is warm because it comes from the **tropics**, !!not from volcanoes on the Sea of Japan floor!! [CDS 2015 II]",
"Gulf Stream :: **warm and poleward**, like the Kuroshio, shaping the weather of the US east coast — it !!does not!! feed West Pacific reefs [CDS 2017 I]",
"Country that gains most from the North Atlantic Drift :: **Norway** (ice-free ports) [RAS 1999]"]},
{h:"What currents do",t:1,list:[
"Currents move **heat and salt** from the equator towards the poles and balance the Earth’s temperature",
"Cold currents on **tropical west coasts** chill and dry the air and help make **deserts** — Canary → Sahara, Benguela → Namib, Peru → Atacama",
"Warm currents on **tropical east coasts** raise evaporation and rain and breed **tropical cyclones** — Florida, the China and Japan coasts",
"Warm drifts keep **temperate west coasts** mild and their ports ice-free — the North Atlantic Drift and western Europe",
"Where warm and cold currents meet, plankton thrive — the world’s great **fishing grounds** — but fog is frequent [CSE 2013]",
"The **Grand Banks** off Newfoundland lie where the warm Gulf Stream meets the cold Labrador; without the Labrador there would be !!no north-west Atlantic fishing grounds!! [CDS 2015 I]",
"Cold currents are zones of **upwelling**, lifting nutrient-rich water to the surface — the rich fisheries off Peru and Chile"]},
{h:"Sargasso Sea",t:2,list:[
"Sargasso Sea :: the only sea with **no coastline**, ringed by currents in the North Atlantic gyre [UPPCS M 2016]",
"Its bounding currents :: the **Gulf Stream** (west), **North Atlantic Current** (north), **Canary** (east) and **North Equatorial** (south) [CAPF 2014]",
"It lies **east of the Gulf Stream and west of the Canary** — !!not the other way round!!; its water circulates **anticyclonically**, calm and salty [CDS 2019 I]",
"It is marked by floating brown seaweed, **sargassum** — typical marine vegetation [UP RO 2014]"]},
{h:"Upwelling and deep circulation",t:2,list:[
"**Upwelling** :: offshore winds push surface water away, and cold, nutrient-rich water rises — strongest along cold-current coasts",
"**Downwelling** :: onshore winds pile water against the coast and it sinks — also where sea ice forms and where currents converge",
"**Thermohaline circulation** :: deep flow driven by **density** (temperature and salinity); it starts where polar water, made saltier by forming ice, sinks, and it rises again in upwelling zones",
"The deep flow links all the oceans in one loop — the **global conveyor belt**",
"**AMOC** (Atlantic Meridional Overturning Circulation) :: the Atlantic arm of the conveyor, which carries the Gulf Stream’s heat north",
"The IPCC’s latest assessment finds the AMOC **very likely to weaken** this century as meltwater freshens the North Atlantic, the NAD weakens and polar warming cuts the temperature contrast; one 2023 study put a possible **collapse** between 2025 and 2095, though the IPCC judged collapse before 2100 unlikely",
"A weaker AMOC would mean **harsher western European winters**, higher sea levels on the western Atlantic’s shores, and disturbed fisheries",
"**Water mass** :: a body of water with uniform temperature and salinity — surface (subtropical), intermediate (Antarctic Intermediate) and deep (North Atlantic Deep Water); they drive thermohaline flow and spread heat, salt and oxygen"]},
