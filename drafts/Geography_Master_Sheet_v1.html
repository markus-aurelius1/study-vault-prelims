{h:"Straits and channels",t:1,cols:["Strait","Joins","Between"],rows:[
["**Gibraltar**","Atlantic ↔ Mediterranean","Spain (and British Gibraltar) and Morocco (with Spanish Ceuta) — **Europe and Africa** [UPPCS 1999]"],
["**Bosphorus · Dardanelles**","Black Sea ↔ Marmara · Marmara ↔ Aegean","Europe and Asia at **Istanbul** · Gallipoli and Anatolia"],
["**Kerch**","Black Sea ↔ Sea of Azov","Crimea and Russia’s Taman peninsula"],
["**Bab-el-Mandeb**","Red Sea ↔ Gulf of Aden","Yemen and Djibouti–Eritrea [BPSC 2011]"],
["**Hormuz**","Persian Gulf ↔ Gulf of Oman","Iran and Oman’s Musandam [UPPCS M 2005]"],
["**Dover**","English Channel ↔ North Sea","England and France"],
["**Bering**","Bering Sea (Pacific) ↔ Chukchi Sea (Arctic)","**Asia and North America**; the Date Line runs through it [UP Lower 2004]"],
["**Davis · Denmark · Hudson**","Baffin Bay ↔ Labrador Sea · Greenland Sea ↔ Atlantic · Hudson Bay ↔ Labrador Sea","Canada and Greenland · Greenland and Iceland · Baffin Island and Quebec"],
["**Florida · Yucatán Channel**","Gulf of Mexico ↔ Atlantic · Gulf of Mexico ↔ Caribbean","The Florida Keys and Cuba · Mexico and Cuba"],
["**Magellan · Drake Passage**","Atlantic ↔ Pacific","Mainland South America and Tierra del Fuego · South America and **Antarctica**"],
["**Malacca · Singapore (Johor)**","Andaman Sea ↔ South China Sea","Malaysia and Sumatra — the busiest shipping lane · Singapore and Malaysia"],
["**Sunda · Lombok**","Java Sea ↔ Indian Ocean","**Sumatra and Java** (Krakatoa lies in it) · **Bali and Lombok**"],
["**Taiwan · Korea · Tsugaru**","East ↔ South China Sea · Japan Sea ↔ East China Sea · Japan Sea ↔ Pacific","Taiwan and China · Korea and Japan · Honshu and Hokkaido (the **Seikan** tunnel)"],
["**Mozambique Channel**","—","Mozambique and **Madagascar**"],
["**Bass · Cook · Torres**","—","Australia and **Tasmania** · New Zealand’s North and South islands · Australia’s Cape York and New Guinea"]]},
{h:"Straits in questions",t:1,list:[
"Ships from **Bahrain and Qatar** must pass **Hormuz** to reach the Indian Ocean — Syria and Egypt need not [CSE 2026]",
"Nearest the International Date Line :: **Bering Strait** [CSE 2008]",
"The UK–France tunnel runs under the :: **Strait of Dover** [CSE 2007; UPPCS M 2007]",
"Dover joins the :: **English Channel and the North Sea** [UPPCS M 2010]",
"To shorten India–East Asia voyages, a canal across the **Kra Isthmus** (Gulf of Thailand to the Andaman Sea) would help; deepening the Malacca Strait would !!not!! [CSE 2011]",
"Strait ↔ lands :: Bass — **Australia–Tasmania** · Davis — **Canada–Greenland** · Dover — **UK–France** · Florida — **USA–Cuba** [CDS 2017 II]",
"Strait ↔ location :: Gibraltar — **Africa–Europe** · Malacca — **Indonesia–Malaysia** · Bering — **Asia–North America** · Hormuz — **Persian Gulf–Gulf of Oman** [RAS 2013]",
"Separates Tasmania from Australia :: **Bass Strait** — !!not the Tasman Sea!! [UP RO 2023]",
"The **Lombok** Strait lies between :: **Bali and Lombok** [UP RO M 2017]"]},
{h:"Canals",t:1,cols:["Canal","Joins","Remember"],rows:[
["**Suez**","Mediterranean (**Port Said**) ↔ Red Sea (**Suez**), Egypt","Opened **1869**; about 193 km, at sea level with **no locks**"],
["**Panama**","Caribbean (Atlantic) ↔ Pacific","Opened **1914**; about 82 km, with **locks** that lift ships to **Gatun Lake**"],
["**Kiel**","North Sea ↔ Baltic, northern Germany","The busiest artificial ship canal"],
["**Soo · Welland · Erie**","Superior ↔ Huron · Erie ↔ Ontario · Lake Erie ↔ the Hudson","The Great Lakes’ links (see Where the Great Lakes lie)"],
["**Volga–Don · White Sea–Baltic**","The Volga ↔ the Don · the White Sea ↔ Lake Onega","Give the Caspian a way to the Black Sea, and the Arctic one to the Baltic"],
["**Ludwig (Main–Danube)**","The Rhine basin ↔ the Danube, southern Germany","An inland waterway across Bavaria [UPPCS 2017]"],
["**Corinth · Manchester Ship · Grand Canal**","Greece · England · China","Across the Isthmus of Corinth · Manchester to the Irish Sea · Beijing–Hangzhou, the longest canal"]]},
{h:"Canals in questions",t:1,list:[
"The largest navigation canal :: **Suez** [UP GIC 2010; UPPCS 2005, 1995]",
"Suez joins :: the **Mediterranean and the Red Sea** — !!not the Atlantic and Indian oceans directly!! [UPPCS 2025]",
"The Suez Canal connects :: the **Red Sea with the Mediterranean** [UPPCS 1992]",
"Suez cut the India–Europe voyage by about :: **7,000 km**, sparing ships the Cape of Good Hope [UPPCS 2018]",
"Lakes along Suez, north → south :: **Manzala → Timsah → Great Bitter → Little Bitter** [UPPCS 2019]"]},
{h:"Isthmuses, peninsulas and capes",t:2,list:[
"Terms :: a **strait** is a narrow sea passage between two larger waters; an **isthmus** is its opposite — a narrow neck of land joining two landmasses; a **channel** is a wider passage; a **cape** is a headland running into the sea",
"Isthmuses :: **Panama** (Central to South America) · **Suez** (Sinai to Africa) · **Kra** (Malay Peninsula to the mainland) · **Perekop** (Crimea to Ukraine) · **Corinth** (the Peloponnese to Greece)",
"Peninsulas of the Americas :: **Yucatán** (karst, the Maya, the Chicxulub crater of the dinosaurs’ end), **Florida**, **Alaska**, **Labrador**, **Baja California**",
"Peninsulas of the Old World :: **Arabian** (the largest), **Sinai**, **Anatolia**, **Kamchatka**, **Korean**, **Malay**, the **Deccan**; **Iberian**, **Italian**, **Balkan**, **Scandinavian**, **Jutland**, **Crimea**; the **Somali** Horn; Australia’s **Cape York** (bauxite at Weipa)",
"Greece and Albania are **Balkan**, !!not Iberian!!, and a nautical mile (1,852 m) is longer than a land mile (1,609 m) [CSE 2006]",
"Capes :: **Cape York** — Australia’s **northern** tip · **Kanyakumari** — India’s mainland tip · **Cape Agulhas** — Africa’s southern tip (the Cape of Good Hope lies just west) · **Cap-Vert** (Dakar) — Africa’s western tip · **Cape Horn** — South America’s tip · **Cape Sable** — the US mainland’s southern tip",
"The USA’s launch site :: **Cape Canaveral** (Florida), called Cape Kennedy in 1963–73 [UPPCS 1991]"]},
{h:"Largest islands",t:1,list:[
"By area :: **Greenland > New Guinea > Borneo > Madagascar** > Baffin > Sumatra > Honshu > Victoria Island > Great Britain [UPPCS 1993]",
"Largest of Borneo, Madagascar, New Guinea and Sumatra :: **New Guinea** [CDS 2017 II]",
"**Greenland** :: the largest island, a self-governing part of **Denmark** — !!not the USA!!; its capital **Nuuk** lies a few metres above the sea [UPPCS M 2012]",
"Geographically American but politically European :: **Greenland** [UPPCS 2002]",
"Largest of NZ’s North Island, Newfoundland, NZ’s South Island and Java :: **New Zealand’s South Island** [UPPCS M 2015]",
"**Borneo** is shared by **Indonesia, Malaysia and Brunei** [UPPCS 2010]",
"Borneo is split among **three** countries — true; the key also accepted ‘formed by volcanic deposits’, though Borneo is mostly **non-volcanic** rock [UPPCS 2022]"]},
{h:"Islands of the Atlantic and Mediterranean",t:1,list:[
"Atlantic, south → north :: **St Helena** (UK; Napoleon died there) · **Ascension** (UK) · **Cape Verde** (independent) · **Canaries** (Spain) · **Madeira** (Portugal) · **Azores** (Portugal; the **Azores High** sits over them)",
"The **Falklands** (Malvinas) :: a British territory in the **South Atlantic** that Argentina claims — !!not in the Indian Ocean!! [UPPCS 1993]",
"**Bermuda** :: a British territory in the **North Atlantic** — !!not the Caribbean or the Gulf of Mexico!! [CDS 2022 I]",
"The **Bermuda Triangle** — Miami, Bermuda, Puerto Rico — lies in the :: **North Atlantic** [UPPCS M 2008; UPPCS 2003, 2001; UP UDA 2002]",
"The Bermuda Triangle reaches **southern Florida** and **Puerto Rico** — !!not Hawaii!! [CSE 2006]",
"The ‘**Sheep Islands**’ :: the **Faroe** Islands (Denmark) [UP Lower 2015]",
"**Newfoundland** (Canada) :: the Grand Banks fishing grounds lie off it; **Long Island** belongs to New York",
"Caribbean :: the **Greater Antilles** — Cuba, Hispaniola (Haiti, Dominican Republic), Jamaica, Puerto Rico (USA); the **Lesser Antilles** — many small states; the **Bahamas** lie just north",
"Not in the Caribbean :: **Madeira** (Portugal, Atlantic) — Grenada, Montserrat and Anguilla are [UPPCS 2021]",
"Known for salt pans :: **Saint-Martin** (Caribbean) [UP GIC 2017]",
"Mediterranean, west → east :: **Balearics** (Spain; limestone karst; **Mallorca** the largest) · **Corsica** (France; Napoleon’s birthplace) · **Sardinia** (Italy; vines and wine) · **Sicily** (Italy; the largest) · **Malta** · **Crete** (Greece) · **Cyprus**",
"**Mallorca** is Spanish, **Normandy** French and **Sardinia** Italian — so !!none!! of Mallorca–Italy, Normandy–Spain, Sardinia–France was right [CSE 2025]",
"**Malta** lies in the :: **Mediterranean**, south of Sicily [CSE 2008]"]},
{h:"Islands of the Indian Ocean",t:1,list:[
"North → south :: **Socotra** (Yemen) · Lakshadweep · **Maldives** · **Seychelles** · **Comoros** · **Mauritius** · **Réunion** (France), with the **Chagos** in the middle of the ocean",
"**Socotra** belongs to **Yemen**, !!not Oman!!, and is a World Heritage site (2008) [UPPCS 2021]",
"Socotra today :: held since 2020 by the UAE-backed **Southern Transitional Council**",
"**Chagos** :: Britain agreed in May 2025 to hand the islands to **Mauritius**, leasing **Diego Garcia** — a US base — back for 99 years; the Chagos are in the Indian Ocean, !!not the North Pacific!! [CAPF 2017]",
"India’s island links :: an airstrip and jetty on **Agalega** (Mauritius, 2024); a planned base on **Assumption** (Seychelles)",
"Island nearest **Great Nicobar** :: **Sumatra** (about 150 km) — not Java, Borneo or Sri Lanka [CSE 2017]",
"The **Maldives** straddle the Equator (Huvadhu and **Addu** atolls lie south of it); **Cocos (Keeling)** and **Christmas** islands are Australian"]},
{h:"Islands of the Pacific and East Asia",t:1,list:[
"Japan, north → south :: **Hokkaido → Honshu → Shikoku → Kyushu** [UP BEO 2019; UP RO 2017]",
"Japan’s largest island :: **Honshu**, with Tokyo [UPPCS 1991]",
"Indonesia, west → east :: **Sumatra → Java → Bali → Lombok** [UPPCS 2021]",
"An archipelago of some 14,000 islands from **Aceh** to the **Torres Strait**, as far as London is from Baghdad :: **Indonesia** [CSE 1997]",
"**Indonesia** :: about **17,000** islands and about **130** active volcanoes — the key marked both ‘over 15,000 islands’ and ‘over 150 active volcanoes’ wrong [UP RO M 2021]",
"The **Galápagos** are volcanic and belong to **Ecuador**, !!not Peru!! — Darwin’s islands on the Equator [UP RO M 2021]",
"Island ↔ owner :: Aleutians — **USA** · Bear Island — **Norway** · Greenland — **Denmark** · Franz Josef Land — **Russia** [UPPCS M 2014]",
"A Melanesian group :: the **Solomon Islands** — the Gilberts and Marshalls are Micronesian, the Society Islands Polynesian [UPPCS M 2012]",
"Not Polynesian :: **Tinian** (Northern Marianas, Micronesia) — Tonga, Tuvalu and Tahiti are [UP RO 2021]",
"Oceania’s groups are Melanesia, Micronesia and Polynesia with Australia — **Indonesia** is Asian [UKPCS 2010]",
"Disputed islands :: the **Kurils** (Russia holds, Japan claims the southern four) · **Senkaku / Diaoyu** (Japan holds, China and Taiwan claim; Japan renamed the area Tonoshiro Senkaku in 2020)",
"South China Sea islands :: the **Paracels**, **Spratlys**, **Scarborough Shoal** and **Natunas** — China’s ‘nine-dash line’ is contested by Vietnam, the Philippines, Malaysia, Brunei, Indonesia and Taiwan",
"Other islands :: **Sakhalin** (Russia — ONGC holds a stake in its oil) · **Bougainville** (Papua New Guinea; it voted for independence in 2019) · **Hawaii** (the 50th US state) · **Tasmania** (Australia)",
"New Zealand :: the North and South islands across the **Cook Strait**; **Wellington** is the southernmost national capital"]},
{h:"Bays and gulfs",t:2,list:[
"**Bay of Fundy** (Canada) :: the highest tidal range on Earth",
"Cuba’s bays :: the **Bay of Pigs** (the failed US-backed landing, 1961) and **Guantánamo Bay** (a US naval base and prison)",
"Australia’s coast :: the **Gulf of Carpentaria**, the **Great Australian Bight** (a wide open bay), Spencer Gulf, Shark Bay, Geographe Bay, Encounter Bay",
"New Zealand :: the **Bay of Plenty** and Hawke Bay; Cook also named Poverty Bay",
"Africa’s gulfs :: **Guinea** (the Bights of Benin and Biafra), **Sidra (Sirte)** and **Gabès** on the Libyan and Tunisian coasts"]},
{h:"Round the coasts",t:2,list:[
"North America, Arctic to Pacific :: Beaufort Sea → Baffin Bay → **Davis Strait** → **Hudson Strait**, Hudson Bay and James Bay → Newfoundland → Gulf of St Lawrence → **Bay of Fundy** → Chesapeake Bay → **Florida Strait** → Gulf of Mexico → **Yucatán** → Gulf of California → Gulf of Alaska → Vancouver Island",
"South America, clockwise from Panama :: Gulf of Darién → Lake **Maracaibo** and the Gulf of Venezuela → the **Orinoco** delta → the **Amazon** mouth → Brazil’s ‘shoulder’ → **Patos** and Mirim lagoons → **Río de la Plata** → Bahía Blanca → Gulf of San Matías → Valdés Peninsula → Gulf of San Jorge → **Tierra del Fuego** and the **Strait of Magellan** → **Cape Horn** and the **Drake Passage** → Gulf of Guayaquil",
"Africa, clockwise from Tunisia :: Gulf of **Gabès** → Gulf of **Sirte** → the Nile delta → Gulf of **Suez** → Red Sea → **Bab-el-Mandeb** → the Horn → **Mozambique Channel** → **Cape Agulhas** and the **Cape of Good Hope** → the Slave, Gold, Ivory and Grain coasts → **Bight of Benin**",
"Australia, clockwise from the north :: Gulf of **Carpentaria** → **Cape York**, with the **Torres Strait** and Arafura Sea beyond → the **Great Barrier Reef** and Coral Sea → Tasman Sea → **Bass Strait** → **Spencer Gulf** → **Great Australian Bight** → **Joseph Bonaparte Gulf**",
"Europe’s seas, north-west → south-east :: Norwegian → North → Irish → Baltic → the **Strait of Dover** and **English Channel** → Atlantic and **Bay of Biscay** → Mediterranean → Adriatic → Ionian → Aegean → Sea of Marmara → Black Sea → Sea of Azov → Caspian",
"Asia’s seas, west → east :: **Aral** → **Caspian** → Black → Mediterranean → **Red Sea** → **Persian Gulf** → Arabian Sea → Bay of Bengal → **South China** → East China → Sea of Japan → Sea of Okhotsk → **Bering**",
"West Asia’s shores :: **Caspian** → **Black** → **Mediterranean** → **Red Sea** → Gulf of Aden → Arabian Sea → **Gulf of Oman** → **Persian Gulf**",
"South-East Asia’s waters :: the Indian Ocean, **Andaman Sea**, **Gulf of Thailand**, **South China Sea**, East China Sea, Sea of Japan and **Java Sea**"]}
]});

SEC({id:"world-regions",title:"World: Countries, Borders & Regions",group:"World",tier:2,
stats:["UPSC CSE: regions in the news — Donbas, Kachin, Tigray (2023); Anatolia, Amhara, Cabo Delgado, Catalonia (2022); Catalonia, Crimea, Mindanao, Oromia and Aleppo, Kirkuk, Mosul, Mazar-i-Sharif (2018); neighbours of Ukraine (2023) and Afghanistan (2022), the longest border (2024), and older capital and border items (2005, 2006)","UPPCS Pre: countries and capitals (2019, 2020, 2024) inside the 39 world-regional Q since 2018; older UPPSC papers asked borders, landlocked states, capitals and sobriquets about 80 times","Formats: country ↔ capital, country ↔ neighbour (‘which does not border…’), region or town ↔ country, landlocked or transcontinental, dividing lines, sobriquets"],
note:"The world’s countries region by region — West Asia, the Caucasus and Central Asia, South, East and South-East Asia, Europe, Africa, the Americas, Oceania and Antarctica — then landlocked states, dividing lines, capitals and sobriquets. Seas and islands are in the previous sheet, world tribes in the Population sheet.",
blocks:[
{h:"West Asia",t:1,list:[
"**Turkey (Türkiye)** :: Asia’s westernmost country, astride the Bosphorus — **Istanbul** in Europe, the capital **Ankara** in Asian Anatolia; on the Black, Marmara, Aegean and Mediterranean seas; quake-prone along the North Anatolian **transform fault**",
"**Cyprus** :: an island in the eastern Mediterranean — Asian by geography, an **EU** member by politics; divided since 1974 between a Greek Cypriot south and a Turkish Cypriot north, with **Nicosia** split between them",
"**Iran** :: West Asia’s easternmost state and India’s nearest; on the Caspian, the Persian Gulf and the Gulf of Oman; capital **Tehran**; India is developing its **Chabahar** port",
"**Iraq** :: capital **Baghdad** on the Tigris; not landlocked — a short Gulf coast at **Basra**; the Tigris–Euphrates lowland makes it West Asia’s great farm belt",
"The **Sunni Triangle** is **Baghdad, Ramadi and Tikrit** — !!not Basra!!, Iraq’s Shia port [UPPCS 2022]",
"**Saudi Arabia** :: capital **Riyadh**; the only country on both the **Red Sea** (**Jeddah**) and the **Persian Gulf** (**Dammam**); Mecca and Medina",
"Gulf states :: **Kuwait** (Kuwait City) — tiny and oil-rich · **Bahrain** (Manama) — an island · **Qatar** (Doha) — a peninsula whose only land neighbour is Saudi Arabia · **UAE** (Abu Dhabi; Dubai, Sharjah) — on the Gulf and the Gulf of Oman",
"**Oman** :: capital **Muscat**; on the Arabian Sea and the Gulf of Oman, with the Musandam tip on Hormuz; India has access to its **Duqm** port, including for the navy",
"**Yemen** :: capital **Sana’a**; on the Red Sea and the Gulf of Aden; **Aden** is a port of call; its **Houthis** attacked Red Sea shipping in 2023–25",
"**Israel** borders :: **Lebanon, Syria, Jordan and Egypt**, with the Palestinian West Bank and Gaza [UPPCS 2017]",
"Israel’s coasts :: the **Mediterranean** (Haifa) and the **Gulf of Aqaba** (Eilat) — !!not the Persian Gulf!!; Israel calls **Jerusalem** its capital, while most embassies stay in **Tel Aviv**",
"The **Gaza Strip** lies on the Mediterranean between Egypt and Israel, and is bordered by Israel — both true [UP RO 2023]",
"**Jordan** (Amman) :: named after the **Jordan River**, which runs from the Hermon–Golan hills through the **Sea of Galilee** to the **Dead Sea**; its only coast is on the Gulf of Aqaba",
"**Lebanon** (Beirut) and **Syria** (Damascus) :: Israel took Syria’s **Golan Heights** in the 1967 war",
"**Kurdistan** :: the Kurdish lands of **Turkey, Iraq, Iran and Syria**",
"The Arabian Peninsula :: **Saudi Arabia, Yemen, Oman, UAE, Qatar, Bahrain, Kuwait** — !!not Iraq or Syria!! [UP RO 2023]",
"Not in the Arabian Peninsula :: **Libya** — Kuwait, Oman and Yemen are [CAPF 2024]",
"Towns in the news :: **Aleppo — Syria** and **Mazar-i-Sharif — Afghanistan** are right; **Kirkuk** and **Mosul** are Iraqi, !!not Yemeni or Palestinian!! [CSE 2018]"]},
{h:"The Caucasus and Central Asia",t:1,list:[
"Caucasus states :: **Georgia** (Tbilisi) — on the **Black Sea** only · **Armenia** (Yerevan) — landlocked · **Azerbaijan** (**Baku**) — on the **Caspian** only",
"**Nagorno-Karabakh** :: an Armenian-populated enclave inside Azerbaijan; Azerbaijan retook it in 2023 and its people left for Armenia",
"**Chechnya** :: a Russian republic on Georgia’s northern border",
"Central Asia’s capitals :: **Kazakhstan — Astana** · **Kyrgyzstan — Bishkek** · **Tajikistan — Dushanbe** · **Uzbekistan — Tashkent** · **Turkmenistan — Ashgabat** [UPPCS 2019]",
"**Astana** was renamed **Nur-Sultan** in 2019 and changed back in 2022",
"**Bishkek** is Kyrgyzstan’s capital, !!not Tajikistan’s!!; Amman — Jordan, Ulaanbaatar — Mongolia, Sana’a — Yemen [UPPCS 2007]",
"Namesakes :: the **Bishkek Declaration** (2013) on snow leopards · the **Tashkent Agreement** (1966) after the India–Pakistan war of 1965 · the **Ashgabat Agreement**, a transport corridor to Central Asia that India joined in 2018",
"Caspian shores :: **Russia, Kazakhstan, Turkmenistan, Iran, Azerbaijan** — !!Armenia has none!! [CSE 2003]",
"Afghanistan’s neighbours :: **Iran, Pakistan, Turkmenistan, Uzbekistan, Tajikistan, China** (the Wakhan corridor), and India through Gilgit-Baltistan — of Azerbaijan, Kyrgyzstan and the three others, only **Tajikistan, Turkmenistan, Uzbekistan** [CSE 2022]",
"Afghanistan does not border :: **Russia** [UPPCS M 2012; UP Lower 2002]",
"Not in present-day Afghanistan :: **Fergana** and **Samarkand** (Uzbekistan) — Ghazni and Kandahar are Afghan [UP RO 2023]",
"The **Baikonur** cosmodrome is in :: **Kazakhstan**, east of the Aral Sea — !!not Ukraine!! [UPPCS 1992]",
"The former Soviet Union’s **15** republics :: Russia; the five Central Asian states; Georgia, Armenia, Azerbaijan; the Baltic **Estonia, Latvia, Lithuania**; **Ukraine, Belarus, Moldova**",

note:"World farming types, crops and livestock by country, minerals and fuels with their famous mining regions, industrial regions and towns, and transport — railways, sea routes, ports and tunnels. Rankings are recent (2023–25); where an older answer key differs, both are given. India’s own crops, minerals and industries are in the India sheets.",
blocks:[
{h:"Types of farming",t:1,list:[
"**Shifting cultivation** (slash and burn) :: clear, burn, crop for a few years, move on — **jhum** (north-east India), **milpa** (Mexico, Central America), **ladang** (Indonesia, Malaysia), **chena** (Sri Lanka), **roça** (Brazil), **masole** (Congo), **ray** (Vietnam)",
"Not a kind of shifting cultivation :: **fazenda**, a Brazilian coffee estate — chena, jhum and milpa are [UPPCS M 2010, 2006]",
"Practice ↔ region :: jhum — **South-East Asia** and milpa — **Mexico** are right; ladang is **Indonesian**, !!not Sri Lankan!! [UP RO 2023]",
"**Nomadic herding** :: moving with the animals for water and grass — the Sahara, Arabia, the Central Asian steppes, the Tibetan and Mongolian plateaus, and reindeer herding on the tundra",
"**Intensive subsistence** :: small plots, much labour and two or three crops a year — rice-led in monsoon Asia, wheat, maize and millets where rice will not grow",
"**Plantation** :: one cash crop on a big estate with much capital and labour, often foreign-owned and near ports — tea, coffee, rubber, cocoa, sugarcane, bananas, oil palm",
"Tropical plantations sit in patches on **coastal plains and plateau slopes**, !!not on flat lowlands!!, and the **Amazon** suits rubber but lacks workers — only those two are right [UPPCS 1998]",
"**Extensive commercial grain** :: huge mechanised farms of one crop, usually wheat — the prairies, pampas, steppes, the Canterbury plains and the Australian downs",
"**Monoculture** marks :: **commercial grain farming** [UP UDA 2010]",
"**Mixed farming** :: crops and livestock together — north-western Europe, eastern North America, the pampas, south-eastern Australia, New Zealand, South Africa",
"**Dairying** :: near city markets — north-western Europe, New Zealand, south-eastern Australia, the north-eastern USA and Canada",
"**Mediterranean farming** :: winter wheat with **citrus, grapes and olives**; citrus fruit flourishes in the Mediterranean regions [UPPCS 2020]",
"Commercial **viticulture** belongs to Europe’s **Mediterranean** because about 85% of its grapes go into wine — the reason explains it [UPPCS M 2005]",
"**Market gardening** :: vegetables, fruit and flowers for nearby cities — the Netherlands’ tulips",
"**Collective and co-operative farming** :: the Soviet **kolkhoz**; Denmark’s co-operatives",
"**Alley cropping** :: crops grown between rows of planted trees [UPPCS M 2007]",
"High-yielding seed varieties were first bred in :: **Mexico**, by Norman Borlaug [UP Lower 2008]"]},

{h:"Dams, canals and rivers in questions",t:2,list:[
"**Rihand** dam (Pipri, Sonbhadra) :: its reservoir, **Govind Ballabh Pant Sagar**, is UP’s largest",
"Other dams :: **Obra** (Rihand, Sonbhadra) · **Matatila** and **Rajghat** (Betwa, Lalitpur — Rajghat shared with MP) · **Parichha** (Betwa, Jhansi) · **Meja** (Belan, Prayagraj) · **Maudaha** (Birma, Hamirpur) · **Arjun** (Mahoba)",
"The **Ken–Betwa** link, built with MP, will carry Ken water to the Betwa for Bundelkhand",
"Canals :: the **Upper Ganga** (Haridwar) and **Lower Ganga** (Narora) water the doab, the **Sharda** canal the centre, the **Eastern Yamuna** canal the west, and the **Saryu Nahar** project (2021) the east",
"The **Gandak** was keyed as !!not!! flowing through UP — it only brushes the Bihar border in Kushinagar — while the Son, Hindon and Sharda do [UP RO 2021]"]},
{h:"Climate and soils",t:2,list:[
"Climate :: tropical monsoon — hot, dry May–June with the **loo**, most rain in June–September, and **western disturbances** bringing winter rain for the rabi crop",
"Rain falls off from **east to west** — heaviest in the north-eastern Terai, lightest in the west around **Mathura–Agra**",
"Hottest :: the **Bundelkhand** plateau — Banda and Jhansi often pass 47°C",
"Floods :: **eastern UP** is the worst hit, as the Ghaghara, Rapti and their tributaries overflow [UPPCS M 2012]",
"Drought :: **Bundelkhand** — thin soils, little rain and few canals",
"Bundelkhand soils :: **mar** and **kabar** (black, clayey) · **parwa** (light, loamy) · **rakar** (red, gravelly)",
"Plains soils :: **bhangar** and **khadar** alluvium, with **usar (reh)** alkaline patches in the drier west and centre, reclaimed with gypsum; the **Terai** soils are damp, clayey and rich in humus"]},
{h:"Forests",t:2,list:[
"Forest cover :: only about **6%** of UP (India State of Forest Report 2023) — far below the national one-fifth — though UP was among the States adding the most forest and tree cover in 2021–23",
"Most forest :: **Sonbhadra**, then the Terai districts (Lakhimpur Kheri, Pilibhit, Bahraich) and the Vindhyan south (Mirzapur, Chandauli)",
"Forest types :: **tropical dry deciduous** over most of UP, moist **sal** forest in the Terai, and thorn scrub in the south-west",
"UP’s **tiger reserves**, sanctuaries and Ramsar wetlands are in the Environment notes"]},
{h:"People of UP (Census 2011)",t:1,list:[
"Population :: **19.98 crore**; growth in 2001–11 **20.2%**; density **829** per km² — 4th after Bihar, West Bengal and Kerala",
"Sex ratio :: **912**; child sex ratio **902**",
"Literacy :: **67.7%** — men 77.3%, women 57.2%",
"Urban :: **22.3%** — UP has India’s largest **rural** population",
"Scheduled Castes :: **20.7%** — more SCs than any other State; Scheduled Tribes only **0.6%**",
"Religions :: Hindu about **80%**, Muslim about **19%**",
"District extremes :: densest **Ghaziabad**, sparsest **Lalitpur** · best sex ratio **Jaunpur**, worst **Gautam Buddh Nagar** · most literate **Gautam Buddh Nagar**, least **Shravasti**",
"Tribes :: the **Gond** (the largest), **Kharwar** and **Tharu**, with Buksa, Bhotia, Baiga, Agaria and Sahariya",
"**Tharu** :: the Terai people of **UP and Uttarakhand** (and Bihar and Nepal) — Lakhimpur Kheri, Bahraich, Balrampur, Maharajganj [UP RO 2017; UPPCS 1991]",
"The **Tharu** keep **Diwali** as a festival of mourning [UPPCS 2005; UPPCS M 2015]",
"The largest Scheduled Tribe of Uttarakhand :: **Tharu** [UPPCS 2005]"]},
{h:"Farming in UP",t:1,list:[
"UP leads India in :: **wheat**, **sugarcane**, **potato** and **milk** (2024–25), and has the largest **rice** area",
"Largest share of India’s food grains :: **Uttar Pradesh** [UPPCS 2008]",
"Cropping :: **rice–wheat** in the centre and east, **sugarcane–wheat** in the west, and **pulses and oilseeds** in Bundelkhand",
"Sugar :: UP is the ‘**sugar bowl**’; its cane belt runs from the western doab and Rohilkhand to **Lakhimpur Kheri**, the biggest cane district",
"The first sugar mill :: **Pratappur** (Deoria), **1903** [UPPCS M 2013]",
"Largest area under **hybrid rice** :: **Uttar Pradesh** [UPPCS M 2014]",
"The two largest users of chemical fertiliser, as keyed :: **UP and Andhra Pradesh** — UP still uses the most [UPPCS M 2009]",
"**UP-308** is a variety of :: **wheat** [UP Lower M 2016]",
"**UPAS-120** :: an early arhar that fits double cropping with wheat [UP UDA M 2010]",
"**Mentha** (menthol mint) :: UP grows about four-fifths of India’s — Barabanki, Badaun, Rampur, Sambhal",
"**Kala namak** :: a scented, black-husked rice of Siddharthnagar, with a GI tag",
"Mango belts :: **Malihabad** (Lucknow; Dasheri), **Varanasi** (Langra), Saharanpur and Amroha",
"Farm universities :: Kanpur (Chandra Shekhar Azad), **Meerut** (Sardar Vallabhbhai Patel), Ayodhya (Kumarganj) and Banda — Pantnagar went to Uttarakhand",
"**Indira Gandhi Krishi Vishwavidyalaya** is in **Raipur**, Chhattisgarh, !!not Rajasthan!!; Sardar Vallabhbhai Patel University — UP, JNKVV — MP [UP RO 2016]",
"**ODOP** (2018) :: ‘One District One Product’ — a speciality for every district, from Kala namak rice to Moradabad brass"]},
{h:"Minerals and power",t:2,list:[
"UP is poor in minerals; they lie on the southern plateau :: **Sonbhadra** — limestone, dolomite, coal (Singrauli), andalusite, pyrite · **Lalitpur** — granite, rock phosphate, diaspore, pyrophyllite · **Mirzapur** — Chunar sandstone · **Prayagraj** — **Shankargarh** silica sand for glass · **Banda** — the **Shajar** stone of the Ken",
"Granite slabs and slates are made at :: **Lalitpur** [UPPCS 2002]",
"Sonbhadra has **andalusite, pyrite and dolomite** — !!not uranium!!, whose traces are in **Lalitpur** [UP UDA 2001]",
"Thermal stations :: **Singrauli** and **Rihand** (NTPC), **Obra** and **Anpara** — all in Sonbhadra — and **Harduaganj** (Aligarh), **Panki** (Kanpur), **Parichha** (Jhansi), Tanda, Unchahar, Dadri, Meja and Ghatampur",
"Other power :: gas at **Auraiya** and **Dadri**, nuclear at **Narora** (Bulandshahr), hydro at Rihand, Obra, Matatila and **Khara** (Yamuna, Saharanpur)",
"The **Singrauli small hydro** project is in :: **Uttar Pradesh** (Sonbhadra) [UP RO M 2017]",
"Solar :: parks in **Bundelkhand** (Jalaun, Jhansi, Lalitpur); UP’s 2022 solar policy aims at **22 GW** by 2027"]},
{h:"Industries and crafts",t:1,cols:["Town","Known for"],rows:[
["**Kanpur**","Leather, textiles, fertiliser (Panki) — the ‘Manchester of the North’"],
["**Agra**","Leather footwear, marble inlay, petha"],
["**Firozabad**","Glass **bangles** — the ‘city of bangles’"],
["**Moradabad**","**Brassware** — ‘Peetal Nagri’"],
["**Aligarh**","**Locks**"],
["**Varanasi**","**Banarasi silk** sarees; the Banaras Locomotive Works"],
["**Bhadohi and Mirzapur**","Hand-knotted **carpets**"],
["**Lucknow**","**Chikankari** embroidery"],
["**Meerut**","**Sports goods**"],
["**Saharanpur**","**Wood carving**"],
["**Khurja**","**Ceramics**"],
["**Kannauj**","**Attar** (perfume)"],
["**Nizamabad (Azamgarh) · Gorakhpur**","Black pottery · terracotta"],
["**Mau · Pilkhuwa**","Handloom sarees · handloom bedsheets"],
["**Noida**","Electronics and **mobile phones** — among the world’s largest phone factories"],
["**Renukoot**","**Aluminium** (Hindalco)"]]},
{h:"More on industry",t:2,list:[
"Industrial corridors :: the **UP Defence Industrial Corridor** (2018) — Agra, Aligarh, Chitrakoot, Jhansi, Kanpur, Lucknow — and the Eastern and Western freight corridors, which meet at **Dadri**",
"India’s first **synthetic rubber** plant :: **Bareilly** (1963); a 2016 key, with no Bareilly among its options, took **Panipat** [UP RO 2016]",
"Fertiliser :: **Phulpur** (IFFCO), **Aonla**, **Gorakhpur**, **Babrala**, Jagdishpur, Panki and Shahjahanpur",
"Cement :: **Chunar**, **Churk** and **Dalla** on the Mirzapur–Sonbhadra limestone",
"Rail units :: the Banaras Locomotive Works (Varanasi) and the Modern Coach Factory (**Raebareli**); zone offices at **Gorakhpur** (North Eastern) and **Prayagraj** (North Central)"]},
{h:"Transport and tourism",t:2,list:[
"Expressways :: **Yamuna** (Greater Noida–Agra, 2012) · **Agra–Lucknow** (2016) · **Purvanchal** (Lucknow–Ghazipur, 2021) · **Bundelkhand** (Chitrakoot–Etawah, 2022) · **Ganga** (Meerut–Prayagraj, ~594 km) — more than any other State",
"Airports :: **Lucknow**, **Varanasi**, **Kushinagar** and **Ayodhya**, with the **Noida International Airport** at **Jewar**",
"Rail :: **Gorakhpur** had the world’s longest platform (1,366 m) until **Hubballi** passed it in 2023; India’s first regional rapid rail (**Namo Bharat**) runs Delhi–Ghaziabad–Meerut",
"Waterway :: National Waterway 1 has a multimodal terminal at **Varanasi** (Ramnagar, 2018)",
"World Heritage sites :: the **Taj Mahal**, **Agra Fort** and **Fatehpur Sikri**",
"Buddhist circuit :: **Sarnath** (the first sermon), **Kushinagar** (the Buddha’s death), **Shravasti**, **Kaushambi**, **Sankisa** and **Piprahwa** (Kapilavastu relics)",
"**Prayagraj** hosted the **Maha Kumbh** in 2025"]}
]});

(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
/* ---- exam tags: [CSE 2021; UPPCS 2023, 2019; UPPCS M 2010; CDS 2016 II] ---- */
const FAM={cse:"UPSC CSE Prelims",up:"UPPSC exam",upm:"UPPCS Mains",cds:"CDS / NDA",capf:"CAPF",oth:"Other State PCS"};
function famLab(n){const u=n.toUpperCase().replace(/\s+/g," ").trim();
  if(/^(CSE|UPSC)/.test(u)) return ["cse","CSE"];
  if(/^UPPCS M|^UPPCS SPL M|^UPM/.test(u)) return ["upm","UPM"];
  if(/^UPPCS|^UPPSC/.test(u)) return ["up","UP"];
  if(/^UP RO/.test(u)) return ["up","RO"];
  if(/^UP LOWER/.test(u)) return ["up","UPL"];
  if(/^UP (BEO|UDA|GIC|RI|SPL|OTHER)/.test(u)) return ["up","UP·"];
  if(/^UKPCS|^UTTARAKHAND/.test(u)) return ["oth","UK"];
  if(/^CDS/.test(u)) return ["cds","CDS"]; if(/^NDA/.test(u)) return ["cds","NDA"];
  if(/^CAPF/.test(u)) return ["capf","CAPF"];
  if(/^(BPSC|MPPCS|RAS|CGPCS|JPSC|HPSC|OTHER|RPSC|MPSC|PCS)/.test(u)) return ["oth",u.split(" ")[0].replace("MPPCS","MP").replace("CGPCS","CG").replace("JPSC","JH").replace("BPSC","BP").replace("OTHER","PCS")];
  return null;}
function parseTags(inner){const parts=inner.split(/\s*;\s*/),tags=[];let ok=true;
  parts.forEach(p=>{const m=p.match(/^([A-Za-z][A-Za-z .]*?)\s*((?:19|20)\d\d(?:\s*[,/ ]\s*(?:19|20)\d\d)*)\s*(I{1,2})?$/);
    if(!m){ok=false;return;} const fl=famLab(m[1]); if(!fl){ok=false;return;}
    m[2].match(/(?:19|20)\d\d/g).forEach(y=>tags.push({f:fl[0],l:fl[1],y:y,t:m[1].trim()+" "+y+(m[3]?" "+m[3]:"")}));});
  return ok&&tags.length?tags:null;}
const chip=t=>'<span class="y '+t.f+'" title="'+esc(t.t+" — "+FAM[t.f])+'">'+t.l+'’'+t.y.slice(2)+'</span>';
const TAGRE=/\[([^\[\]]{4,200})\]/g;
function fmt(s){return esc(s)
  .replace(TAGRE,(all,inner)=>{const r=parseTags(inner);return r?'<span class="yrs">'+r.map(chip).join("")+'</span>':all;})
  .replace(/!!(.+?)!!/g,'<span class="trap">$1</span>')
  .replace(/==(.+?)==/g,'<span class="hl">$1</span>')
  .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
  .replace(/`(.+?)`/g,'<span class="num">$1</span>');}
/* ---- recall: blur only answer text; exam-tag chips (.yrs) always stay outside the blurred spans ---- */
const YRS=/(<span class="yrs">(?:<span class="y [a-z]+" title="[^"]*">[^<]*<\/span>)+<\/span>)/;
function hideHTML(h){return h.split(YRS).map((p,i)=>i%2||!p.trim()?p:'<span class="ans">'+p+'</span>').join("");}
const even=(s,re)=>(s.match(re)||[]).length%2===0;
const pairs=(s,a,b)=>(s.split(a).length)===(s.split(b).length);
/* a line with no "::" and no bold: show the cue before the first " — " or ": ", hide what follows */
function cueSplit(s){for(const sep of [" — ",": "]){const i=s.indexOf(sep);if(i<2)continue;const c=s.slice(0,i);
  if(c.length<=90&&even(c,/!!/g)&&even(c,/==/g)&&even(c,/`/g)&&pairs(c,"[","]")&&pairs(c,"(",")")&&pairs(c,"“","”")&&even(c,/"/g))return [c,sep,s.slice(i+sep.length)];}
  return null;}
function famsOf(text){const s=new Set();(text.match(TAGRE)||[]).forEach(b=>{const r=parseTags(b.slice(1,-1));if(r)r.forEach(t=>s.add(t.f));});return s;}
function tagCount(text){let n=0;(text.match(TAGRE)||[]).forEach(b=>{const r=parseTags(b.slice(1,-1));if(r)n+=r.length;});return n;}
const rowText=r=>r.join(" ");
/* ---- figures: block field fig = {kind:"svg"|"img", src, alt, caption}. Only an inline <svg> or a base64 data: image
   is ever shown; the build checks every figure for safety and size (NOTES_FORMAT_GUIDE.md §14). figHTML and imgSize
   are the same code as the Vault's app/js/render.js, and the build compares the two outputs figure by figure. ---- */
const escA=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
/* pixel size of a base64 PNG / GIF / WebP / JPEG, read from its header bytes (reserves the space: no layout shift) */
function imgSize(src){const m=/^data:image\/(png|gif|webp|jpeg);base64,([A-Za-z0-9+/]+={0,2})$/.exec(src);if(!m)return null;
  const t=m[1],b=m[2],A="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
  const at=i=>{const q=4*Math.floor(i/3);if(q+4>b.length)return -1;let n=0;for(let j=0;j<4;j++)n=n*64+Math.max(0,A.indexOf(b[q+j]));return Math.floor(n/Math.pow(256,2-i%3))%256;};
  const be=(i,k)=>{let n=0;for(let j=0;j<k;j++)n=n*256+at(i+j);return n;};
  const le=(i,k)=>{let n=0;for(let j=k-1;j>=0;j--)n=n*256+at(i+j);return n;};
  const str=(i,k)=>{let s="";for(let j=0;j<k;j++)s+=String.fromCharCode(at(i+j));return s;};
  let w=0,h=0;
  if(t==="png"&&str(1,3)==="PNG"&&str(12,4)==="IHDR"){w=be(16,4);h=be(20,4);}
  else if(t==="gif"&&str(0,4)==="GIF8"){w=le(6,2);h=le(8,2);}
  else if(t==="webp"&&str(0,4)==="RIFF"&&str(8,4)==="WEBP"){const c=str(12,4);
    if(c==="VP8 "){w=le(26,2)%16384;h=le(28,2)%16384;}
    else if(c==="VP8L"){const v=le(21,4);w=v%16384+1;h=Math.floor(v/16384)%16384+1;}
    else if(c==="VP8X"){w=le(24,3)+1;h=le(27,3)+1;}}
  else if(t==="jpeg"&&be(0,2)===65496){
    for(let i=2,k=0;k<500&&at(i)===255;k++){const mk=at(i+1);
      if(mk===255){i++;continue;}
      if(mk>=192&&mk<=207&&mk!==196&&mk!==200&&mk!==204){h=be(i+5,2);w=be(i+7,2);break;}
      i+=mk===1||(mk>=208&&mk<=216)?2:2+be(i+2,2);}}
  return w>0&&h>0?[w,h]:null;}
function figHTML(f){let m="";
  if(f.kind==="svg"&&/^<svg[\s>]/.test(f.src))m='<div class="nfig-m" role="img" aria-label="'+escA(f.alt)+'">'+f.src+'</div>';
  else if(f.kind==="img"){const d=imgSize(f.src);if(d)m='<div class="nfig-m"><img src="'+f.src+'" alt="'+escA(f.alt)+'" width="'+d[0]+'" height="'+d[1]+'" decoding="async"></div>';}
  if(!m)m='<p class="nfig-bad">Figure not shown: it is not an inline &lt;svg&gt; or a base64 data: image. The build explains why.</p>';
  return '<figure class="nfig nfig-'+escA(f.kind)+'">'+m+(f.caption?'<figcaption>'+escA(f.caption)+'</figcaption>':'')+'</figure>';}
const figText=f=>f.alt+" "+(f.caption||"");
/* ---- ids ---- */
S.forEach((s,i)=>{s.no=String(i+1).padStart(2,"0");s.blocks.forEach((b,j)=>{b.id=s.id+"-"+(j+1);b.k=b.k||"core";
  const txt=(b.list||[]).join(" ")+" "+(b.rows||[]).map(rowText).join(" ");b.tags=tagCount(txt);});});
const GROUPS=[];S.forEach(s=>{let g=GROUPS.find(x=>x[0]===s.group);if(!g){g=[s.group,[]];GROUPS.push(g);}g[1].push(s);});
/* ---- sidebar ---- */
const side=$("side"),main=$("main");
function buildSide(){let h="";
  GROUPS.forEach(g=>{h+='<div class="grp">'+esc(g[0])+'</div>';
    g[1].forEach(s=>{h+='<div class="nav-item"><div style="display:flex;align-items:center"><button class="nav-sec" data-sec="'+s.id+'"><span class="no">'+s.no+'</span><span class="tt">'+esc(s.title)+'</span><span class="tier t'+s.tier+'">P'+s.tier+'</span></button><button class="tw-tog" data-tog="'+s.id+'" aria-expanded="false" aria-label="Show sub-topics of '+esc(s.title)+'">▸</button></div><ul class="nav-subs" id="subs-'+s.id+'" hidden>'+s.blocks.map(b=>'<li><button data-go="'+b.id+'" data-in="'+s.id+'">'+esc(b.h.replace(/[*=!`]/g,""))+'</button></li>').join("")+'</ul></div>';});});
  side.innerHTML=h;}
buildSide();
/* ---- key / legend ---- */
const KEY='<details class="key"><summary>Key to marks &amp; tags</summary><div class="legend">'+
 '<span><span class="y cse">CSE’21</span>UPSC CSE Prelims</span><span><span class="y up">UP’24</span>UPPCS Prelims</span><span><span class="y up">RO’23</span><span class="y up">UPL’13</span><span class="y up">UP·’10</span>other UPPSC exams (RO/ARO, Lower Sub., BEO, UDA/LDA, GIC)</span><span><span class="y upm">UPM’10</span>UPPCS Mains</span><span><span class="y cds">CDS’19</span>CDS / NDA</span><span><span class="y capf">CAPF’18</span>CAPF</span><span><span class="y oth">MP’15</span><span class="y oth">UK’21</span>other State PCS</span>'+
 '<span><span class="tier t1">P1</span> heavily tested — learn cold</span><span><span class="tier t2">P2</span> regular</span><span><span class="tier t3">P3</span> occasional — skim</span><span><span class="bc">7 tags</span> PYQ tags inside a block</span>'+
 '<span><span class="trap">trap</span> wrong option examiners use</span><span><span class="hl">mark</span> key distinction</span><span><b>bold</b> exact term / number</span><span><span class="num">280</span> Article / entry</span><span>Q <span class="ar">::</span> A — answer blurs in Recall mode</span></div></details><p class="recall-hint">Recall mode: answers after → and bold key terms are blurred (exam tags stay visible) — tap a line or cell to reveal.</p>';
/* ---- blocks ---- */
let exF="";
/* search folds case, curly quotes/apostrophes and dashes on both sides of the match, and ignores the markup markers */
const nq=s=>String(s).toLowerCase().replace(/\*\*|!!|==|`/g,"").replace(/[’‘‛ʼ′´]/g,"'").replace(/[“”„″]/g,'"').replace(/[–—−‐‑]/g,"-");
function okLine(txt,term){return (!term||nq(txt).includes(term))&&(!exF||(exF==="any"?tagCount(txt)>0:famsOf(txt).has(exF)));}
/* a figure stays beside surviving lines, or on its own when a search matches its heading, alt or caption; an exam filter hides a figure-only block */
function filt(b,term){if(!term&&!exF)return b;const o=Object.assign({},b);let n=0;
  if(b.rows){o.rows=b.rows.filter(r=>okLine(rowText(r),term)||(term&&nq(b.h).includes(term)&&!exF));n+=o.rows.length;}
  if(b.list){o.list=b.list.filter(i=>okLine(i,term)||(term&&nq(b.h).includes(term)&&!exF));n+=o.list.length;}
  if(b.fig&&!n&&!(term&&!exF&&nq(b.h+" "+figText(b.fig)).includes(term)))delete o.fig;
  return n||o.fig?o:null;}
/* li classes: qa = "prompt :: answer" (answer blurs) · cz = bold key terms blur · cue = no bold, text after the cue blurs · open = nothing to hide */
function liHTML(s){const m=s.split(" :: ");let k,body,c;
  if(m.length>1){k="qa";body=fmt(m[0])+' <span class="ar">→</span> '+hideHTML(fmt(m.slice(1).join(" :: ")));}
  else if(/\*\*.+?\*\*/.test(s)){k="cz";body=fmt(s);}
  else if((c=cueSplit(s))){k="cue";body=fmt(c[0])+c[1]+hideHTML(fmt(c[2]));}
  else{k="open";body=fmt(s);}
  return '<li class="'+k+(/!!/.test(s)?' t':'')+'">'+body+'</li>';}
function blockHTML(b,open){const n=(b.rows?b.rows.length:0)+(b.list?b.list.length:0);
  let h='<details class="block k-'+b.k+'" id="'+b.id+'"'+(open?' open':'')+'><summary><h3>'+fmt(b.h)+(b.sub?'<small>'+fmt(b.sub)+'</small>':'')+'</h3><span class="bmeta">'+(b.t?'<span class="tier t'+b.t+'">P'+b.t+'</span>':'')+(b.k==="trap"?'<span class="kt">traps</span>':'')+(b.fig?'<span class="kt kf">figure</span>':'')+(b.tags?'<span class="bc" title="PYQ tags in this block">'+b.tags+' tag'+(b.tags===1?'':'s')+'</span>':'')+'<span class="chev" aria-hidden="true"></span></span></summary>';
  if(b.fig) h+=figHTML(b.fig);
  if(b.html) h+=b.html;
  if(b.rows) h+='<div class="tw"><table><thead><tr>'+b.cols.map(c=>'<th>'+esc(c)+'</th>').join("")+'</tr></thead><tbody>'+b.rows.map(r=>'<tr>'+r.map((c,k)=>'<td>'+(k?hideHTML(fmt(c)):fmt(c))+'</td>').join("")+'</tr>').join("")+'</tbody></table></div>';
  if(b.list) h+='<ul class="facts'+(b.list.length>7&&!b.one?' cols2':'')+'">'+b.list.map(liHTML).join("")+'</ul>';
  return h+'</details>';}
function statsHTML(s){let h='<div class="stats"><span class="tier t'+s.tier+'">P'+s.tier+'</span>';
  (s.stats||[]).forEach(x=>h+='<span class="stat">'+fmt(x)+'</span>');return h+'</div>';}
let cur=S[0].id;
function markNav(id){side.querySelectorAll(".nav-sec").forEach(b=>b.setAttribute("aria-current",b.dataset.sec===id?"true":"false"));}
function openSubs(id,on){const u=$("subs-"+id),t=side.querySelector('[data-tog="'+id+'"]');if(!u)return;u.hidden=!on;if(t){t.textContent=on?"▾":"▸";t.setAttribute("aria-expanded",on?"true":"false");}}
function show(id,go){const s=S.find(x=>x.id===id)||S[0];cur=s.id;markNav(s.id);
  S.forEach(x=>openSubs(x.id,x.id===s.id));
  const bs=s.blocks.map(b=>filt(b,"")).filter(Boolean);
  let h='<div class="sec-head"><span class="no">'+s.no+'</span><h2>'+esc(s.title)+'</h2></div>'+statsHTML(s)+(s.note?'<p class="sec-note">'+fmt(s.note)+'</p>':'')+KEY;
  if(exF) h+='<p class="filt">Showing only lines tagged <b>'+(exF==="any"?"with any PYQ":FAM[exF])+'</b> · <button class="lnk" data-clear-ex>show all</button></p>';
  if(bs.length>1) h+='<nav class="subnav" aria-label="Sub-topics">'+bs.map(b=>'<button class="sn k-'+b.k+'" data-go="'+b.id+'">'+esc(b.h.replace(/[*=!`]/g,""))+'</button>').join("")+'<span class="sn-tools"><button class="lnk" data-all="1">expand all</button> · <button class="lnk" data-all="0">collapse all</button></span></nav>';
  /* cards start collapsed; open only the card a sub-topic link asked for, or every card when an exam filter is on */
  h+=bs.length?bs.map(b=>blockHTML(b,!!exF||b.id===go)).join(""):'<div class="empty">No line in this section carries that exam tag.</div>';
  const i=S.indexOf(s),p=S[i-1],n=S[i+1];
  h+='<div class="pager">'+(p?'<button class="btn" data-sec="'+p.id+'">← '+esc(p.title)+'</button>':'<span></span>')+(n?'<button class="btn" data-sec="'+n.id+'">'+esc(n.title)+' →</button>':'')+'</div>';
  main.innerHTML=h;
  if(location.hash.slice(1)!==s.id&&!go) history.replaceState(null,"","#"+s.id);
  if(go){const d=$(go);if(d){d.open=true;d.scrollIntoView({block:"start"});}} else window.scrollTo({top:0});}
/* ---- search ---- */
const q=$("q"),qclr=$("qclr");
/* highlight every hit inside result lines, cells and headings; the fold is char-for-char so offsets line up */
const nc=c=>{const l=c.toLowerCase();c=l.length===1?l:c;return /[’‘‛ʼ′´]/.test(c)?"'":/[“”„″]/.test(c)?'"':/[–—−‐‑]/.test(c)?"-":c;};
function markHits(root,term){
  root.querySelectorAll("ul.facts li, tbody td, details.block h3, figure.nfig figcaption").forEach(el=>{
    const nodes=[],w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n,txt="";
    while((n=w.nextNode())){if(n.parentNode.closest(".yrs"))continue;nodes.push([n,txt.length]);txt+=n.nodeValue;}
    let low="";for(let i=0;i<txt.length;i++)low+=nc(txt[i]);
    const hits=[];for(let i=low.indexOf(term);i>=0;i=low.indexOf(term,i+term.length))hits.push([i,i+term.length]);
    if(!hits.length)return;
    nodes.forEach(([n,o])=>{const v=n.nodeValue,e=o+v.length,cut=hits.filter(h=>h[0]<e&&h[1]>o);if(!cut.length)return;
      const f=document.createDocumentFragment();let p=0;
      cut.forEach(h=>{const a=Math.max(h[0]-o,0),b=Math.min(h[1]-o,v.length);if(a>p)f.appendChild(document.createTextNode(v.slice(p,a)));
        const m=document.createElement("mark");m.className="qh";m.textContent=v.slice(a,b);f.appendChild(m);p=b;});
      if(p<v.length)f.appendChild(document.createTextNode(v.slice(p)));n.parentNode.replaceChild(f,n);});});
  /* a hit that is only in a tag (e.g. “2021” behind the chip CSE’21) outlines the chip */
  root.querySelectorAll(".y").forEach(y=>{if(nq(y.title).includes(term))y.classList.add("hit");});}
function doSearch(){const term=nq(q.value.trim());qclr.hidden=!term;
  if(term.length<2){show(cur);return;}
  markNav("");let out="",hits=0;
  S.forEach(s=>{let part="";s.blocks.forEach(b=>{const fb=filt(b,term);if(fb){hits+=(fb.rows||[]).length+(fb.list||[]).length+(fb.fig&&nq(fb.h+" "+figText(fb.fig)).includes(term)?1:0);part+=blockHTML(fb,true);}});
    if(part) out+='<button class="srch-sec" data-sec="'+s.id+'">'+s.no+' · '+esc(s.title)+' →</button>'+part;});
  main.innerHTML='<div class="sec-head"><h2>'+hits+' match'+(hits===1?'':'es')+' for “'+esc(q.value.trim())+'”</h2></div>'+(exF?'<p class="filt">Filtered to <b>'+(exF==="any"?"any PYQ":FAM[exF])+'</b> · <button class="lnk" data-clear-ex>show all</button></p>':'')+'<p class="recall-hint">Recall mode: tap to reveal.</p>'+(out||'<div class="empty">Nothing matches. Try an Article number (280), a name (Sarkaria), or a year (1976).</div>');
  markHits(main,term);}
let st;q.addEventListener("input",()=>{clearTimeout(st);st=setTimeout(doSearch,120);});
qclr.addEventListener("click",()=>{q.value="";doSearch();q.focus();});
const rerender=()=>{if(q.value.trim().length>=2)doSearch();else show(cur);};
/* ---- exam filter ---- */
const ex=$("ex");function setEx(v){exF=v;ex.value=v;ex.classList.toggle("on",!!v);rerender();}
ex.addEventListener("change",()=>setEx(ex.value));
/* ---- recall ---- */
const rb=$("recall");rb.addEventListener("click",()=>{const on=!document.body.classList.contains("recall");document.body.classList.toggle("recall",on);rb.setAttribute("aria-pressed",on?"true":"false");});
/* ---- theme ---- */
const tb=$("theme");
function isDark(){const t=document.documentElement.dataset.theme;return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches;}
function paintTheme(){tb.textContent=isDark()?"Light":"Dark";}
tb.addEventListener("click",()=>{const t=isDark()?"light":"dark";document.documentElement.dataset.theme=t;try{localStorage.setItem("pms2-theme",t)}catch(e){}paintTheme();});
paintTheme();
/* ---- nav drawer ---- */
const closeNav=()=>document.body.classList.remove("nav-open");
$("menu").addEventListener("click",()=>document.body.classList.add("nav-open"));
$("scrim").addEventListener("click",closeNav);
/* ---- clicks ---- */
side.addEventListener("click",e=>{const tg=e.target.closest("[data-tog]");if(tg){const u=$("subs-"+tg.dataset.tog);openSubs(tg.dataset.tog,u.hidden);return;}
  const sc=e.target.closest("[data-sec]");if(sc){q.value="";qclr.hidden=true;show(sc.dataset.sec);closeNav();return;}
  const go=e.target.closest("[data-go]");if(go){q.value="";qclr.hidden=true;if(cur!==go.dataset.in||!$(go.dataset.go))show(go.dataset.in,go.dataset.go);else{const d=$(go.dataset.go);d.open=true;d.scrollIntoView({block:"start"});}closeNav();}});
main.addEventListener("click",e=>{
  const go=e.target.closest("[data-go]");if(go){const d=$(go.dataset.go);if(d){d.open=true;d.scrollIntoView({block:"start"});}return;}
  const all=e.target.closest("[data-all]");if(all){main.querySelectorAll("details.block").forEach(d=>d.open=all.dataset.all==="1");return;}
  if(e.target.closest("[data-clear-ex]")){setEx("");return;}
  const sc=e.target.closest("[data-sec]");if(sc){q.value="";qclr.hidden=true;show(sc.dataset.sec);return;}
  if(!document.body.classList.contains("recall"))return;
  const c=e.target.closest("ul.facts li:not(.open), td:not(:first-child)");if(c)c.classList.toggle("shown");});
/* print every card, not just the open ones */
let wasOpen=[];
addEventListener("beforeprint",()=>{wasOpen=[...main.querySelectorAll("details.block")].map(d=>[d,d.open]);wasOpen.forEach(([d])=>d.open=true);});
addEventListener("afterprint",()=>{wasOpen.forEach(([d,o])=>d.open=o);wasOpen=[];});
/* ---- header height, back to top ---- */
const hdr=$("top"),tt=$("totop");const setH=()=>document.documentElement.style.setProperty("--hdr",hdr.offsetHeight+"px");setH();addEventListener("resize",setH);
addEventListener("scroll",()=>{tt.hidden=scrollY<700;},{passive:true});tt.addEventListener("click",()=>scrollTo({top:0}));
addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement!==q){e.preventDefault();q.focus();}if(e.key==="Escape")closeNav();});
let start=location.hash.slice(1);if(!S.some(s=>s.id===start))start=S[0].id;show(start);
addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(S.some(s=>s.id===h)&&h!==cur){q.value="";show(h);}});
})();
</script>
