{h:"Arabian Sea and Bay of Bengal branches",t:1,cols:["Feature","Arabian Sea branch","Bay of Bengal branch"],rows:[
["Strength","The stronger branch","The weaker branch"],
["Landfall","Kerala, about 1 June; then strikes the **Western Ghats** at right angles — heavy rain on the windward side","The **Arakan** coast of Myanmar and the Bengal–Bangladesh coast"],
["Then","Sinks down the lee — a **rain shadow** over interior Maharashtra, Karnataka and Telangana; up through Gujarat and **parallel to the Aravalli**, so Rajasthan stays dry","Turned by the Himalaya — one arm up the Brahmaputra and into the **Meghalaya** funnel (**Mawsynram**, **Sohra**), the other west along the **Ganga plain**"],
["Rain pattern","Falls sharply inland from the coast","Falls from **east to west** along the plains and away from the foothills"]]},
{h:"Branches in questions",t:1,list:[
"The **Tamil Nadu coast** stays dry in summer — it lies **parallel** to the Bay branch and in the **rain shadow** of the Arabian Sea branch; the reason explains it [UPPCS 2023]",
"Interior **Maharashtra** lies in the Western Ghats’ rain shadow [CDS 2017 II]",
"The two branches merge over the north-west — **Punjab** gets rain from both [CDS 2021 II]"]},
{h:"The south-west monsoon season",t:1,list:[
"Onset :: over **Kerala** about **1 June** — the monsoon arrives there first [UPPCS 2006]",
"It covers the whole country by about **8 July** (IMD’s normal dates, revised in 2020)",
"**Burst** :: the sudden onset, with violent thunder and lightning, as moisture-laden winds arrive",
"**Break** :: a dry spell of days to weeks when the monsoon trough shifts to the Himalayan foothills — the hills get rain while the plains dry out",
"Rain comes largely from **depressions** that form at the head of the Bay and travel west-north-west along the trough",
"About **75%** of India’s annual rain falls from June to September",
"India is a ‘thirsty land’ despite ample rain — **rapid run-off**, **quick evaporation** and **rain packed into a few months**; all three [UPPCS 1994]",
"**Normal** monsoon :: seasonal rain within **96–104%** of the long-period average of **87 cm** (1971–2020); below 90% is ‘deficient’, above 110% ‘excess’",
"Duration **falls from south to north**, and annual rain on the northern plains **falls from east to west** — both true [CSE 2012]",
"Monsoon rain falls off towards the **west and north-west** of the Ganga plain — true; the winds do !!not!! rise higher up the plain, so the reason is false [CSE 1994]",
"Monsoon traits :: **uncertain onset**, **breaks**, an uneven spread and early or late withdrawal make farming a gamble"]},
{h:"Retreat and winter",t:1,list:[
"Retreat :: withdrawal from north-west India begins about **17 September** and is complete by **mid-October**, as the trough weakens and moves south",
"**October heat** :: hot, humid days after the rains, with clear skies over the still-wet land",
"Post-monsoon (October–November) :: depressions and cyclones from the Bay strike the **east coast**; the Coromandel gets its main rain now",
"**North-east monsoon** :: the retreating winds gather moisture over the Bay and rain on **Tamil Nadu** — the State that gains most from it [UPPCS 2009, 2008; RAS 2010]",
"Over half their rain from the north-east monsoon :: **South Arcot and Ramanathapuram**, Tamil Nadu [CDS 2018 II]",
"Winter (December–February) :: a high over the north-west sends **cool, dry north-easterlies** over most of India — both true, but the trades do !!not!! explain the dryness [UP RO 2023]",
"**Western disturbances** :: shallow lows from the **Mediterranean** that ride the westerly jet and bring winter rain and snow to the north-west — the ‘**mahawat**’, vital for **rabi** wheat [UPPCS 2021, 1993]",
"Winter rain reaches the **north-west** (western disturbances) and the **south-east** (the north-east monsoon on the Coromandel) [UPPCS M 2012]",
"Western-disturbance rain on the plains **falls from west to east** — the reverse of the summer monsoon; in the hills it falls from north to south [UPPCS 2019]"]},
{h:"Hot weather season and local storms",t:1,list:[
"March–May :: heat moves north with the Sun; days of **45°C** and more in the north-west; a low settles over the Thar and the plains",
"Local storms :: **mango shower** — the Karnataka coast (and Kerala) · **blossom shower** — Kerala · **Kalbaisakhi** — West Bengal · **loo** — Punjab to Bihar [UPPCS 2024]",
"**Mango showers** :: pre-monsoon thundershowers on the Kerala and Karnataka coasts that help mangoes ripen",
"**Blossom showers** :: pre-monsoon rain over Kerala and the Karnataka coffee country that makes the coffee flower",
"**Kalbaisakhi (Nor’westers)** :: violent evening squalls with rain in **West Bengal and Assam** in Baisakh — good for **tea, jute and rice**; ‘Bardoli chheerha’ in Assam [UP RO 2023]",
"**Loo** :: hot, dry afternoon winds from **Punjab to Bihar** in May and June",
"Seasons :: IMD counts **four** — winter (Jan–Feb), pre-monsoon (Mar–May), south-west monsoon (Jun–Sep), post-monsoon (Oct–Dec)",
"Six traditional **ritus** :: **Vasanta** (spring, Chaitra–Vaishakha) → **Grishma** (summer) → **Varsha** (rains) → **Sharad** (autumn) → **Hemanta** → **Shishira** [UP RO 2021]"]},
{h:"Rainfall in India",t:1,list:[
"Annual average :: about **116 cm** (the 1971–2020 normal)",
"Over 200 cm :: the Western Ghats’ windward face, the sub-Himalayan North-East and the **Meghalaya** hills — **Mawsynram** and **Sohra** are the wettest",
"Under 50 cm :: western **Rajasthan**, Kutch, **Ladakh** and the Deccan’s rain shadow",
"Least rain of Leh, Bikaner, Jaisalmer and Cherrapunji :: **Leh** [UPPCS M 2010; UPPCS 2009, 2008; CDS 2020 II]",
"Rainfall order :: **Kochi > Kolkata > Patna > Delhi** [CSE 2005]",
"Most marked contrast at one latitude :: **Ajmer and Shillong** (~26°N) [CSE 1993]",
"Humid climates :: **Kochi** and **Tezpur** — not Ahmedabad or Ludhiana [UP UDA 2010]",
"Most rain of Hyderabad, Bengaluru, Delhi and Raipur :: **Raipur** [CAPF 2020]",
"Highest average rain of Arunachal, Sikkim, Kerala and J&K :: keyed **Sikkim** [UPPCS M 2016]",
"**Andaman and Nicobar** :: a humid tropical coastal climate with rain from **both** the south-west and north-east monsoons — the wet months run May–December, !!not December–May!! [CSE 2026]",
"Rainy day (IMD) :: a day with **2.5 mm** or more of rain [CSE 1993]",
"**Variability** :: highest where rain is least — over **40%** in western Rajasthan, Kutch and Ladakh",
"Inland waterways are poorly developed partly because most rain falls in **four months** — the reason explains it [UPPCS 2008]"]},
{h:"Climatic regions (Köppen)",t:2,cols:["Code","Type","Where"],rows:[
["**Amw**","Monsoon, short dry season","West coast south of Goa"],
["**As**","Monsoon with a dry summer and wet winter","The **Coromandel** coast of Tamil Nadu"],
["**Aw**","Tropical savanna","Most of the Peninsula south of the Tropic"],
["**BShw**","Semi-arid steppe","North-west Gujarat, parts of western Rajasthan and Punjab"],
["**BWhw**","Hot desert","Far western Rajasthan — the Thar [CDS 2022 I]"],
["**Cwg**","Monsoon with a dry winter","Most of the **Ganga plain**, eastern Rajasthan, northern MP, much of the North-East [UKPCS 2021]"],
["**Dfc**","Cold, humid winter; short summer","Arunachal Pradesh"],
["**E**","Polar (alpine)","High Ladakh, Himachal and Uttarakhand"]]},

{h:"El Niño, La Niña and the monsoon",t:1,list:[
"Normal year :: the trades push warm water west — a **warm pool** with rising air and rain over Indonesia, and a cold, upwelling sea off **Peru**; the east–west **Walker circulation** links the two",
"**El Niño** :: every few years the trades weaken and warm water spreads back east, **replacing the cold current off Peru** — rain moves to the central and eastern Pacific [UPPCS M 2015; CAPF 2022]",
"El Niño brings a **warm current** off **Peru** but does !!not!! add plankton — the warm, nutrient-poor water starves fisheries [UPPCS 2023]",
"Effects :: rain and **floods** on the desert coast of Peru and Ecuador; **drought** in Indonesia, Australia and often India; fewer Atlantic hurricanes; coral bleaching",
"El Niño does !!not!! send the **south-east trades** towards the Indian Ocean — they weaken; it does distort equatorial circulation, alter evaporation and cut plankton and fish [CDS 2022 I]",
"**ENSO** :: El Niño and the **Southern Oscillation** together — the ocean warming and the Tahiti–Darwin pressure swing; it explains occasional **weak monsoons** [CSE 2002]",
"**La Niña** :: the reverse — stronger trades and a colder eastern Pacific; usually good for India’s monsoon, and it brings floods to Australia",
"La Niña is unusually cold water in the **equatorial Pacific**, !!not the Indian Ocean!!, and it **does** affect the monsoon — both statements false [CSE 2011]",
"**El Niño Modoki** :: warming in the **central** Pacific with cooler water east and west — a two-cell Walker circulation; the ordinary El Niño warms the **eastern** Pacific, so the reversed claim is false [CSE 2010]",
"ENSO’s grip on the monsoon has **weakened** since the 1980s — linked to a warmer Eurasia, shifted jets and rising greenhouse gases"]},
{h:"IOD, MJO, PDO and ocean heat",t:1,list:[
"**Indian Ocean Dipole** :: the sea-surface temperature difference between the **western** Indian Ocean and the **eastern** Indian Ocean off **Indonesia** — !!not the eastern Pacific!! [CSE 2017]",
"A **positive IOD** (warmer west) helps India’s monsoon and can **offset an El Niño** — as in 1997; a negative IOD does the reverse [CSE 2017]",
"Positive IOD years also favour **more Arabian Sea cyclones** than Bay ones",
"**MJO (Madden–Julian Oscillation)** :: an eastward-moving pulse of cloud and rain that circles the tropics in **30–60 days**; over the Indian Ocean its active phase strengthens monsoon spells and cyclones, its inactive phase brings breaks",
"**Ocean Mean Temperature** :: the average temperature of the sea down to the **26°C isotherm** — about **59 m** deep in the south-western Indian Ocean in January–March, !!not 129 m!! [CSE 2020]",
"OMT for January–March helps forecast whether monsoon rain will be **above or below** the long-term mean — a better guide than surface temperature [CSE 2020]",
"**PDO (Pacific Decadal Oscillation)** :: a 20–30-year swing of Pacific temperatures; a warm (positive) PDO with El Niño is bad for the monsoon, and a cool one with La Niña favours cyclones",
"**IMD** forecasts the monsoon in April and June from ENSO, IOD and ocean-heat signals, using statistical and coupled dynamical models"]},
{h:"Tropical cyclones of India",t:1,list:[
"Seasons :: **pre-monsoon** (April–May) and, the main one, **post-monsoon** (October–December); few form in the monsoon itself, when strong wind shear tears them apart",
"The **Bay of Bengal** gets about **four** cyclones for every **one** in the Arabian Sea — warmer, fresher surface water, remnants of Pacific typhoons and weaker shear",
"The **east coast** is more cyclone-prone than the west — true; it lies in the north-east trade-wind belt — also true, but !!not the reason!! [UPPCS 2003]",
"Arabian Sea cyclones are growing in number and strength as that sea warms — **Tauktae** (May 2021) formed there and hit **Gujarat** [UP RO 2021]",
"Storm surges are worst at the **head of the Bay**, where shallow water and a funnel-shaped coast pile the sea up — Odisha, West Bengal, Bangladesh; the **Bhola** cyclone (1970) killed some 3 lakh people",
"Landmark cyclones :: **Nargis** (2008) wrecked Myanmar’s Irrawaddy delta · **Fani** (2019) hit Odisha · **Amphan** (2020), a super cyclone, hit West Bengal",
"**Odisha** faces the most natural disasters of Andhra, Odisha, Bihar and Gujarat — cyclones, floods and droughts [UP Lower 2002]",
"**Mangroves** blunt cyclones with their dense roots; India is !!not!! disaster-free; the Bhopal gas leak was man-made; disasters hurt developing countries most [UPPCS 2018]",
"The 2004 tsunami struck the **Coromandel** coast hardest [UP RO M 2014]"]},
{h:"IMD cyclone scale",t:2,cols:["Stage","Wind speed"],rows:[
["Low-pressure area","Below 31 km/h"],
["**Depression**","31–49 km/h"],
["**Deep depression**","50–61 km/h"],
["**Cyclonic storm** — named from here","62–88 km/h"],
["**Severe cyclonic storm**","89–117 km/h"],
["**Very severe cyclonic storm**","118–166 km/h"],
["**Extremely severe cyclonic storm**","167–221 km/h"],
["**Super cyclonic storm**","222 km/h and above"]]},
{h:"Naming and warnings",t:1,list:[
"Names are given by **RSMC New Delhi** (IMD) for the North Indian Ocean under the **WMO/ESCAP Panel on Tropical Cyclones**",
"Members :: **13** — Bangladesh, India, Iran, Maldives, Myanmar, Oman, Pakistan, Qatar, Saudi Arabia, Sri Lanka, Thailand, UAE and Yemen; the 2020 list has **169** names, 13 from each, used in turn",
"A name is used **once only**; it must be short (up to eight letters), neutral and inoffensive",
"2025 :: **Shakhti** (Sri Lanka’s name; Arabian Sea, October) · **Montha** (Thailand’s; hit Andhra near Narasapuram, October) · **Senyar** (the UAE’s; Strait of Malacca, November) · **Ditwah** (Yemen’s; Sri Lanka, November)",
"Next on the list :: **Arnab** (Bangladesh) — the Bay system of September 2026 stayed a deep depression and went unnamed",
"IMD colour warnings :: **green** — no action · **yellow** — be aware · **orange** — be prepared · **red** — take action",
"Cyclone warning stages :: **pre-cyclone watch** (72 h ahead) → **cyclone alert** (48 h) → **cyclone warning** (24 h) → **post-landfall outlook** (12 h)"]},
{h:"Earthquakes and seismic zones",t:1,list:[
"India has **four** seismic zones — **II, III, IV and V**; the old Zone I was merged into Zone II in 2002 [UP Lower 2013]",
"**Zone V** (very high, ~11% of the land) :: Kashmir, Ladakh, Himachal, Uttarakhand, the North-East, north Bihar, the **Rann of Kutch** and the Andaman and Nicobar Islands",
"**Zone IV** (~18%) :: **Delhi**, the rest of the Himalayan belt, Sikkim, parts of the Indo-Gangetic plain and Gujarat, and the **Koyna** region",
"**Zone III** (~30%) :: Lakshadweep, the Western Ghats, Kerala, much of central India and the southern Ganga plain (Lucknow)",
"**Zone II** (~41%) :: most of the old Peninsular plateau — the **Karnataka plateau** is !!not!! a high-intensity area [UPPCS 2006]",
"Cities :: **Bhuj — V** · **Srinagar — V** · **Chennai — III** · **Hyderabad — II**; the 2014 options paired three of them wrongly [UP RI 2014]",
"The BIS issued a new code (IS 1893: 2025) in November 2025 with a **Zone VI** for the whole Himalayan arc, but **withdrew it on 3 March 2026** over costs and thin consultation — the **2016** code and its four zones still apply",
"**Koyna** may grow more quake-prone as changing reservoir levels load an old fault — the reason explains it [UPPCS 2001]",
"Great Indian quakes :: **Shillong 1897** · **Bihar–Nepal 1934** · **Assam 1950** (M 8.6, the strongest) · **Uttarkashi 1991** · **Latur 1993** · **Bhuj 2001** · **Kashmir 2005** · **Sikkim 2011**",
"The first disaster-management training institution was keyed at **Latur**, Maharashtra, scene of the 1993 quake [UP Lower 2004]",
"Tsunami warning :: the **Indian Tsunami Early Warning Centre** at **INCOIS, Hyderabad** [UPPCS M 2012]",
"**IMD** :: founded in 1875 at Calcutta; headquarters now in **New Delhi** [UPPCS M 2012]"]},
{h:"Floods, droughts and other hazards",t:1,list:[
"Exposure :: about **59%** of the land is prone to moderate-to-very-high earthquakes, **12%** (over 40 million ha) to floods, **5,700 km** of the coast to cyclones and tsunamis, and **68%** of the cultivated area to drought",
"Most flood-prone State :: **Bihar** — the Kosi, Gandak and Bagmati [UPPCS 2000]",
"In Uttar Pradesh the **eastern** districts flood most [UPPCS M 2012]",
"Landslides are rising in the Himalaya — earthquakes, road and dam building, deforestation and **mining**; the reason explains it [UPPCS M 2003]",
"Landslide belts :: the **Himalaya**, the North-East and the **Western Ghats** — the Wayanad slides of July 2024",
"Drought-prone :: western Rajasthan, Kutch, the Deccan rain shadow (**Marathwada**, **Rayalaseema**) and **Bundelkhand**",
"**Heat wave** (IMD) :: at least **40°C** in the plains with a departure of **4.5°C** or more, or **45°C** outright",
"Blizzards were keyed for a traveller to **Arunachal Pradesh**, whose peaks top 7,000 m [CDS 2021 II]",
"**Disaster Management Act, 2005** :: the **NDMA**, chaired by the Prime Minister; the **NDRF** for response; the **NIDM** for training"]}
]});

/* ===== 17 SOILS & NATURAL VEGETATION ===== */
SEC({id:"soils-veg",title:"Soils & Natural Vegetation",group:"India — Physical",tier:2,
stats:["UPSC CSE: 9 Q (2010–24) in 7 of 17 papers — soil conservation, red soil and the largest forest type (2010), laterite (2013), Himalayan plants (2014), teak forests (2015), black soil (2021), deciduous trees (2023), native trees (2024); older papers asked erosion stages (2001), thorn forests and mangroves (2002), laterite and ravines (1994) and Rajasthan’s soils (1993)","UPPCS Pre: 3 Q since 2018 — black soil (2018), laterite (2023), red soil (2024); UP RO and BEO papers since 2016 added soil ↔ State, usar and saline soils, erosion order and tree ↔ region; older UPPSC papers asked regur, laterite and forest types about 30 times","Formats: soil from three traits, soil ↔ State or crop, Assertion–Reason on soil colour and fertility, tree ↔ forest type, erosion order"],
note:"India’s soils — how they form, the eight groups and their crops, soil orders, erosion and conservation — then natural vegetation: forest types by rainfall and altitude, key trees, mangroves and forest cover. Protected areas and biodiversity are in Environment; crops are in the agriculture sheet.",
blocks:[
{h:"How soils form",t:2,list:[
"Soil-forming factors :: **parent rock**, **climate**, **relief**, **organisms** and **time** — climate and time (the active factors) outweigh parent rock in the long run",
"Parent rock sets the first texture and colour — **basalt** gives black soil, **granite and gneiss** red soil",
"Climate :: heavy rain **leaches** soluble minerals down; in dry lands evaporation draws salts **up** by capillarity and leaves them at the surface",
"Humus builds up in **cold** climates, where bacteria work slowly; in hot, wet lands dead matter rots fast, so humus stays low",
"Texture by particle size :: **clay under 0.002 mm** · silt 0.002–0.05 mm · sand 0.05–2 mm [UP RO 2016]",
"**Loam** :: a balanced mix of sand, silt and clay — the best farm texture [BPSC 2011]",
"**Clay** holds the most water, and capillary rise works best in it [BPSC 2011; UPPCS 2015]",
"Best pH for common crops :: about **6 to 7** — slightly acidic to neutral [CSE 1993]",
"**Lime** corrects **acidic** soils; **gypsum** corrects alkaline ones [MPPCS 2006]",
"Edaphic factors :: those of the **soil** [UPPCS 2018]"]},

caption:"Water carries material down the profile: it is leached out of A and E (eluviation) and collects in B (illuviation).",

{h:"Soil-forming processes",t:2,cols:["Process","Where","What happens"],rows:[
["**Laterisation**","Hot, wet tropics with a dry season","Heavy leaching strips silica and bases, leaving **iron and aluminium** oxides — a hard, red crust"],
["**Podzolisation**","Cool, humid **high mid-latitudes**, under conifers","Acid litter leaches iron and aluminium down, leaving a pale, **silica-rich** upper layer [CAPF 2024; RAS 2013]"],
["**Calcification**","Temperate grasslands, where evaporation beats rain","**Calcium carbonate** gathers near the surface — the fertile **chernozem** of the steppes [RAS 2013]"],
["**Salinisation**","Arid lands and over-irrigated fields","Capillary rise leaves **sodium and magnesium salts** at the surface"],
["**Alkalisation**","Poorly drained dry plains","Exchangeable **sodium** builds up; pH above 8.5 — sodic (usar) soil"],
["**Gleying**","Waterlogged soils","Iron is chemically reduced, giving grey-blue, mottled layers"]]},
{h:"Soils of India",t:1,cols:["Soil","Where","Make-up","Crops and exam hooks"],rows:[
["**Alluvial**","Northern plains, river valleys, deltas and coastal plains — about **40%** of India","**Rich in potash, poor in phosphorus**; low in nitrogen and humus; **khadar** (new) and **bhangar** (old) [CDS 2021 II; CDS 2023 I]","The **most productive** soil — rice, wheat, sugarcane, jute; typical of **Uttar Pradesh** [UP RO 2021]"],
["**Black (regur)**","The **Deccan lava** tract — Maharashtra, the **Malwa** plateau, Gujarat, MP, Telangana, Karnataka","From the weathering of **basalt** (fissure lava); rich in **lime, iron, magnesia and alumina**; poor in nitrogen, phosphorus and humus; clayey and deep [CSE 2021; CDS 2021 I]","Cotton — the ‘**black cotton soil**’; typical of **Maharashtra** [UP RO 2021]"],
["**Red and yellow**","Around the black soil to the south, east and north — Tamil Nadu, Karnataka, Andhra, Chota Nagpur, Odisha","From **granite and gneiss**; red from **diffused iron** (ferric oxides), yellow when hydrated; rich in potash, poor in nitrogen, phosphorus and humus [CSE 2010]","Millets, pulses, groundnut; typical of **Andhra Pradesh** [UP RO 2021]"],
["**Laterite**","Western Ghats, Kerala, Karnataka, Maharashtra, Odisha hills, Meghalaya","Formed under **high temperature and heavy rain** with a dry season; leached, rich in **iron and aluminium**, poor in nitrogen, potash, lime and humus; hardens in air — cut as bricks","Low fertility; with manure, **cashew, tapioca**, tea, coffee and rubber"],
["**Arid (desert)**","Western Rajasthan, Kutch","Sandy, saline, low in humus and nitrogen; **kankar** (lime) in the lower layers; phosphate is normal [CSE 1993; CAPF 2021]","Fertile once irrigated; typical of **Rajasthan** [UP RO 2021]"],
["**Saline and alkaline**","Western Gujarat, the eastern deltas, the **Sundarbans**, over-irrigated plains of Punjab, Haryana and UP","Excess **sodium, potassium and magnesium** salts — the **reh, kallar, usar** of the north [CDS 2023 II]","Infertile until reclaimed with **gypsum** and salt-tolerant crops"],
["**Peaty (marshy)**","Kerala (**kari**), coastal Odisha, the Sundarbans","Waterlogged, rich in **organic matter**, often acidic","Rice where drained"],
["**Forest (mountain)**","Himalaya, Western and Eastern Ghats","Thin and **acidic** on steep upper slopes, low in humus there; loamy and fertile in the valleys","Tea, coffee and spices in the south; fruit, maize and potato in the Himalaya"]]},
{h:"Soils in questions",t:1,list:[
"Red soil is the **second-largest** soil group, and it surrounds the black soil to the south, east and north — both true, but the spread does !!not!! explain the rank [UPPCS 2024]",
"Red soil owes its colour to the **wide diffusion of iron**, !!not a high proportion!! of it; it is also poor in nitrogen, phosphorus and humus — both true, but the reason is unrelated [UP RO 2023]",
"Formed from **basaltic lava** :: **regur** (black) soil — the ‘lava soil’ of the Malwa plateau [UPPCS 2015, 1998; UP Lower 2015; UP GIC 2010]",
"Black soil is black and suits **cotton**, but it is !!not rich in humus!! — its colour comes from iron-bearing minerals [UPPCS 2013, 1999; UPPCS Spl M 2004]",
"Most suitable for cotton :: **regur** [UPPCS M 2014]",
"Needs little irrigation because it holds water :: **black soil** — sticky when wet, deep cracks when dry, so it is ‘**self-ploughing**’ [UPPCS 2010; UP Lower 2009]",
"Black soil is called **regur**, is a mature soil and holds moisture — but it is !!not found in the Himalaya!! [UPPCS 2018]",
"Laterite forms under **high temperature and heavy rain** — true; it is !!not poor in iron and aluminium!! [UPPCS 2023]",
"**Laterite** soils are humid-tropical, highly leached and of low fertility — they are !!not rich in lime!! [UPPCS 2001]",
"Laterites are generally **red** and grow **tapioca and cashew** — they are !!not rich in nitrogen and potash!! and !!not well developed in Rajasthan and UP!! [CSE 2013]",
"Rendered infertile by **excess iron** :: **laterite** [CSE 1994]",
"Laterite is most widespread along the **Malabar** coast (Kerala); of UP, Himachal, Punjab and Maharashtra, it is **Maharashtra** [UPPCS 2000; UP UDA 2006]",
"**Andhra Pradesh’s** net sown share is below West Bengal’s — true; that most of Andhra’s soil is laterite is !!false!! [CSE 2006]",
"The most productive soil in India :: **alluvial** [UP RO 2014]",
"Most deficient micronutrient in Indian soils :: **zinc** [UPPCS Spl M 2004]",
"**Himalayan soils** are !!not rich in humus!!, though the Himalaya has India’s largest forest area [UP Lower 2004]",
"**Usar** soil :: alkaline (**pH above 7**); reclaimed with **gypsum**, !!not lime!!; salt-tolerant rice can be grown [UP BEO 2019]",
"Saline soils are unfit for crops because **dry climate and poor drainage** leave salt behind — the reason explains it [UP RO 2023]",
"Largest saline area :: **Gujarat** [UPPCS M 2017, 2012]",
"Largest alkaline area was keyed as :: **Uttar Pradesh** [UPPCS M 2007]",
"Tea needs :: deep, well-drained **acidic** soil [UPPCS 2002]"]},
{h:"Soil orders",t:2,list:[
"The American (USDA) system groups soils into **orders**; India’s largest are **Inceptisols (~40%)**, **Entisols (~28%)**, **Alfisols (~14%)** and **Vertisols (~9%)**, then Aridisols, Ultisols and Mollisols",
"Order definitions :: **Entisols** — weakly developed, with no horizons · **Inceptisols** — weak, young horizons · **Histosols** — very rich in organic matter near the top · **Oxisols** — very old and highly weathered [CDS 2022 I]",
"**Vertisols** are the black cotton soils; **Aridisols** the desert soils — low in organic matter, !!not high!!, with little water for plants most of the year [CDS 2017 I]",
"World soils by climate :: **podzol** — cold temperate · **chernozem** — temperate steppe · **spodosols** — humid cold temperate · **laterite** — hot, humid [RAS 2013]",
"**Terra rossa** :: red soil formed over **limestone** in Mediterranean lands [BPSC 1994]",
"Earthworms **improve** soil by loosening and enriching it — so ‘earthworms are not good for soil’ is !!false!! [JPSC 2013]"]},
{h:"Soil erosion",t:1,list:[
"Water erosion, by growing severity :: **splash → sheet → rill → gully** [CSE 2001; UP RO 2023]",
"**Sheet erosion** :: a thin layer of fertile topsoil washed off level land — hardly noticed",
"**Gully erosion** :: deep channels on slopes that cut fields into **ravines** or **badlands** — the Chambal ravines [CSE 1994; CDS 2019 I]",
"Worst-hit areas :: the **Chambal** and Yamuna ravines, the **Shiwalik foothills**, Chota Nagpur, Malwa and the black-soil lands of Maharashtra [UPPCS 2004; UP Lower 2004]",
"Wind erosion :: the arid west — **Rajasthan**, Haryana and Gujarat",
"Causes :: **deforestation**, **overgrazing**, shifting cultivation, ploughing down slopes and over-irrigation",
"**Soil impoverishment** :: soil so depleted of plant nutrients that it grows little [CDS 2019 II]"]},
{h:"Soil conservation",t:1,list:[
"Appropriate methods :: **crop rotation**, **sand fences**, **terracing** and **windbreaks** — all four [CSE 2010]",
"Best single remedy :: **afforestation** — never deforestation or overgrazing [UP RO 2014]",
"On slopes :: **terracing** and **contour ploughing** check run-off [CDS 2014 I]",
"**Contour bunding** :: earth ridges along the contour on hill slopes — seen in **Himachal Pradesh** [CDS 2021 II]",
"Other methods :: **mulching** (covering soil with straw), **strip cropping** and intercropping, rock dams in gullies, and **shelterbelts** of trees in dry and coastal belts"]},
{h:"Forest types of India",t:1,cols:["Type","Rainfall","Where","Trees"],rows:[
["**Tropical wet evergreen**","Over **250 cm**, humidity above 75%","Western Ghats’ wet side, the North-East, Andaman and Nicobar","Tall, dense, many-layered: mahogany, **ebony**, rosewood, rubber, cinchona, **jackfruit** [CDS 2015 II]"],
["**Tropical semi-evergreen**","200–250 cm","Next to the evergreen belt; lower Shiwaliks, Odisha","Mixed evergreen and deciduous"],
["**Tropical moist deciduous**","100–200 cm","Eastern Western Ghats, Shiwalik–Terai, the North-East, Chota Nagpur, Odisha","**Teak**, **sal**, shisham, mahua, sandalwood, bamboo [CDS 2015 II]"],
["**Tropical dry deciduous**","70–100 cm","A broad belt from the middle Ganga plain to the southern plateau — the **largest** forest type by area","Teak, sal, **khair**, axlewood, **red sanders** (Andhra–Karnataka borders)"],
["**Tropical thorn**","Under 70 cm","Rajasthan, Gujarat, south-west Punjab, and the Deccan rain shadow","**Babul**, **khejri**, kikar, cacti; stunted trees with long roots and thorns"],
["**Tropical dry evergreen**","~100 cm, mostly from the NE monsoon","Coromandel coast of Tamil Nadu","Short evergreen trees"],
["**Montane wet temperate (shola)**","150–300 cm","**Nilgiris**, Anamalai, Palni — with grassland between [CDS 2022 II]","Stunted evergreen forest in hollows — !!not the upper Himalaya!! [CDS 2016 II]"],
["**Himalayan moist and dry temperate**","100–250 cm; dry in the inner ranges","1,500–3,000 m","**Deodar**, blue pine, chir, oak, **walnut**, fir, spruce [CDS 2015 II]"],
["**Alpine and sub-alpine**","Mostly snow","Above ~3,000 m","Silver fir, **birch**, rhododendron, juniper, then scrub and meadows [CDS 2015 II]"],
["**Littoral and swamp**","Tidal coasts and deltas","Sundarbans, Mahanadi, Godavari, Krishna deltas; Andaman","**Mangroves** — sundari, rhizophora"]]},
{h:"Forests in questions",t:1,list:[
"Rain over 250 cm, 25–27°C, humidity over 75% and no season for shedding leaves :: **tropical wet evergreen** [CAPF 2017]",
"Of the options, the forest type with the largest area :: **tropical moist deciduous** — among all types, the tropical **dry** deciduous is the largest [CSE 2010]",
"Teak and sal were keyed as products of the :: **tropical dry deciduous** forests — both grow in the moist deciduous too [UPPCS M 2007]",
"Teak is dominant in the :: **tropical moist deciduous** forest [CSE 2015]",
"Deciduous trees :: **mahua** and **teak** — !!jackfruit is evergreen!! — so only two of the three [CSE 2023]",
"Forest ↔ region :: moist deciduous — **Terai** · dry deciduous — **middle Ganga plain** · alpine — **Arunachal** · evergreen — **Sahyadri** [UPPCS 2001]",
"Forest ↔ region :: tropical — **Silent Valley** · conifer — **Himachal** · mangrove — **Sundarbans** · deciduous (thorny) — **Rajasthan** [UPPCS 2017]",
"Open stunted forest with long-rooted, thorny trees is found in :: **western Andhra Pradesh** (the Rayalaseema rain shadow) [CSE 2002]",
"Going by road from Bikaner to Konark you pass :: **desert → tropical thorn → moist deciduous → mangrove** [CDS 2022 II]",
"**Orchids** thrive in :: **Arunachal Pradesh** — the State best placed for an export orchid industry [CSE 2011]"]},

caption:"Schematic belts; real limits vary with rainfall and aspect. The tree line and every belt sit higher in the wetter eastern Himalaya than in the west.",

{h:"Mountain vegetation",t:1,list:[
"Himalayan belts, rising :: tropical moist deciduous (**sal**) → subtropical **chir pine** → temperate **deodar**, blue pine, oak, fir, spruce → sub-alpine **silver fir, birch, rhododendron** → alpine scrub and meadows (**bugyals**) → snow",
"You would see **oak** and **rhododendron** in the Himalaya — !!not sandalwood!!, a southern tree [CSE 2014]",
"Not of the temperate Himalaya :: **cashew and magnolia** — oak, maple, rhododendron, birch and laurel are [CDS 2023 II]",
"**Birch** grows in the :: **Himalaya** [UKPCS 2006]",
"The tree line is **lower in the western Himalaya** (~3,300–3,600 m) than in the east (~3,600–3,800 m) [UPPCS M 2005]",
"The **88°E** meridian, near Sikkim, is taken as the divide between the western and eastern Himalayan vegetation",
"Subtropical broad-leaved hill forests :: 1,000–2,000 m on the **Nilgiris, Palni, Mahabaleshwar**, Satpura–Maikal, Mount Abu and the Khasi–Jaintia hills — oak, chestnut, sal and pine"]},
{h:"Trees and where they grow",t:1,cols:["Tree","Where","Exam hook"],rows:[
["**Teak**","Central and western Peninsula; largest teak forests in **MP**","Central India [UPPCS 1992]"],
["**Sal**","Sub-Himalayan Terai and the north-eastern Peninsula","Moist deciduous"],
["**Deodar**","**Western Himalaya**, above ~1,500 m","!!Not the Nilgiris!! [UP RO 2023; UPPCS 1992]"],
["**Sundari**","The **Sundarbans** delta","Gives the Sundarbans its name [UPPCS 1992]"],
["**Cinchona**","Evergreen hills of Assam, Kerala, West Bengal","!!Not Chhattisgarh!! [UP GIC 2010]"],
["**Khejri**","Rajasthan’s thorn forest","Multipurpose tree of **social forestry** — fodder, fuel, medicine [UPPCS M 2002]"],
["**Khair (catechu)**","Dry forests","Keyed a **subtropical** tree [UKPCS 2021]"],
["**Palash (flame of the forest)**","Dry deciduous forests","**Butea monosperma** [RAS 2010]"],
["**Red sanders**","**Endemic** to the Seshachalam–Palkonda hills of Andhra","The only one of cashew, papaya and red sanders **native to India** — cashew came from Brazil, papaya from Central America [CSE 2024]"],
["**Rosewood / shisham**","Moist deciduous forests","Genus **Dalbergia** [CSE 2007]"]]},
{h:"Medicinal plants",t:3,list:[
"**Sarpagandha** :: treats high blood pressure; found only in India",
"**Himalayan yew** :: its bark, needles and roots give **taxol**, a leading anti-cancer drug — Himachal and Arunachal",
"**Jamun** seed powder helps control **diabetes**; **arjun** leaf juice eases earache and regulates blood pressure",
"Other remedies :: **neem** — antibiotic and antibacterial · **tulsi** — coughs and colds · **babool** — leaves for eye sores, gum as a tonic · **kachnar** — asthma and ulcers"]},
{h:"Mangroves",t:2,list:[
"Mangroves :: **salt-tolerant** trees of tropical tidal coasts, between roughly 25°N and 25°S",
"Adaptations :: **breathing roots** (pneumatophores), **stilt roots**, salt-excluding roots and seeds that sprout on the tree and float",
"India’s largest mangroves :: **Sundarbans** (West Bengal), then **Gujarat** and **Andaman and Nicobar**; mangrove cover is about **5,000 km²**",
"Sites :: Achra–**Ratnagiri** (Maharashtra) · **Coondapur** (Karnataka) · **Pichavaram** (Tamil Nadu) · **Vembanad** (Kerala) [CSE 2002]",
"**Coringa** :: the mangroves of the **Godavari** delta near Kakinada — the second-largest after the Sundarbans [UP RO M 2021]",
"Mangrove sites and States :: Sundarbans — West Bengal · **Bhitarkanika** — Odisha · Pichavaram — Tamil Nadu · Vembanad — **Kerala**, !!not Karnataka!! [UP Lower 2002]"]},
{h:"Forest cover",t:2,list:[
"Forest cover :: every patch of **1 ha or more** with **tree canopy of 10% or more**, whatever the ownership — orchards, bamboo and palms included",
"**Recorded forest area** :: land recorded as forest in government records — reserved and protected forests under the Indian Forest Act, 1927 — whether or not trees stand on it",
"Density classes :: **very dense** (70%+ canopy) · **moderately dense** (40–70%) · **open** (10–40%); **tree cover** means patches under 1 ha outside recorded forest",
"India State of Forest Report 2023 :: forest cover **21.76%** and tree cover **3.41%** of the country — **25.17%** in all",
"Largest forest cover :: **Madhya Pradesh > Arunachal Pradesh > Chhattisgarh**",
"Highest share of area under forest :: **Lakshadweep** (~91%) > Mizoram (~85%) > Andaman and Nicobar (~82%) [CDS 2022 I]",
"Biggest gains in forest and tree cover (2021–23) :: **Chhattisgarh**, UP, Odisha, Rajasthan",
"Biggest losses (2021–23) :: **Madhya Pradesh**, Karnataka, Ladakh, Nagaland"]}
]});

SEC({id:"water-projects",title:"Irrigation, Dams & River Links",group:"India — Resources & People",tier:2,
stats:["UPSC CSE: 5 Q (2009–22) in 4 of 17 papers — hydro projects on the Chenab (2009 ×2), the Godavari–Krishna link (2016), what Aliyar, Isapur and Kangsabati are (2019), reservoir ↔ State (2022); a dam–river pair set (2010) and groundwater (2023) came up too","UPPCS Pre: 5 Q since 2018 — a Bhutan hydro plant (2019), canal ↔ river and the Ramganga project (2024), dam ↔ river and Himalayan hydropower (2025); older UPPSC papers matched dams, rivers and States about 60 times","Formats: dam ↔ river ↔ State matching, how many pairs are wrong, canal ↔ source river, joint projects and water disputes, river links"],
note:"Water as a resource: how much India has, how its fields are irrigated and from which canals, the big multipurpose dams of the north and of the Peninsula, river links and water disputes, and traditional water harvesting. The rivers themselves are in the two drainage sheets; hydropower as energy is in the energy sheet.",
blocks:[
{h:"India’s water",t:1,list:[
"India has about **4%** of the world’s fresh water for about **18%** of its people",
"Water resource potential :: about **1,999 bcm** a year, of which some **1,122 bcm** is usable — ~690 bcm from surface water and ~432 bcm from groundwater",
"India ranks about **13th** among the world’s most water-stressed countries",
"Water per head :: about **1,545 m³** in 2011 and **~1,486 m³** by 2021 — below the **1,700 m³** stress line; below 1,000 m³ is scarcity (the Falkenmark index)",
"India is the world’s **largest user of groundwater** — about a quarter of global withdrawals; about **60%** of the annual extractable recharge is now drawn",
"Richest in replenishable groundwater :: **Uttar Pradesh** [UPPCS M 2006]",
"Stress hot spots :: the over-pumped **north-west** (Punjab, Haryana, Delhi, western UP, Rajasthan), the hard-rock **south**, and arsenic- and fluoride-hit parts of the east",
"The most cost-effective water strategy for India :: **rainwater harvesting** [UPPCS M 2011]"]},
{h:"Irrigation",t:1,list:[
"A little over **half** of India’s net sown area is irrigated; the rest is rain-fed",
"Sources of the net irrigated area :: **tube wells and wells** over three-fifths · **canals** about a quarter · **tanks** a few per cent",
"**Tanks** are a major source in the Peninsula — hard rock hinders wells and canals, and most rivers there are seasonal; the reason explains it [UP Lower 2015]",
"Largest area under tube-well and well irrigation :: **Uttar Pradesh** — about three-quarters of its irrigated area [UPPCS M 2017; UPPCS 2006]",
"Tube-well irrigation grew most spectacularly in the canal-less **Saryupar plain** [UPPCS 1995]",
"Highest share of cropped area irrigated :: **Punjab** and **Haryana** (over 90%); of Haryana, UP, MP and Maharashtra, **Haryana** [UPPCS M 2015]",
"Crop with the highest irrigated share :: **sugarcane** (~97%), then wheat (~95%); rice ~70%, oilseeds under half [UP UDA 2013]"]},
{h:"Canals",t:1,cols:["Canal","Takes off from","Serves and notes"],rows:[
["**Indira Gandhi (Rajasthan) Canal**","**Harike** barrage, below the Sutlej–Beas meeting; water of the **Sutlej, Beas and Ravi**","India’s longest — a ~204 km feeder and ~445 km main canal into the Thar; the **Pong** dam on the Beas keeps it running in winter [UPPCS 2024, 1999, 1992; UP GIC 2010; UP UDA 2013]"],
["**Sirhind Canal**","**Sutlej**, at Ropar","Punjab [UPPCS 2024]"],
["**Upper Bari Doab Canal**","**Ravi**, at Madhopur","Punjab, between the Beas and the Ravi [UPPCS 2024]"],
["**Gurgaon Canal**","**Yamuna**","Haryana [UPPCS 2024]"],
["**Western and Eastern Yamuna Canals**","**Yamuna**, at Hathnikund","Haryana and western UP"],
["**Upper and Lower Ganga Canals**","**Ganga** — the Upper at **Haridwar**, the Lower at **Narora**","The Ganga–Yamuna doab [UP GIC 2010]"],
["**Sharda Canal**","**Sharda**, at Banbasa","Central UP"],
["**Eden Canal**","**Damodar**","West Bengal [UPPCS 2015]"],
["**Midnapore Canal**","**Kangsabati (Kasai)**","West Bengal [UP Lower 2015]"],
["**Buckingham Canal**","Coastal, Kakinada to Villupuram","A salt-water navigation canal along the Coromandel coast"],
["**Jawai · Ghataprabha · Nira · Ukai**","Jawai (a Luni tributary) · Ghataprabha · Nira · Tapi","**Rajasthan** — !!not Tamil Nadu!! · Karnataka · Maharashtra · Gujarat [UP BEO 2019]"]]},

{h:"Dams in questions",t:1,list:[
"Of four reservoir–State pairs, three were wrong :: **Ghataprabha** is in **Karnataka**, **Indira Sagar** in **MP**, **Maithon** in **Jharkhand** — only **Gandhi Sagar — MP** was right [CSE 2022]",
"**Aliyar**, **Isapur** and **Kangsabati** are all :: **reservoirs** — Aliyar in Tamil Nadu, Isapur on the Penganga in Maharashtra, Kangsabati in West Bengal [CSE 2019]",
"Not part of the Chambal project :: **Govind Sagar** (Bhakra) and **Govind Ballabh Pant Sagar** (Rihand) [UPPCS M 2011]",
"**Rihand** is on a Son tributary, **Hirakud** on the Mahanadi, **Maithon** on the Barakar (a Damodar tributary), and **Tungabhadra** is a Karnataka–Andhra project — all four true [UP RO 2016]",
"**Rana Pratap Sagar** is in **Rajasthan**, !!not MP!! [UP Lower 2004]",
"**Sivasamudram** power station is in **Karnataka**, !!not Kerala!! [UPPCS M 2011, 2009; UPPCS Spl M 2008]",
"Oldest hydropower station :: **Sidrapong** near Darjeeling (1897); **Sivasamudram** on the Kaveri (1902) came next [UPPCS M 2008; UP Lower 1998; UP UDA 2013]",
"The **Damodar** was the ‘sorrow of Bengal’ — fast in its upper course, sluggish and flood-prone below — until the DVC dams [UPPCS 2010]",
"The **Kaveri** dispute involves **Tamil Nadu, Karnataka, Kerala and Puducherry** [UP UDA 2010]",
"Himalayan hydropower :: the potential is **huge** — true; that eastern UP and Bihar cannot use it because the hills to their north lie in Nepal is !!false!! — power moves over the grid and through cross-border projects (the first key took both as true) [UPPCS 2025]",
"Bhutan projects built with India :: **Chukha**, **Kurichhu**, **Tala**, **Mangdechhu** (inaugurated 2019) and **Punatsangchhu-II** (November 2025) [UPPCS 2019]",
"**Kalpong** :: the first hydro project of the **Andaman and Nicobar** Islands [UP Lower 2002]"]},
{h:"River links",t:1,list:[
"**National Perspective Plan** (1980) :: **30** links joining **37** rivers — **16** Peninsular and **14** Himalayan — studied by the National Water Development Agency",
"**Ken–Betwa** :: the first link taken up under the plan — MoU between **UP and MP** in 2005; the **Daudhan** dam on the Ken, begun December 2024, borders Panna [UPPCS 2006]",
"**Godavari–Krishna** :: linked in 2015–16 by the **Pattiseema** lift scheme in Andhra [CSE 2016]",
"**Parbati–Kalisindh–Chambal–Eastern Rajasthan Canal** :: a Rajasthan–MP link agreed in 2024",
"**Damanganga–Pinjal** (Mumbai’s water) and **Par–Tapi–Narmada** (Gujarat) are western links; the Mahanadi–Godavari link heads the Peninsular chain",
"Disputes go to tribunals under the **Inter-State River Water Disputes Act, 1956** (Article 262)",
"Tribunals and parties :: **Krishna** — Maharashtra, Karnataka, Telangana, Andhra · **Narmada** — MP, Gujarat, Maharashtra, Rajasthan · **Mahadayi (Mandovi)** — Goa, Karnataka, Maharashtra · **Vansadhara** — Odisha, Andhra · **Mahanadi** — Odisha, Chhattisgarh · **Ravi–Beas** — Punjab, Haryana, Rajasthan"]},
{h:"Traditional water harvesting",t:2,list:[
"**Kuls (guls)** :: diversion channels of the western Himalaya",
"**Khadins** (Jaisalmer), **johads** and **kunds (tankas)** :: rain-catching bunds, ponds and covered cisterns of Rajasthan",
"Others :: **zabo** (Nagaland), **bamboo drip** (Meghalaya), **ahar–pyne** (south Bihar), **eri** tanks (Tamil Nadu), **surangam** tunnels (Kerala–Karnataka)",
"**Tamil Nadu** was the first State to make rooftop rainwater harvesting compulsory for all houses"]}
]});

/* ===== 19 CROPS & AGRICULTURE ===== */
SEC({id:"agriculture",title:"Crops & Agriculture",group:"India — Resources & People",tier:2,
stats:["UPSC CSE: 24 Q on crop geography (2010–25), 13 since 2018 — a crop from its needs (pepper 2010, cotton 2020), crops for the lower Ganga plain (2011), rain-fed and kharif crops (2012, 2013), region ↔ crop and maize uses (2014), kharif area, rice exports and edible-oil imports (2019), pulses (2020), water use and palm oil (2021), tea States (2022), India vs China (2023), legumes (2024), turmeric (2025); MSP, farm technology and GM crops are in Economy","UPPCS Pre: 10 Q since 2018, 5 of them in 2024 (cultivated area, rice facts, jute, cotton, canals), and an institute’s location (2021); older UPPSC papers asked leading States, seasons, revolutions, crop varieties and research institutes about 180 times","Formats: crop ↔ leading State (keys follow the data of their year), crop from its climate, season ↔ crop, how many statements are correct, revolution ↔ product"],
note:"Crop geography of India: land use and farm regions, the three seasons, what each crop needs and where it grows — food grains, pulses, oilseeds, fibres, plantation crops, spices and horticulture — then livestock, fish and silk, and the research institutes. Prices, procurement, farm technology and GM crops belong to Economy.",
blocks:[
{h:"Land and farming",t:1,list:[
"Net sown area :: about **140 million ha** — some **46%** of India’s area; cropping intensity is about **150%**",
"India has **more arable land than China** — true; China irrigates a **larger share** and gets **higher yields**, so only one of the three statements held [CSE 2023]",
"Of the USA, China and Japan, India has the **largest cultivated area**, and its tropical monsoon setting allows crops all year — both true [UPPCS 2024]",
"Kharif area in recent years :: **rice** has the largest area, and **cotton** outranks **sugarcane** — jowar is !!not!! ahead of oilseeds, and sugarcane area has !!not!! fallen steadily [CSE 2019]",
"Average holding :: about **1.1 ha** (2015–16), and falling; the largest averages are in **Nagaland** and, of the big farm States, **Punjab** [UP UDA 2010]",
"Land-use classes :: **current fallow** — left uncultivated for up to a year · **other fallow** — 1–5 years · **culturable waste** — over 5 years",
"**Net sown area** counts a field once; **gross cropped area** counts it once for every crop sown in the year; **cropping intensity** = gross ÷ net × 100",
"Land-use trends :: forests and **non-farm uses** have grown; barren land, permanent pasture, other fallow and culturable waste have shrunk; **current fallow** has grown",
"Low productivity comes from **overcrowding on the land**, **tiny holdings** and **old methods** — all three; cooperative farming is !!not a cause!! [UPPCS 2007, 2003]",
"Farm regions :: the Planning Commission drew **15** agro-climatic regions; the soil survey bureau (NBSS&LUP) **20** agro-ecological regions and 60 sub-regions [UPPCS M 2016; UP RO M 2013; UP Lower 2013]",
"**Shifting cultivation** names :: **jhum** — North-East · **kumari** — Western Ghats · **waltre (valre)** — south-east Rajasthan · **dahiya, bewar** — MP and Chhattisgarh · **podu** — Andhra · **koman, bringa, dabi** — Odisha · **kuruwa** — Jharkhand [UPPCS 2017]",
"Jhum is most widespread in :: **Nagaland** and the other hill States of the North-East [UPPCS 2005]"]},
{h:"Cropping calendar",t:1,fig:{kind:"svg",

{h:"Cropping seasons",t:1,cols:["Season","Sown · harvested","Crops"],rows:[
["**Kharif**","June–July · September–October","Rice, maize, jowar, bajra, tur, moong, urad, **cotton**, **jute**, **groundnut**, **soybean** [UPPCS Spl M 2004]"],
["**Rabi**","October–November · March–April","**Wheat**, barley, **gram**, lentil, **mustard**, peas, linseed, potato [UPPCS M 2016]"],
["**Zaid**","March · June","Watermelon, muskmelon, cucumber, vegetables, fodder; **moong and urad** under irrigation [UPPCS 2011]"]]},
{h:"Seasons in questions",t:1,list:[
"Kharif crops :: **cotton, groundnut and rice** — !!wheat is rabi!! [CSE 2013]",
"Not kharif :: **mustard** and **gram** — both rabi [UPPCS 2012; UPPCS M 2011]",
"Green gram (**moong**) is mainly a **kharif** pulse — !!not a rabi pulse!! like gram, lentil and French bean [UP RO 2023]",
"Crop ↔ season :: **sunflower** — all seasons · **muskmelon** — zaid · **cotton** — kharif · **linseed** — rabi [UP RO 2016]",
"Grown all year round :: **maize** [UP Lower 2015; UPPCS 2007]",
"Rabi crops thrive in Punjab and Haryana — true; the winter rain comes from **western disturbances**, !!not tropical cyclones!! [UP RO 2023]",
"Mainly **rain-fed** :: **groundnut, sesamum and pearl millet** [CSE 2012]"]},
{h:"What crops need",t:1,cols:["Crop","Temperature","Rainfall","Soil and notes"],rows:[
["**Rice**","**25°C+**, hot and humid","**100 cm+** — the 100 cm isohyet marks its western limit","Clayey alluvium that holds water [UPPCS M 2007]"],
["**Wheat**","**10–15°C** at sowing, 21–26°C and bright sun at harvest","50–75 cm","Loam and clay loam; winter crop"],
["**Maize**","21–27°C","50–100 cm","Old alluvium, red loam; a **C4** plant [UPPCS M 2014]"],
["**Millets**","**Bajra** hottest and driest (40–50 cm) · **jowar** in between · **ragi** coolest and wettest","30–100 cm","Poor, light soils; rain-fed"],
["**Pulses**","Moderate","Under 75 cm","Any soil; they **fix nitrogen** [UPPCS M 2006]"],
["**Sugarcane**","20–30°C, humid","75–150 cm or irrigation","Alluvium and black soil; a thirsty, long-duration crop"],
["**Cotton**","**21–30°C**; **210 frost-free days**","**50–100 cm** — light rain","**Black soil**"],
["**Jute**","Hot and humid, 25°C+","**150 cm+**, humidity over 80%","New alluvium of flood plains"],
["**Tea**","Warm, frost-free","**150–300 cm**, well spread","Deep, **acidic**, well-drained soil on **slopes**"],
["**Coffee**","15–28°C, no frost","150–200 cm","Shaded hill slopes, well-drained loam"],
["**Rubber**","25–35°C","~200–300 cm, all year","Laterite and deep loam"]]},
{h:"Crops from clues",t:1,list:[
"Humid, hot all year — the best pair for the **lower Gangetic plain** :: **paddy and jute** [CSE 2011]",
"A tropical creeper of the humid Western Ghats, grown up support trees for its berries :: **black pepper** [CSE 2010]",
"Needs 21–30°C, 50–100 cm of rain, 210 frost-free days and black soil :: **cotton** [CSE 2020]",
"Cotton is mostly a **kharif** crop needing moderate rain of 50–75 cm — both true [UPPCS 2024]",
"Least water-efficient of sugarcane, sunflower, pearl millet and red gram :: **sugarcane** [CSE 2021]",
"More than 200 cm of rain on sloping hills suits :: **tea** [UPPCS 2010]",
"Belong to the pea family and fix nitrogen :: **groundnut, horse-gram and soybean** — all three [CSE 2024]",
"Enriches soil nitrogen :: **pea** [CSE 1994]",
"Used as pulse, fodder and green manure :: **cowpea** and **green gram** [CSE 2012]",
"Green manure crop with the most nitrogen :: **cowpea (lobia)** — above dhaincha, sunhemp and guar [UPPCS M 2016]",
"Region ↔ crop pairs :: **Kinnaur — areca nut**, **Mewat — mango** and **Coromandel — soybean** — !!none is right!! (Kinnaur grows apples, Mewat mustard and millets) [CSE 2014]"]},
{h:"Rice and wheat",t:1,list:[
"**Rice** :: the chief food crop and the largest by area [UPPCS M 2011; UP Lower 2004]",
"India became the world’s **largest rice producer** (announced January 2026), overtaking China, and is the **largest exporter** — about two-fifths of world trade [CSE 2019]",
"Largest rice area :: **Uttar Pradesh** [UPPCS M 2007; UPPCS 2024]",
"Leading rice States rotate among **UP, Telangana, West Bengal and Punjab** — in 2024–25 UP led, ahead of Telangana and West Bengal; West Bengal led for most earlier years, so keys follow their year [UPPCS M 2006]",
"Highest rice yield :: **Punjab** [UPPCS M 2015; UP RO 2017]",
"Rice facts :: **West Bengal** grows three rice crops a year (aus, aman, boro); the western limit is the **100 cm** isohyet; UP has the largest area — but **Bihar’s share is about 5%**, !!not 15.7%!! [UPPCS 2024]",
"**Aman** paddy :: sown June–July, harvested November–December — !!not sown in March–April!! [UPPCS M 2011; UP Lower 2013]",
"**Wheat** :: **UP > MP > Punjab** (2024–25); UP has led for years [UPPCS 2006; UP RO 2016; UP Lower 2013]",
"Wheat gained most from the **Green Revolution**, in both output and yield [UPPCS 2015, 2001, 1994]"]},
{h:"Millets, maize and pulses",t:1,list:[
"**Bajra** (pearl millet) :: **Rajasthan** grows about 45%, then UP, Haryana and Gujarat [UPPCS M 2008]",
"**Jowar** :: Maharashtra and Karnataka; **ragi** comes mainly from Karnataka",
"**Maize** leaders (2024–25) :: **MP, Karnataka, Bihar**, Maharashtra, Telangana [UPPCS M 2010]",
"Maize yields **starch**, **oil** (a biodiesel feedstock) and **alcohol** — all three uses hold [CSE 2014]",
"**Guar** (cluster bean) :: a drought-hardy legume of Rajasthan whose seed gum goes into foods and into **fracking** for shale gas",
"India is the largest **producer, consumer and importer** of pulses — so pulses are hardly exported [UPPCS M 2014; UPPCS 2013]",
"Pulses restore soil nitrogen through root-nodule bacteria (**Rhizobium**); one key took **rajma** as a non-fixer, though it too forms nodules [UPPCS M 2009]",
"India is short of **pulses** but not of protein, because demand for pulses runs ahead — the reason explains it [UPPCS 2009]",
"Pulse leaders (2024–25) :: **MP > Maharashtra > Rajasthan** [UP Lower 2004]",
"**Black gram** grows in both kharif and rabi — true; green gram is !!not half!! of pulse output (gram is the largest), and rabi pulse output has !!not fallen!! [CSE 2020]",
"**Pulses** intercropped with cereals are complementary, and their tap roots do not compete with cereals’ fibrous roots — both true, but the root fact does !!not explain!! the first [UP RO 2023]",
"**Arhar (red gram)** originated in :: **India** [UPPCS M 2007]"]},
{h:"Oilseeds",t:1,list:[
"India imports over half its edible oil — **vegetable oils** are its largest farm import; palm oil comes mainly from Indonesia and Malaysia [CSE 2019]",
"Oilseed leaders (2024–25) :: **Rajasthan > MP > Maharashtra > Gujarat** [UPPCS M 2006]",
"**Groundnut** :: **Gujarat** leads, then Rajasthan and MP; India is the second groundnut grower after China [UPPCS M 2006]",
"Small area but the highest groundnut yield :: **West Bengal** [UPPCS M 2014]",
"**Soybean** :: MP has the largest area [UPPCS M 2014]",
"MP led soybean output for years; **Maharashtra** led in 2024–25 [UPPCS 2015, 2003; UP UDA 2001]",
"**Mustard** :: **Rajasthan** [UPPCS M 2008]",
"Highest oil content :: **sesame** (til) [UPPCS M 2017]",
"**Niger** :: a kharif oilseed of poor, rain-fed tribal lands in Odisha, Chhattisgarh and MP",
"**Sesamum** is a kharif crop in the north and a rabi crop in the south; **castor** is grown in both seasons",
"**Palm oil** :: the oil palm is native to **West Africa**, !!not South-East Asia!!; its oil goes into **lipsticks and perfumes** and makes **biodiesel** [CSE 2021]"]},
{h:"Fibres",t:1,list:[
"**Cotton** :: **Maharashtra** became the top producer in 2024–25, ahead of long-time leader **Gujarat** [UPPCS M 2016]",
"Cotton is Maharashtra’s ‘**white gold**’, and its fibre grows from the **seed** [UP Lower 2002; UPPCS M 2009]",
"**Jute (golden fibre)** :: **West Bengal** grows about four-fifths of it and has the largest area; then Bihar and Assam [UPPCS 2007]",
"India was the world’s largest jute producer until **2019**; **Bangladesh** has led since 2020 — and the Yellow Revolution is about oilseeds, !!not jute!! [UP RO 2023]",
"**Jute** is native to India and is sown February–June and cut July–October — both true, but the season does !!not explain!! its origin [UPPCS 2024]",
"Fibre crops :: **cotton, jute and sunhemp** [UPPCS M 2017]"]},
{h:"Plantation crops and spices",t:1,list:[
"Plantation crops :: **tea, coffee, rubber**, coconut, arecanut, cashew and cocoa [UP UDA 2001]",
"**Tea** :: **Assam** grows the most, then **West Bengal** [UPPCS 1994]",
"India was keyed **first** in tea output and use for 2007–08; China has since moved well ahead, and India is now **second** [UPPCS 2008]",
"India is a major tea **exporter** — behind Kenya and China — but its home consumption is huge, !!not poor!! [UPPCS 2007]",
"Tea-producing States include :: **Andhra Pradesh, Kerala, Himachal Pradesh and Tripura** — all four [CSE 2022]",
"**Coffee** :: **Karnataka** grows about **70%**, then Kerala and Tamil Nadu; it began in the **Baba Budan** hills; India ranks about seventh in the world [UPPCS 2016, 2002; UPPCS M 2002; UPPCS Spl M 2010, 2004; UP UDA 2006; UP GIC 2010]",
"**Rubber** :: **Kerala** leads, then **Tripura** and Karnataka — !!not Himachal!! [UPPCS 2022; UPPCS M 2014; UP RO M 2017; UP RI 2014; UP Lower 2004]",
"**Coconut** :: Kerala led for decades; **Karnataka** led in 2023–24, ahead of Tamil Nadu [UP RO 2014]",
"**Cashew** :: **Maharashtra** leads, then Andhra and Odisha; it came from **Brazil** with the Portuguese [UP UDA 2013]",
"**Spices** :: **MP** grows the most by weight; **Kerala** is the ‘garden of spices’ and leads in **cardamom**; **Karnataka** leads in **black pepper** [UPPCS 2018, 2011; UPPCS M 2012; UP RO M 2013; UP UDA M 2010]",
"India is the second producer of black pepper, after **Vietnam**; large cardamom comes from **Sikkim**",
"**Turmeric** :: India grows, eats and exports most of the world’s — about three-quarters of output; **Telangana** and **Maharashtra** lead [CSE 2025]",
"**Tobacco** :: **Gujarat** leads (about 45%), then Andhra and UP [UPPCS 2012; UPPCS M 2006]",
"**Saffron** :: the **Kashmir** valley (Pampore) [UPPCS 2007, 1990]",
"Commodity boards :: **Tea — Kolkata** · **Coffee — Bengaluru**, !!not Hyderabad!! · **Rubber — Kottayam** · **Spices — Kochi** [UP RO 2023]"]},
{h:"Sugarcane",t:1,list:[
"**Uttar Pradesh** has the largest sugarcane area and output — the ‘sugar bowl’ of India; then Maharashtra and Karnataka [UPPCS 2015, 2014; UPPCS M 2013; UPPCS Spl M 2008]",
"The sugar industry shifts south for **higher yield per hectare**, **more sucrose** and a **longer crushing season** — the reason explains it [UPPCS M 2007; UP RO M 2017]",
"**Brazil** is the largest sugar producer; India is second and the **largest consumer** [UPPCS M 2009]",
"Sugarcane breeding :: the **Sugarcane Breeding Institute, Coimbatore** (1912) [UPPCS M 2009]"]},
{h:"Horticulture",t:1,list:[
"India is the **second** producer of fruits and vegetables, after **China** [UPPCS 2006; UP Lower 2015]",
"India is the largest producer of **mango, banana, papaya** and lemon [UP RO M 2021]",
"The biggest fruit by output :: **banana** [UP RO 2023]",
"**Banana** :: Maharashtra leads, then Andhra and Tamil Nadu [UPPCS M 2013]",
"**Potato** :: **UP** leads, then West Bengal and Bihar [UPPCS M 2016, 2011; UP RI 2014]",
"**Grapes** :: Maharashtra (Nashik); Sultana, Gulabi and Kali Champa are varieties [UPPCS 2018]",
"Other belts :: **apples** of J&K and Himachal · **oranges** of Nagpur · **litchi** of Muzaffarpur · **pineapple** of Meghalaya and Tripura",
"**Sikkim** became India’s first fully **organic** State in 2016 [UPPCS M 2016]"]},
{h:"Revolutions",t:2,cols:["Revolution","Product"],rows:[
["**Green**","Food grains; began **1966–67** in Punjab, Haryana and western UP"],
["**White**","**Milk** — Operation Flood, Verghese Kurien [UPPCS 2015, 2014]"],
["**Blue**","**Fish** — !!not poultry!! [UPPCS M 2016, 2015; UP UDA M 2010]"],
["**Yellow**","**Oilseeds** [UPPCS M 2017, 2004; UP RO M 2014; UP Lower 2002]"],
["**Golden**","**Horticulture** [UPPCS M 2016, 2015]"],
["**Pink**","**Onion** (sometimes prawns) [UPPCS M 2010]"],
["**Grey**","**Fertilisers** [UPPCS 2014]"],
["**Red · Silver · Round · Black**","Meat and tomato · eggs · potato · petroleum"]]},
{h:"Green Revolution people",t:2,list:[
"‘Father of the Green Revolution’ in the world :: **Norman Borlaug** — Mexican dwarf wheats, Nobel Peace Prize 1970 [UP Lower 2015]",
"**M. S. Swaminathan** led it in India and later called for an ‘**Evergreen Revolution**’ [UPPCS M 2015]",
"The 1960s were the ‘seventh decade’, so the key read the new strategy as of the ‘**seventies**’ [UPPCS 2015]",
"India’s first farm university :: **G. B. Pant University**, Pantnagar (1960) [UP RO 2023; UPPCS M 2014, 2013; UP RO M 2013]"]},
{h:"Livestock, fish and silk",t:2,list:[
"India is the world’s largest **milk** producer [UPPCS Spl 2008]",
"Top milk States (2024–25) :: **UP > Rajasthan > MP > Gujarat > Maharashtra** [UPPCS 2014]",
"Livestock Census 2019 :: most cattle in **West Bengal**, then UP and MP; most buffaloes in **UP**; most sheep in **Telangana** [UPPCS 2009]",
"**Sahiwal** :: a high-yielding dairy cow breed [UPPCS Spl M 2004]",
"Fish (2022–23) :: **Andhra > West Bengal > Karnataka**; Andhra leads inland fish, Karnataka marine — India is the world’s **second** fish producer [UPPCS 2015; UPPCS M 2007]",
"Silk types and leaders :: **mulberry — Karnataka** · **tasar — Jharkhand** · **eri — Assam** · **muga — Assam**, found only in India [UPPCS M 2017, 2008; UPPCS Spl M 2008; UP UDA M 2010]",
"**Karnataka** leads in raw silk, yarn and silk fabric; India is the second silk producer after China [UPPCS M 2017, 2013, 2006]"]},
{h:"Crop varieties and diseases",t:3,list:[
"Wheat :: **Kalyan Sona**, **Sonalika**, Sonora-64 (from induced mutation), Raj 3077, Pusa Sindhu Ganga; the dwarfing gene is **Norin-10** [UPPCS M 2015, 2005; UP Lower 2013]",
"Rice :: **Jaya**, **Padma**, Krishna, Pusa Sugandha, Mahi Sugandha, Pusa RH-10 (hybrid Basmati) [UPPCS M 2015, 2006]",
"Others :: **Varuna** and Pusa Bold — mustard · **Bahar** and Malaviya Chamatkar — arhar · **Kaushal** — groundnut · **Amrapali** — Dasheri × Neelam mango [UPPCS M 2016, 2014, 2013, 2007, 2002]",
"Diseases :: **rust** and **Karnal bunt** — wheat · **khaira** — rice (zinc deficiency) · **red rot** — sugarcane · **wilt** — arhar · **late blight** — potato · **ergot** and **green ear** — bajra [UPPCS M 2014, 2004, 2003; UP Lower 2015]",
"Seed classes, in order :: **nucleus → breeder** (golden-yellow tag) → **foundation** (white) → **certified** (blue) [UP RO 2023, 2016]"]},
{h:"Research institutes",t:3,list:[
"Institute ↔ city :: Central Rice Research — **Cuttack** · Farming Systems Research — **Meerut** · Soil Science — **Bhopal** · Agroforestry — **Jhansi** [UP Lower 2013]",
"Institute ↔ city :: Soil Salinity (CSSRI) — **Karnal** · Tuber Crops (CTCRI) — **Thiruvananthapuram** · IRRI — **Manila** · Arid Zone (CAZRI) — **Jodhpur** [UPPCS M 2013]",
"Crop directorate ↔ city :: rice — **Hyderabad** · wheat — **Karnal** · maize — **New Delhi** (now Ludhiana) · pulses — **Kanpur** [UPPCS M 2013]",
"Institute ↔ city :: Environmental Engineering (NEERI) — **Nagpur** · Food Technology (CFTRI) — **Mysuru** · Potato — **Shimla** · Tobacco — **Rajahmundry** [UP RO 2016]",
"Subtropical Horticulture (CISH) is at **Lucknow**, !!not Srinagar!!; Vegetable Research — Varanasi, Sugarcane Research — Lucknow, Pulses Research — Kanpur [UP RO 2017]",
"Indian Institute of Pulses Research :: **Kanpur** [UPPCS 2015; UP Lower 2004; UP UDA M 2010]",
"Indian Institute of Vegetable Research :: **Varanasi** [UPPCS M 2016; UP RO M 2017]",
"Central Institute of Subtropical Horticulture :: **Lucknow** [UPPCS 2010]",
"Indian Institute of Sugarcane Research :: **Lucknow** [UPPCS M 2013]",
"Central Agroforestry Research Institute :: **Jhansi** — !!not Banda!! [UPPCS 2021; UPPCS M 2010]",
"Indian Grassland and Fodder Research Institute :: **Jhansi** [UPPCS M 2015]",
"Goat research institute (CIRG) :: **Makhdoom**, Mathura [UP GIC 2017]",
"Centre for Social Forestry and Eco-Rehabilitation :: **Prayagraj** — the Forest Research Institute is at Dehradun and IIFM at Bhopal [UP BEO 2019]",
"Wrongly paired :: the **Rajiv Gandhi Centre for Biotechnology** is at Thiruvananthapuram, !!not Kolkata!!; CAZRI — Jodhpur, Social Forestry — Prayagraj, Forest Productivity — Ranchi [CDS 2016 II]",
"National Dairy Research Institute :: **Karnal** [UPPCS 2016; UPPCS M 2013]",
"National Dairy Development Board :: **Anand** (Gujarat) [UP UDA 2006]",
"**Hyderabad** hosts :: dryland farming (CRIDA), **ICRISAT** and agricultural research management (NAARM) [UPPCS M 2015; UPPCS Spl 2008; UP RO M 2013; UPPCS 2014; UP UDA M 2010]",
"Agricultural engineering (CIAE) :: **Bhopal** [UPPCS 2009]",
"National agricultural marketing institute :: **Jaipur** [UPPCS M 2013]",
"Plant protection, quarantine and storage directorate :: **Faridabad** [UP Lower 2013]",
"National Centre of Organic Farming :: **Ghaziabad** [UP Lower 2015]",
"India’s first horticulture university :: **Solan** (Dr Y. S. Parmar University) [UPPCS 1990]",
"The first **Krishi Vigyan Kendra** :: Puducherry, 1974 [UP GIC 2017]"]}
]});

["**Cuddapah**","Old unfossiliferous sediments of Andhra’s Cuddapah basin","Asbestos (Pulivendula), **barytes** (Mangampet), limestone, diamonds of the Krishna valley"],
["**Vindhyan**","Sandstone, shale and **limestone** from Sasaram to Chittorgarh","**Limestone** for cement, red sandstone, the **Panna** diamond pipes [UP Lower 2004]"],

["**Tertiary**","Young sediments of Assam, Gujarat, Rajasthan and the offshore basins","**Petroleum, natural gas**, Tertiary coal and **lignite**"]]},
{h:"Rock systems in questions",t:1,list:[
"Most of India’s coal and ferrous minerals lie in the **Peninsula**, south of the Vindhyas — once part of **Gondwanaland** with Africa, South America, Antarctica and Australia; both true [CDS 2016 I]",
"Iron ore is found mainly in the :: **Dharwar** rocks [UP BEO 2019; UPPCS M 2012; UP RO M 2014; UPPCS 1994]",
"**Gondwana** rocks give about 95% (now 99%) of the coal and the **Dharwars** hold most metals — both true, but one does !!not explain!! the other [UPPCS M 2017]",
"**Mica** is abundant in **Koderma** — true; natural gas does !!not!! occur in the Gondwana beds, and the **Dharwars** are !!not!! famous for petroleum [CSE 2013]",
"The Vindhyan rocks hold huge reserves of :: **limestone** [UP Lower 2004]"]},
