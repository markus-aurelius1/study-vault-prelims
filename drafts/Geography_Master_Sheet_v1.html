{h:"Tides",t:1,list:[
"Tides :: the regular rise and fall of the sea, caused by the **gravity of the Moon and the Sun** and the **centrifugal force** of the Earth–Moon system [CSE 2015; UPPCS 1991]",
"The bulge facing the Moon comes from its pull; the **opposite bulge** — the indirect high tide — comes from **centrifugal force** [RAS 1999]",
"Tides come from the **Moon’s and Sun’s pull** and the **Earth’s rotation** — true; the Earth spins west to east — true, !!but that does not explain tides!! [CDS 2018 I; CDS 2015 I]",
"The Moon’s tide-raising pull is about **twice** the Sun’s, because it is so much nearer",
"Timing :: two highs and two lows in **24 h 52 min**, so high tide comes about **50 minutes later** each day, and low tide follows high by ~6 h 13 min — !!not exactly every 12 h 30 min!! [UPPCS 2023]",
"**Spring tide** :: Sun, Earth and Moon in a **straight line (syzygy)** at **new and full moon**, twice a month — the highest highs and lowest lows [UPPCS 2023, 1999]",
"Tides about **20% higher** than normal are :: **spring tides** [CAPF 2018]",
"**Neap tide** :: Moon at **right angles** to the Sun (quadrature) at the **first and last quarter** — !!not at new moon!! — about seven days after a spring tide; high tide is below normal and low tide above normal [CSE 1998]",
"**Perigean** tides (Moon nearest) are larger and apogean ones smaller; tides are also a little larger near **perihelion** in January",
"By frequency :: **semi-diurnal** (two nearly equal highs and lows a day — the commonest) · **diurnal** (one high, one low) · **mixed** (unequal heights — the west coast of North America and many Pacific islands)",
"Wide shelves and **funnel-shaped bays** magnify tides; mid-ocean islands get small ones",
"Highest tides :: the **Bay of Fundy** (Canada, ~16 m); in India the **Gulf of Khambhat** and Gulf of Kutch — the tidal-energy sites",
"**Tidal current** :: a tide channelled between islands or into bays and estuaries",
"Tides help **tidal ports** such as Kolkata, flush silt from harbours and can yield **tidal power**; they also erode coasts and sweep away sediment that would build **deltas**"]},
{h:"Waves and tsunamis",t:1,list:[
"**Wavelength** :: the distance between two successive crests or troughs; **fetch** is the stretch of open water the wind blows over [CAPF 2020]",
"Tsunami :: a series of waves from the sudden displacement of a large volume of water; abrupt movement of **thrust faults** at convergent plate boundaries generates them — the reason explains it [CDS 2014 II]",
"Other causes :: submarine **volcanic eruptions**, **landslides**, **meteorite impacts** and underwater nuclear explosions",
"“Tsunami” is **Japanese** (harbour wave), !!not Latin!!; they are also called seismic sea waves, and **Pacific coasts** are the most exposed [CDS 2017 I]",
"In deep water a tsunami races at **700–900 km/h** with a very low height, so ships barely notice it",
"Near the coast it slows and **piles up to great heights** — the **shoaling effect** — before striking land"]},
{h:"Coral reefs",t:1,list:[
"Corals :: colonies of tiny **polyps** that build skeletons of **calcium carbonate**, living in **symbiosis with zooxanthellae** algae, which feed them and give their colour; reefs are the **rainforests of the oceans**",
"Most reefs are in **tropical** waters; over a third lie in **Australia, Indonesia and the Philippines**; reefs host far more **animal phyla** than tropical rainforests — all true [CSE 2018]",
"Conditions :: warm water (**above ~20°C**), roughly **30°N–30°S**, **shallow, clear, sunlit** water (under about 60 m), normal salinity, **no silt**, a shallow **platform**, and plenty of plankton",
"River mouths and **deltas** lack reefs: fresh water and silt kill the polyps",
"Reefs grow mostly on the **eastern coasts** of continents, washed by warm currents — !!western coasts have cold currents and upwelling, so few reefs!!",
"The **Coral Triangle** :: Indonesia, Malaysia, the Philippines, Papua New Guinea, the Solomon Islands and Timor-Leste — the richest reefs; Australia’s Great Barrier Reef lies just south",
"Other reef seas :: the **Caribbean**, the Gulf of Mexico and Florida; the **Red Sea**, Persian Gulf, East Africa and the Maldives",
"Indian reefs :: **Andaman and Nicobar**, the **Gulf of Kachchh**, the **Gulf of Mannar** and **Lakshadweep** — !!not the Sundarbans or the Gulf of Khambhat!! [CSE 2014; BPSC 2019; CAPF 2018]",
"Largest reef area in India :: **Andaman and Nicobar** [CDS 2022 II]",
"**Fringing reef** :: a narrow reef platform right against the coast — Caribbean islands, the Red Sea",
"**Barrier reef** :: a broad reef far offshore, separated by a **lagoon** — the Great Barrier Reef",
"**Atoll** :: a ring of reef round a central lagoon, built on a sinking volcanic island or seamount — Lakshadweep, the Maldives, the Pacific islands",
"**Coral bleaching** :: stressed corals expel their algae and turn white — from warmer seas, El Niño, acidification, pollution, silt and salinity change (details in Environment)"]},
{h:"Maritime zones",t:2,list:[
"**Baseline** :: the **low-water line** along the coast, straightened across bays and island fringes",
"**Internal waters** :: landward of the baseline — bays, lagoons, backwaters and ports — under full sovereignty",
"**Territorial sea** :: **12 nautical miles** from the baseline; sovereignty over the water, sea bed and **air above**, subject to **innocent passage** by foreign ships [UPPCS M 2005]",
"**Contiguous zone** :: to **24 nautical miles**; the state may enforce **customs, fiscal, immigration and sanitary** laws there, but it is not sovereign territory",
"**Exclusive economic zone** :: to **200 nautical miles**; sovereign rights over fishing, minerals and energy, while others keep freedom of navigation and overflight",
"**Continental shelf** rights :: over the sea bed to 200 nautical miles, or to the shelf’s outer edge up to **350 nautical miles** — the EEZ itself never exceeds 200",
"**High seas** :: beyond national jurisdiction and open to all; the **deep sea bed** beyond it is the **common heritage of mankind**, managed by the **International Seabed Authority**"]}
]});

/* ===== 10 INDIA: LOCATION, BORDERS & STATES ===== */
SEC({id:"india-location",title:"India: Location, Borders & States",group:"India — Physical",tier:1,
stats:["UPSC CSE: 7 Q (2011–26) — a State from clues (2011, 2012), easternmost and westernmost States (2015), fewest States from Kohima to Kottayam (2017), Delhi’s longitude (2018), State borders and border bridges (2026 ×2); older papers asked city positions (2003, 2007), shared borders (2006) and coastal States (2008)","UPPCS Pre: 2 Q since 2018 (the McMahon Line, 2018; India’s size and the Tropic, 2022); older UPPSC papers asked the Tropic of Cancer, IST, borders and boundary lines about 35 times (1990–2017)","Formats: which States a line crosses, State ↔ neighbour, city nearest a latitude or longitude, how-many counts on routes and borders, local-time arithmetic"],
note:"India on the globe: size and extremes, the Tropic of Cancer and Indian Standard Time, land and sea neighbours, boundary lines and disputed areas, then the States and UTs and who borders whom. Physical divisions follow in the next sheets; Uttar Pradesh has its own sheet.",
blocks:[
{h:"Size and extent",t:1,list:[
"Area :: **3.287 million km²** — the **7th largest** country, about **2.4%** of the world’s land — !!not the 6th!! [UPPCS 2022; UPPCS M 2006; UP RO M 2016; JPSC 2016]",
"Latitudes :: mainland **8°4′N–37°6′N**; with the islands the south end is **Indira Point, ~6°45′N** [JPSC 2016; CDS 2017 II]",
"Longitudes :: **68°7′E–97°25′E** — about 29°, so local time differs by some **2 hours** from Gujarat to Arunachal [JPSC 2016; UPPCS 1992]",
"Stretch :: **~3,214 km** north–south and **~2,933 km** east–west; land frontier **~15,200 km** [UP RO M 2016]",
"Coastline :: **~11,099 km** in the 2023–24 recount (earlier **7,516.6 km**), across **9 States** and **4 UTs** [CSE 2008]",
"The **Tropic of Cancer** runs almost through the middle and splits India into two nearly equal latitudinal halves; the north lies outside the tropics, so India is !!not wholly tropical!! [UPPCS 2022; UPPCS M 2006]",
"India became the **most populous** country in 2023, overtaking China [UP RO M 2016]",
"A **subcontinent** :: a well-marked physical unit — mountains on the north, seas on three sides — with a shared geological history, climate and culture",
"**28 States and 8 UTs** today — the “26 States” option was the wrong one [JPSC 2016]"]},
{h:"Extremes of India",t:1,cols:["Extreme","Place","Note"],rows:[
["Northernmost","**Indira Col**, at the head of the Siachen glacier (Ladakh)","On the Saltoro–Karakoram watershed"],
["Southernmost","**Indira Point**, Great Nicobar","Mainland tip: **Kanyakumari** (Cape Comorin) [UP Lower 2002; MPPCS 2006]"],
["Easternmost","**Kibithu**, Anjaw district, Arunachal Pradesh","The **Dong** valley nearby sees India’s first sunrise — !!not Mizoram!! [UP RO M 2016]"],
["Westernmost","**Guhar Moti**, near **Sir Creek**, Kachchh (Gujarat)","**68°7′E** [MPPCS 2008]"],
["Highest","**K2 (Godwin-Austen)**, 8,611 m, Karakoram","Kangchenjunga (8,586 m) is the highest in Indian-held territory [UPPCS 1990; UPPCS M 2009]"],
["Lowest","**Kuttanad**, Kerala — about 2 m below sea level","Farming below sea level; a Globally Important Agricultural Heritage System [UPPCS M 2015]"]]},
{h:"Tropic of Cancer and IST",t:1,list:[
"Tropic of Cancer (23°30′N) crosses **8 States**, west → east :: **Gujarat → Rajasthan → MP → Chhattisgarh → Jharkhand → West Bengal → Tripura → Mizoram** [UPPCS 2017, 1990]",
"Of those 8, **2 are coastal** (Gujarat, West Bengal) and **6 landlocked** [CDS 2023 I]",
"**Manipur** lies wholly north of the Tropic — it does !!not!! cross it; nor do UP, Bihar or Odisha [UPPCS M 2008]",
"Just south of the Tropic: Bhuj, **Gandhinagar**, Ahmedabad, Ujjain, Bhopal, **Jabalpur**, Ranchi; just north: **Agartala**, Aizawl",
"Nearest the Tropic :: **Gandhinagar** of Agartala, Gandhinagar, Jabalpur and Ujjain [UPPCS 1999; UP GIC 2010; UP Lower 2002]",
"Nearest the Tropic :: **Jabalpur** of Jabalpur, Ahmedabad, Ujjain and Varanasi [UPPCS M 2017]",
"Nearest the Tropic :: **Kolkata** of Delhi, Kolkata, Jodhpur and Nagpur [CSE 2003]",
"The **Mahi** crosses the Tropic of Cancer **twice** [UP RO 2016]",
"The parallel that crosses the most States :: **24°N** [CAPF 2019]",
"**Indian Standard Time** :: the **82°30′E** meridian through **Mirzapur**, near Prayagraj [UPPCS 2013; UP Lower 2013; CDS 2021 II]",
"IST meridian crosses **5 States**, north → south :: **UP → MP → Chhattisgarh → Odisha → Andhra Pradesh** — !!not Maharashtra!! [UPPCS M 2010]",
"The Tropic and the IST meridian cross in **Chhattisgarh**",
"IST is **5 h 30 min ahead** of GMT (UTC) — !!not behind!!; one time zone serves the whole country, islands included [CDS 2021 II; UPPCS M 2006]",
"Noon at 82°30′E → at 120°E it is :: **14:30** (37½° × 4 min = 2½ h later) [UPPCS 2001]",
"Midnight on the IST meridian and 6 a.m. at a place → that place is at :: **172°30′E** (90° further east) [UPPCS M 2002]",
"Sunrise at 5 a.m. in Tirap (Arunachal) → at Kandla (Gujarat) about :: **7 a.m.** [UPPCS 2010]"]},
{h:"Same longitude, same latitude",t:2,list:[
"On one longitude (~73°E) :: **Mumbai**, Surat, **Ahmedabad**, Gandhinagar, **Jodhpur** — and Islamabad",
"On one longitude (~75°E) :: **Srinagar**, Jammu, **Amritsar**, **Ajmer**, Belagavi, **Mangaluru**",
"On one longitude (~77°E) :: Manali, Shimla, **Delhi**, Bhopal, **Bengaluru**, Kanyakumari",
"Closest to Delhi’s longitude :: **Bengaluru** — not Hyderabad, Nagpur or Pune [CSE 2018]",
"Pairs on one longitude :: **Kanpur–Chennai** · **Lucknow–Vijayawada** · **Prayagraj–Raipur** · **Varanasi–Visakhapatnam** · **Gangtok–Kolkata** · Shillong–Dispur · **Aizawl–Port Blair**",
"On one latitude (~27°N) :: **Jaisalmer**, **Jaipur**, Agra, **Lucknow**, Gorakhpur and (a little south) **Itanagar**",
"On one latitude :: **Surat–Nagpur–Raipur** (~21°N) · **Mangaluru–Bengaluru–Chennai** (~13°N)",
"Most easterly of Hyderabad, Bhopal, Lucknow and Bengaluru :: **Lucknow** [CSE 2007]",
"Aurangabad’s latitude lies between **Vadodara’s and Pune’s**, and **Bengaluru is south of Chennai** — true; Jabalpur lies east of both Indore and Bhopal, !!not between them!! [CSE 2003]",
"State capital closest to the Equator among Hyderabad, Bhubaneswar, Panaji and Mumbai :: **Panaji** (~15.5°N) [CDS 2023 II]",
"A place at 34°N, 77°E lies in :: **Ladakh** (Leh) [CDS 2021 II]",
"Longest north–south stretch among Jharkhand, Telangana, Odisha and Chhattisgarh :: **Chhattisgarh** [CDS 2023 I]",
"Easternmost and westernmost States :: **Arunachal Pradesh** and **Gujarat** [CSE 2015]"]},
{h:"Land neighbours",t:1,cols:["Neighbour","Border (longest first)","Indian States and UTs on it"],rows:[
["**Bangladesh**","~4,096 km — the longest; **Radcliffe Line** (1947)","**West Bengal**, Assam, **Meghalaya**, **Tripura**, **Mizoram** — !!not Manipur or Nagaland!! [UPPCS Spl M 2004; UPPCS 2002; UP Lower 2002]"],
["**China**","~3,488 km; **McMahon Line** (1914) in the east, the LAC elsewhere","Ladakh, Himachal Pradesh, Uttarakhand, Sikkim, Arunachal Pradesh [UPPCS 2018]"],
["**Pakistan**","~3,323 km; **Radcliffe Line**, and the LoC in Jammu and Kashmir","Ladakh, J&K, **Punjab**, **Rajasthan**, **Gujarat** — !!not Himachal or Haryana!! [UPPCS 1996, 1990; UP UDA 2001]"],
["**Nepal**","~1,751 km; the **Kali (Mahakali)** under the Treaty of Sugauli (1816)","Uttarakhand, Uttar Pradesh, Bihar, West Bengal, Sikkim"],
["**Myanmar**","~1,643 km","**Arunachal** (the longest stretch), **Nagaland**, **Manipur**, **Mizoram** — !!not Assam!! [UPPCS M 2012; RAS 2007]"],
["**Bhutan**","~699 km","**Sikkim**, **West Bengal**, **Assam**, **Arunachal** — !!not Meghalaya!! [MPPCS 2012]"],
["**Afghanistan**","~106 km; **Durand Line** (1893)","Ladakh (the Gilgit–Wakhan sector held by Pakistan) [UP UDA 2006]"]]},
{h:"Borders in questions",t:1,list:[
"Three international neighbours :: **West Bengal** (Bangladesh, Nepal, Bhutan), **Sikkim** (China, Nepal, Bhutan), **Arunachal** (China, Bhutan, Myanmar) and the UT **Ladakh** (China, Pakistan, Afghanistan)",
"**Tripura** has an international border on **three sides** — all with Bangladesh [UPPCS Spl M 2008]",
"Assam borders **Bhutan and Bangladesh**, West Bengal borders **Bhutan and Nepal**, Mizoram borders **Bangladesh and Myanmar** — all true [CSE 2006]",
"The longest international border of any State is **West Bengal’s** (~2,217 km with Bangladesh) — !!not Rajasthan’s!! [CSE 2026]",
"Landlocked States with **no** international border :: **Chhattisgarh, Haryana, Jharkhand, Madhya Pradesh, Telangana** [CAPF 2022]",
"The India–Pakistan line is a **superimposed boundary**, drawn across an already settled landscape [MPPCS 2016]",
"**Johnson Line** (1865) puts **Aksai Chin** in India; China rejects it; the **McDonald Line** (1899) would leave it to China",
"**Wakhan Corridor** :: Afghanistan’s strip reaching **China**, between Tajikistan and the Pakistan-held north of Jammu and Kashmir",
"Border bridges :: **Maitri Setu** over the Feni joins **Sabroom (Tripura)** with **Ramgarh (Bangladesh)** — !!not the other way round!!; **Jhulaghat** is an India–**Nepal** bridge, !!not Myanmar!!; the **Mechi** bridge joins **Panitanki** (West Bengal) with **Kakarvitta (Nepal)** [CSE 2026]"]},
{h:"Disputed and sensitive areas",t:2,list:[
"**Line of Control** :: the 1949 ceasefire line, fixed by the **Shimla Agreement (1972)**; beyond it lies Pakistan-occupied Kashmir — ‘Azad Kashmir’ and **Gilgit-Baltistan**",
"**Shaksgam valley** :: 5,180 km² of Ladakh ceded by Pakistan to **China in 1963**; India protested Chinese road-building there in 2024 — both statements true [UPPCS 2024]",
"The **Karakoram Highway** (CPEC’s route) crosses Gilgit-Baltistan by the **Khunjerab** pass — !!not the Shaksgam valley!!",
"**Siachen glacier** :: held by India since **Operation Meghdoot (1984)**; **NJ9842** is the last demarcated point of the LoC",
"**Aksai Chin** (‘white stone desert’) :: part of the **Ladakh plateau**, held by China, lying between the Johnson and McDonald lines [UPPCS 1995]",
"Along the LAC :: Daulat Beg Oldi, Galwan, **Pangong Tso**, Chushul, **Demchok** (where the Indus enters India)",
"**Kalapani–Lipulekh–Limpiyadhura** :: India–Nepal dispute over the source of the Kali",
"**Doklam** :: a Bhutan–China dispute at the Sikkim tri-junction (2017 stand-off)",
"**Sir Creek** :: a 96-km tidal estuary in the Rann of Kutch disputed with Pakistan"]},
{h:"Sea neighbours",t:2,list:[
"Maritime neighbours :: **Pakistan, Maldives, Sri Lanka, Bangladesh, Myanmar** (Coco Islands), **Indonesia** and **Thailand**",
"Ancient names :: **Ratnakara** — the Indian Ocean [CSE 1994]"]},
{h:"States and UTs",t:1,list:[
"Largest States :: **Rajasthan > Madhya Pradesh > Maharashtra > Uttar Pradesh** — UP is **4th** by area [UP RO 2016]",
"The first three hold about **30%** of India’s area",
"**Maharashtra** :: 2nd in population and 3rd in area (2011) [UP BEO 2019]",
"Most districts :: **Uttar Pradesh (75)** [UPPCS 2006]",
"Most neighbours :: **Uttar Pradesh** — 8 States and Delhi [CSE 2026]",
"Largest UT :: **Ladakh** since 2019; of Daman & Diu, Puducherry, Delhi and Chandigarh the answer was **Delhi** [UPPCS 2014]",
"UTs, south → north :: **Andaman & Nicobar**, Lakshadweep, Puducherry, Dadra & Nagar Haveli and Daman & Diu, Delhi, Chandigarh, Jammu & Kashmir, **Ladakh**",
"Puducherry’s four districts lie in **Tamil Nadu** (Puducherry, Karaikal), **Kerala** (Mahe) and **Andhra Pradesh** (Yanam) [UPPCS M 2006]",
"Chandigarh borders **Punjab and Haryana** only — !!not Himachal!!",
"**National Capital Region** :: Delhi with parts of Haryana (Rohtak, Karnal…), UP (Meerut, Ghaziabad, **Khurja** in Bulandshahr…) and Rajasthan (Alwar, Bharatpur) — !!not Ambala, no part of Punjab or MP!! [UPPCS 2011; UP RO M 2017]",
"North-east capitals :: Assam — **Dispur** · Nagaland — **Kohima** · Arunachal — **Itanagar** · Meghalaya — **Shillong** · Manipur — **Imphal** · Mizoram — **Aizawl** · Tripura — **Agartala** [UPPCS 1994, 1990]",
"Towns :: **Palanpur — Gujarat** is right; Aurangabad (Chhatrapati Sambhajinagar) is in Maharashtra, Hubballi in Karnataka, Guntur in Andhra [UP Lower 2004]"]},
{h:"Who borders whom",t:1,cols:["State","Neighbouring States"],rows:[
["**Uttar Pradesh**","Uttarakhand, Himachal, Haryana, Delhi, Rajasthan, MP, Chhattisgarh, Jharkhand, Bihar — the most of any State"],
["**Chhattisgarh**","UP, MP, Maharashtra, Telangana, Andhra, Odisha, Jharkhand — !!not Bihar!! [UP RO M 2013]"],
["**Telangana**","**Maharashtra, Chhattisgarh, Andhra Pradesh, Karnataka** — !!not Odisha or MP!! [UPPCS M 2015; CDS 2023 I]"],
["**Madhya Pradesh**","Rajasthan, UP, Chhattisgarh, Maharashtra, Gujarat — five since 2000, seven before Chhattisgarh was carved out [UPPCS 1993]"],
["**Karnataka**","Maharashtra, Goa, Telangana, Andhra, Tamil Nadu, Kerala"],

/* ===== 11 HIMALAYA, PASSES & GLACIERS ===== */
SEC({id:"himalaya",title:"Himalaya, Passes & Glaciers",group:"India — Physical",tier:1,
stats:["UPSC CSE: 7 Q (2010–22) in 7 of 17 papers — what the Himalaya does for India (2010), the U-turn at the syntaxial bend (2011), signs of youth (2012), how many States it covers (2017), glacier ↔ river (2019), Siachen (2020), peak ↔ range (2022); older papers asked the oldest range (1994), Jammu and Kashmir’s ranges (1995), Nanda Devi (2003) and valleys (2006)","UPPCS Pre: about 11 Q (2019–25) — fossils and seismic zones (2019), the Kashmir valley and the youngest range (2020), peaks (2019, 2022), passes ↔ States (2023), pass heights and a rising Himalaya (2024), Atal Tunnel (2025); older UPPSC papers matched passes to States about 15 times","Formats: pass ↔ State matching and west-to-east order, peak ↔ range or State, valley between two ranges, Statement sets on formation and evidence of youth"],
note:"The Himalaya from the Karakoram to the Purvanchal: how it rose, its parallel ranges and the thrusts between them, regional divisions and valleys, then passes, peaks and glaciers. Himalayan rivers are in the drainage sheet; mountain forests in the soils and vegetation sheet; disputed areas in the location sheet.",
blocks:[
{h:"How the Himalaya rose",t:1,list:[
"Built in three phases :: the **Greater Himalaya** first (Eocene–Oligocene, after the collision ~50 million years ago), then the **Lesser Himalaya** (Miocene), and the **Shiwaliks** last (Pliocene–Pleistocene)",
"The oldest of the parallel ranges is the **Great Himalaya** [CSE 1994]",
"Youngest mountain range :: the **Shiwalik** — of Vindhya, Aravalli, Shiwalik and Annamalai [UP UDA 2010]",
"Of Himadri, Aravalli, Western Ghats and Vindhya, the youngest is the **Himadri** [UPPCS 2020]",
"Extra-peninsular mountains formed in the :: **Cenozoic** era [BPSC 1996]",
"Signs of a young range :: **deep gorges**, **U-turn river courses**, **parallel ranges** and **steep slopes with landslides** — all four count [CSE 2012]",
"More signs :: frequent earthquakes, youthful rivers cutting down, drying Tibetan lakes and rising peaks — Everest re-measured at **8,848.86 m** (2020)",
"The Brahmaputra’s U-turn round Namcha Barwa comes from the **syntaxial bending** of the young Himalaya, where the ranges turn sharply at both ends [CSE 2011]",
"The arc bends round two buttresses of the Indian plate — the **Aravalli–Delhi ridge** in the north-west and the **Shillong plateau** in the north-east — so the middle sags into its arcuate shape",
"Greater Himalayan sedimentary rocks are !!not fossil-free!!; the Lesser Himalaya’s rocks hold **marine fossils**, and early human remains lie in the outer (Shiwalik) zone [UPPCS 2019]",
"India has the most seismic zones in the **Himalaya**, because of its many longitudinal **thrust zones** — the reason explains it [UPPCS 2019]",
"Without the Himalaya :: **Siberian cold waves** would sweep India, the plains would lack their **alluvium**, and the **monsoon** would behave differently — all three [CSE 2010]",
"Without the Himalaya the north Indian plain would be **much colder in winter** [CDS 2014 II]",
"The Himalaya spreads over **more than five** States and UTs — !!“five only” is false!! — Ladakh, J&K, Himachal, Uttarakhand, Sikkim, West Bengal (Darjeeling) and Arunachal, with the Purvanchal beyond [CSE 2017]"]},
{h:"The ranges in cross-section",t:1,fig:{kind:"svg",
alt:"South-to-north cross-section of the Himalaya: the plains, then the Himalayan Frontal Thrust and the low Shiwalik hills, the Main Boundary Thrust and the Lesser Himalaya, the Main Central Thrust and the high Greater Himalaya, the Indus–Tsangpo suture zone, then the Trans-Himalaya and the Karakoram; the thrust faults dip northward",
caption:"Each range is pushed south over the one below it along a north-dipping thrust; the youngest thrust (HFT) is the southernmost.",

{h:"Ranges from south to north",t:1,cols:["Range","Also called","Height","Features"],rows:[
["**Shiwalik**","Outer Himalaya","~900–1,100 m; 10–50 km wide","Youngest; loose sediments; flat **duns** between it and the Lesser Himalaya — Dehradun, Patli Dun, Kothri Dun; Jammu hills, Dudhwa range, Churia (Nepal), Dafla–Miri–Abor–Mishmi (Arunachal)"],
["**Lesser Himalaya**","**Himachal**, Middle Himalaya","~3,700–4,500 m; ~50 km wide","**Pir Panjal** (the longest), **Dhauladhar**, Mahabharat (Nepal), Mussoorie, Nag Tibba; hill stations and meadows — Gulmarg, Sonamarg, the **bugyals** of Uttarakhand [UPPCS Spl M 2008]"],
["**Greater Himalaya**","**Himadri**, Inner Himalaya","Average ~6,100 m; ~2,400 km long","Continuous wall from **Nanga Parbat to Namcha Barwa**; granite core; asymmetrical folds; the highest peaks and most glaciers"],
["**Trans-Himalaya**","Tibetan Himalaya","~3,000 m and more","**Karakoram, Ladakh, Zanskar, Kailash** ranges; rain-shadow country beyond the Himadri"]]},
{h:"Thrusts and the seismic gap",t:2,list:[
"Order south → north :: plains → **HFT** → Shiwalik → **MBT** → Lesser Himalaya → **MCT** → Greater Himalaya → **Indus–Tsangpo Suture Zone** → Trans-Himalaya",
"Order of the ranges from south to north :: **Shiwalik → Lesser Himalaya → Great Himalaya** [CGPCS 2015]",
"**Main Central Thrust** :: the oldest and highest thrust, dipping north, between the Greater and Lesser Himalaya",
"**Main Boundary Thrust** :: between the Lesser Himalaya and the Shiwaliks; it and the HFT are the more active",
"**Himalayan Frontal Thrust** :: the youngest and southernmost, where the Shiwaliks meet the plains — it does !!not!! separate the Himalaya from Tibet; the suture zone does [CAPF 2017]",
"All three merge at depth into one basal detachment — the **Main Himalayan Thrust**",
"**Central Seismic Gap** :: a ~700 km stretch of the central Himalaya where the frontal thrust has not ruptured for centuries — a likely site of a great earthquake"]},
{h:"Regional divisions",t:1,list:[
"**Punjab Himalaya** :: between the **Indus and the Sutlej** (Kashmir and Himachal)",
"**Kumaon Himalaya** :: between the **Sutlej and the Kali** [UP RO 2016]",
"**Nepal Himalaya** :: between the **Kali and the Teesta**",
"**Assam Himalaya** :: between the **Teesta and the Dihang** (Brahmaputra)",
"**Nanda Devi** lies in the Kumaon Himalaya, in Chamoli district of **Garhwal** — keyed Garhwal Himalaya in 2003 and Kumaon Himalaya in 2022; !!Namcha Barwa is not in Garhwal and Nokrek is not in Sikkim!! [CSE 2022, 2003]",
"Within Uttarakhand, **Garhwal** is the western half and **Kumaon** the eastern"]},
{h:"Western and eastern Himalaya",t:2,cols:["Feature","Western (Indus → Kali)","Eastern (Teesta → Brahmaputra)"],rows:[
["Height","Higher, rising gradually","A little lower, rising abruptly from the plains"],
["Width","Wider; the Shiwalik and Lesser ranges stand apart","Narrower; the Shiwaliks merge into the Lesser range"],
["Climate","Cooler and drier","Warmer and much wetter"],
["Forests","Conifers, lower diversity","Evergreen forest, very high diversity"],
["Snowline","Lower","Higher"]]},
{h:"Valleys, duns and basins",t:1,list:[
"Kashmir valley :: between the **Pir Panjal** and the **Great Himalaya** (Himadri) [UPPCS 2020]",
"**Karewas** :: Pleistocene **lake deposits** on the lower slopes of the Pir Panjal — famous for **saffron**, almonds and walnuts [CDS 2022 II; BPSC 2022]",
"The Kashmir valley and the **Imphal basin** are **lacustrine plains** — old lake beds [UPPCS 2019]",
"Kullu valley :: between the **Dhauladhar and the Pir Panjal** [UPPCS 1999; UP Lower 2002]",
"**Kangra** valley :: between the Dhauladhar and the Shiwaliks — tea, especially green tea",
"**Nubra** valley :: between the Ladakh and Karakoram ranges; the **Changthang** plateau lies between the Ladakh and Zanskar ranges",
"Valleys :: **Markha — Ladakh** · **Dzukou — Nagaland** · **Sangla — Himachal** · **Yumthang — Sikkim** [CSE 2006]",
"**Nelang** valley :: Uttarkashi, **Uttarakhand**, inside Gangotri National Park [UPPCS 2016]",
"**Shimla** sits on a Lesser Himalayan ridge, !!not the Pir Panjal!! [UP UDA 2013]",
"**Duars** :: gravel and alluvial fans along the eastern Himalayan foothills (West Bengal, Assam) — tea gardens",
"**Bugyals** :: alpine meadows of Uttarakhand, green in summer and snowbound in winter, grazed by the **Gujjar** and **Bakarwal** herders",
"Hill stations of the Lesser Himalaya :: Shimla, Kullu–Manali, Mussoorie, Nainital, Dalhousie, Darjeeling; lakes **Nainital**, **Bhimtal**, **Chandratal**"]},
{h:"Trans-Himalaya",t:1,list:[
"**Karakoram** :: from the **Pamir knot** east into Tibet; dark rocks gave it the old name **Krishnagiri**; glaciers Siachen, Baltoro, Biafo, Hispar; highest peak **K2 (Godwin-Austen)** — India’s highest",
"**Ladakh range** :: north of the Indus, between the **Indus and Shyok**; continues east as the **Kailash** range",
"**Zanskar range** :: south of the Indus; **Tso Moriri** (a Ramsar site, black-necked cranes); **Kamet** stands at its south-eastern end in Garhwal",
"**Kailash range** :: **Mansarovar** (freshwater, fed by glaciers) and **Rakshas Tal** (saline — no glacial inflow), linked by the Ganga Chhu channel",
"Plains north of the Karakoram :: **Depsang**, **Soda plains**, Aksai Chin; the northern limit runs along the Pamirs, the Aghil mountains and the Yarkand river",
"Ranges of Jammu, Kashmir and Ladakh, north → south :: **Karakoram → Ladakh → Zanskar → Pir Panjal** [CSE 1995]",
"South → north :: **Dhauladhar → Zanskar → Ladakh → Karakoram** [JPSC 2013]",
"The Trans-Himalayan ranges are **older** than the Himadri — **Cambrian** fossils occur in them"]},
{h:"Purvanchal",t:1,list:[
"Purvanchal :: the Himalaya’s **southward swing** along the Myanmar border, mostly of **sandstone** — Patkai Bum, Naga hills, Manipur hills, Mizo (Lushai) hills, Tripura hills",
"**Naga hills** (highest **Saramati**) · **Manipur hills** (Mt Iso or Tempu; the **Loktak** basin) · **Mizo hills** (**Phawngpui**, the Blue Mountain; valley fill of molasse) · **Tripura hills** (Betlingchhip; ridge-and-valley country)",
"In Assam :: the **Barail** range (Haflong in the North Cachar hills) and the **Mikir (Karbi Anglong)** hills south of Kaziranga",
"Tripura does !!not!! lie along the **Patkai** hills [UPPCS M 2015]",
"Arunachal’s foothill tribes, west → east :: **Monpa**, Nyishi (Dafla), Adi (Abor), **Mishmi**"]},

SEC({id:"peninsula",title:"Peninsular Plateau & Hill Ranges",group:"India — Physical",tier:1,

note:"The old block south of the plains: its rock systems, the plateaus from Marwar to the Deccan and Meghalaya, the hill ranges from the Aravalli to the Ghats, their peaks and passes. Peninsular rivers are in the drainage sheet; minerals and soils in their own sheets.",
blocks:[
{h:"The Peninsular Block",t:1,list:[
"Extent :: from the **Delhi ridge** (the Aravalli’s tail) in the north-west to the **Rajmahal hills** in the east, the **Gir** range in the west and the **Cardamom hills** in the south; the **Shillong and Karbi Anglong** plateaus are its north-eastern outliers",

"It is built of **patland** plateaus — Hazaribagh, Palamu, Ranchi, Malwa, Coimbatore, Karnataka",

"The **Meghalaya plateau** belongs to the Peninsular Block, cut off by the down-faulted **Garo–Rajmahal (Malda) gap** [UP UDA 2013; BPSC 2005]",
"The Deccan plateau **rises gently from north to south**, the western Satpuras part the Narmada and the Tapi, and Chota Nagpur is Archaean granite and gneiss — true; the Malwa plateau forming the ‘eastern flank’ is !!false!! [CDS 2017 II]",
"The southern block is **granite and gneiss**, the Deccan lava plateau a tableland of **horizontal lava sheets**, and the Narmada–Tapi trough lies **between the Vindhya and Satpura** [CAPF 2016, 2014; MPPCS 2014]"]},
{h:"Rock systems",t:1,cols:["System","Age","What it gives"],rows:[

["**Gondwana**","Late Palaeozoic–Mesozoic (Permian onward)","About **98% of India’s coal** — the Damodar, Son, Mahanadi and Godavari valleys"],

"**Bhangar** :: **older alluvium** on terraces above flood level, with **kankar** (lime nodules) — the old ‘kachhari’ clay; less fertile [BPSC 1996; CAPF 2022]",
"**Khadar** :: **new alluvium** of the flood plains, renewed every year — the most fertile, silty soil [CAPF 2022]",
"Deltas end the sequence in **marsh** [CAPF 2022]",
"**Reh (kallar)** :: barren saline crusts in the drier plains of Haryana and UP",
"**Bhur** :: wind-blown sand hummocks along the Ganga, heaped in the hot, dry months"]},
{h:"Parts of the plains",t:1,list:[
"Punjab–Haryana plain :: built by the Indus tributaries, cut into **doabs**",
"Doabs :: **Bist** — Beas and Sutlej · **Bari** — Beas and Ravi · **Rechna** — Ravi and Chenab · **Chaj** — Chenab and Jhelum [UKPCS 2016]",
"**Sindh Sagar** doab lies between the **Indus and the Jhelum–Chenab**; the **Malwa plain** of Punjab lies between the Sutlej and the Ghaggar",
"Ganga plain :: from **Delhi to West Bengal** — upper, middle and lower divisions",
"**Brahmaputra (Assam) plain** :: from Sadiya to **Dhubri**, where the river enters Bangladesh"]},
{h:"Divisions of the Ganga plain",t:2,cols:["Division","North of the Ganga","South of the Ganga"],rows:[
["**Upper**","Rohilkhand plain, Awadh plain","Ganga-par plain"],
["**Middle**","Saryu-par, Gandak and Kosi plains; **Mithila** between them","**Magadh** (between the Ganga and the Son), Anga"],
["**Lower**","Duars, Darjeeling Terai, Barind plain","**Rarh** — a dead, abandoned delta plain"]]},
{h:"Thar desert",t:1,list:[
"**Marusthali** :: the true desert of western Rajasthan; the semi-arid **Bagar** lies east of it, drained by the **Luni**, with fertile **Rohi** tracts near streams and sandy **Thali** plains north of the Luni",
"The Rajasthan desert is the world’s **most densely peopled** desert, about **10,000 years old**, with only 40–60% of it fit to farm, and spreading cultivation has eaten into the **grazing lands** — all four true [UPPCS 2008]",
"The most populated desert in the world :: the **Thar** [UPPCS 2012]",
"The largest desert of South Asia :: the **Thar** [UPPCS 1996]",
"**Marusthali** lay under the sea in the :: **Mesozoic** era [CDS 2022 II]",
"The monsoon brings little rain because its winds cross Rajasthan with **no barrier** to lift them — the Aravalli runs parallel to their path [BPSC 2022]",
"A **lost Himalayan river** of the Indus system once crossed the region; its drying helped make the desert"]},
{h:"The two coastal plains",t:1,cols:["Feature","East coast","West coast"],rows:[
["Extent","Sundarbans to Kanyakumari","Kachchh to Kanyakumari"],
["Width","**Wide** — long rivers build big **deltas**","**Narrow** — short, swift rivers make **estuaries**"],
["Character","**Emergent**, depositional, smooth coast","**Submergent** and erosional (Kerala excepted) — high, rocky and retreating"],
["Harbours","Few natural harbours; ports are dredged or artificial","Indented coast with **natural harbours** — Mumbai, Mormugao, Kochi"],
["Continental shelf","Narrower","Wider"],
["Divisions","**Utkal** (Odisha — Mahanadi delta, Chilika) · **Andhra** (to Pulicat — Krishna–Godavari delta) · **Tamil Nadu** (Kaveri delta); also **Northern Circars** (Mahanadi to Krishna) and **Coromandel** (Krishna delta to Kanyakumari)","**Kachchh–Kathiawar** (Gujarat) · **Konkan** (Daman to Goa) · **Kanara** (Goa to Mangaluru, the narrowest) · **Malabar** (Mangaluru to Kanyakumari — lagoons and backwaters, the **kayals**)"]]},
{h:"Coasts in questions",t:1,list:[
"The west coast is **high, rocky and retreating** with **erosional** landforms; the east coast is **broad and sedimentary** with **depositional** ones — all true [CDS 2022 I]",
"The coast between the Krishna delta and Cape Comorin :: **Coromandel** [UPPCS 2015]",
"The northern part of the western coastal plain :: **Konkan** [UPPCS 2016]",
"Longest coastline among the States :: **Gujarat** (~2,340 km); Andaman and Nicobar has the longest of all [UPPCS 2018, 2007; UP UDA 2006; UP RO 2016; CDS 2023 I]",
"At **Chandipur** (Balasore, Odisha) the sea retreats several km at low tide and you can walk on the sea floor [CSE 2017]",
"Extensive marshland left by repeated falls in sea level :: the **Rann of Kutch** — not Bhitarkanika, Marakkanam or Naupada [CSE 2023]",
"**Kori Creek** lies in the :: **Rann of Kutch** [UPPCS M 2011; UPPCS Spl 2008]",
"India’s mean sea level is measured on the :: **Chennai** coast [UP UDA 2013]",
"A Danish outpost with a fort and the New Jerusalem church — **Tharangambadi (Tranquebar)** — lies on the :: **Tamil Nadu** coast [CSE 1996]",
"West coast, north → south :: **Janjira → Sindhudurg → Kannur → Nagercoil** [UP UDA 2001]",
"On the west coast :: **Janjira** and **Udupi** — !!Auroville and Tuticorin are on the east coast!! [UP Lower 2002]",
"Beaches :: Digha — **West Bengal** · Gopalpur — **Odisha** · Calangute — **Goa** · Marina — **Tamil Nadu** [UPPCS Spl M 2008]",
"Lagoons :: **Chilika**, **Pulicat**, **Ashtamudi** and **Vembanad** — built behind spits and bars; **Periyar lake** is a reservoir, !!not a lagoon!! [CSE 2002]",
"**Pulicat** lagoon is spread over only **two** States — Andhra Pradesh and Tamil Nadu [CSE 2017; UPPCS M 2008]",
"Ships from Chennai to Kochi go round Sri Lanka because the **Palk Strait** is **too shallow** [CDS 2015 II]",
"India and Sri Lanka are separated by the :: **Palk Strait** [MPPCS 1990]"]},

{h:"Andaman and Nicobar Islands",t:1,list:[
"Origin :: the drowned southward continuation of the **Arakan Yoma** fold ranges — with two volcanic islands, Barren and Narcondam",
"North → south :: Landfall → North Andaman → **Middle Andaman** (the largest) → South Andaman (**Port Blair**) → Little Andaman → Ten Degree Channel → **Car Nicobar** → Nancowry group → Little Nicobar → **Great Nicobar** (**Indira Point**)",
"Highest peak of the islands :: **Saddle Peak** (~732 m), **North Andaman** [UPPCS 2009; CSE 1996]",
"**Mount Thuillier**, the Nicobars’ highest, is on :: **Great Nicobar** [CDS 2022 I]",
"**Barren Island** :: India’s **only active volcano**, in the Andaman Sea about 135 km north-east of Port Blair — !!not 140 km east of Great Nicobar!!; it erupted in 1991 and repeatedly since, so !!not inactive since 1991!! [CSE 2018; UP GIC 2010]",
"**Narcondam** :: a dormant volcanic island north-east of Barren",
"Renamed :: Ross → **Netaji Subhas Chandra Bose Dweep** · Havelock → **Swaraj Dweep** · Neil → **Shaheed Dweep** · Mount Harriet → **Mount Manipur**",
"**Baratang** (Middle Andaman) has mud volcanoes and limestone caves; **Galathea Bay** on Great Nicobar is a leatherback-turtle nesting beach",
"**Ritchie’s Archipelago** lies east of Middle Andaman and the **Labyrinth Islands** south-west of South Andaman"]},
{h:"Lakshadweep and other islands",t:1,list:[
"**Lakshadweep** :: coral islands and **atolls** (36 islands, ~32 km²) off Kerala, 220–440 km from Kochi; groups **Amindivi** (north), **Laccadive** and **Minicoy** (south); capital **Kavaratti**; the largest island is Andrott [JPSC 2021]",
"A coral island among New Moore, Car Nicobar, Andaman and Lakshadweep :: **Lakshadweep** [UP UDA 2013]",
"One of the remotest islands from the Indian coast :: **Minicoy** — not Bhatkal, Arnala or Henry [UP UDA 2013]",
"**Tilanchong** is a Nicobar island, !!not part of Lakshadweep!!; Agatti, Kavaratti and Kalpeni are [UKPCS 2021]",
"Most populous island of India :: **Salsette** (Mumbai) [UPPCS M 2016]",
"The Indian island between India and Sri Lanka :: **Rameswaram** (Pamban) [UPPCS 2006]",
"Adam’s Bridge (Ram Setu) starts from :: **Dhanushkodi**, on Pamban island [UP UDA 2010]",
"The **Pamban bridge** joins Pamban (Rameswaram) island to **Mandapam** on the mainland — !!not to Kanyakumari!!",
"Gujarat :: Viyant Syodhar — **Gulf of Kutch** · Piram — **Gulf of Khambhat** · Dwarka — **Arabian Sea coast** · Diu — **Kathiawar coast** [UP GIC 2010]",
"**Pirotan** island lies in the **Gulf of Kutch** [CDS 2015 I]",
"Islands of the Rann of Kutch :: **Pachham**, **Khadir**, **Bela**",
"Islands of the Gulf of Kutch :: **Nora**, **Kurumbar**, **Baidar**",
"**Sriharikota** (Pulicat, Andhra) — ISRO’s launch centre · **Abdul Kalam (Wheeler) Island** (Odisha) — DRDO missile range · **Gangasagar (Sagar)** — the Hooghly mouth",
"**New Moore (Purbasha)** :: an uninhabited islet that rose after the 1970 cyclone and has since vanished under the sea",
"**St Mary’s Islands** (Udupi) — columnar basalt, a geo-heritage site · **Willingdon Island** — Kochi port · **Majuli** — the great Brahmaputra river island"]}

/* ===== 14 DRAINAGE & HIMALAYAN RIVERS ===== */
SEC({id:"rivers-north",title:"Drainage & Himalayan Rivers",group:"India — Physical",tier:1,
stats:["UPSC CSE: 8 Q (2014–26) in 6 of 17 papers — Arunachal rivers (2014), Brahmaputra tributaries (2016), the Teesta (2017), which river joins the Indus (2021), Ganga tributaries west to east (2024), and three in 2026 (Pleistocene river shifts, Rigvedic names, the Sutlej from clues); older papers asked a river rising outside India (2009), tributary pairs (2008) and north-to-south order (2006, 1996)","UPPCS Pre: 8 Q since 2018 — the Moribund delta (2019), the trans-Himalayan Sutlej and the Yamuna’s tributaries (2020), the Jonk and the Teesta’s capture (2021), Devprayag (2023), the Prayags (2024), perennial Himalayan rivers (2025); older UPPSC papers asked sources, tributaries and river names about 25 times","Formats: tributary ↔ river, west-to-east or north-to-south order, river from clues, confluence ↔ Prayag, Assertion–Reason on perennial flow and river capture"],
note:"How India drains and how the two river families differ, then the Himalayan systems one by one — the Indus, the Ganga with its Prayags and tributaries, the Brahmaputra and the rivers of the North-East. Peninsular rivers, lakes and waterfalls are in the next sheet; dams, canals and river links in the water-projects sheet; drainage patterns in the landforms sheet.",
blocks:[
{h:"How India drains",t:1,list:[
"Drainage basin :: the area drained by a river and its tributaries; the high ground between two basins is the **water divide**",
"About **77%** of India’s drainage area drains to the **Bay of Bengal** and **23%** to the **Arabian Sea**",
"Main water divide :: the **Delhi ridge, the Aravalli and the Sahyadri** — the Indus and the west-flowing rivers on one side, the Ganga and the east-flowing rivers on the other",
"Basin classes :: **major** (over 20,000 km²), **medium** (2,000–20,000 km²) and **minor** (smaller) — India has 14 major basins",
"Largest basin :: the **Ganga** (~26% of India); then the Indus (~10%) and the **Godavari** (~10%), the largest Peninsular basin",
"Longest river flowing in India :: the **Ganga** (~2,525 km); the Indus and the Brahmaputra are longer overall, but most of their length lies outside India"]},
{h:"Himalayan and Peninsular rivers",t:1,cols:["Feature","Himalayan rivers","Peninsular rivers"],rows:[
["Source","Glaciers and snowfields of the Himalaya and Tibet","Plateau hills — mostly the **Western Ghats**; also the Eastern Ghats, Amarkantak and Chota Nagpur"],
["Flow","**Perennial** — snow and glacier melt plus monsoon rain","Mostly **seasonal** and rain-fed; little flow in the dry months"],
["Gradient and erosion","**Steeper**; far more erosion and silt","Gentler, over hard rock — they erode **less**, !!not more!! [BPSC 2022]"],
["Valleys","Deep **V-shaped gorges**; many **antecedent** rivers","Broad, shallow, **graded** valleys of old, mature rivers"],
["In the plains","**Meanders**, braids and **shifting courses**","Fixed, fairly straight courses"],
["Mouths","Huge **deltas** (the Sundarbans)","East-flowing rivers build deltas; west-flowing ones end in **estuaries**"]]},
{h:"Himalayan rivers in questions",t:1,list:[
"Himalayan rivers are **perennial** because the high Himadri and Trans-Himalayan ranges stay **snow-covered all year** and feed glaciers — the reason explains it [UPPCS 2025]",
"Himalayan rivers are perennial and the Himalaya gets most rain from the **south-west monsoon** — both true, but the monsoon does !!not!! explain the perennial flow; the glaciers do [UPPCS M 2011]",
"**Antecedent** river :: older than the mountains it crosses — it kept cutting down as the range rose, leaving deep gorges: the **Indus**, **Sutlej**, **Brahmaputra** (Dihang gorge), **Arun** (Kosi), **Kali Gandaki** (Gandak) and **Karnali** (Ghaghara)",
"The **Sutlej** cuts across all the Himalayan ranges [UPPCS M 2012; UP RO M 2014]",
"**Trans-Himalayan** rivers rise north of the Great Himalaya, in Tibet — the **Indus**, the **Sutlej** and the **Brahmaputra**; the Sutlej was the answer [UPPCS 2020]",
"The **Ganga** was keyed an example of **antecedent** drainage [UP UDA 2013]",
"**Superimposed** river :: one that kept the course it had on younger cover rocks and cut down into the unlike structure beneath — the **Chambal**, the **Son** and other rivers of the Rewa plateau [UPPCS M 2007]",
"**River capture** :: a stronger river, eroding back faster, steals the headwaters of a neighbour — common among the young Himalayan rivers",
"The **Teesta** once drained to the Ganga system; after the flood of **1787** it swung south-east into the **Brahmaputra** — river capture explains it [UPPCS 2021]"]},
{h:"How the Himalayan drainage evolved",t:2,list:[
"**Indo-Brahm** (Shiwalik) river :: a single great river that, some geologists held, once ran the length of the Himalaya from Assam to Punjab and out to the **Gulf of Sindh** in the Miocene",
"It was split into the **Indus**, **Ganga** and **Brahmaputra** systems in the **Pleistocene** — uplift of the **Potwar plateau** (Delhi ridge) made the Indus–Ganga divide, and the down-faulted **Malda gap** between the Rajmahal and Meghalaya hills turned the Ganga and Brahmaputra towards the Bay",
"**River dolphins of one kind** (Platanista) live in both the Indus and the Ganga systems — the basis for holding that in the Pleistocene the Yamuna once flowed to the Indus, or the Sutlej to the Yamuna; !!not the Rigveda’s Nadi-sukta, nor the explorations of Robert Bruce Foote!!, who worked in South India [CSE 2026]",
"The lost **Sarasvati** is often identified with the **Ghaggar–Hakra** bed, left dry as the Sutlej and the Yamuna shifted away"]},

["**Sutlej** (Shutudri; ‘Langchen Khambab’ in Tibet)","**Rakshas Tal**, beside Mansarovar, Tibet","Antecedent; enters India at **Shipki La**; takes the **Spiti** and the Baspa; cuts the **Bhakra** gorge and leaves the hills at **Ropar**; joins the Chenab to form the **Panjnad**, which meets the Indus at **Mithankot**"]]},
{h:"The Indus system in questions",t:1,list:[
"West → east across Punjab :: **Indus → Jhelum → Chenab → Ravi → Beas → Sutlej**",
"North → south :: **Shyok → Zanskar → Spiti → Sutlej** [CSE 2006]",
"Rigvedic names :: **Vitasta — Jhelum** · **Asikni — Chenab** · **Parushni — Ravi** · **Vipasha — Beas** · **Shutudri — Sutlej**; the paper swapped Vitasta and Asikni, and !!Yavyavati is not the Beas!! [CSE 2026]",
"Rises outside India :: the **Sutlej**, in Tibet — the Beas, Chenab and Ravi rise in Himachal [CSE 2009; UPPCS 2013; UP GIC 2010]",
"Rises near Mansarovar and enters India through Shipki La :: the **Sutlej** [UP RO 2023]",
"The Mansarovar area feeds the **Indus, Sutlej and Brahmaputra** (and the Karnali) [BPSC 1994; CAPF 2014]",
"The **Indus and the Brahmaputra** rise close together near Mansarovar [UPPCS 2006]",
"Of the Chenab, Jhelum, Ravi and Sutlej, the one keyed as joining the Indus directly is the **Sutlej** — as the **Panjnad** it carries the other three into the Indus at **Mithankot** [CSE 2021]",
"Antecedent, flows through three countries, rises on the Tibetan plateau, vital for irrigation, and forms **no distributaries** :: the **Sutlej** — the Indus and Brahmaputra build deltas, and the Teesta rises in Sikkim [CSE 2026]",
"Indus basin in India :: **Ladakh, J&K, Himachal, Punjab, Haryana** and part of **Rajasthan**, with Chandigarh — about a tenth of India [CDS 2023 I]",
"**Doodh Ganga** :: a Jhelum tributary in Kashmir (another flows in Uttarakhand); the key took J&K [UPPCS 2015]"]},
{h:"Indus Waters Treaty",t:2,list:[
"**Indus Waters Treaty** (1960, Karachi; brokered by the **World Bank**) :: the eastern rivers — **Ravi, Beas, Sutlej** — to India; the western rivers — **Indus, Jhelum, Chenab** — to Pakistan",
"On the western rivers India may make domestic and farm use and **run-of-the-river** hydropower, with storage capped at about **3.6 million acre-feet**",
"Differences over dam designs (Kishanganga, Ratle) went to a **Neutral Expert** and a **Court of Arbitration**",
"India placed the treaty **in abeyance** in April 2025, after the Pahalgam attack"]},

{h:"Panch Prayag and the headstreams",t:1,list:[
"**Bhagirathi** :: rises at **Gaumukh**, the snout of the Gangotri glacier; the **Bhilangna** joins it at **Tehri**",
"**Alaknanda** :: rises from the **Satopanth** and Bhagirath Kharak glaciers and flows past **Badrinath**, which stands on its bank [UP UDA 2013]",
"Down the Alaknanda :: **Vishnuprayag** (Dhauliganga) → **Nandprayag** (Nandakini) → **Karnaprayag** (Pindar) → **Rudraprayag** (Mandakini) → **Devprayag** (Bhagirathi), below which the river is the **Ganga**",
"Confluences :: **Devprayag** — Alaknanda + Bhagirathi · **Rudraprayag** — Alaknanda + Mandakini · **Karnaprayag** — Alaknanda + Pindar · **Tehri** — Bhagirathi + Bhilangna [UPPCS 2024, 2023; UPPCS M 2016; UP Lower 2002]",
"**Mandakini** :: rises near **Kedarnath** (Chorabari); Gaurikund, Rambara and Guptkashi lie on it — **Govindghat** is at the Alaknanda–Lakshman Ganga meeting, !!not on the Mandakini!! [UPPCS M 2013]",
"The river between Kedarnath and Rudraprayag :: the **Mandakini** [UKPCS 2006]",
"**Dhauliganga** :: rises near the **Niti** pass; its tributary the **Rishiganga** drains the Nanda Devi basin — the Chamoli flood of February 2021 came down these two valleys",
"The Ganga leaves the mountains at **Haridwar**"]},
{h:"The Ganga",t:1,list:[
"Main-stream States :: **Uttarakhand → Uttar Pradesh → Bihar → Jharkhand → West Bengal**",
"The basin is shared by **India** (~79%), Nepal, Bangladesh and China (Tibet)",
"**Farakka** barrage (1975) :: sends water down the **Bhagirathi–Hooghly** to flush silt from Kolkata port; the main stream enters Bangladesh as the **Padma** [UPPCS M 2016]",
"Ganga water is shared at Farakka with **Bangladesh** under the **1996** treaty, which runs for 30 years, to 2026 [CAPF 2022]",
"The **Padma** meets the **Jamuna** (the Brahmaputra) at Goalundo and then the **Meghna**, which enters the Bay",
"With the Brahmaputra and Meghna, the Ganga carries the **third-largest** flow on Earth, after the Amazon and the Congo",
"The Ganga is badly polluted — by **untreated sewage and industrial waste**, !!not by its holiness!! [UPPCS 2005]",
"**Bengal delta** :: built by the Ganga, Brahmaputra and Meghna — the world’s largest; its western, inactive part divides into the **Moribund**, Mature and Active deltas [UPPCS 2019]",
"The **Sundarbans** fringe the seaward edge of the Ganga–Brahmaputra delta [MPPCS 2014]",
"Not in the Ganga basin :: the **Jonk**, a Mahanadi tributary — the Punpun, Ajay and Jalangi are Ganga-basin rivers [UPPCS 2021]",
"**Mahatma Gandhi Setu** (~5.6 km) crosses the Ganga between **Patna and Hajipur**, Bihar [UPPCS 1993]"]},

{h:"Left-bank tributaries of the Ganga",t:1,cols:["River","Rises","Course and joins"],rows:[
["**Ramganga**","Dudhatoli hills near **Gairsain**, Garhwal","Enters the plains near Najibabad and joins near **Kannauj** — a Ganga tributary, !!not the Yamuna’s!! [UP GIC 2010]"],
["**Gomti**","**Gomat Tal (Fulhar Jheel)**, Pilibhit — the only major tributary rising in the **plains** [UP Lower 2008; UPPCS 2009]","Past **Lucknow** and Jaunpur; joins the Ganga below Varanasi [UP GIC 2010]"],
["**Ghaghara**","**Mapchachungo** glacier, Tibet; the **Karnali** in Nepal","Takes the **Sharda** (Kali) and the **Rapti**; joins at **Chhapra**, Bihar"],
["**Gandak**","Nepal Himalaya — the **Kali Gandaki** and Trishuli; the **Narayani** in Nepal","Enters India at Valmikinagar and joins at **Sonepur**, opposite Patna; keyed as !!not flowing through UP!! — it only skirts UP’s border [UP RO 2021]"],
["**Burhi Gandak**","West Champaran, Bihar","Its meanders left **Kanwar (Kabar) Tal** in Begusarai, Asia’s largest freshwater oxbow lake [BPSC 2022]"],
["**Kosi**","Seven streams in Nepal (the **Sapt Kosi**) — the **Arun** from Tibet is the main one","Drains the Everest region, carries huge silt and keeps **shifting its course** westward — the ‘**sorrow of Bihar**’; joins near **Kursela**, Katihar [UP UDA 2013]"],
["**Mahananda**","Darjeeling hills","Through the Siliguri corridor; joins the Ganga (Padma) in **Bangladesh**"]]},
{h:"Right-bank tributaries of the Ganga",t:1,cols:["River","Rises","Course and joins"],rows:[
["**Yamuna**","**Yamunotri** glacier, Bandarpunch","The longest Ganga tributary; past Delhi, Mathura and Agra to the **Sangam** at **Prayagraj**; its largest tributary is the **Tons**"],
["**Chambal**","**Janapav** hills near Mhow, Malwa (MP)","North through a gorge past **Kota**; forms part of the MP–Rajasthan border; its valley is famous for deep **ravines** (badlands); takes the Banas, Kali Sindh and Parbati; joins the Yamuna near Etawah [MPPCS 2019]"],
["**Sindh · Betwa · Ken**","Malwa plateau · Vindhyan hills near Bhopal · Kaimur hills","Cross Bundelkhand to the Yamuna — the **Betwa** at **Hamirpur**, the **Ken** near Chilla (Banda) [UP RO 2014]"],
["**Son**","**Amarkantak** — the source is keyed as **Son Bachharwar** (Gaurela-Pendra-Marwahi, Chhattisgarh); some records name Sonmuda (MP) [UPPCS M 2007]","North, then east along the **Kaimur** scarp; takes the **Rihand**, Johila and **North Koel**; joins the Ganga **directly** near Patna [CDS 2020 II; BPSC 2019]"]]},
{h:"Ganga tributaries in questions",t:1,list:[
"Himalayan rivers joining the Ganga below Prayagraj, west → east :: **Gomti → Ghaghara → Gandak → Kosi** — reversed, east → west [CSE 2024; CDS 2018 I]",
"The Yamuna’s right-bank tributaries, west → east :: **Chambal → Sindh → Betwa → Ken** [UPPCS 2020]",
"The Yamuna runs nearly dead between Delhi and Agra most of the year because of **pollution** — !!it is not a non-perennial river!! [UPPCS 2015]",
"Largest catchment of the Mahananda, Son, Ramganga and Gandak :: the **Son** [UP RO M 2017]",
"Tributary pairs :: **Manas — Brahmaputra** is right; the Chambal joins the **Yamuna**, !!not the Narmada!!, and the Son joins the **Ganga**, !!not the Yamuna!! [CSE 2008]",
"North → south :: **Kishanganga → Ganga → Wainganga → Penganga** [CSE 1996]"]},
{h:"Towns on the Himalayan rivers",t:2,list:[
"**Ludhiana** stands on the **Sutlej** [UPPCS 1992]",
"Ganga system :: **Kanpur, Varanasi, Patna, Bhagalpur** — Ganga · **Ayodhya** — Saryu (the Ghaghara)",
"Brahmaputra :: **Dibrugarh, Tezpur, Guwahati, Dhubri**"]},
{h:"The Brahmaputra",t:1,list:[
"Rises in the **Chemayungdung** glacier of the Kailash range near Mansarovar — recent surveys trace it to the **Angsi** glacier",
"Names downstream :: **Yarlung Tsangpo** in Tibet (east for ~1,200 km) → U-turn round **Namcha Barwa** → **Siang (Dihang)** in Arunachal → **Brahmaputra** in Assam once the **Dibang and Lohit** join near **Sadiya** → **Jamuna** in Bangladesh → joins the Padma → **Meghna**",
"Length ~**2,900 km**, about 900 km in India; basin in **Tibet, Bhutan, India and Bangladesh** — the 1990 key named Tibet, Bangladesh and India [UPPCS 1990]",
"A heavily **braided** river with enormous silt loads; floods and bank erosion every monsoon; it leaves India at **Dhubri**",
"**Majuli** :: shaped by the Brahmaputra, the Subansiri and the **Kherkutia Xuti**, an anabranch; India’s first island district (2016), shrinking as its banks erode",
"**Umananda** (Peacock Island), at Guwahati, is among the smallest inhabited river islands",
"China began building a giant hydropower project on the lower **Yarlung Tsangpo** near the great bend (Medog) in July 2025; India plans the **Siang Upper Multipurpose Project** in Arunachal in response"]},
{h:"Tributaries of the Brahmaputra",t:1,list:[
"North-bank (right) tributaries, west → east :: **Teesta**, **Sankosh**, **Manas**, **Kameng**, **Subansiri** — from Sikkim, Bhutan, Arunachal and Tibet",
"South-bank (left) tributaries :: **Burhi Dihing**, **Disang**, **Dikhow**, **Dhansiri** and **Kopili** — with the **Dibang** and **Lohit** at the head",
"**Subansiri** :: the largest tributary; rises in Tibet and enters Assam near Gerukamukh",
"**Kameng** :: called the **Jia Bharali** in Assam; joins near **Tezpur**",
"**Manas** :: Bhutan’s largest river; joins at Jogighopa",
"**Sankosh** :: comes down from Bhutan and forms part of the **Assam–West Bengal** border [UPPCS M 2007]",
"**Dibang** (Sikang) and **Lohit** :: join the Siang near Sadiya; the 9.15-km **Bhupen Hazarika (Dhola–Sadiya)** bridge spans the Lohit",
"**Teesta** :: rises in North Sikkim (Tso Lhamo and the Zemu glacier); the **Rangeet**, which rises in West Sikkim, joins it at **Melli (Triveni)**; it crosses West Bengal and joins the Brahmaputra in Bangladesh — so its source is !!not the Brahmaputra’s!! and it does !!not!! reach the Bay on the border [CSE 2017]",
"Brahmaputra tributaries :: the **Dibang**, **Kameng** and **Lohit** — all three [CSE 2016]",
"West → east :: **Teesta → Sankosh → Subansiri → Dibang** [CDS 2016 I]",
"Flow through Arunachal :: the **Lohit** and **Subansiri** — !!the Barak does not!! [CSE 2014]"]},
{h:"Other rivers of the North-East",t:2,list:[
"**Barak** :: rises in the hills of Senapati district, Manipur; flows through Manipur, Mizoram and Assam (Silchar); in Bangladesh it splits into the **Surma** and **Kushiyara**, which reunite as the **Meghna**",
"Barak tributaries :: the **Dhaleswari (Tlawng)** and the **Tuirial (Sonai)** from Mizoram, and the Jiri [CDS 2022 I]",
"**Kaladan (Chhimtuipui)** :: rises in Myanmar’s Chin hills, loops through southern Mizoram and returns to Myanmar to reach the Bay at **Sittwe** — the route of the **Kaladan Multimodal Transit** project",
"**Gumti** :: Tripura’s longest river; flows into Bangladesh to the Meghna",
"**Manipur (Imphal)** river :: drains the Loktak basin south into Myanmar, to the **Chindwin** system of the **Irrawaddy**"]}
]});

/* ===== 15 PENINSULAR RIVERS, LAKES & WATERFALLS ===== */
SEC({id:"rivers-south",title:"Peninsular Rivers, Lakes & Waterfalls",group:"India — Physical",tier:1,
stats:["UPSC CSE: 10 Q (2010–24) in 9 of 17 papers — the Luni (2010), why the Narmada flows west (2013), Godavari tributaries (2015), an artificial lake (2018), river towns (2019), Rajasthan’s saline lakes and rivers of the Eastern Ghats (2021), Gandikota (2022), lakes (2023), waterfalls (2024); older papers asked Amarkantak and Kerala’s rivers (2009), the Kalinadi and river towns (2007), where the Cauvery rises (2006), the Damodar rift and phumdis (1998)","UPPCS Pre: 13 Q since 2018 — the Tapi and the highest waterfall (2018), the Luni and the Damodar (2019), lakes by State (2020), waterfalls and Chilika (2021 ×3), waterfalls and basin size (2022), sources and tributaries (2023 ×2), west-flowing rivers (2025); older UPPSC papers asked river towns, lakes and waterfalls about 45 times","Formats: source ↔ river, tributary ↔ river, town ↔ river, waterfall ↔ river or State, lake ↔ State or type, why west-flowing rivers make no delta"],
note:"The Peninsular rivers — how the old plateau drains, the east-flowing rivers with their deltas, the Narmada and Tapi in their rift troughs, the short Western Ghats streams, the rivers of Odisha and Chota Nagpur and the inland rivers of Rajasthan — then river towns, waterfalls and lakes. Himalayan rivers are in the previous sheet; dams, canals and river links in the water-projects sheet.",
blocks:[
{h:"How the Peninsula drains",t:1,list:[
"An old, stable plateau :: rivers flow in **broad, shallow, graded** valleys with fixed courses",
"Evolution :: the **western flank subsided** below the sea in the early Tertiary, upsetting a once-symmetrical drainage; the Himalayan upheaval cracked the troughs of the **Narmada and Tapi**; and the block **tilted from north-west to south-east**, so most rivers run to the Bay",
"Main divide :: the **Western Ghats**, close to the west coast — so the big rivers rise in the west and cross the whole plateau to the Bay",
"South Indian rivers mainly show a **dendritic** pattern (keyed) [UPPCS 2014]",
"West-flowing Western Ghats rivers make **no delta** — short, swift courses over hard rock; the reason explains it [UPPCS 2014; UP UDA 2010; UP RO M 2013]",
"Estuary, not delta :: the **Tapi** (and the Narmada) — the Godavari, Kaveri and Mahanadi build deltas [UPPCS 2006]",
"The **Mahanadi** builds its delta in **Odisha**, near Paradip — !!not an estuary!! [UP RO 2014; JPSC 2003]",
"Water-short basins :: the **Sabarmati** and the **Tapi** [UP Lower 2002]"]},
{h:"Peninsular rivers",t:1,fig:{kind:"svg",

{h:"East-flowing rivers",t:1,cols:["River","Rises","Main tributaries","Course and mouth"],rows:[
["**Mahanadi**","**Sihawa** hills, Dhamtari (Chhattisgarh) [UPPCS 2023]","**Seonath**, **Hasdeo**, Mand, **Ib**, Jonk, **Tel**, Ong","~851 km through Chhattisgarh and Odisha; delta near **Paradip**; its basin (~1.4 lakh km²) is larger than the Narmada’s, Kaveri’s or Tapi’s [UPPCS 2022; UP RO M 2021]"],
["**Godavari**","**Trimbakeshwar**, near Nashik [UPPCS 2023]","Left: **Purna**, **Pranhita** (Wainganga + Wardha + Penganga), **Indravati**, **Sabari**; right: **Pravara**, **Manjira**, Maner","~1,465 km — the **longest** Peninsular river and the largest basin, the ‘**Dakshin Ganga**’; through Maharashtra, Telangana and Andhra; delta below **Rajahmundry** [UP UDA 2013; UP RO M 2014; UPPCS 2009]"],
["**Krishna**","**Mahabaleshwar**, Sahyadri [UPPCS 2023; UKPCS 2016]","Right: **Koyna**, **Ghataprabha**, **Malaprabha**, **Tungabhadra**; left: **Bhima**, Dindi, **Musi**, Munneru","~1,400 km through Maharashtra, Karnataka, Telangana and Andhra; delta near Vijayawada"],
["**Pennar (Penna)**","**Nandi hills**, Chikkaballapur (Karnataka)","Jayamangali, Kunderu, Papagni, Chitravati","North, then east through Rayalaseema; cuts the **Gandikota** canyon in the Erramala hills; reaches the Bay near **Nellore** by an estuary [CSE 2022]"],
["**Kaveri**","**Talakaveri**, Brahmagiri hills, Kodagu (Karnataka) — !!not Andhra Pradesh!! [CSE 2006; UPPCS M 2011; UP RO M 2013; UKPCS 2016]","Left: Harangi, **Hemavati**, Shimsha, **Arkavathi**; right: **Kabini**, Lakshmana Tirtha, **Bhavani**, Noyyal, **Amaravati**","~800 km, with its delta in Thanjavur; fed by **both monsoons** — its upper basin by the south-west, its lower by the north-east — so its flow is the steadiest of the Peninsular rivers; forks round the islands of **Srirangapatna**, **Sivasamudram** and **Srirangam** [CSE 1996]"],
["**Vaigai**","Varushanad hills, Theni (Tamil Nadu)","—","Past **Madurai** to the Palk Strait"]]},
{h:"Peninsular tributaries in questions",t:1,list:[
"Godavari tributaries :: the **Indravati** and the **Pranahita** — !!not the Vamsadhara or the Pennar!! [CSE 2015]",
"**Pranhita — Mahanadi** was the wrong pair; Hemavati — Kaveri, Malaprabha — Krishna and Manjira — Godavari are right [UPPCS 2023]",
"**Tel** is a Mahanadi tributary, !!not the Krishna’s!! — the Bhima, Doni and Tungabhadra join the Krishna [UP UDA 2010]",
"**Hagari (Vedavati)** joins the **Tungabhadra** [UPPCS M 2009]",
"River and tributary :: Ganga — **Son** · Godavari — **Manjira** · Krishna — **Bhima** · Yamuna — **Ken** [UPPCS M 2003]",
"Rise in the **Eastern Ghats** :: the **Nagavali** and the **Vamsadhara** — the Brahmani and Subarnarekha rise on the Chota Nagpur [CSE 2021]",
"The Godavari, Kaveri and Kabini rise in the Western Ghats; the **Tapi** does not — it rises at **Multai** in the Satpura [UPPCS 2018]",
"Rise at **Amarkantak** :: the **Narmada** (west to the Arabian Sea) and the **Son** (north to the Ganga) [CSE 2009; UPPCS M 2008]",
"Kerala has east-flowing rivers (the **Kabini**, **Bhavani**, **Pambar**) and MP has west-flowing ones (the **Narmada**, **Tapi**, **Mahi**) — both ‘none’ statements are false [CSE 2009]",
"Crossed on the way from Chennai to Kolkata :: **Pennar → Krishna → Godavari → Mahanadi → Subarnarekha** [CDS 2017 I]",
"Different from the Tungabhadra, Penganga and Mahanadi :: the **Narmada** — it alone reaches the Arabian Sea [BPSC 2024]",
"Falls into the Arabian Sea :: the **Periyar** — the Pennar and the Palar go to the Bay [UPPCS 2025]",
"The **Tapi** reaches the Arabian Sea [UPPCS 1992]",
"‘Ganga of the South’ was keyed as the **Kaveri** in one paper, though the name usually goes to the Godavari [UPPCS 2015]",
"The **Krishna** water dispute involves **Maharashtra, Karnataka, Telangana and Andhra** — the 2013 options had no fully right answer [UP UDA 2013]"]},
{h:"Narmada and Tapi",t:1,list:[
"**Narmada** :: rises at **Amarkantak** and runs west ~1,312 km through MP, along the Maharashtra border and into Gujarat, in a **rift valley** between the **Vindhya and Satpura**, to the **Gulf of Khambhat** near **Bharuch** [UPPCS 2012]",
"Why the Narmada flows west :: it occupies a **linear rift valley** — lying between the Vindhyas and Satpuras is !!not the reason!!, and central India does !!not!! slope west [CSE 2013]",
"The Narmada and Tapi flow west, against the plateau’s general slope, because they occupy **rift valleys** — the reason explains it [UPPCS M 2002; UPPCS 1999]",
"The Narmada makes an **estuary**, !!not a delta!! — its rift valley carries little silt [UPPCS M 2005]",
"Rivers in rift (fault) troughs :: the **Narmada** and the **Tapi** — and the **Damodar** in the east [UPPCS 2010; UP GIC 2017; UP UDA 2013]",
"Narmada towns and shrines :: Narmadapuram, **Omkareshwar**, **Maheshwar**, Bharuch",
"Narmada tributaries :: mostly short; the **Tawa** is the longest, with the Hiran, Burhner, Banjar and Kundi",
"**Tapi** :: rises at **Multai**, Betul (MP), in the Satpura; flows west in a parallel trough past Burhanpur and Jalgaon to **Surat**; tributaries the **Purna**, **Girna** and Panjhra",
"**Mahi** :: rises in the western Vindhyas (Dhar, MP), loops through Banswara in Rajasthan and reaches the **Gulf of Khambhat** in Gujarat",
"**Sabarmati** :: rises in the Aravalli (Udaipur district) and flows past **Ahmedabad** and **Gandhinagar** to the Gulf of Khambhat"]},
{h:"Western Ghats rivers",t:1,list:[
"West-flowing Ghats rivers :: **short and swift**, with waterfalls; they end in **estuaries** and backwaters",
"**Mandovi (Mhadei)** :: rises at Bhimgad (Belagavi, Karnataka), crosses Goa to Panaji; Karnataka’s **Kalasa–Banduri** diversion towards the Malaprabha is disputed by Goa",
"**Zuari** :: Goa’s largest river; **Mormugao** port lies at the joint mouth of the Mandovi and Zuari",
"**Kalinadi** :: a **west-flowing** river of Karnataka, reaching the sea at **Karwar** — !!not east-flowing!!; the plateau’s eastward tilt is true [CSE 2007]",
"**Sharavati** :: rises in Shivamogga and flows wholly in Karnataka — **Jog** falls",
"**Netravati** :: reaches the sea at **Mangaluru**",
"**Periyar** :: rises in the **Sivagiri** hills; Kerala’s second-longest river; meets the sea near Kochi",
"**Bharathapuzha (Ponnani)** :: Kerala’s longest river; rises in the **Anamalai** and flows west through the **Palakkad gap**",
"**Pamba** :: flows past **Sabarimala** into **Vembanad** lake",
"Konkan rivers :: the **Damanganga**, the **Vaitarna** (Mumbai’s water) and the Ulhas",
"**Mithi** river of Mumbai begins as the overflow of **Vihar** lake [UP RO 2014]"]},
{h:"Rivers of Odisha and Chota Nagpur",t:1,list:[
"**Subarnarekha** :: rises near **Ranchi** and flows through Jharkhand, West Bengal and Odisha to the Bay; gold placers in its sands; **Hundru** falls [UKPCS 2016]",
"**Brahmani** :: formed at **Vedvyas, Rourkela**, where the **South Koel** from Jharkhand meets the **Sankh**",
"**Baitarani** :: rises in the **Gonasika** hills of Keonjhar, Odisha",
"The Brahmani and Baitarani meet just before the sea, where **Bhitarkanika** lies [CSE 2011]",
"**Damodar** :: rises in the **Khamarpat** hills of Chota Nagpur, crosses Jharkhand’s coal belt and joins the **Hooghly** in West Bengal; once the ‘**sorrow of Bengal**’ [UP UDA 2006; UP Lower 2008; UPPCS 2008]",
"The Damodar flows in a **rift valley** made by down-warping — a Gondwana trough [CSE 1998; UPPCS 2019]",
"Damodar tributaries :: the **Barakar**, **Konar**, Jamunia and Barki — !!the Indravati is a Godavari tributary!! [UP BEO 2019]",
"The **Damodar** was keyed the most polluted of the Gomti, Periyar, Damodar and Mahanadi — coal and industrial waste [UP UDA 2013]",
"**Vamsadhara** and **Nagavali** :: rise in Odisha’s Eastern Ghats and enter the Bay in north Andhra",
"**Palar** :: rises near the Nandi hills and flows through Karnataka and Andhra into Tamil Nadu, past Vellore and Kanchipuram, to the Bay south of Chennai",
"**Ponnaiyar (South Pennar)** :: rises in the Nandi hills and flows past Hosur into Tamil Nadu to the Bay near Cuddalore"]},
{h:"Inland rivers of the west",t:1,list:[
"**Luni** :: rises in the **Aravalli** near **Ajmer–Pushkar** as the **Sagarmati**; after the **Sarasuti** from Pushkar joins at Govindgarh it is the Luni; fresh upstream, **saline** below **Balotra**, it ends in the marshes of the **Rann of Kutch** — !!not the Gulf of Khambhat!! [CSE 2010; UPPCS 2019]",
"The name Luni comes from **Lavanavati**, ‘the salt river’",
"Luni tributaries :: mostly left-bank streams from the Aravalli — the **Jawai**, **Sukri**, Bandi, Guhiya and Mithri — and the right-bank **Jojari**; !!the Banas is a Chambal tributary!! [CDS 2018 II]",
"**Ghaggar** :: rises in the Shiwaliks near Kalka and dies out in the Thar near **Hanumangarh** — the **Hakra** in Pakistan; a classic river of **inland drainage**",
"Of the Barak, Rupen, Banas and Machchhu, the one that is **not** a desert river is the **Barak** — the other three drain into the Rann of Kutch [CAPF 2021]"]},

["**Hyderabad**","**Musi**, a Krishna tributary — !!not the Krishna!! [UPPCS 1996; UP RO M 2016]"],
["**Bhubaneswar**","**Daya** and **Kuakhai** — !!not the Mahanadi!! [UPPCS 1999; UP GIC 2010]"],
["**Cuttack** · Sambalpur","**Mahanadi** [UPPCS 1992]"],

["**Kota**","**Chambal** [UPPCS 1999, 1996; UP RO M 2016]"],
["**Jabalpur**","**Narmada** [CSE 2007; UPPCS 1999, 1996; UP RO M 2016]"],
["**Surat**","**Tapi** [UPPCS 1999]"],
["**Betul**","The **Tapi** rises in this district, at Multai [CSE 2007]"],
["**Jagdalpur**","**Indravati** [CSE 2007]"],
["**Ahmedabad**","**Sabarmati** [UP GIC 2010]"],
["**Pandharpur**","**Chandrabhaga** (the Bhima) [CSE 2019]"],
["**Tiruchirappalli**","**Kaveri** [CSE 2019]"],
["**Hampi**","**Tungabhadra** — !!not the Malaprabha!! [CSE 2019]"],
["**Vijayawada** · **Madurai** · **Nellore**","Krishna · Vaigai · Pennar"]]},
{h:"Waterfalls",t:1,cols:["Waterfall","River","State"],rows:[
["**Kunchikal**","Varahi","Karnataka — keyed India’s highest at 455 m; newer surveys put it far lower and rank **Nohkalikai** first [UPPCS 2018; UPPCS M 2015]"],
["**Nohkalikai**","A stream off the Sohra plateau","Meghalaya — the tallest plunge fall (~340 m)"],
["**Jog (Gersoppa)**","**Sharavati** — !!not the Krishna!!","Karnataka [UPPCS 2017; UPPCS M 2005; CAPF 2018]"],
["**Dudhsagar**","**Mandovi**","**Goa**, on the Karnataka border [UPPCS 2022, 2017; UPPCS M 2014; CDS 2022 I]"],
["**Gokak**","**Ghataprabha**","Karnataka [UPPCS 2017]"],
["**Barkana**","Seetha, near Agumbe","**Karnataka** [UPPCS 2022; CDS 2022 I]"],
["**Sivasamudram**","**Kaveri**","Karnataka — powered one of Asia’s first hydroelectric stations (1902), for the Kolar gold fields [UPPCS M 2005]"],
["**Hogenakkal**","Kaveri","Tamil Nadu"],
["**Kiliyur**","Hill stream, Yercaud (Shevaroy hills)","**Tamil Nadu** [CDS 2022 I]"],
["**Athirappilly**","Chalakudy","Kerala"],
["**Duduma**","**Machkund**","**Odisha**–Andhra border [UPPCS 2017; CDS 2022 I]"],
["**Khandadhar**","Korapani stream","**Odisha** [UPPCS 2022]"],
["**Chitrakote**","**Indravati**","Chhattisgarh (Bastar, near Jagdalpur) — ‘India’s Niagara’ [UP RO M 2017, 2016]"],
["**Hundru** · **Dassam**","Subarnarekha · Kanchi","Jharkhand, near Ranchi [UPPCS 2021]"],
["**Budha Ghagh (Lodh)**","**Burha** — !!not the Kanchi!!","Jharkhand (Latehar) [UPPCS 2021]"],
["**Dhuandhar**","**Narmada**","MP — the marble gorge at **Bhedaghat**, near Jabalpur [UPPCS 2021; UPPCS M 2005]"],
["**Chachai**","**Bihad** (Beehar)","MP (Rewa) [UPPCS 2021]"],
["**Kapildhara**","Narmada","MP, near Amarkantak"],
["**Chulia**","**Chambal**","Rajasthan, near Rawatbhata [UPPCS M 2005]"],
["**Palani**","—","**Himachal Pradesh** (keyed) [UPPCS 2022]"]]},
{h:"Waterfalls in questions",t:1,list:[
"Of three rows, only **Hundru — Chota Nagpur — Subarnarekha** was right; **Dhuandhar** is at Bhedaghat near Jabalpur, !!not in Malwa!!, and **Gersoppa** (Jog) is on the **Sharavati**, !!not the Netravati!! [CSE 2024]"]},
{h:"Kinds of lakes",t:1,cols:["Kind","How formed","Examples"],rows:[
["**Tectonic**","Earth movements — faulting and uplift","**Bhimtal** and the Kumaon lakes [CDS 2019 I]"],
["**Glacial**","Basins scoured or dammed by ice","**Gangabal** (Kashmir), Hemkund, Suraj Tal [CDS 2019 I]"],
["**Crater**","A meteorite impact crater in basalt","**Lonar** (Buldhana, Maharashtra) — saline and alkaline [CDS 2019 I]"],
["**Fluvial (oxbow)**","Cut-off river meanders","**Purbasthali** (West Bengal) [CDS 2019 I]"],

["**Inland saline**","Salty basins of inland drainage in dry country","**Sambhar**, Didwana, Pachpadra, Lunkaransar"],
["**Artificial**","Behind dams or dug out","**Govind Sagar** (behind Bhakra), **Govind Ballabh Pant Sagar** (Rihand)"]]},
{h:"Lakes in questions",t:1,list:[
"Artificial lake :: **Kodaikanal** (Tamil Nadu), made in 1863 — Kolleru, Nainital and Renuka are natural [CSE 2018]",
"Rajasthan’s saline lakes :: **Didwana, Kuchaman, Sargol and Khatu** [CSE 2021]",
"The **Jhelum** flows through **Wular** — true; the Krishna does !!not!! feed **Kolleru** directly; **Kanwar** was left by the **Burhi Gandak**, !!not the Gandak!! — only one statement right [CSE 2023]",
"**Phumdis** :: floating mats of vegetation, soil and organic matter on **Loktak**, Manipur — the North-East’s largest freshwater lake [CSE 1998; UPPCS 2020; UPPCS M 2005; CDS 2023 I]",
"Largest freshwater lake :: **Wular**, by volume (keyed); **Kolleru** by area [UP RO 2021]",
"**Chilika** :: India’s largest brackish lagoon and the largest lagoon on the east coast (Odisha); keyed ‘largest saline lake’ though **Sambhar** is the largest inland salt lake [UPPCS 2021]",
"Chilika lies on the **Northern Circars** coast [UP Lower 2008; UP UDA 2016]",
"**Vembanad** :: India’s longest lake and Kerala’s largest; Kochi port stands at its mouth [UPPCS 1997; CDS 2022 II]",
"**Kolleru** :: a freshwater lake between the **Godavari and Krishna** deltas, Andhra Pradesh [UPPCS 2012; UP UDA M 2010; CDS 2023 I]",
"Lakes of Ladakh :: **Pangong Tso** (brackish, cut by the LAC), **Tso Moriri** and **Tso Kar** — !!Tsomgo (Changu) is in Sikkim!! [CDS 2017 II]"]},
{h:"Lakes by State",t:2,list:[

"Himachal :: **Khajjiar**, Renuka, Prashar and the snow-fed **Ghepan** (Lahaul) [UPPCS M 2016; CDS 2022 II]",

"Arunachal :: **Sela** [UPPCS 2020]",
"Assam :: **Chandubi**, **Chapanala**, Haflong [UPPCS M 2014]",
"Meghalaya :: **Umiam (Barapani)** — a reservoir on the Umiam river north of Shillong, now cleaned by an **AI-guided robotic boat** [CDS 2023 I]",
"Tamil Nadu :: **Kaliveli** (Viluppuram), Ooty, **Red Hills** (Puzhal) [UPPCS 2020; CDS 2022 II]",
"Kerala :: **Ashtamudi** and Sasthamkotta (freshwater) [UPPCS 2015]",
"Rajasthan :: **Pichola**, **Fateh Sagar** and **Jaisamand (Dhebar)** at Udaipur · **Nakki** at Mount Abu — !!not in Gujarat!! [UPPCS 2012]",
"Gujarat :: **Hamirsar** (Bhuj), **Nal Sarovar**, **Lakhota** (Jamnagar), Kankaria (Ahmedabad)",

/* ===== 16 INDIAN CLIMATE, MONSOON & HAZARDS ===== */
SEC({id:"india-climate",title:"Indian Climate, Monsoon & Hazards",group:"India — Physical",tier:1,
stats:["UPSC CSE: 6 Q (2010–26) in 6 of 17 papers — El Niño Modoki (2010), La Niña and El Niño (2011), monsoon duration and the rainfall gradient (2012), the Indian Ocean Dipole (2017), Ocean Mean Temperature (2020), the Andaman climate (2026); older papers asked ENSO and a station’s climate (2002), a rainfall order (2005), causes of climatic contrasts (1997) and the rainy day (1993)","UPPCS Pre: 8 Q since 2018 — disasters (2018), western disturbances (2019, 2021), Agra and Darjeeling (2022), the dry Tamil Nadu coast and El Niño off Peru (2023), local storms (2024), altitude and vegetation (2025); older UPPSC papers asked the monsoon, winter rain, rainfall extremes and seismic zones about 35 times","Formats: Assertion–Reason on monsoon causes, local storm ↔ region, place ↔ rainfall, ENSO and IOD statement sets, city ↔ seismic zone, cyclone facts"],
note:"India’s monsoon climate: what controls it, how the monsoon works and retreats, the seasons and their local storms, rainfall and climatic regions, then El Niño, the IOD and the other drivers of a good or bad monsoon, and the hazards — cyclones, earthquakes, floods and droughts. Pressure belts, jet streams and the anatomy of a cyclone are in the Climate & Oceans sheets.",
blocks:[
{h:"What shapes India’s climate",t:1,list:[
"Type :: **tropical monsoon** — the seasonal reversal of winds dominates, even though the north lies outside the tropics",
"India is a **monsoon** country, and the high **Himalaya** give its climate a distinct unity — they keep out Central Asian cold and hold the monsoon over the subcontinent; the reason explains it [UPPCS 1998, 1996; UP Lower 1998]",
"Controls :: **latitude**, the **Himalaya**, land and sea, **distance from the sea**, **altitude**, relief (the Western Ghats, the Aravalli), and the air aloft — jet streams, **western disturbances** and tropical cyclones",
"Agra and Darjeeling lie near one latitude, yet average ~16°C and ~4°C in January — temperature falls with **altitude** and in thin air; the reason explains it [UPPCS 2022]",
"Causes :: Chennai warmer than Kolkata — **latitude** · Himalayan snowfall — **altitude** · rain falling from West Bengal to Punjab — **distance from the sea** · winter rain on the Sutlej–Ganga plain — **western depressions** [CSE 1997]",
"Himalayan vegetation varies because climate changes with **altitude** — the reason explains it [UPPCS 2025]",
"The **southern** Himalayan slopes get more rain and sun and carry **denser** forest than the northern slopes — so ‘northern slopes are thicker’ is !!false!! [UP RO 2023]",
"South India has **no extremes** — small daily and yearly ranges, warm all year [CDS 2019 II]",
"A station with a mean of 26°C and a small annual range of 9°C — the mark of a coast — was keyed **Chennai** [CSE 2002]"]},
{h:"How the monsoon works",t:1,list:[
"The word :: Arabic **mausim**, ‘season’ — a seasonal reversal of winds",
"Classical (thermal) view :: a giant **land and sea breeze** — summer heating makes a low over the land that draws in moist sea air; in winter the flow reverses",
"Summer :: the **ITCZ** shifts north over the Ganga plain as the **monsoon trough**; the south-east trades cross the equator, are turned right by the Coriolis force and arrive as the **south-west monsoon** [MPPCS 2012; UP RO M 2016; CSE 1996]",
"Upper air :: in early June the **subtropical westerly jet** leaves the plains for the north of the Tibetan plateau, and the **tropical easterly jet** (~15°N) sets in over the Peninsula — then the monsoon bursts",
"**Tibetan plateau** :: its summer heating builds a strong high aloft that feeds the easterly jet",
"**Mascarene High** near Madagascar and the low-level **Somali (Findlater) jet** off East Africa steer the flow towards India",
"**Southern Oscillation** :: a see-saw of pressure between the eastern Pacific (**Tahiti**) and the Indian Ocean (**Darwin**, north Australia); a negative Tahiti-minus-Darwin reading warns of a weak, late monsoon",
"Monsoon factors — differential heating, the ITCZ shift, the jets, Tibet and pressure over the southern oceans — **all count** [CDS 2015 II]",
"Winter :: a weak high over north-west India sends out **cold, dry** winds and chills the plains — !!no loo and no torrential rain!! [CDS 2014 I]"]},
{h:"Two branches of the monsoon",t:1,fig:{kind:"svg",

caption:"Schematic. The Arabian Sea branch pours on the windward Ghats and leaves a rain shadow behind them; the Bay branch, turned west by the Himalaya, gives the plains less rain from east to west, while the Tamil Nadu coast, parallel to it, stays dry.",
